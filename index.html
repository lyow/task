<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All projects</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08080A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Projects">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--violet:#6E9EFF;--cyan:#39CFE6;--magenta:#FF4F93;--mint:#35D888;--amber:#FFB830;--lime:#D4FF3A;--iris:var(--lime);--on:#0B0B0D;--s-active:var(--amber);--s-done:var(--mint);--dots:radial-gradient(circle at center,rgba(255,255,255,.07) 1px,transparent 1.2px);--display:'Geologica',system-ui,sans-serif;--ui:'Onest','Segoe UI',system-ui,sans-serif}
html,body{height:100%;margin:0}
body{display:flex;font-family:var(--ui);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::placeholder{color:var(--dim)}
:focus-visible{border-radius:4px}
svg{display:block;flex:0 0 auto}
.pad{padding:16px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── sidebar ── */
#side{position:relative;z-index:2;width:288px;flex:0 0 288px;display:flex;flex-direction:column;margin-left:-289px;transition:margin-left .26s cubic-bezier(.4,0,.2,1)}
body.side-open #side{margin-left:0}
.side-top{display:flex}
.btn-all{display:flex;align-items:center;transition:.16s}
.btn-all:hover{color:var(--txt);border-color:var(--line-2)}

.btn-icon{padding:9px;border:1px solid var(--line);border-radius:10px;color:var(--soft);background:var(--panel-2);transition:.16s}
#btnShow{display:none}
body:not(.side-open) #btnShow{display:inline-flex}
.btn-icon:hover{color:var(--txt);border-color:var(--line-2)}

.search input{width:100%;padding:9px 11px 9px 32px;border-radius:10px;font-size:15px}
.search input:focus{outline:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim)}
.side-label{font-family:var(--ui)}
#sideList{flex:1;overflow-y:auto;padding:7px 9px;display:flex;flex-direction:column;gap:5px}
.empty-side{padding:16px 9px;font-size:14px;line-height:1.6;color:var(--dim)}
.row{display:flex;align-items:center;gap:2px;position:relative}

.row-name{flex:1;min-width:0;display:flex;align-items:center;gap:9px;text-align:left;text-decoration:none;color:inherit;cursor:inherit}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--s-idle)}
.dot[data-s=active]{background:var(--s-active)}
.dot[data-s=done]{background:var(--s-done)}
.row-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.on .row-text{font-weight:500}
.flag{color:var(--magenta)}
.btn-gear{padding:7px;border-radius:9px;color:var(--dim);opacity:0;transition:.14s}
.row:hover .btn-gear,.row.on .btn-gear{opacity:1}
.btn-gear:hover{color:var(--txt);background:var(--raise)}
.btn-gear.big{opacity:1;padding:10px;border:1px solid var(--line);background:var(--panel-2);border-radius:11px;color:var(--soft)}
.picker{display:flex;gap:1px}
.pick{padding:6px;border-radius:8px;color:var(--dim);opacity:.45;transition:.14s}
.row:hover .pick{opacity:.8}
.pick:hover{opacity:1;background:var(--raise)}
.pick.on{opacity:1}
.pick.on[data-s=idle]{color:var(--s-idle)}

.pick.on[data-s=done]{color:var(--s-done)}
.picker.big{flex-wrap:wrap}
.picker.big .pick{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;opacity:.65}
.picker.big .pick.on{opacity:1;border-color:currentColor}

.btn-new{padding:11px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;border:1px solid var(--line-2);color:var(--txt);background:var(--panel-2);transition:.16s;position:relative;overflow:hidden}
.btn-new::after{content:'';position:absolute;inset:0;background:var(--iris);opacity:0;transition:.18s}

.btn-new:hover::after{opacity:0}
.btn-new>*{position:relative;z-index:1}
.backup{display:flex;gap:6px}
.backup button{flex:1;padding:8px;border:1px solid var(--line);border-radius:9px;color:var(--dim);
  font-family:var(--ui);font-size:12px;transition:.14s}
.backup button:hover{color:var(--txt);border-color:var(--line-2);background:var(--panel-2)}
#scrim{display:none}

/* ── main ── */
#main{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:11px;padding:12px 20px;border-bottom:1px solid var(--line)}
.crumb{font-family:var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{flex:1;overflow-y:auto;padding:30px 34px 72px}
.head{margin:0 auto 22px}
.head h1{margin:0}
.head h1 i{-webkit-background-clip:text}
.lede{margin:9px 0 0;line-height:1.55}

.chips{max-width:1500px;margin:0 auto 16px;display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 15px}

.grid{max-width:1500px;margin:0 auto;display:grid}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;text-decoration:none;color:var(--txt);border:1px solid var(--line);overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background-image:var(--dots);background-size:20px 20px;
  opacity:.5;-webkit-mask-image:radial-gradient(70% 70% at 80% 10%,#000,transparent);mask-image:radial-gradient(70% 70% at 80% 10%,#000,transparent)}

.card .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;z-index:0}

.card.has-cover:hover .cover{opacity:.58}
.card.has-cover::before{opacity:.18}
.card .veil{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity .3s;
  background:linear-gradient(180deg,rgba(2,2,3,.62) 0%,rgba(2,2,3,.78) 42%,rgba(2,2,3,.93) 100%)}
.card.has-cover .veil{opacity:1}
.card:not(.has-cover)::after{content:'';position:absolute;inset:auto -20% -40% -20%;height:70%;z-index:1;
  background:radial-gradient(50% 100% at 50% 100%,color-mix(in srgb,var(--violet) 13%,transparent),transparent 72%);pointer-events:none}
.card.has-cover .card-name{text-shadow:0 2px 18px rgba(0,0,0,.95)}
.card.has-cover .card-meta,.card.has-cover .next{text-shadow:0 1px 10px rgba(0,0,0,.9)}
.card>*{z-index:2}
.card>*{position:relative}
.card-top{position:absolute;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-status{display:inline-flex;align-items:center;font-family:var(--ui)}

.card-name{margin:0 0 7px;font-family:var(--display);font-weight:600;line-height:1.25;letter-spacing:-.01em;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-family:var(--ui);line-height:1.7}
.mini{overflow:hidden}
.mini i{display:block;height:100%;background:var(--iris)}
.empty-main{max-width:1500px;margin:0 auto;color:var(--soft)}
.btn-inline{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:12px 22px;border-radius:12px;font-family:var(--display);font-weight:600;font-size:12px}

/* ── project ── */

.p-title-row{display:flex;align-items:center;gap:12px}
.p-title{flex:1;min-width:0;background:none;border:none;padding:3px 0;border-bottom:1px solid transparent}
.p-title:focus{outline:none;border-bottom-color:var(--line-2)}
.p-meta{margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag,.tag-imp{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;font-family:var(--ui);font-size:12px;color:var(--soft)}
.tag-imp{color:var(--magenta)}
#save{font-family:var(--ui);font-size:12px;color:var(--dim);margin-left:auto}
.bar{position:relative;margin-top:18px;height:5px;border-radius:5px;max-width:360px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s ease}
.bar b{position:absolute;right:-46px;top:-7px;font-family:var(--ui);font-size:12px;font-weight:400;color:var(--dim)}
.panes{max-width:1500px;margin:0 auto;display:grid;gap:20px;grid-template-columns:repeat(2,minmax(0,1fr))}
.pane.wide{grid-column:1/-1}
.pane-h{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:0 0 12px;font-family:var(--ui)}
.pane-h .sp{flex:1}
.count{font-size:12px;padding:2px 7px;border-radius:999px;background:var(--raise);color:var(--soft)}

.task-add{display:flex;gap:7px}
.task-add input{flex:1;padding:11px 13px}
.task-add input:focus{outline:none}
.task-add button{padding:0 15px}

.tasks{list-style:none;margin:12px 0 0;padding:0}
.tasks li{display:flex;align-items:flex-start;gap:11px;padding:10px 6px;border-bottom:1px solid var(--line);line-height:1.5}
.tasks li>span:not(.check){flex:1;word-break:break-word}
.tasks li span.check{flex:0 0 auto;display:inline-flex;align-items:center}
.tasks li.done span{text-decoration:line-through;color:var(--dim)}
.check{color:var(--dim);padding:0;margin-top:1px;transition:.14s}

.tasks li.done .check{color:var(--s-done)}
.task-del{opacity:0;color:var(--dim);padding:3px;transition:.14s}
.tasks li:hover .task-del{opacity:.6}
.task-del:hover{opacity:1;color:var(--magenta)}
.notes{width:100%;min-height:190px;resize:vertical;padding:15px;line-height:1.65;font-size:15px}
.notes:focus{outline:none}

/* ── photo board ── */
#board{position:relative;height:min(56vh,620px);min-height:400px;border:1px solid var(--line);border-radius:18px;background:var(--panel);touch-action:none}
#canvas{background-image:var(--dots);background-size:22px 22px;background-position:0 0}
#canvas::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(38% 30% at 18% 12%,color-mix(in srgb,var(--violet) 10%,transparent),transparent 70%),
             radial-gradient(34% 26% at 76% 8%,color-mix(in srgb,var(--magenta) 7%,transparent),transparent 72%)}
.board-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--dim);text-align:center;padding:20px;pointer-events:none}
.board-empty b{font-family:var(--display);font-size:15px;font-weight:600;color:var(--soft)}
.pin{position:absolute;border-radius:12px;overflow:visible;user-select:none;touch-action:none;transition:box-shadow .16s,filter .16s}
.pin img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line-2);
  box-shadow:0 16px 36px -18px rgba(0,0,0,.95);pointer-events:none;background:var(--panel-2)}
.pin:hover{filter:brightness(1.04)}
.pin:hover img{box-shadow:0 0 0 1px rgba(255,255,255,.22),0 18px 44px -16px rgba(0,0,0,1)}
.pin.grabbing{z-index:9999!important}
.pin.grabbing img{box-shadow:0 0 0 1.5px var(--violet),0 26px 60px -18px rgba(0,0,0,1)}
.pin-x{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:#0D0D12;border:1px solid var(--line-2);
  color:var(--soft);opacity:0;transform:scale(.7);transition:.15s}
.pin:hover .pin-x{opacity:1;transform:scale(1)}
.pin-x:hover{background:var(--magenta);border-color:var(--magenta);color:var(--on)}
.pin-size{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:7px;cursor:nwse-resize;
  background:#0D0D12;border:1px solid var(--line-2);opacity:0;transition:.15s;
  display:flex;align-items:center;justify-content:center;color:var(--soft)}
.pin:hover .pin-size{opacity:1}
.pin-size:hover{border-color:var(--violet);color:var(--violet)}
.hint{margin:12px 0 0;font-size:12px;line-height:1.6}

body.dragging #board{border-color:var(--violet)}

/* ── overlays ── */
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.96);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.lb img{max-width:100%;max-height:76vh;border-radius:14px;border:1px solid var(--line-2)}
.lb-bar{display:flex;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap;justify-content:center;color:var(--soft)}
.lb-bar button{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line-2);
  border-radius:10px;color:var(--txt)}
.lb-bar button:hover{background:var(--panel-2)}
.sheet-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:18px}
.sheet{width:100%;max-width:420px;max-height:90vh;overflow-y:auto;position:relative}
.sheet::before{content:'';position:absolute;inset:0;border-radius:20px;padding:1px;pointer-events:none;
  background:var(--iris);opacity:.34;-webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  -webkit-mask-composite:xor;mask-composite:exclude}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.f{display:block;margin-bottom:17px}
.f>span{display:block;margin-bottom:8px;font-family:var(--ui)}
.f input{width:100%;border-radius:11px}
.f input:focus{outline:none}
.f input[type=date]{color-scheme:dark}
.two{display:flex;gap:7px}
.opt{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px;font-size:14px;font-weight:500}

.sheet-foot{border-top:1px solid var(--line);padding-top:16px}
.danger{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px;
  border-radius:11px;background:none;color:var(--magenta);border:1px solid color-mix(in srgb,var(--magenta) 34%,transparent);font-size:14px;font-weight:500}
.danger:hover{background:color-mix(in srgb,var(--magenta) 11%,transparent)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,22px) scale(.96);z-index:130;opacity:0;
  display:flex;align-items:center;gap:11px;max-width:min(92vw,440px);
  padding:11px 13px;border-radius:15px;background:var(--raise);
  box-shadow:inset 0 0 0 1px var(--line-2),0 24px 60px -22px #000;
  color:var(--txt);font-size:15px;pointer-events:none;
  transition:opacity .22s cubic-bezier(.2,.8,.2,1),transform .22s cubic-bezier(.2,.8,.2,1)}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#toast .t-ico{flex:0 0 auto;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;color:var(--mint);background:color-mix(in srgb,var(--mint) 14%,transparent)}
#toast.warn .t-ico{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
#toast.bad .t-ico{color:var(--magenta);background:color-mix(in srgb,var(--magenta) 14%,transparent)}
#toast .t-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#toast .t-body b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast .t-body span{font-family:var(--ui);font-size:12px;
  color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast .t-act{flex:0 0 auto;padding:8px 13px;border-radius:10px;font-size:14px;font-weight:600}

@media (max-width:760px){#toast{bottom:calc(96px + env(safe-area-inset-bottom));left:12px;right:12px;
  max-width:none;transform:translateY(22px) scale(.96)}
  #toast.on{transform:translateY(0) scale(1)}}

.capture{max-width:1500px;margin:0 auto 18px;display:flex;gap:8px}
.capture input{flex:1;padding:12px 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:15px}
.capture input:focus{outline:none;border-color:var(--line-2)}
.capture button{padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);color:var(--soft);transition:.14s}
.capture button:hover{color:var(--txt);border-color:var(--violet);background:var(--raise)}
.next{display:flex;gap:9px;margin:0 0 10px;font-size:14px;line-height:1.45;color:var(--txt)}
.next em{flex:0 0 auto;font-style:normal;font-family:var(--ui);font-size:12px;
  color:var(--cyan);padding-top:3px}
.next span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .next{margin:0 0 7px}
.card .next span{-webkit-line-clamp:1}

.tasks li.first-open{border-radius:10px;padding-left:11px}
.row.done-row .row-text{color:var(--dim)}

.fcount{margin-left:auto;font-family:var(--ui);font-size:12px;padding:2px 7px;
  border-radius:999px;background:rgba(255,255,255,.09)}

.star{opacity:0;color:var(--dim);padding:3px;transition:.14s}
.tasks li:hover .star{opacity:.55}
.star:hover{opacity:1;color:var(--amber)}
.star.on{opacity:1;color:var(--amber)}
.star.on svg{fill:var(--amber)}
.fgroup{margin:0 auto 22px}
.fgroup-h{display:flex;align-items:center;gap:9px}
.fgroup-h button{font-family:var(--display);font-weight:600;font-size:14px;color:var(--soft)}
.fgroup-h button:hover{color:var(--txt)}
.focus-wrap{margin-bottom:8px}

#board.full{position:fixed;inset:0;height:auto;min-height:0;z-index:80;border-radius:0;border:none;
  box-shadow:none}
body.board-open{overflow:hidden}
.chip.tog{display:inline-flex;align-items:center;gap:7px}

.arch-link.has{color:var(--soft)}
.arch-link{width:100%;padding:8px;border-radius:9px;color:var(--dim);font-family:var(--ui);
  font-size:12px;border:1px solid transparent}
.arch-link:hover{color:var(--txt);border-color:var(--line)}
.row.arch .row-text{color:var(--dim);font-style:italic}
.ideas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));margin-top:14px}
.idea{position:relative;display:flex;flex-direction:column;gap:12px;padding:15px 15px 12px;border:1px solid var(--line);min-height:112px}

.idea::after{content:'';position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:2px;
  background:var(--iris);opacity:.55}
.idea-edit{width:100%;min-height:74px;resize:vertical;padding:9px 11px;border-radius:10px;
  border:1px solid var(--line-2);background:var(--panel-2);font-size:15px;line-height:1.55}
.idea-edit:focus{outline:none;border-color:var(--violet)}
.idea-foot{display:flex;align-items:center;gap:8px}
.idea-date{font-family:var(--ui);font-size:12px;
  color:var(--dim)}
.idea-acts{margin-left:auto;display:flex;gap:4px;opacity:0;transition:.14s}
.idea:hover .idea-acts,.idea:focus-within .idea-acts{opacity:1}
.idea-acts button{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;
  border:1px solid var(--line);color:var(--soft);font-size:12px;font-weight:500}
.idea-acts button:hover{color:var(--txt);border-color:var(--line-2);background:var(--panel-2)}
.idea-acts button[data-idel]:hover{color:var(--magenta);border-color:color-mix(in srgb,var(--magenta) 40%,transparent)}
.idea-acts button[data-mk]:hover{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 40%,transparent)}
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto}
.pick-list button{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel-2);text-align:left;font-size:15px}
.pick-list button:hover{border-color:var(--line-2);background:var(--raise)}
.sheet-foot.two .danger{width:auto;flex:1}

.nav{display:flex;flex-direction:column}
.btn-nav{border:none;position:relative}
.btn-nav .ncount{font-family:var(--ui);border-radius:999px}

.side-label{display:flex;align-items:center;gap:8px}

.side-tools{display:flex;flex-direction:column;gap:5px;padding:9px 11px;margin:0 9px;
  border:1px solid var(--line);border-radius:11px;background:var(--panel-2)}
.side-tools .tool{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;
  font-size:14px;color:var(--soft);text-align:left}
.side-tools .tool:hover{background:var(--raise);color:var(--txt)}

.row{cursor:grab;touch-action:pan-y}
.row.drag{opacity:.4;touch-action:none;background:var(--raise);box-shadow:0 10px 30px -14px #000}
.row.over{box-shadow:inset 0 2px 0 var(--cyan)}
.btn-pin{padding:6px;border-radius:8px;color:var(--dim);opacity:0;transition:.14s}
.row:hover .btn-pin{opacity:.7}

.skind{flex:0 0 54px;font-family:var(--ui)}
.stext{flex:1;min-width:0;word-break:break-word}
.srow mark,.sgroup mark{background:color-mix(in srgb,var(--violet) 35%,transparent);color:var(--txt);border-radius:3px;padding:0 2px}
.smore{padding:9px 16px;font-family:var(--ui);font-size:12px;color:var(--dim)}

/* разбор */

/* цвет проекта */
.pc-none{background:var(--panel-2);border:2px dashed var(--line-2)!important}
.sk-dot.c-lime{background:var(--lime)}
.row.tinted{box-shadow:inset 3px 0 0 var(--pc)}
.row.on.tinted{box-shadow:inset 3px 0 0 var(--pc),inset 0 0 0 1px var(--line-2)}
.row.on .dot{transform:scale(1.25)}
.dot{transition:transform .14s}
.tinted.c-violet{--pc:var(--violet)}.tinted.c-cyan{--pc:var(--cyan)}.tinted.c-magenta{--pc:var(--magenta)}
.tinted.c-mint{--pc:var(--mint)}.tinted.c-amber{--pc:var(--amber)}.tinted.c-lime{--pc:var(--lime)}

/* компактный список */
.plist{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:14px;padding:12px 15px;border:1px solid var(--line);
  border-radius:12px;background:var(--panel);text-decoration:none;color:var(--txt);transition:.14s}
.prow:hover{border-color:var(--line-2);background:var(--raise)}
.prow.tinted{box-shadow:inset 3px 0 0 var(--pc)}
.pname{flex:0 1 auto;min-width:0;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--display);font-weight:600;font-size:15px}

.prow .flag svg{display:block}
.pnext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:14px;color:var(--soft)}
.pmeta{flex:0 0 auto;font-family:var(--ui);font-size:12px;color:var(--dim)}

/* переходы между экранами */
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.pthumb{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--panel-2) center/cover no-repeat;
  box-shadow:inset 0 0 0 1px var(--line)}

/* тонкая полоса прокрутки в панели */
#sideList::-webkit-scrollbar{width:8px}
#sideList::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:8px;
  border:2px solid transparent;background-clip:padding-box}
#sideList:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);background-clip:padding-box}

/* заметнее фокус с клавиатуры */
.btn-nav:focus-visible,.row-name:focus-visible,.card:focus-visible,.prow:focus-visible{
  outline:2px solid var(--violet);outline-offset:2px}

/* заголовок проекта: подпись статуса заметнее на тёмном */
.card-status{backdrop-filter:blur(3px);padding:3px 8px;border-radius:999px;background:rgba(2,2,3,.45)}
.card:not(.has-cover) .card-status{background:transparent;backdrop-filter:none;padding:0}

/* мягкая подсветка строки под курсором в списке */
.prow{position:relative;overflow:hidden}
.prow::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .16s;
  background:linear-gradient(90deg,color-mix(in srgb,var(--violet) 10%,transparent),transparent 45%)}
.prow:hover::after{opacity:1}
.links.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);text-decoration:none;color:var(--txt);
  transition:.14s;cursor:pointer}
.lrow:hover{border-color:var(--line-2);background:var(--raise)}
.lrow-thumb{flex:0 0 auto;width:38px;height:38px;border-radius:9px;overflow:hidden;
  background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center}
.lrow-thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.lrow-thumb img[src]{opacity:1}
.lrow-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--display);font-weight:600;font-size:14px}
.lrow-host{flex:0 0 auto;font-family:var(--ui);font-size:12px;color:var(--dim)}
.lrow .lacts{position:static;opacity:0;flex:0 0 auto}
.lrow:hover .lacts{opacity:1}
.lcard.drag,.lrow.drag{opacity:.4;box-shadow:0 12px 30px -16px #000}
.lcard[draggable],.lrow[draggable]{cursor:grab}
.refprev img{max-width:min(92vw,760px);max-height:74vh;border-radius:14px;object-fit:contain}

/* рамка выделения и панель действий */
.marquee{position:absolute;z-index:60;border:1px solid var(--violet);background:color-mix(in srgb,var(--violet) 12%,transparent);
  border-radius:6px;pointer-events:none}
.pin.sel{outline:2px solid var(--violet);outline-offset:2px}
.sel-bar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:96;display:flex;
  align-items:center;gap:9px;padding:9px 12px;border-radius:14px;background:var(--raise);
  box-shadow:0 20px 50px -20px #000,inset 0 0 0 1px var(--line-2);font-size:14px}
.sel-bar span{font-family:var(--ui);font-size:12px;color:var(--soft);padding-right:4px}
.sel-bar button{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;
  color:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.sel-bar button:hover{color:var(--txt);box-shadow:inset 0 0 0 1px var(--line-2);background:var(--panel-2)}
.sel-bar button[data-sel="del"]:hover{color:var(--magenta);box-shadow:inset 0 0 0 1px var(--magenta)}

.share-box{display:flex;gap:6px}
.share-box input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel-2);font-family:var(--ui);font-size:12px;color:var(--soft)}
.share-box .opt{flex:0 0 auto;width:auto;padding:9px 14px}
body.shared-view #board{touch-action:auto}
body.shared-view .pin{cursor:pointer}
body.shared-view .pin:hover{outline:2px solid var(--violet);outline-offset:2px;border-radius:4px}
body.shared-view .sticky{cursor:default}
body.shared-view .topbar{justify-content:center}
.net-dot{margin-left:12px;padding:4px 10px;border-radius:999px;font-family:var(--ui);
  font-size:12px;}
.net-dot.off{color:var(--magenta);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--magenta) 40%,transparent);background:color-mix(in srgb,var(--magenta) 8%,transparent)}
.net-dot.syncing{color:var(--amber);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--amber) 40%,transparent);background:color-mix(in srgb,var(--amber) 8%,transparent)}

.tasks li[draggable]{cursor:grab}
.tasks li.drag{opacity:.45;background:var(--raise);border-radius:10px}
.trash-grid{display:grid;gap:9px;grid-template-columns:repeat(3,1fr);max-height:50vh;overflow-y:auto}
.trash-item{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.trash-item img{width:100%;height:100%;object-fit:cover;filter:grayscale(.6)}
.trash-age{position:absolute;left:6px;bottom:6px;font-family:var(--ui);font-size:12px;
  color:#fff;text-shadow:0 1px 6px #000}
.trash-acts{position:absolute;top:5px;right:5px;display:flex;gap:4px}
.trash-acts button{width:25px;height:25px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:rgba(4,4,7,.7);color:#fff;backdrop-filter:blur(3px)}
.trash-acts button[data-restore]:hover{background:var(--mint);color:var(--on)}
.trash-acts button[data-purge]:hover{background:var(--magenta);color:var(--on)}
.qbar{max-width:1500px;margin:-6px auto 20px;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}

.qchev{display:flex;transition:transform .16s}
.qbar:not(.closed) .qchev{transform:rotate(90deg)}
.qlist{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.qchip{display:inline-flex;align-items:center;border-radius:10px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}

.qchip a{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;text-decoration:none;color:var(--txt);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qchip img{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.qchip button{padding:7px 8px 7px 2px;color:var(--dim);opacity:0;transition:.14s}
.qchip:hover button{opacity:1}
.qchip button:hover{color:var(--magenta)}

.chips-toggle{display:none}
.board-toggle{display:inline-flex;align-items:center;gap:8px;font:inherit;color:inherit;
  letter-spacing:inherit;text-transform:inherit}
.board-toggle .qchev{display:flex;transition:transform .16s}
.board-pane:not(.collapsed) .board-toggle .qchev{transform:rotate(90deg)}
.board-pane.collapsed #board,.board-pane.collapsed .hint{display:none}

.fab-wrap{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:85;
  display:none;flex-direction:column;align-items:center;gap:10px}
.fab{width:58px;height:58px;border-radius:19px;display:flex;align-items:center;justify-content:center;color:var(--on)}
.fab:active{transform:scale(.94)}
.fab.small{width:44px;height:44px;border-radius:15px;background:var(--raise);color:var(--txt);
  box-shadow:0 10px 26px -14px #000,inset 0 0 0 1px var(--line-2)}
body.shared-view .fab-wrap{display:none!important}.refs-pane.collapsed .link-add,.refs-pane.collapsed .links,.refs-pane.collapsed .hint{display:none}
.refs-pane:not(.collapsed) .board-toggle .qchev{transform:rotate(90deg)}
.embed-box{position:relative;background:#000;border-radius:14px;overflow:hidden;
  box-shadow:0 30px 80px -30px #000}
.embed-box.wide{width:min(92vw,900px);aspect-ratio:16/9}
.embed-box.tall{width:min(92vw,420px);height:min(78vh,740px)}
.embed-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.inline-link{color:var(--violet);text-decoration:none;border-bottom:1px dashed color-mix(in srgb,var(--violet) 50%,transparent);
  word-break:break-all}
.inline-link:hover{color:var(--cyan);border-bottom-color:color-mix(in srgb,var(--cyan) 60%,transparent)}
.tasks li.done .inline-link,.tditem.done .inline-link{opacity:.6}

.row-wrap{position:relative}
.row-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:36px;height:36px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--txt);
  background:rgba(10,10,16,.82);backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1px var(--line-2),0 10px 24px -14px #000;
  opacity:0;transition:opacity .16s,transform .16s}
.row-wrap:hover .row-nav{opacity:1}
.row-nav:hover{transform:translateY(-50%) scale(1.08)}
.row-nav.hide{opacity:0!important;pointer-events:none}
.row-nav.prev{left:-6px}
.row-nav.prev svg{transform:rotate(180deg)}
.row-nav.next{right:-6px}
.links.row{cursor:grab;scrollbar-width:thin}
.links.row.dragging{cursor:grabbing;scroll-snap-type:none}
.links.row.dragging .lcard{pointer-events:none}
.cap-wrap{position:fixed;inset:0;z-index:125;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;opacity:0;transition:opacity .2s}
.cap-wrap.in{opacity:1}
.cap-sheet{width:100%;background:var(--panel);border-radius:24px 24px 0 0;padding:10px 16px 18px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px -20px #000;
  transform:translateY(14px);transition:transform .24s cubic-bezier(.2,.9,.2,1)}
.cap-wrap.in .cap-sheet{transform:none}
.cap-grab{width:40px;height:4px;border-radius:3px;background:var(--line-2);margin:0 auto 16px}
.cap-paste{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:15px;
  background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line);transition:.16s;cursor:pointer}
.cap-paste.has{box-shadow:inset 0 0 0 1px var(--violet);background:color-mix(in srgb,var(--violet) 10%,transparent)}
.cap-paste:active{transform:scale(.99)}
.cp-ico{flex:0 0 auto;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;color:var(--violet);background:color-mix(in srgb,var(--violet) 16%,transparent)}
.cap-paste.has .cp-ico{color:var(--on);background:var(--iris)}
.cp-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cp-txt b{font-family:var(--display);font-weight:600;font-size:15px}
.cp-txt span{font-family:var(--ui);font-size:12px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-paste.has .cp-txt span{color:var(--violet)}
.cp-go{color:var(--dim);display:flex}
#capText{width:100%;margin-top:10px;padding:13px 14px;border-radius:15px;background:var(--panel-2);
  border:none;box-shadow:inset 0 0 0 1px var(--line);font-size:16px;line-height:1.45;resize:none;
  font-family:var(--ui)}
#capText:focus{outline:none}
.cap-row{display:flex;gap:9px;margin-top:10px}
.cap-photo{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;padding:0 16px;height:52px;
  border-radius:15px;color:var(--soft);box-shadow:inset 0 0 0 1px var(--line);font-size:15px}
.cap-photo.has{color:var(--mint);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--mint) 50%,transparent)}
.cap-send{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;border-radius:15px;background:var(--iris);color:var(--on)}
.cap-send:active{transform:scale(.98)}
.cap-label{margin:16px 0 8px;font-family:var(--ui);font-size:12px;
  color:var(--dim)}
.cap-targets{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.cap-targets::-webkit-scrollbar{display:none}
.cap-t{flex:0 0 auto;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:10px 15px;border-radius:999px;color:var(--soft);font-size:15px;
  box-shadow:inset 0 0 0 1px var(--line);transition:.14s}
.cap-t.on{color:var(--on);box-shadow:none}
.cap-t.t-ideas.on{background:var(--violet)}
.cap-t.t-want.on{background:var(--mint)}
.cap-t.t-todo.on{background:var(--magenta)}
.cap-t.t-proj.on{background:var(--amber)}.folders{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.fol{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;font-size:14px;box-shadow:inset 0 0 0 1px var(--line);transition:.14s;position:relative}
.fol:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
.fol>span:not(.fdot):not(.fol-edit){font-family:var(--ui);font-size:12px;color:var(--dim)}

.fol.on>span{color:rgba(8,8,11,.6)}
.fol.on .fdot{background:rgba(8,8,11,.35)}
.fol.c-violet.on{background:var(--violet)}
.fol.c-cyan.on{background:var(--cyan)}
.fol.c-magenta.on{background:var(--magenta)}
.fol.c-mint.on{background:var(--mint)}
.fol.c-amber.on{background:var(--amber)}
.fol.c-lime.on{background:var(--lime)}
.fol.arch{color:var(--dim)}
.fol.add{color:var(--dim);box-shadow:inset 0 0 0 1px transparent;border:1px dashed var(--line)}
.fol.add:hover{color:var(--txt);border-color:var(--line-2)}
.fol-edit{opacity:0;display:inline-flex;margin-left:-2px;transition:.14s}
.fol:hover .fol-edit{opacity:.7}
.fol-edit:hover{opacity:1}
.fdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.fdot.c-violet{background:var(--violet)}.fdot.c-cyan{background:var(--cyan)}.fdot.c-magenta{background:var(--magenta)}
.fdot.c-mint{background:var(--mint)}.fdot.c-amber{background:var(--amber)}.fdot.c-lime{background:var(--lime)}

.idea-top{display:flex;gap:11px;align-items:flex-start;flex:1;min-width:0}
.idea-thumb{flex:0 0 auto;width:42px;height:42px;border-radius:11px;background:var(--panel-2) center/cover no-repeat;
  box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.idea-thumb.has{box-shadow:inset 0 0 0 1px var(--line-2)}
.idea-fav{border-radius:5px}
.idea-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.idea-title{line-height:1.35;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.idea-host{display:inline-flex;align-items:center;font-family:var(--ui);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.idea.has-link::after{background:var(--iris)}
@media (max-width:760px){.folders{gap:6px}.fol{padding:9px 12px}.fol-edit{opacity:.7}}

/* ─── движение ─── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-140% 0}100%{background-position:240% 0}}
@keyframes bootPulse{0%{transform:scale(.82);opacity:.55}50%{transform:scale(1);opacity:1}100%{transform:scale(.82);opacity:.55}}
@keyframes bootSpin{to{transform:rotate(360deg)}}

.boot{flex-direction:column;gap:18px;transition:opacity .3s ease}
.boot.gone{opacity:0;pointer-events:none}
.boot-mark{width:96px;height:96px;border-radius:24px;display:block;
  animation:bootPulse 1.6s ease-in-out infinite}

/* мелкие радости */
.fab{animation:popIn .32s cubic-bezier(.2,.8,.2,1) both}
.fab.small{animation-delay:.06s}

.lb img,.refprev img{animation:popIn .22s cubic-bezier(.2,.8,.2,1) both}

.tasks li .check svg,.tditem .check svg,.want .check svg{transition:transform .16s cubic-bezier(.2,1.6,.4,1)}
.tasks li.done .check svg,.tditem.done .check svg,.want.done .check svg{transform:scale(1.16)}
.chip,.ghost-btn,.qchip{transition:transform .12s ease,color .14s,background .14s,box-shadow .14s}
.chip:active,.ghost-btn:active,.qchip:active{transform:scale(.96)}

/* публичная страница появляется по частям */
body.shared-view .head{animation:fadeUp .34s ease both}
body.shared-view .qbar{animation:fadeUp .34s ease .08s both}
body.shared-view .panes>*{animation:fadeUp .36s ease both}
body.shared-view .panes>*:nth-child(2){animation-delay:.12s}
body.shared-view .panes>*:nth-child(3){animation-delay:.18s}
body.shared-view .panes>*:nth-child(4){animation-delay:.24s}

@media (prefers-reduced-motion:reduce){
  .grid>*,.plist>*,.links>*,.wish-grid>*,.tdlist>*,.ideas>*,.sgroup,.fab,.sheet,.lb img,.refprev img,body.shared-view .head,body.shared-view .qbar,body.shared-view .panes>*{animation:none!important}
  .lrow-thumb,.pthumb,.boot-mark{animation:none!important}
}

/* ── сенсорные экраны: наведения нет, действия видны всегда ── */
@media (hover:none){
  .btn-gear,.star,.task-del,.sub-del,.idea-acts,.pin-x,.pin-size,.tditem .idea-acts,.lacts,.sticky-acts,.sticky-size,.qchip button{opacity:1!important}
  
  .btn-pin{opacity:.65!important}
  .row:hover,.card:hover,.idea:hover{transform:none}
  .card:hover .cover{transform:none}
  .wcard .wacts{opacity:0;pointer-events:none}

body,button,.row,.card,a,input,textarea{cursor:auto}
}

@media (max-width:900px){
  #side{position:fixed;top:0;bottom:0;left:0;width:276px;flex-basis:276px}
  body.side-open #scrim{display:block;position:fixed;inset:0;z-index:1;background:rgba(0,0,0,.66)}
  .panes{grid-template-columns:1fr}
  #view{padding:22px 15px 70px}
  
  .bar{max-width:none;margin-right:46px}
  #board{height:64vh;min-height:340px}
}

/* ── телефоны ── */
@media (max-width:760px){
  body{padding-bottom:env(safe-area-inset-bottom)}
  .fab-wrap{display:flex}

/* главная: сначала запись, потом проекты */
  .head .lede{display:none}
  
  .capture{margin-bottom:12px}
  
  .chips-toggle{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-family:var(--ui);font-size:12px;margin-bottom:12px}
  .chips{display:none}
  .chips.open{display:flex;margin-top:-4px}

  /* внутри проекта */
  
  .board-pane #board{height:56vh}
  .embed-box.wide{width:94vw}
  .embed-box.tall{width:94vw;height:70vh}
  .lrow{padding:11px 12px;gap:13px}
  .lrow-thumb{width:46px;height:46px;border-radius:11px}
  .lrow-name{font-size:15px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
  .lrow .lacts{opacity:1}
  .lrow .lacts button{width:34px;height:34px}
  .link-add{gap:7px}
  .tasks li{padding:11px 4px}
  
  .check svg{width:20px;height:20px}
  
  .qchip a{padding:9px 11px}
  .want{padding:14px 15px}
  .idea{padding:15px}

/* v3 — colour with a job, feedback on every press, today list */
@property --sec{syntax:'<color>';inherits:true;initial-value:#D4FF3A}

body{transition:--sec .45s ease}

#main::before{content:'';position:absolute;inset:0 0 auto 0;height:320px;pointer-events:none;z-index:0;

/* press feedback */
button:active,.chip:active,.jot-tab:active{transform:scale(.96)}

.row-nav:active{transform:translateY(-50%) scale(.96)}
.burst{position:fixed;z-index:9999;width:0;height:0;pointer-events:none}

  transform:rotate(var(--a));animation:burst .5s cubic-bezier(.2,.7,.3,1) forwards}

.card-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);min-height:18px}

  .card{aspect-ratio:1/1}

  .wish-add{flex-direction:row;flex-wrap:wrap}
  .wish-add>*{width:auto!important}

  .tsrc{max-width:30%}
  .due-sheet{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .jot{margin-bottom:22px}
  
  .jot .capture input{padding:14px}

/* today digest */
.digest{position:fixed;z-index:120;right:20px;bottom:20px;width:min(380px,calc(100vw - 20px));padding:8px;border-radius:18px;animation:pmenuIn .18s cubic-bezier(.2,.8,.2,1)}

.ncount,.chip-n,.sec-n,.card-n,.bar b,.wrow-price,.wprice,.wsum,.msum-c b,.dg-n,.count,.hday-h span,.sp-v,.sp-day-h span,.sp-row b,.due,.idea-date,.scount,.day-done{font-variant-numeric:tabular-nums}

.sp-ai{font-size:15px;line-height:1.6;color:var(--txt)}
/* today and task rows */
.plan-day{margin-top:12px}
.upcoming{margin:26px auto 0}
.up-day{margin-bottom:14px}
.up-h{display:flex;align-items:baseline;gap:8px;padding:0 4px 6px;font-size:14px;font-weight:600}

.idea-q{margin:12px 0 0;max-width:420px}

  .check,.due,.tsnooze,.star,.board-toggle,.idea-name,.wcheck{position:relative}

/* ════════ v8 — one system ════════
   surfaces: ink → s1 → s2 → s3; hairline edges with a lighter top; floating things are dark glass;
   type: Geologica for titles and numbers, Onest for UI on 12/13/14/15/18/22/30/44; 8px grid;
   radii by role: 8 small controls, 10 buttons/inputs, 14 cards, 18 floating; lime only for the main action */
:root{
  --ink:#08080A;--s1:#0E0E11;--s2:#141418;--s3:#1B1B21;
  --bg:var(--ink);--panel:var(--s1);--panel-2:var(--s2);--raise:var(--s3);
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.11);--edge:rgba(255,255,255,.06);
  --txt:#F2F2EF;--soft:#A4A4AC;--dim:#7E7E86;
  --r-s:8px;--r-c:10px;--r-card:14px;--r-f:18px;
  --sh-card:inset 0 1px 0 var(--edge),0 18px 40px -28px rgba(0,0,0,.9);
  --sh-float:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px rgba(255,255,255,.08),0 30px 80px -24px rgba(0,0,0,.95);
  --glass:rgba(22,22,27,.78);
  --ease:cubic-bezier(.2,.8,.2,1);
}
body{background:var(--ink);color:var(--txt);-webkit-font-smoothing:antialiased;font-size:14px}
/* one ambient light, behind the page title or hero number */
#main{background:radial-gradient(640px 280px at 28% -60px,rgba(212,255,58,.045),transparent 70%) no-repeat,var(--ink)}
.topbar{background:transparent}
/* titles and numbers */
.head h1,.p-title,.day b,.sp-total,.sp-three b,.sec-h h2{font-family:var(--display);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.head h1,.p-title{font-size:30px;font-weight:600;line-height:1.1}
.day b{font-size:24px;font-weight:600}
.sec-h h2{font-size:18px;font-weight:600}
.lede{font-size:14px;color:var(--soft)}
.pane-h{font-size:13px;font-weight:600;color:var(--soft);letter-spacing:0}
small,.hint{color:var(--dim)}
/* cards and panels: raised, hairline, lit top edge */
.jot,.tlist,.wish-list,.sp-box,.sp-day,.sp-grp,.sp-bars,.sgroup,.msum,.resurf,.upcoming .tasks,.fgroup .tasks,.hday,.tditem,.idea,.card,.wcard,.lcard,.sp-ok,.sp-need,.empty-line{
  border-color:var(--line)}
.jot,.tlist,.wish-list,.sp-box,.sp-day,.sp-grp,.sp-bars,.sgroup,.msum,.sp-ok,.sp-need{
  background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh-card)}
.idea,.tditem,.card,.wcard,.lcard{background:var(--s1);border-radius:var(--r-card);box-shadow:var(--sh-card)}
.empty-line{background:transparent;border-color:var(--line-2);border-radius:var(--r-card)}
/* floating: dark glass */
.pmenu,.sheet,.cmdk,.toast,.digest,.paid-pop,.cap{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  border:0;box-shadow:var(--sh-float)}
.pmenu{border-radius:14px;padding:6px}
.sheet,.cmdk{border-radius:var(--r-f)}
.sheet-wrap{background:rgba(4,4,6,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.pmenu>button{min-height:36px;border-radius:9px;font-size:14px}
.pmenu>button:hover{background:rgba(255,255,255,.06)}
.pm-sep{height:1px;margin:6px 4px;background:var(--line)}
.pm-n{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.pm-ver{font-size:12px!important;color:var(--dim)!important;min-height:30px!important}
/* inputs: slightly recessed */
input:not([type=checkbox]):not([type=radio]):not([type=file]),textarea,select{border-radius:var(--r-c)}
.task-add input,.want-add input,.wish-add input,.link-add input,#tdText,.sp-add input,.jot .capture input,.f input,.sp-need input,.paid-pop input,.iprev-name{
  background:#0A0A0D;border:1px solid var(--line);box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.task-add input:focus,.want-add input:focus,.wish-add input:focus,.link-add input:focus,#tdText:focus,.sp-add input:focus,.jot .capture input:focus,.f input:focus{
  border-color:color-mix(in srgb,var(--lime) 45%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.45),0 0 0 3px color-mix(in srgb,var(--lime) 12%,transparent)}
/* buttons: primary (lime), secondary (lit surface), ghost */
.jot #capBtn,.sp-go,.gate-go,.task-add button,.wish-add .go,.link-add .go,.want-add .go,.dg-done,.paid-go,.fab:not(.small){
  background:var(--lime);color:var(--on);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.4);transition:filter .14s var(--ease),transform .12s var(--ease)}
.jot #capBtn:hover,.sp-go:hover,.gate-go:hover,.task-add button:hover,.wish-add .go:hover,.link-add .go:hover,.dg-done:hover{filter:brightness(1.07)}
.ghost-btn,.sec-new,.resurf-a button,.sp-ok-acts>button,.sp-ok-date,.dg-later,.td-when,.wnext,.home-money,.sp-big,.opt,.btn-inline,.chips-toggle{
  background:var(--s2);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge);color:var(--soft);transition:background .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease)}
.ghost-btn:hover,.sec-new:hover,.resurf-a button:hover,.sp-ok-acts>button:hover,.sp-ok-date:hover,.dg-later:hover,.td-when:hover,.wnext:hover,.home-money:hover,.sp-big:hover,.opt:hover,.btn-inline:hover,.chips-toggle:hover{
  background:var(--s3);color:var(--txt);border-color:var(--line-2)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid color-mix(in srgb,var(--lime) 80%,transparent);outline-offset:2px}
/* chips and segmented switches */
.chip{background:transparent;border:1px solid var(--line);color:var(--soft);font-size:13px;font-weight:500}
.chip:hover{color:var(--txt);border-color:var(--line-2)}
.chip.on,.chip.on:hover,.jot-tab.on,.jot-tab.on:hover,.sp-switch button.on,.sp-kind button.on,.fol.on{background:var(--s3);color:var(--txt);border-color:transparent;box-shadow:inset 0 1px 0 var(--edge),0 0 0 1px var(--line-2)}
.sp-switch,.sp-kind{background:var(--s1);border:1px solid var(--line);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
/* keycaps */
kbd,.kb{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;
  background:var(--s2);border:1px solid var(--line-2);border-bottom-width:2px;color:var(--dim);font:600 11.5px/1 var(--ui);letter-spacing:0;font-variant-numeric:tabular-nums}
/* counts: quiet badges */
.sec-n,.pane-h .count,.dg-n{background:var(--s3);color:var(--soft);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;box-shadow:inset 0 1px 0 var(--edge)}
/* list rows */
.tlist li,.tasks li{min-height:40px}
.tlist li+li,.sp-row+.sp-row{border-top:1px solid var(--line)}
.tlist li:hover,.sp-row:hover,.cmdk-it:hover{background:rgba(255,255,255,.025)}
/* sidebar */
#side{background:#0A0A0C;border-right:1px solid var(--line)}
.side-top{gap:6px}
.btn-all,.btn-all.on{flex:1;justify-content:flex-start;gap:10px;height:40px;padding:0 12px;border-radius:10px;border:0;background:none;color:var(--txt);font:600 14.5px var(--ui);box-shadow:none}
.btn-all:hover{background:var(--s2)}
.btn-all.on,.btn-all.on:hover{background:var(--s3);color:var(--txt);box-shadow:inset 0 1px 0 var(--edge)}
.btn-all svg{color:var(--soft)}
.search{position:relative;margin:4px 9px 8px;border-radius:10px;background:#0A0A0D;border:1px solid var(--line);box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.search input{background:none!important;border:0!important;box-shadow:none!important}
.search .kb{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.btn-nav.on,.btn-nav.on:hover{background:var(--s3);box-shadow:inset 0 1px 0 var(--edge)}
.btn-nav:hover{background:var(--s2)}
.side-label{padding:18px 15px 6px;font-size:12px;font-weight:600;color:var(--dim)}
.row.on{background:var(--s3);box-shadow:inset 0 1px 0 var(--edge)}
.row:hover{background:var(--s2)}
.side-foot{display:flex;flex-direction:row;align-items:center;gap:8px;padding:10px;border-top:1px solid var(--line)}
.nav{gap:2px;padding:0 9px 6px}
.nav .btn-nav{margin:0}
.side-top{padding:10px 9px 4px}
.side-foot .btn-new{flex:1;width:auto;justify-content:center;height:40px;margin:0;border-radius:10px;background:var(--s2);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge);color:var(--txt);font:600 14px var(--ui)}
.side-foot .btn-new:hover{background:var(--s3);border-color:var(--line-2);color:var(--txt)}
.side-foot .btn-new::after{display:none}
.btn-acct{flex:0 0 40px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:3px;color:var(--soft);border:1px solid var(--line);background:var(--s2);box-shadow:inset 0 1px 0 var(--edge)}
.btn-acct i{width:3.5px;height:3.5px;border-radius:50%;background:currentColor}
.btn-acct:hover{background:var(--s3);color:var(--txt)}
.acct-menu{min-width:220px}
/* top bar: one quiet command button */
.cmd-btn{margin-left:auto;display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 8px 0 12px;border-radius:10px;
  background:var(--s1);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge);color:var(--dim);font-size:14px;min-width:220px}
.cmd-btn span{flex:1;text-align:left}
.cmd-btn:hover{color:var(--soft);border-color:var(--line-2);background:var(--s2)}
/* home: projects header keeps one "New project" (in the panel) on wide screens */
@media (min-width:900px){#homeNew{display:none}}
/* motion: short and physical; nothing when reduced */
.pmenu{animation:pmenuIn .14s var(--ease)}
.sheet,.cmdk{animation:sheetIn .18s var(--ease) both}
button:active:not(:disabled){transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* phones */
@media (max-width:760px){
  .cmd-btn{min-width:0;padding:0 10px}
  .cmd-btn span,.cmd-btn .kb{display:none}
  .sheet::before{content:'';display:block;position:static;width:36px;height:4px;margin:-8px auto 12px;border-radius:4px;background:rgba(255,255,255,.18);padding:0;opacity:1;-webkit-mask:none;mask:none}
  .tlist li,.tasks li,.sp-row,.cmdk-it,.pmenu>button{min-height:44px}
  .search .kb{display:none}
}

/* home: status filters as one quiet row, the rest in ⋯ */
.chips.xrow{align-items:center}
.chips-more{opacity:1!important;width:32px;height:32px;border-radius:999px;border:1px solid var(--line)}
.day{align-items:center;gap:12px}
.day-done{color:var(--soft);font-weight:500}
.day-done svg{color:var(--lime)}

/* today page */
.fgroup-h{font-size:13px;font-weight:600;color:var(--soft);margin:0 0 8px}
.fgroup .tasks,.upcoming .tasks{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh-card);padding:2px 10px}
.fgroup{margin-bottom:18px}
.up-h{color:var(--txt)}
/* to do */
.tditem{border:1px solid var(--line)}
.tditem:hover{border-color:var(--line-2)}
.catbadge{background:var(--s3);border:0;color:var(--soft);box-shadow:inset 0 1px 0 var(--edge)}

/* list pages share the title's left edge and one reading width */
.hday,.msum,.hbars,.sgroup,.upcoming,.focus-wrap,.fgroup,#view>.empty-line,.focus-wrap>div{margin-left:0!important;margin-right:auto!important;max-width:820px}
.head{max-width:1500px}
.dice{background:var(--s2);border:1px solid var(--line);color:var(--soft);box-shadow:inset 0 1px 0 var(--edge)}
.dice svg{color:var(--lime)}
.dice:hover{background:var(--s3);color:var(--txt);border-color:var(--line-2)}

/* ideas: add first, then one tool row, then sources */
.ideas-pane{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;row-gap:12px}
.ideas-pane>*{flex:1 1 100%;margin:0!important}
.ideas-pane>.task-add{order:1}
.ideas-pane>.folders{order:2;flex:1 1 300px}
.ideas-pane>.idea-q{order:3;flex:0 1 260px;max-width:260px}
.ideas-pane>.sp-found{order:4}
.ideas-pane>.resurf{order:5}
.ideas-pane>.chips{order:6;flex:1 1 auto}
.ideas-pane>#aiNameAll{order:7;flex:0 0 auto}
.ideas-pane>.ideas,.ideas-pane>.empty-line,.ideas-pane>p{order:8}
.fol{background:transparent;border:1px solid var(--line);color:var(--soft)}
.fol:hover{border-color:var(--line-2);color:var(--txt)}

.tool-cur{justify-content:space-between;cursor:default}
.tool-cur .cur-pick{display:flex;gap:4px}
.tool-cur .cur-pick button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);color:var(--soft);font-size:13px}
.tool-cur .cur-pick button.on{background:var(--s3);color:var(--txt);border-color:var(--line-2)}

/* spending hero: numbers, then one row of small stats */
.sp-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sp-stats>span,.sp-stats>.sp-big{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge);margin:0}
.sp-stats>span,.sp-stats .sp-big>span{flex-direction:column;align-items:flex-start;justify-content:center;gap:1px}
.sp-stats small{font-size:12px;color:var(--dim);line-height:1.1}
.sp-stats b{font-size:14px;font-weight:600;color:var(--txt);font-variant-numeric:tabular-nums;line-height:1.2}
.sp-stats b.up{color:var(--soft)}
.sp-stats .sp-big{padding-left:6px}
.sp-stats .sp-big .sp-ic{flex-basis:30px;width:30px;height:30px;border-radius:9px}
.sp-sum{margin-top:6px;font-size:14px;color:var(--soft)}
.sp-hero{margin-top:22px}
.sp-stats .sp-big>span{display:flex}

/* project page: status as a segmented control; no outline on the next task */
.picker.big{display:inline-flex;gap:2px;padding:3px;background:var(--s1);border:1px solid var(--line);border-radius:12px;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.picker.big .pick{height:30px;padding:0 12px;border:0!important;border-radius:9px;background:none;color:var(--soft);box-shadow:none}
.picker.big .pick:hover{color:var(--txt);background:var(--s2)}
.picker.big .pick.on{background:var(--s3);color:var(--txt);box-shadow:inset 0 1px 0 var(--edge),0 0 0 1px var(--line-2)}
.picker.big .pick.on[data-s=active] svg{color:var(--amber)}
.picker.big .pick.on[data-s=done] svg{color:var(--mint)}
.tasks li.first-open{border:0!important;box-shadow:none!important;background:none!important;outline:0}
.notes{background:#0A0A0D;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.tag,.tag-imp{border-radius:999px;background:var(--s2);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge)}

.f>.sp-amt{display:flex;margin:0}
.sp-amt select{height:46px;background:#0A0A0D;border:1px solid var(--line);color:var(--txt);padding:0 8px}
.sp-sheet .sp-grid13{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px}
.sp-sheet .sp-grid13 button{padding:7px 4px;gap:3px}
.gate{background:radial-gradient(520px 260px at 50% 18%,rgba(212,255,58,.05),transparent 70%),var(--ink)}
.gate-box{background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh-card),0 40px 90px -40px #000;border-radius:var(--r-f)}

/* phones: tabs never wrap, rows stay one gesture, content clears the + button */
@media (max-width:760px){
  .jot-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:2px}
  .jot-tabs::-webkit-scrollbar{display:none}
  .jot-tab{flex:0 0 auto;white-space:nowrap;padding:0 12px}
  .tlist .tsnooze{display:none}
  .tlist .tsrc{max-width:28%}
  #view{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
  .day{gap:6px 10px}
  
}
@media (max-width:760px){.sp-hero{margin-top:0}}
@media (hover:none){.acct-menu [data-a=keys]{display:none}}

.wbusy{position:absolute;left:10px;right:10px;top:50%;transform:translateY(-50%);z-index:3;padding:8px 10px;border-radius:10px;text-align:center;
  font-size:12px;font-weight:600;color:var(--txt);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--sh-float)}

/* one logo tile: fixed square, centred mark, no shift while loading */
.sp-ic{position:relative;display:inline-grid;place-items:center;flex:0 0 36px;width:36px;height:36px;border-radius:10px;background:var(--s3);
  box-shadow:inset 0 1px 0 var(--edge);overflow:hidden;line-height:1}
.sp-ic>i{font-style:normal;font-size:18px;line-height:1}
.sp-ic img,.sp-ic svg{width:66%;height:66%;object-fit:contain;border-radius:22%;opacity:0;transition:opacity .15s}
.sp-ic img.ok,.sp-ic svg{opacity:1}
.sp-ic.logo{background:#1E1E25}
.sp-ic.lt{background:#ECECEF;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sp-ic.big{flex-basis:44px;width:44px;height:44px;border-radius:12px}
.sp-ic.big>i{font-size:22px}
.sp-freq button .sp-ic,.sp-big .sp-ic,.sp-stats .sp-big .sp-ic{flex:0 0 30px;width:30px;height:30px;border-radius:9px}
.sp-freq button .sp-ic{border-radius:999px}
.sp-freq button .sp-ic>i,.sp-stats .sp-big .sp-ic>i{font-size:15px}
/* stat pills: same height, label above value, long values cut cleanly */
.sp-stats>span,.sp-stats>.sp-big{height:48px;padding:0 12px;align-items:center}
.sp-stats .sp-big{gap:10px;padding-left:9px;max-width:260px}
.sp-stats .sp-big>span{min-width:0}
.sp-stats small{font-size:12px;line-height:14px}
.sp-stats b{font-size:14px;line-height:18px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-ic svg{width:76%;height:76%}

/* type scale — 12 meta/badges · 13 chips/secondary · 14 UI and buttons · 15 rows and names · 16 inputs · 18 section titles
   · 22/24 small titles · 30 page titles · 34/44/56 hero numbers; weights 400 body, 500 secondary, 600 titles, 700 lime buttons */
:root{--fs-meta:12px;--fs-sm:13px;--fs-ui:14px;--fs-row:15px;--fs-in:16px;--fs-h3:18px;--fs-h2:24px;--fs-h1:30px}
body{font-size:var(--fs-ui);line-height:1.45;font-kerning:normal;text-rendering:optimizeLegibility}
input,textarea,select{font-size:var(--fs-in)}
.head h1,.p-title{letter-spacing:-.022em}
.sp-total,.sp-three b,.sp-ok-amt{letter-spacing:-.03em}
b,strong{font-weight:600}
.sp-go,.jot #capBtn,.gate-go,.paid-go,.dg-done{font-weight:700}
.tasks li>span:not(.check),.tdtext,.sp-name,.wrow-name,.idea-title,.dg-text b{overflow-wrap:anywhere;hyphens:auto}
.money,.sp-row>b,.sp-amtc b,.wprice,.wrow-price,.wsum,.ncount,.chip-n,.sp-v,.sp-stats b{font-variant-numeric:tabular-nums lining-nums}

.lpin{display:inline-flex;font-style:normal;color:var(--lime);margin-right:6px;vertical-align:-1px}
.lacts button[data-lpin].on{color:var(--lime)}

.isrc-hint{display:flex;flex-wrap:wrap;gap:4px 12px}
.isrc-hint button{font-size:13px;color:var(--dim);padding:2px 0}
.isrc-hint button span{color:var(--dim);opacity:.7;font-variant-numeric:tabular-nums}
.isrc-hint button:hover{color:var(--txt)}
.ideas-pane>.isrc-hint{order:6;flex:1 1 auto}

.ideas-more{height:1px}
.net-dot{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line);color:var(--soft);white-space:nowrap}
.net-dot.off{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,var(--line))}
.ideas-pane>.ideas-more{order:9}

.rep-row.rep-6{grid-template-columns:repeat(3,1fr)}
.rep-n{display:flex;align-items:center;gap:8px;margin:-4px 0 14px;font-size:14px;color:var(--soft)}
.rep-n input{width:64px;height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:#0A0A0D;color:var(--txt);font-size:16px}
.rep-n b{font-weight:500;color:var(--dim)}

.sp-att{display:inline-flex;font-style:normal;color:var(--dim);margin-left:6px;vertical-align:-1px}
.sp-rcpt-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp-rcpt-img img{display:block;width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.sp-rcpt-wait{font-style:normal;font-size:12px;color:var(--dim)}
#eNote{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0A0A0D;color:var(--txt);font:inherit;font-size:16px;resize:vertical}
.bud-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bud-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 6px 0 12px;font-size:14px}
.bud-row+.bud-row{border-top:1px solid var(--line)}
.bud-row input{width:120px;height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:#0A0A0D;color:var(--txt);text-align:right;font-size:16px;font-variant-numeric:tabular-nums}
.sp-grp-bar.bud{background:var(--lime)}
.sp-grp-bar.bud.near{background:var(--amber)}
.sp-grp-bar.bud.over{background:var(--magenta);max-width:calc(100% - 28px)}
.g-near{color:var(--amber)!important}

.mic-btn{flex:0 0 auto;width:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--soft);box-shadow:inset 0 1px 0 var(--edge)}
.mic-btn:hover{color:var(--txt);background:var(--s3)}
.mic-btn.rec{color:var(--on);background:var(--magenta);border-color:transparent;animation:micPulse 1.2s ease-in-out infinite}
@keyframes micPulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--magenta) 25%,transparent)}}
.jot .mic-btn,.sp-add .mic-btn{height:56px;border-radius:14px;background:var(--bg);border-color:transparent}
.cap-row .mic-btn{height:48px}

.decide{max-width:1500px;margin:0 auto 26px}
.decide-list{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh-card);overflow:hidden}
.decide-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 8px 6px 14px;flex-wrap:wrap}
.decide-row+.decide-row{border-top:1px solid var(--line)}
.decide-name{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--txt);text-decoration:none}
.decide-name:hover{text-decoration:underline}
.decide-row small{flex:1;min-width:120px;font-size:13px;color:var(--dim)}
.decide-acts{display:flex;gap:6px}
.decide-acts button{min-height:32px;padding:0 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge);color:var(--soft);font-size:13px;font-weight:600}
.decide-acts button:hover{background:var(--s3);color:var(--txt)}
.decide-more{margin:0;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
@media (max-width:760px){.decide-acts button{min-height:40px}}

.trash-acts button{display:inline-flex;align-items:center;gap:5px;width:auto!important;padding:0 9px!important;font-size:12px;font-weight:600}
.trash-age{font-variant-numeric:tabular-nums}

.app-ver{display:block;width:100%;padding:2px 10px 10px;font-size:11.5px;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.app-ver:hover{color:var(--soft)}
.app-ver.new{color:var(--lime);font-weight:600}
h1.p-title{margin:0;font-family:var(--display)}

.nav-sep{display:block;height:1px;margin:6px 10px;background:var(--line)}
#btnCal svg{color:var(--cyan)}
#btnJrn svg{color:var(--amber)}
/* calendar */
.cal{max-width:1180px;margin:0 auto}
.cal-add{margin-bottom:12px}
.cal-soon{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.cal-soon button{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--s1);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge);font-size:13.5px;color:var(--txt)}
.cal-soon button b{font-weight:600;color:var(--amber)}
.cal-head{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.cal-head b{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.02em;min-width:190px;text-align:center}
.cal-head>button:not(.ghost-btn){width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.cal-head>button:not(.ghost-btn):hover{background:var(--s2);color:var(--txt)}
#calPrev svg{transform:rotate(180deg)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--s1);box-shadow:var(--sh-card)}
.cal-wd{padding:8px 10px;font-size:12px;font-weight:600;color:var(--dim);border-bottom:1px solid var(--line)}
.cal-cell{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell:hover{background:rgba(255,255,255,.02)}
.cal-cell.out{opacity:.45}
.cal-cell.sel{background:var(--s2);box-shadow:inset 0 0 0 1px var(--line-2)}
.cal-cell.drop{box-shadow:inset 0 0 0 2px var(--lime)}
.cal-n{font-size:12.5px;font-weight:600;color:var(--soft);font-variant-numeric:tabular-nums;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px}
.cal-cell.is-today .cal-n{background:var(--lime);color:var(--on)}
.cal-ev{display:flex;align-items:center;gap:5px;min-width:0;padding:2px 6px;border-radius:6px;font-size:12px;line-height:16px;background:var(--s3);color:var(--txt)}
.cal-ev>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cal-ev i{font-style:normal;flex:0 0 auto;font-size:11px}
.cal-ev .sp-ic{flex:0 0 16px;width:16px;height:16px;border-radius:4px}
.cal-ev .sp-ic>i{font-size:10px}
.cal-ev em{font-style:normal;color:var(--dim)}
.cal-ev b{font-weight:600}
.cal-ev.ev-task{cursor:grab}
.cal-ev.ev-rep{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--soft)}
.cal-ev.ev-date{background:color-mix(in srgb,var(--amber) 14%,var(--s3))}
.cal-more{font-size:11.5px;color:var(--dim);padding-left:6px}
.cal-day{margin-top:16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh-card);overflow:hidden}
.cal-day-h{display:flex;align-items:baseline;gap:8px;padding:12px 14px 6px}
.cal-day-h b{font-size:15px;font-weight:600}
.cal-day-h small{font-size:12.5px;color:var(--dim)}
.cal-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 14px;cursor:pointer}
.cal-row+.cal-row{border-top:1px solid var(--line)}
.cal-row:hover{background:rgba(255,255,255,.025)}
.cal-ic{flex:0 0 22px;display:inline-flex;justify-content:center;font-size:16px}
.cal-ic .sp-ic{flex-basis:30px;width:30px;height:30px}
.cal-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:15px}

.cal-none{margin:0;padding:6px 14px 14px;font-size:13.5px;color:var(--dim)}

/* dates elsewhere */
.date-chips,.dg-dates{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.dg-dates{margin:0;padding:4px 12px 8px}
.date-chip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--s1);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--edge);font-size:13.5px;color:var(--txt);max-width:100%}

.day .date-chip{min-height:30px;font-size:13px}
.day .date-chip b{font-family:inherit;font-size:inherit;letter-spacing:0}
/* journal */
.jr{max-width:760px;margin:0 auto}
.jr-week{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;margin-bottom:12px;box-shadow:var(--sh-card)}
.jr-week>div{background:var(--s1);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.jr-week b{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.jr-week small{font-size:12.5px;color:var(--dim)}
.jr-search{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);margin-bottom:16px;color:var(--dim)}
.jr-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font-size:15px}
.jr-day{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh-card);padding:12px 14px 10px;margin-bottom:10px}
.jr-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.jr-h b{font-size:15.5px;font-weight:600}
.jr-h small{font-size:12.5px;color:var(--dim)}
.jr-money{margin-left:auto;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:6px}
.jr-money:hover{background:var(--s2)}
.jr-money b{font-weight:600;color:var(--mint)}
.jr-note{display:flex;align-items:flex-start;gap:6px;margin-top:8px}
.jr-note textarea{flex:1;min-width:0;resize:none;overflow:hidden;min-height:38px;padding:8px 10px;border-radius:10px;background:var(--s2);border:1px solid transparent;color:var(--txt);font:inherit;font-size:15px;line-height:1.45}
.jr-note textarea:focus{outline:0;border-color:var(--line-2)}
.jr-note textarea:placeholder-shown{background:transparent;border-color:var(--line)}
.jr-ph{flex:0 0 38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.jr-ph:hover{background:var(--s2);color:var(--txt)}
.jr-img{position:relative;margin-top:8px;width:160px;max-width:100%}
.jr-img.big{width:100%}
.jr-img img{display:block;width:100%;border-radius:10px;cursor:zoom-in}
.jr-img.big img{cursor:zoom-out}
.jr-img button{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.jr-list{list-style:none;margin:8px 0 0;padding:0}

<script>
/* ───────── cloud ───────── */
const SUPA_URL='https://behlseohzahgkvnsghjm.supabase.co';
const SUPA_KEY='sb_publishable_jtedcHjzGQ8Ow8Usp8WiWA_xF25IBGU';
let sb=null, ME=null, lastLoad=0;

/* ───────── local cache (kept for migration) ───────── */
const DB_NAME='proekty', DB_VER=2;
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('projects')) d.createObjectStore('projects',{keyPath:'id'});
      if(!d.objectStoreNames.contains('photos')){
        const s=d.createObjectStore('photos',{keyPath:'id'});
        s.createIndex('pid','pid');
      }
      if(!d.objectStoreNames.contains('queue')) d.createObjectStore('queue',{keyPath:'id'});
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
const tx=(s,m)=>db.transaction(s,m).objectStore(s);
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const localProjects=()=>req(tx('projects').getAll());
const localPhotos=()=>req(tx('photos').getAll());

/* ───────── cloud data layer ───────── */
const tasksOf=p=>(p.tasks||[]).filter(t=>t.kind!=='link'&&t.kind!=='sticky'&&t.kind!=='quick');
const linksOf=p=>(p.tasks||[]).filter(t=>t.kind==='link');
const KIND_OF=pid=>pid===INBOX?'idea':pid===WANT?'wish':pid===TODO?'todo':pid===DATES?'date':pid===JOURNAL?'jnote':'task';

function projectRow(p){
  return {id:p.id,user_id:ME.id,name:p.name||'',status:p.status||'idle',
    important:!!p.important,archived:!!p.archived,pinned:!!p.pinned,
    ord:p.ord==null?null:p.ord,start_date:p.startDate||null,revisit:p.revisit||null,
    cover:p.cover||null,color:p.color||null,shared:!!p.shared,share_id:p.shareId||null,
    share_data:p.shareData||null,notes:p.notes||'',created:p.created||Date.now(),
    updated:p.updated||Date.now(),done_at:p.doneAt||null};
}
function projectFromRow(r,items){
  return {id:r.id,name:r.name,status:r.status,important:r.important,archived:r.archived,
    pinned:r.pinned,ord:r.ord,startDate:r.start_date||'',revisit:r.revisit||'',
    cover:r.cover||null,color:r.color||null,shared:!!r.shared,shareId:r.share_id||null,
    shareData:r.share_data||null,notes:r.notes||'',created:Number(r.created)||0,
    updated:Number(r.updated)||0,doneAt:r.done_at?Number(r.done_at):null,tasks:items||[]};
}
function itemRow(t,p,i){
  return {id:t.id,project_id:p.id,user_id:ME.id,kind:t.kind||KIND_OF(p.id),text:t.text||'',
    preview:t.preview||null,layout:t.layout?(typeof t.layout==='string'?JSON.parse(t.layout):t.layout):null,
    done:!!t.done,done_at:t.doneAt||null,star:!!t.star,
    price:(t.price===0||t.price)?t.price:null,url:t.url||null,note:t.note||null,
    cat:t.cat||null,subs:t.subs||[],ord:i,created:t.created||Date.now()};
}
function itemFromRow(r){
  const t={id:r.id,text:r.text,done:r.done,created:Number(r.created)||0};
  if(r.kind&&r.kind!=='task') t.kind=r.kind;
  if(r.preview) t.preview=r.preview;
  if(r.layout) t.layout=typeof r.layout==='string'?r.layout:JSON.stringify(r.layout);
  if(r.done_at) t.doneAt=Number(r.done_at);
  if(r.star) t.star=true;
  if(r.price!=null) t.price=Number(r.price);
  if(r.url) t.url=r.url;
  if(r.note) t.note=r.note;
  if(r.cat) t.cat=r.cat;
  if(Array.isArray(r.subs)&&r.subs.length) t.subs=r.subs;
  return t;
}

let netOk=true, pendingCount=0;

function setNet(ok){
  if(netOk===ok) return;
  netOk=ok;
  paintNet();
  if(ok) toast('Back online — syncing');
}
function paintNet(){
  const el=document.getElementById('netDot');
  if(!el) return;
  if(netOk&&!pendingCount){ el.style.display='none'; return }
  el.style.display='';
  el.className='net-dot'+(netOk?' syncing':' off');
  el.textContent=netOk?('Syncing '+pendingCount+(pendingCount===1?' change…':' changes…')):('Offline'+(pendingCount?' · '+pendingCount+(pendingCount===1?' change':' changes')+' waiting to sync':' · changes will sync when you are back'));
  el.title=netOk?'Sending your changes':'Your changes are kept on this device and sent when the connection is back';
}

async function localPut(store,val){ if(!db) return; try{ await req(tx(store,'readwrite').put(val)) }catch(e){} }
async function localDel(store,id){ if(!db) return; try{ await req(tx(store,'readwrite').delete(id)) }catch(e){} }
async function queueAll(){ if(!db) return []; try{ return await req(tx('queue').getAll()) }catch(e){ return [] } }

async function enqueue(job){
  job.id=job.id||uid(); job.at=Date.now();
  await localPut('queue',job);
  pendingCount=(await queueAll()).length;
  paintNet();
}

async function pushProject(p){
  try{
    const r1=await sb.from('projects').upsert(projectRow(p));
    if(r1.error) throw r1.error;
    const rows=(p.tasks||[]).map((t,i)=>itemRow(t,p,i));
    if(rows.length){
      const r2=await sb.from('items').upsert(rows);
      if(r2.error) throw r2.error;
    }
    let q=sb.from('items').delete().eq('project_id',p.id);
    const ids=rows.map(r=>r.id);
    if(ids.length) q=q.not('id','in','('+ids.map(x=>'"'+x+'"').join(',')+')');
    const r3=await q;
    if(r3.error) throw r3.error;
    return true;
  }catch(e){ console.error(e); return false }
}

async function putProject(p){
  if(!sb||!ME) return;
  await localPut('projects',JSON.parse(JSON.stringify(p)));   // зеркало на диске
  const ok=await pushProject(p);
  if(!ok){ await enqueue({kind:'project',pid:p.id}); setNet(false) }
  else setNet(true);
}

async function flushQueue(){
  if(!sb||!ME||!db) return;
  const jobs=await queueAll();
  pendingCount=jobs.length; paintNet();
  for(const job of jobs.sort((a,b)=>a.at-b.at)){
    let done=false;
    try{
      if(job.kind==='project'){
        const p=st.projects.find(x=>x.id===job.pid)
             ||(await req(tx('projects').get(job.pid)));
        done=p?await pushProject(p):true;
      }
      if(job.kind==='projDel'){
        done=!(await sb.from('projects').delete().eq('id',job.pid)).error;
      }
      if(job.kind==='photo'){
        const up=await sb.storage.from('photos').upload(job.path,job.blob,{contentType:'image/jpeg',upsert:true});
        if(!up.error||/exists/i.test(up.error.message||'')){
          done=!(await sb.from('photos').upsert(job.row)).error;
        }
      }
      if(job.kind==='photoRow'){
        done=!(await sb.from('photos').upsert(job.row)).error;
      }
      if(job.kind==='photoPurge'){
        if(job.path) await sb.storage.from('photos').remove([job.path]);
        done=!(await sb.from('photos').delete().eq('id',job.pid)).error;
      }
    }catch(e){ done=false }
    if(done) await localDel('queue',job.id); else { setNet(false); break }
  }
  const left=await queueAll();
  pendingCount=left.length;
  if(!left.length) setNet(true);
  paintNet();
}

async function signPhotos(rows){

  const need=rows.filter(r=>{

    return !(c&&Date.now()-c.at<URL_TTL);
  }).map(r=>r.path);
  if(need.length){

    (data||[]).forEach(d=>{ if(d.path&&d.signedUrl) urlCache[d.path]={url:d.signedUrl,at:Date.now()} });

  const map={};
  rows.forEach(r=>{ const c=urlCache[r.path]; if(c) map[r.path]=c.url });
  return rows.map(r=>({id:r.id,pid:r.project_id,item:r.item_id||null,album:!!r.album,

function nextDue(d,rep){
