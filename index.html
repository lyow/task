function repLabel(rep){ let m;
  if(!rep) return '';
  if(rep==='day') return 'every day'; if(rep==='week') return 'every week'; if(rep==='month') return 'every month'; if(rep==='wd') return 'weekdays';
  if((m=/^d(\d+)$/.exec(rep))) return +m[1]===1?'every day':'every '+m[1]+' days';
  if((m=/^w(\d+)$/.exec(rep))) return +m[1]===1?'every week':'every '+m[1]+' weeks';
  if((m=/^m(\d+)$/.exec(rep))) return 'monthly on the '+ordN(+m[1]);
  return '' }
/* сразу после отметки «сделано»: повторяющаяся задача не закрывается, а переезжает на следующий срок */
function rollRepeat(t){
  const rep=repOf(t); if(!t.done||!rep) return false;
  t.done=false; t.doneAt=null; t.star=false;
  setLay(t,'due',nextDue(dueOf(t),rep)); setLay(t,'last',Date.now());
  if(t.subs&&t.subs.length) t.subs.forEach(s=>{s.done=false});
  toast('Done',{sub:'next: '+dueLabel(dueOf(t))});
  return true;
}
const WEEK=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function doneStats(){
  const days={}, tk=ld(); let today=0;
  st.projects.forEach(p=>(p.tasks||[]).forEach(t=>{
    [t.doneAt,t.layout&&t.kind!=='sticky'?layObj(t).last:0].forEach(ts=>{
      if(!ts) return; const k=ld(new Date(Number(ts))); days[k]=1; if(k===tk) today++;
    });
  }));
  const d=new Date(); if(!days[ld(d)]) d.setDate(d.getDate()-1);
  let streak=0; while(days[ld(d)]){ streak++; d.setDate(d.getDate()-1) }
  return {today,streak};
}
/* тихие звуки и конфетти */
let actx=null;
function blip(kind){
  if(LS.get('pm:sound')==='0') return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    const f=kind==='done'?[620,940]:kind==='add'?[480,600]:[880,1320];
    o.type='sine'; o.frequency.setValueAtTime(f[0],t); o.frequency.exponentialRampToValueAtTime(f[1],t+.09);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+.17);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.19);
  }catch(e){}
}
const dueState=d=>!d?'':d<ld()?'late':d===ld()?'now':'later';
function dueLabel(d){
  if(!d) return '';
  if(d===ld()) return 'today';
  if(d===ldPlus(1)) return 'tomorrow';
  if(d===ldPlus(-1)) return 'yesterday';
  const a=d.split('-'); return MON[+a[1]-1]+' '+(+a[2]);
}

/* даты словами в конце строки: «в пятницу», «через 3 дня», «next monday», «25 дек», «dec 25», «25.12» */
const WD=[[/^(воскресень[ея]|вс|sunday|sun)$/,0],[/^(понедельник|пн|monday|mon)$/,1],[/^(вторник|вт|tuesday|tue)$/,2],[/^(сред[ау]|ср|wednesday|wed)$/,3],
  [/^(четверг|чт|thursday|thu)$/,4],[/^(пятниц[ау]|пт|friday|fri)$/,5],[/^(суббот[ау]|сб|saturday|sat)$/,6]];
const MONW=[/^(янв|jan)/,/^(фев|feb)/,/^(мар|mar)/,/^(апр|apr)/,/^(ма[йя]|may)/,/^(июн|jun)/,/^(июл|jul)/,/^(авг|aug)/,/^(сен|sep)/,/^(окт|oct)/,/^(ноя|nov)/,/^(дек|dec)/];
function nlDate(text){
  const t=String(text||'').trim(), low=t.toLowerCase();
  const end=(re)=>{ const m=low.match(new RegExp('(?:^|\\s)'+re+'$','i')); return m?{m,rest:t.slice(0,m.index).trim()}:null };
  const plus=n=>ldPlus(n);
  let r;
  if((r=end('(сегодня|завтра|послезавтра|today|tomorrow)'))) return {due:plus(DUE_WORDS[r.m[1]]),rest:r.rest};
  if((r=end('(?:через|in)\\s+(\\d+)\\s*(дн[яей]*|день|days?|недел[юиь]*|weeks?)'))){ const n=+r.m[1]*(/нед|week/.test(r.m[2])?7:1); return {due:plus(n),rest:r.rest} }
  if((r=end('(через неделю|next week|на следующей неделе|in a week)'))) return {due:plus(7),rest:r.rest};
  if((r=end('(?:(в|во|on|this|next|в следующ[а-я]+)\\s+)?([а-яa-z]+)'))){
    const w=WD.find(x=>x[0].test(r.m[2]));
    if(w){ const today=new Date().getDay(); let d=(w[1]-today+7)%7||7; return {due:plus(d),rest:r.rest} }
  }
  const md=(day,mon)=>{ const now=new Date(); let y=now.getFullYear(); const dt=new Date(y,mon,day); if(ld(dt)<ld()) dt.setFullYear(y+1); return dt.getMonth()===mon?ld(dt):null };
  if((r=end('(\\d{1,2})\\s+([а-яa-z]{3,})\\.?'))){ const mi=MONW.findIndex(x=>x.test(r.m[2])); if(mi>=0){ const d=md(+r.m[1],mi); if(d) return {due:d,rest:r.rest} } }
  if((r=end('([a-z]{3,})\\.?\\s+(\\d{1,2})'))){ const mi=MONW.findIndex(x=>x.test(r.m[1])); if(mi>=0){ const d=md(+r.m[2],mi); if(d) return {due:d,rest:r.rest} } }
  if((r=end('(\\d{1,2})[./](\\d{1,2})'))){ const mo=+r.m[2]-1; if(mo>=0&&mo<12){ const d=md(+r.m[1],mo); if(d) return {due:d,rest:r.rest} } }
  return null;
}
const DUE_WORDS={'сегодня':0,'today':0,'завтра':1,'tomorrow':1,'послезавтра':2};

function sortProjects(){
  st.projects.sort((a,b)=>{
    if(SPECIAL(a.id)&&!SPECIAL(b.id)) return -1;
    if(SPECIAL(b.id)&&!SPECIAL(a.id)) return 1;
    if(!!a.archived!==!!b.archived) return a.archived?1:-1;
    if(!!b.pinned!==!!a.pinned) return b.pinned?1:-1;
    if(st.manual) return (a.ord==null?1e9:a.ord)-(b.ord==null?1e9:b.ord);
    if(ORD[a.status]!==ORD[b.status]) return ORD[a.status]-ORD[b.status];
    if(!!b.important!==!!a.important) return b.important?1:-1;
    return (b.updated||b.created)-(a.updated||a.created);
  });
  st.projects.forEach((p,i)=>{ if(p.ord==null) p.ord=i; });
}

function touchProject(p){
  if(!p||SPECIAL(p.id)) return false;
  if(p.status!=='idle') return false;

const UNDO_MAX=40;
let undoStack=[], redoStack=[], baseline={}, lastSnap={};

const snapOf=p=>JSON.stringify({tasks:p.tasks||[],notes:p.notes||'',name:p.name,
  status:p.status,important:!!p.important,archived:!!p.archived,color:p.color||null});

function noteChange(p){
  const now=snapOf(p);
  const prev=baseline[p.id];
  if(prev===undefined){ baseline[p.id]=now; return }
  if(prev===now) return;
  let a,b;
  try{ a=JSON.parse(prev); b=JSON.parse(now) }catch(e){ baseline[p.id]=now; return }
  const structural=JSON.stringify(a.tasks)!==JSON.stringify(b.tasks)
    || a.status!==b.status || a.archived!==b.archived || a.important!==b.important;
  const typing=!structural;
  if(typing && lastSnap[p.id] && Date.now()-lastSnap[p.id]<2500){ baseline[p.id]=now; return }
  undoStack.push({pid:p.id,snap:prev});
  if(undoStack.length>UNDO_MAX) undoStack.shift();
  redoStack.length=0;
  lastSnap[p.id]=Date.now();
  baseline[p.id]=now;
}

function applySnap(pid,snap){
  const p=st.projects.find(x=>x.id===pid);
  if(!p) return null;
  const before=snapOf(p);
  const d=JSON.parse(snap);
  p.tasks=d.tasks; p.notes=d.notes; p.name=d.name;
  p.status=d.status; p.important=d.important; p.archived=d.archived;
  if('color' in d) p.color=d.color;
  baseline[pid]=snap;
  putProject(p).catch(()=>{});
  return before;
}

function undo(){
  const step=undoStack.pop();
  if(!step) return toast('Nothing to undo');
  const before=applySnap(step.pid,step.snap);
  if(before===null) return;
  redoStack.push({pid:step.pid,snap:before});
  sortProjects();
  refreshView();
  toast('Undone');
}
function redo(){
  const step=redoStack.pop();
  if(!step) return toast('Nothing to redo');
  const before=applySnap(step.pid,step.snap);
  if(before===null) return;
  undoStack.push({pid:step.pid,snap:before});
  sortProjects();
  refreshView();
  toast('Redone');
}

function dueItems(){

function remindOn(){ return LS.get('pm:remind')==='1'&&'Notification' in window&&Notification.permission==='granted' }
function checkRemind(){
  if(!remindOn()) return;
  const now=new Date(), hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const at=LS.get('pm:remindAt')||'09:00';
  const list=dueItems();
  const seen=(()=>{ try{ return JSON.parse(LS.get('pm:reminded')||'{}')||{} }catch(e){ return {} } })();
  const day=ld(); if(seen.day!==day){ seen.day=day; seen.ids=[]; seen.morning=false }
  let fresh=list.filter(x=>seen.ids.indexOf(x.t.id)<0);
  if(hm>=at&&!seen.morning){
    seen.morning=true; fresh=list;
  }else if(!seen.morning) fresh=[];
  if(fresh.length){
    try{ new Notification(list.length===1?'1 thing for today':list.length+' things for today',
      {body:fresh.slice(0,3).map(x=>'• '+x.t.text).join('\n')+(fresh.length>3?'\n…':''),icon:'icon-512.png',tag:'pm-today'}) }catch(e){}
  }
  seen.ids=list.map(x=>x.t.id);
  LS.set('pm:reminded',JSON.stringify(seen));
}

const coverCache={};
const COVER_KEY='pm:covers';
let coverFresh=0;
const coverMap=()=>{ try{ return JSON.parse(LS.get(COVER_KEY)||'{}')||{} }catch(e){ return {} } };
async function coverStore(){ try{ return window.caches?await caches.open('pm-covers-v1'):null }catch(e){ return null } }
async function thumbBlob(url){
  const r=await fetch(url); if(!r.ok) throw new Error('cover');
  const bmp=await createImageBitmap(await r.blob());
  const k=Math.min(1,640/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(bmp.width*k)); c.height=Math.max(1,Math.round(bmp.height*k));
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(x=>x?res(x):rej(new Error('cover')),'image/jpeg',.8));
}
/* обложки: сразу из памяти и с диска, потом один запрос на всё и одна подпись ссылок */
async function paintCovers(){
  const cards=()=>Array.from(document.querySelectorAll('.card[data-cover], .prow[data-cover]'));
  const put=(pid,url)=>cards().forEach(c=>{ if(c.dataset.cover===pid) attachCover(c,url) });
  cards().forEach(c=>{ const m=coverCache[c.dataset.cover]; if(m&&m.url) attachCover(c,m.url) });
  const map=coverMap(), store=await coverStore();
  if(store) await Promise.all(Object.keys(map).map(async pid=>{
    if(coverCache[pid]&&coverCache[pid].url) return;
    try{
      const hit=await store.match('/cover/'+map[pid]); if(!hit) return;
      coverCache[pid]={url:URL.createObjectURL(await hit.blob()),id:map[pid]}; put(pid,coverCache[pid].url);
    }catch(e){}
  }));
  if(!sb||!ME||(coverFresh&&Date.now()-coverFresh<5*60*1000)) return;
  let rows;
  try{
    const q=await sb.from('photos').select('id,project_id,path,created,deleted_at').order('created',{ascending:true});
    if(q.error) throw q.error;
    rows=(q.data||[]).filter(r=>!r.deleted_at&&r.path);
  }catch(e){ return }
  coverFresh=Date.now();
  const want={};
  st.projects.forEach(p=>{
    if(SPECIAL(p.id)) return;
    const pick=(p.cover&&rows.find(r=>r.id===p.cover))||rows.find(r=>r.project_id===p.id);
    if(pick) want[p.id]=pick;
  });
  const next={}; Object.keys(want).forEach(pid=>{ next[pid]=want[pid].id });
  LS.set(COVER_KEY,JSON.stringify(next));
  Object.keys(coverCache).forEach(pid=>{
    if(want[pid]) return;
    delete coverCache[pid];
    cards().forEach(c=>{ if(c.dataset.cover!==pid) return; const im=c.querySelector('img.cover'); if(im) im.remove(); c.classList.remove('has-cover') });
  });
  const need=Object.keys(want).filter(pid=>!(coverCache[pid]&&coverCache[pid].id===want[pid].id));
  if(need.length){
    let urlOf={};
    try{
      const sg=await sb.storage.from('photos').createSignedUrls(need.map(pid=>want[pid].path),3600);
      (sg.data||[]).forEach(d=>{ if(d.path&&d.signedUrl) urlOf[d.path]=d.signedUrl });
    }catch(e){}
    await Promise.all(need.map(async pid=>{
      const row=want[pid], src=urlOf[row.path]; if(!src) return;
      let u=src;
      try{
        const blob=await thumbBlob(src);
        if(store) await store.put('/cover/'+row.id,new Response(blob,{headers:{'Content-Type':'image/jpeg'}}));
        u=URL.createObjectURL(blob);
      }catch(e){}
      coverCache[pid]={url:u,id:row.id}; put(pid,u);
    }));
  }
  if(store) try{                                        // старые уменьшенные копии больше не нужны
    const keep=new Set(Object.values(next).map(id=>'/cover/'+id));
    (await store.keys()).forEach(k=>{ const path=new URL(k.url).pathname; if(!keep.has(path)) store.delete(k) });
  }catch(e){}
}
function attachCover(card,url){
  const thumb=card.querySelector('.pthumb');
  if(thumb){                       // компактная строка — маленькое превью
    if(thumb.style.backgroundImage.indexOf(url)>=0) return;
    thumb.style.backgroundImage='url("'+url+'")';
    card.classList.add('has-cover');
    return;
  }
  const old=card.querySelector('img.cover');
  if(old){ if(old.src===url) return; old.remove() }
  const img=document.createElement('img');
  img.className='cover'; img.alt=''; img.decoding='async'; img.src=url;
  card.insertBefore(img,card.firstChild);
  card.classList.add('has-cover');
}
function dropCover(pid){ delete coverCache[pid]; coverFresh=0 }

function bindRowDrag(box){
  let dragId=null;
  box.addEventListener('dragstart',e=>{
    const r=e.target.closest('.row'); if(!r) return;
    dragId=r.dataset.id; st.dragRow=true; r.classList.add('drag');
    e.dataTransfer.effectAllowed='move';
    try{ e.dataTransfer.setData('text/plain',dragId) }catch(_){}
  });
  box.addEventListener('dragend',()=>{ st.dragRow=false; dragId=null; renderSide() });
  box.addEventListener('dragover',e=>{
    if(!dragId) return;
    e.preventDefault();
    const over=e.target.closest('.row'); if(!over||over.dataset.id===dragId) return;
    const el=box.querySelector('.row[data-id="'+dragId+'"]'); if(!el) return;
    const r=over.getBoundingClientRect();
    box.insertBefore(el, (e.clientY-r.top)>r.height/2 ? over.nextSibling : over);
  });
  box.addEventListener('drop',async e=>{
    e.preventDefault(); if(!dragId) return;
    dragId=null; st.dragRow=false;
    await persistOrder(box);
  });
  bindTouchReorder(box);
}

async function persistOrder(box){
  const ids=Array.from(box.querySelectorAll('.row')).map(r=>r.dataset.id);
  for(let i=0;i<ids.length;i++){
    const pr=st.projects.find(x=>x.id===ids[i]);
    if(pr){ pr.ord=i; await putProject(pr) }
  }
  st.manual=true; LS.set('pm:manual','1');
  sortProjects(); renderSide();
  toast('Order saved');
}

function bindTouchReorder(box){
  let held=null, timer=null, startY=0, moved=false;
  const cancel=()=>{ clearTimeout(timer); timer=null };
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch') return;
    const row=e.target.closest('.row'); if(!row) return;
    if(e.target.closest('.pick')||e.target.closest('.btn-gear')||e.target.closest('.btn-pin')) return;
    startY=e.clientY; moved=false;
    timer=setTimeout(()=>{
      held=row; st.dragRow=true; row.classList.add('drag');
      if(navigator.vibrate) navigator.vibrate(12);
    },350);
  });
  box.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch') return;
    if(!held){
      if(timer&&Math.abs(e.clientY-startY)>9){ cancel() }
      return;
    }
    moved=true;
    e.preventDefault();
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const row=under&&under.closest?under.closest('.row'):null;
    if(row&&row!==held&&row.parentNode===box){
      const r=row.getBoundingClientRect();
      box.insertBefore(held,(e.clientY-r.top)>r.height/2?row.nextSibling:row);
    }
  });
  const finish=async e=>{
    cancel();
    if(!held) return;
    const row=held; held=null; st.dragRow=false;
    row.classList.remove('drag');
    if(e) { e.preventDefault(); }
    if(moved) await persistOrder(box);
  };
  box.addEventListener('pointerup',finish);
  box.addEventListener('pointercancel',finish);
}

function decisions(){
  const real=st.projects.filter(x=>!SPECIAL(x.id)&&!x.archived);
  const out=[];
  real.filter(isDue).forEach(p=>out.push({p,why:'asked to come back',acts:[['snooze','Later'],['start','Start'],['arch','Archive']]}));
  real.filter(x=>x.status==='active'&&daysAgo(x.updated||x.created)>=7&&!isDue(x)).forEach(p=>out.push({p,why:'untouched '+daysAgo(p.updated||p.created)+' days',acts:[['snooze','Park'],['done','Done'],['arch','Archive']]}));

  return out;
}

  if(k==='start'){ p.status='active'; p.revisit=''; if(!p.startDate) p.startDate=today(); saveProject(p,true); toast('In progress',{action:'Undo',onAction:undo}) }

    else if(!rolled) toast('Done',{action:'Undo',onAction:()=>{ task.done=false; task.doneAt=null; saveProject(pr,true); if(!st.openId) renderAll(); renderSide() }});
  });
}

function historyEvents(days){
  const from=Date.now()-days*864e5, ev=[];
  st.projects.forEach(p=>{
    if(p.doneAt&&p.doneAt>=from&&!SPECIAL(p.id))
      ev.push({at:p.doneAt,kind:'proj',text:p.name,src:'project finished',pid:p.id});
    (p.tasks||[]).forEach(t=>{
      if(!t.doneAt||t.doneAt<from) return;
      if(p.id===WANT) ev.push({at:t.doneAt,kind:'wish',text:t.text,src:(isExp(t)?(layObj(t).inc?'income':'spent'):'bought')+(t.price?' · '+money(t.price):''),pid:p.id});
      else if(p.id===TODO) ev.push({at:t.doneAt,kind:'todo',text:t.text,src:(t.cat||'other')+' · done',pid:p.id});
      else if(p.id===INBOX) return;
      else ev.push({at:t.doneAt,kind:'task',text:t.text,src:p.name,pid:p.id});
    });
  });
  return ev.sort((a,b)=>b.at-a.at);
}

function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate() }
function dayLabel(ts){
  const n=daysAgo(ts);
  if(n<=0) return 'Today';
  if(n===1) return 'Yesterday';
  const d=new Date(ts);
  return MON[d.getMonth()]+' '+d.getDate();
}

function monthSummary(offset){
  const now=new Date();
  const m=new Date(now.getFullYear(),now.getMonth()-offset,1);
  const from=m.getTime();
  const to=new Date(m.getFullYear(),m.getMonth()+1,1).getTime();
  const ev=historyEvents(4000).filter(e=>e.at>=from&&e.at<to);
  const by=k=>ev.filter(e=>e.kind===k);
  const spent=by('wish').reduce((n,e)=>{const mm=String(e.src).match(/([\d.,]+)\s*$/);return n+(mm?parseFloat(mm[1].replace(',','.'))||0:0)},0);
  const days={};
  ev.forEach(e=>{const k=dayKey(e.at);days[k]=(days[k]||0)+1});
  let bestDay=null,bestN=0;
  Object.keys(days).forEach(k=>{ if(days[k]>bestN){bestN=days[k];bestDay=k} });
  const bestAt=bestDay?ev.find(e=>dayKey(e.at)===bestDay).at:null;
  return {label:MON[m.getMonth()]+' '+m.getFullYear(),ev,tasks:by('task').length,projs:by('proj').length,
    wishes:by('wish').length,todos:by('todo').length,spent,bestAt,bestN,activeDays:Object.keys(days).length};
}

function mark(text,q){
  const t=String(text||'');
  const i=t.toLowerCase().indexOf(q);
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
function snippet(text,q,pad){
  const t=String(text||''); const i=t.toLowerCase().indexOf(q);
  if(i<0) return '';
  const a=Math.max(0,i-pad), b=Math.min(t.length,i+q.length+pad*2);
  return (a>0?'…':'')+t.slice(a,b)+(b<t.length?'…':'');
}
const KIND_LABEL={step:'step',income:'income',spent:'spent',bought:'bought',task:'task',idea:'idea',wish:'wish',todo:'to do',link:'link',sticky:'note',quick:'link'};

function searchHits(){
  const q=st.query.trim().toLowerCase();
  if(!q) return [];
  const out=[];
  st.projects.forEach(p=>{
    const hits=[];
    if((p.name||'').toLowerCase().includes(q)) hits.push({k:'name',t:p.name});
    (p.tasks||[]).forEach(t=>{
      const kind=t.kind||(SPECIAL(p.id)?KIND_OF(p.id):'task');
      const wk=p.id===WANT&&t.done?(isExp(t)?(layObj(t).inc?'income':'spent'):'bought'):kind;
      if((t.text||'').toLowerCase().includes(q)) hits.push({k:wk,t:t.text+(p.id===WANT&&t.done&&t.price?' · '+money2(Number(t.price)):''),done:t.done&&wk!=='spent'&&wk!=='bought',id:t.id,sp:p.id===WANT&&t.done&&Number(t.price)>0});
      if((t.note||'').toLowerCase().includes(q)) hits.push({k:'note',t:snippet(t.note,q,45),id:t.id});
      (t.subs||[]).forEach(sb=>{ if((sb.text||'').toLowerCase().includes(q)) hits.push({k:'step',t:sb.text+' · in “'+(t.text||'')+'”',done:sb.done,id:t.id}) });
      if(p.id===WANT&&t.done&&isExp(t)&&!(t.text||'').toLowerCase().includes(q)&&SCAT[catIdOf(t)].l.toLowerCase().includes(q))
        hits.push({k:isInc(t)?'income':'spent',t:t.text+' · '+SCAT[catIdOf(t)].l+(t.price?' · '+money2(Number(t.price)):''),id:t.id,sp:true});
      if((t.url||'').toLowerCase().includes(q)) hits.push({k:'link',t:t.url,id:t.id});
    });
    if((p.notes||'').toLowerCase().includes(q)) hits.push({k:'notes',t:snippet(p.notes,q,55)});
    if(hits.length) out.push({p,hits});
  });
  return out;
}

function renderSearch(){
  const q=st.query.trim().toLowerCase();
  const groups=searchHits();
  const total=groups.reduce((n,g)=>n+g.hits.length,0);
  $('#crumb').textContent='Search';

}

function ago(ts){
  if(!ts) return '';
  const d=daysAgo(ts);
  if(d<=0) return 'today';
  if(d===1) return 'yesterday';
  if(d<30) return d+' days ago';
  return ru(ld(new Date(ts)));
}

/* идея-ссылка: адрес либо в url, либо весь текст — это голый адрес */
const BARE_URL=/^(https?:\/\/\S+|www\.\S+)$/i;
const isBare=s=>BARE_URL.test(String(s||'').trim());
function ideaUrl(i){
  if(i.url) return i.url;
  const m=String(i.text||'').match(/(https?:\/\/\S+|www\.\S+)/i);
  return m?(/^https?:/i.test(m[1])?m[1]:'https://'+m[1]):'';
}
const noUrl=s=>String(s||'').replace(/(https?:\/\/\S+|www\.\S+)/gi,' ').replace(/\s+/g,' ').trim();
function linkKind(u){
  const h=hostOf(u); let p=''; try{ p=decodeURIComponent(new URL(u).pathname) }catch(e){}
  const at=(p.match(/@([\w.]+)/)||[])[1];
  if(/(^|\.)youtu(be\.com|\.be)$/.test(h)) return {name:'YouTube',what:/\/shorts\//.test(p)?'short':'video'};
  if(/instagram\.com$/.test(h)) return {name:'Instagram',what:/\/reels?\//.test(p)?'reel':/\/p\//.test(p)?'post':/\/stories\//.test(p)?'story':'profile'};
  if(/threads\.(net|com)$/.test(h)) return {name:'Threads',what:at&&!/\/post\//.test(p)?'@'+at:at?'post by @'+at:'post'};
  if(/tiktok\.com$/.test(h)) return {name:'TikTok',what:at?'video by @'+at:'video'};
  if(/^(twitter|x)\.com$/.test(h)) return {name:'X',what:'post'};
  if(/^t\.me$/.test(h)) return {name:'Telegram',what:p.split('/').filter(Boolean)[0]||''};
  if(/github\.com$/.test(h)) return {name:'GitHub',what:p.split('/').filter(Boolean).slice(0,2).join('/')};
  const seg=p.split('/').filter(Boolean).pop()||'';
  return {name:h,what:seg.replace(/\.\w{2,5}$/,'').replace(/[-_+]+/g,' ').slice(0,60)};
}

/* старым ссылкам без названия тихо подтягиваем название и картинку — понемногу за заход */
let enriching=false;
async function enrichIdeas(p){
  if(enriching) return; enriching=true;
  try{
    let seen={}; try{ seen=JSON.parse(LS.get('pm:meta')||'{}')||{} }catch(e){}
    const need=i=>{const u=ideaUrl(i), t=String(i.text||'').trim();
      return u&&!(seen[i.id]>=3)&&(!i.preview&&!autoThumb(u)||!t||isBare(t)||t===shortUrl(u))};
    const closed=u=>/instagram\.com$/.test(hostOf(u));
    ideasOf(p).forEach(i=>{ const u=ideaUrl(i); if(u&&closed(u)&&!i.url){ i.url=u } });
    const list=ideasOf(p).filter(i=>need(i)&&!closed(ideaUrl(i))).reverse().slice(0,25);
    for(const i of list){
      const u=ideaUrl(i);
      const meta=await fetchMeta(u);
      if(meta.fail) continue;                            // лимит или сбой сервиса — попробуем в другой раз
      seen[i.id]=meta.miss?(seen[i.id]||0)+1:3;          // не нашлось — ещё пару попыток в следующие заходы
      LS.set('pm:meta',JSON.stringify(seen));
      const t=String(i.text||'').trim();
      let ch=false;
      if(!i.url){ i.url=u; ch=true }
      if(meta.image&&!i.preview){ i.preview=meta.image; ch=true }
      if(meta.title&&(!t||isBare(t)||t===shortUrl(u))){ i.text=meta.title; ch=true }
      if(!ch) continue;
      saveProject(p,true);
      const el=document.querySelector('.idea[data-id="'+i.id+'"]');
      if(el&&st.openId===p.id&&!el.querySelector('textarea,input')) el.outerHTML=ideaCard(p,i,st.ideaFolder||'');
    }
  }catch(e){ console.error(e) }
  enriching=false;
}

/* листы правки — одно поведение для всех: закрыть любым способом (✕, мимо, Esc, «назад») значит сохранить; «Undo» возвращает как было */
const SHEETS=[]; let sheetPopSkip=0, sheetAfter=null, sheetHand=null;
window.addEventListener('popstate',()=>{ if(sheetPopSkip){ sheetPopSkip--; const f=sheetAfter; sheetAfter=null; if(f) f(); return } const top=SHEETS[SHEETS.length-1]; if(top) top(true) });
function snapKeep(obj,keys){ const pick=()=>JSON.stringify(keys?keys.map(k=>obj[k]===undefined?null:obj[k]):obj), was=pick(), raw=JSON.parse(JSON.stringify(obj));
  return {changed:()=>pick()!==was, restore:()=>{ if(keys) keys.forEach(k=>{ if(k in raw) obj[k]=raw[k]; else delete obj[k] }); else { Object.keys(obj).forEach(k=>{ if(!(k in raw)) delete obj[k] }); Object.assign(obj,raw) } }} }
/* o: {snap, save() — переносит поля в данные, store() — записывает, after() — перерисовывает}. Возвращает fin(): fin() сохранить и закрыть, fin.drop() закрыть без сохранения, fin.hand() закрыть, чтобы сразу открыть заново */
function keepSheet(el,o){
  let done=false, dirty=false, mark;
  if(sheetHand&&history.state&&history.state.sheet===sheetHand){ mark=sheetHand } else { mark='sh'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); try{ history.pushState({sheet:mark},'',location.href) }catch(e){} }
  sheetHand=null;
  const kd=e=>{ if(SHEETS[SHEETS.length-1]!==fin) return;
    if(e.key==='Escape'){ e.preventDefault(); e.stopImmediatePropagation(); fin() }
    else if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.tagName==='INPUT'&&el.contains(e.target)&&!/^(file|checkbox|radio|button|date)$/.test(e.target.type)){ e.preventDefault(); fin() } };
  const off=()=>{ done=true; const i=SHEETS.indexOf(fin); if(i>=0) SHEETS.splice(i,1); document.removeEventListener('keydown',kd,true); el.remove() };
  const popOwn=after=>{ if(history.state&&history.state.sheet===mark){ sheetPopSkip++; sheetAfter=after; history.back();

const AI_MODEL='claude-haiku-5-5', AI_IN=0.10/1e6, AI_OUT=0.50/1e6, AI_SEARCH=0.01;

function aiBill(usage){
  const o=aiSpend(), u=usage||{};
  o.usd+=(u.input_tokens||0)*AI_IN+(u.output_tokens||0)*AI_OUT+((u.server_tool_use&&u.server_tool_use.web_search_requests)||0)*AI_SEARCH;
  o.n++; LS.set('pm:aispend',JSON.stringify(o));

async function aiCall(body){

  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':aiKey(),'anthropic-version':'2026-10-21',
      'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(body)});

  aiBill(j.usage);

/* один вопрос — один короткий ответ. tools: 'search' | 'fetch' | undefined */
async function aiAsk(prompt,tool){
  const variants=tool==='search'?[{type:'web_search_20250305',name:'web_search',max_uses:1},{type:'web_search_20260209',name:'web_search',max_uses:1}]
    :tool==='fetch'?[{type:'web_fetch_20250910',name:'web_fetch',max_uses:1,max_content_tokens:3000},{type:'web_fetch_20260209',name:'web_fetch',max_uses:1,max_content_tokens:3000}]
    :[null];
  let lastErr=null;
  for(const v of variants){
    const messages=[{role:'user',content:prompt}];
    try{
      let msg=null;
      for(let turn=0;turn<3;turn++){
        const body={model:AI_MODEL,max_tokens:2000,output_config:{effort:'low'},messages};
        if(v) body.tools=[v];
        msg=await aiCall(body);
        if(msg.stop_reason!=='pause_turn') break;
        messages.push({role:'assistant',content:msg.content});
      }
      if(!msg||msg.stop_reason==='refusal') return '';
      return (msg.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');
    }catch(e){ lastErr=e; if(e.status!==400) throw e }          // 400 — версия инструмента не подошла, пробуем другую
  }
  throw lastErr;
}

    let hasPhoto=false; try{ hasPhoto=(await photosOf(WANT)).some(x=>x.item===item.id) }catch(e){}
    const got=[];
    if(f&&f.low&&(!handPrice||again)){
      item.price=f.low; setLay(item,'approx',1); setLay(item,'pl',f.low); setLay(item,'ph',f.high);
      got.push(wishPriceLabel(item));
    }
    if(f&&f.url&&(!item.url||again)){ item.url=f.url; got.push('link') }
    if(!hasPhoto&&(!item.preview||again)){
      const img=await productImage(item.url||(f&&f.url),f&&f.image);
      if(img){ item.preview=img; got.push('photo') }
    }
    /* название меняем, только если человек написал сокращение («mac pro 16» → полное имя) */
    let renamed=false;
    if(f&&f.name){
      const a=normName(item.text).split(' ').filter(Boolean), b=normName(f.name).split(' ');
      if(a.length&&normName(f.name)!==normName(item.text)&&f.name.length>item.text.length&&a.every(w=>b.some(x=>x.indexOf(w)===0))){ item.text=f.name; renamed=true }
    }
    if(got.length||renamed){
      saveProject(p,true); renderSide();
      const miss=[!item.price?'price':'',!item.url?'link':'',!(item.preview||hasPhoto)?'photo':''].filter(Boolean);
      toast(got.length?got.join(' · '):'Renamed',{sub:(renamed?'Now “'+item.text+'”':(f&&f.name)||item.text)+(miss.length?' · no '+miss.join(', ')+' found':''),action:'Undo',onAction:()=>{
        Object.assign(item,{text:before.text,price:before.price,url:before.url,preview:before.preview}); if(before.layout) item.layout=before.layout; else delete item.layout;
        saveProject(p,true); wishRerender(p); renderSide() }});
    }else if(loud||!f) toast(f&&f.name?'Nothing new for “'+f.name+'”':'Could not identify “'+item.text+'”',{kind:'warn',sub:f&&f.name?'Price, link and photo were already filled — use Find again to replace them':'Try a more specific name, like the model'});
  }catch(e){ aiFail(e) }
  finally{ done() }
}

function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,'') }catch(e){ return '' } }
function favOf(u){ const h=hostOf(u); return h?'https://icons.duckduckgo.com/ip3/'+h+'.ico':'' }

function embedOf(u){
  u=String(u||''); let m;
  if((m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/)))
    return {src:'https://www.youtube.com/embed/'+m[1]+'?autoplay=1&rel=0',wide:!/shorts/.test(u)};
  if((m=u.match(/vimeo\.com\/(\d+)/)))
    return {src:'https://player.vimeo.com/video/'+m[1]+'?autoplay=1',wide:true};
  if((m=u.match(/instagram\.com\/(p|reel|reels|tv)\/([\w-]+)/)))
    return {src:'https://www.instagram.com/'+(m[1]==='reels'?'reel':m[1])+'/'+m[2]+'/embed',wide:false};
  if((m=u.match(/tiktok\.com\/.*\/video\/(\d+)/)))
    return {src:'https://www.tiktok.com/embed/v2/'+m[1],wide:false};
  return null;
}

function autoThumb(u){
  const yt=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/);
  if(yt) return 'https://img.youtube.com/vi/'+yt[1]+'/hqdefault.jpg';
  return '';
}
async function tiktokMeta(u){
  // официальный публичный oEmbed TikTok — не требует ключа, надёжнее сторонних сервисов
  if(!/tiktok\.com/i.test(u)) return null;
  try{
    const r=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(u));
    if(!r.ok) return null;
    const j=await r.json();
    return {image:j.thumbnail_url||'',title:(j.title||'').trim().slice(0,90)};
  }catch(e){ return null }
}
/* Jina reader: открывает страницу без ключа. Для Threads — основной источник, для прочего — запасной. Instagram не читает (страница входа) */
const isThreads=u=>/(^|\.)threads\.(net|com)$/.test(hostOf(u));
const jinaTried={};                                  /* один запрос на адрес за заход, ответ общий */
function jinaMeta(u){
  if(!u||/instagram\.com$/.test(hostOf(u))) return Promise.resolve(null);
  return jinaTried[u]||(jinaTried[u]=jinaFetch(u));
}
async function jinaFetch(u){
  try{
    const r=await fetch('https://r.jina.ai/'+u,{headers:{accept:'application/json'}});
    if(!r.ok) return null;
    const d=((await r.json())||{}).data||{};
    const clean=x=>String(x||'').replace(/\s+/g,' ').trim();
    const title=clean(d.title), fin=String(d.finalUrl||d.url||'');
    if(/\/login|\/accounts\//i.test(fin)) return null;
    if(!title||/^(threads|instagram|x|twitter|tiktok|log ?in|sign ?in)$/i.test(title)) return null;
    let text=clean(d.description);
    if(!text||/followers|log in|sign up/i.test(text)){
      text=(String(d.content||'').split(/\n/).map(clean).find(l=>l.length>15&&!/^(!?\[|#|\*|>|https?:|title:|url source)/i.test(l)&&!/log in|sign up|followers/i.test(l))||'');
    }
    const who=(title.match(/\(@([\w.]+)\)/)||[])[1];
    const head=title.replace(/\s*(•|on|\|)\s*Threads.*$/i,'').trim();
    let name=text?(who&&!text.includes('@'+who)?'@'+who+': ':'')+text:head;
    name=name.replace(/^["“]|["”]$/g,'');
    if(name.length>90) name=name.slice(0,89).replace(/\s+\S*$/,'')+'…';
    return name?{title:name,image:d.image||''}:null;
  }catch(e){ return null }
}
async function fetchMeta(u){
  const out={image:autoThumb(u)||'',title:''};
  if(isThreads(u)){ const j=await jinaMeta(u); if(j){ out.title=j.title; if(j.image&&!out.image) out.image=j.image; return out } }
  const tt=await tiktokMeta(u);
  if(tt){ if(tt.image) out.image=tt.image; if(tt.title) out.title=tt.title; return out }
  if(out.image){                      // YouTube: название отдаёт сам YouTube, без посредников и лимитов
    try{
      const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(u));
      if(r.ok){ const j=await r.json(); if(j&&j.title){ out.title=String(j.title).trim().slice(0,110); return out } }
    }catch(e){}
  }
  try{
    const r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(u));
    const j=await r.json();
    if(!j||j.status!=='success'){
      const jm=await jinaMeta(u); if(jm){ out.title=jm.title; return out }
      out.fail=r.status===429||r.status>=500; out.miss=true; return out }
    const d=j.data||{};
    if(!out.image&&d.image&&d.image.url) out.image=d.image.url;
    const clean=x=>String(x||'').replace(/\s+/g,' ').trim();
    const generic=x=>!x||/^(instagram|threads|tiktok|youtube|log ?in|sign ?in|just a moment)\b.{0,12}$/i.test(x);
    const social=/instagram\.com|threads\.(net|com)|tiktok\.com|(^|\.)x\.com|twitter\.com/.test(hostOf(u));
    const ti=clean(d.title), de=clean(d.description);
    const pick=social&&de&&!/followers|log in|sign up/i.test(de)?de:(!generic(ti)?ti:de);
    out.title=clean(pick).slice(0,110);
  }catch(e){ out.fail=true }
  return out;
}

async function fetchPreview(u){
  const direct=autoThumb(u);
  if(direct) return direct;
  try{
    const r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(u));
    const j=await r.json();
    return (j&&j.data&&j.data.image&&j.data.image.url)||'';
  }catch(e){ return '' }
}

async function setItemPhoto(pid,itemId,file){
  try{
    const old=(await photosOf(pid)).filter(x=>x.item===itemId);
    for(const o of old) await delPhotoDB(o.id);
    const blob=await compress(file,1000,.75);
    await putPhoto({id:uid(),pid,item:itemId,name:file.name||'preview',blob,created:Date.now()});
    return true;
  }catch(e){ console.error(e); toast('Could not attach that image'); return false }
}

function persistRefOrder(box,p){
  const domIds=Array.from(box.querySelectorAll('[data-ref]')).map(el=>el.dataset.ref);
  const wanted=domIds.slice().reverse();           // на экране новые сверху
  const links=linksOf(p);
  const byId={}; links.forEach(l=>byId[l.id]=l);
  const ordered=wanted.map(id=>byId[id]).filter(Boolean);
  let k=0;
  p.tasks=(p.tasks||[]).map(t=>t.kind==='link'?ordered[k++]:t);
  saveProject(p,true);
  toast('Order saved');
}

function bindRowScroll(box){
  if(!box||box.dataset.scrollBound) return;
  box.dataset.scrollBound='1';
  const wrap=box.closest('.row-wrap');

  const paintNav=()=>{
    if(!wrap) return;
    const max=box.scrollWidth-box.clientWidth-2;
    const prev=wrap.querySelector('.prev'), next=wrap.querySelector('.next');
    if(prev) prev.classList.toggle('hide',box.scrollLeft<=2);
    if(next) next.classList.toggle('hide',box.scrollLeft>=max||max<=0);
  };
  const step=()=>Math.max(200,Math.round(box.clientWidth*0.8));
  if(wrap) wrap.querySelectorAll('[data-rownav]').forEach(b=>b.addEventListener('click',e=>{
    e.preventDefault();
    box.scrollBy({left:step()*Number(b.dataset.rownav),behavior:'smooth'});
  }));
  box.addEventListener('scroll',paintNav,{passive:true});
  setTimeout(paintNav,60);
  window.addEventListener('resize',paintNav);

  // вертикальное колесо крутит ленту вбок
  box.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return;
    if(box.scrollWidth<=box.clientWidth) return;
    e.preventDefault();
    box.scrollLeft+=e.deltaY;
  },{passive:false});

  // протяжка мышью по пустому месту
  let down=false,sx=0,sl=0,moved=false;
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.button!==0) return;
    if(e.target.closest('button')) return;
    down=true; moved=false; sx=e.clientX; sl=box.scrollLeft;
  });
  box.addEventListener('pointermove',e=>{
    if(!down) return;
    const d=e.clientX-sx;
    if(Math.abs(d)>4){ moved=true; box.classList.add('dragging'); box.scrollLeft=sl-d }
  });
  const stop=e=>{
    if(!down) return;
    down=false; box.classList.remove('dragging');
    if(moved&&e){ e.preventDefault(); }
    setTimeout(()=>{moved=false},0);
  };
  box.addEventListener('pointerup',stop);
  box.addEventListener('pointerleave',stop);
  box.addEventListener('click',e=>{ if(moved){ e.preventDefault(); e.stopPropagation() } },true);
}

function bindRefDrag(box,p){
  let dragId=null;
  box.addEventListener('dragstart',e=>{
    const el=e.target.closest('[data-ref]'); if(!el) return;
    dragId=el.dataset.ref; el.classList.add('drag');
    e.dataTransfer.effectAllowed='move';
    try{ e.dataTransfer.setData('text/plain',dragId) }catch(_){}
  });
  box.addEventListener('dragend',e=>{
    const el=box.querySelector('.drag'); if(el) el.classList.remove('drag');
    dragId=null;
  });
  box.addEventListener('dragover',e=>{
    if(!dragId) return;
    e.preventDefault();
    const over=e.target.closest('[data-ref]');
    const el=box.querySelector('[data-ref="'+dragId+'"]');
    if(!over||!el||over===el) return;
    const r=over.getBoundingClientRect();
    const after=refListOn()?(e.clientY-r.top)>r.height/2:(e.clientX-r.left)>r.width/2;
    box.insertBefore(el,after?over.nextSibling:over);
  });
  box.addEventListener('drop',e=>{
    e.preventDefault(); if(!dragId) return;
    dragId=null;
    persistRefOrder(box,p);
  });

  // то же пальцем: долгое нажатие
  let held=null,timer=null,sy=0,moved=false;
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch') return;
    const el=e.target.closest('[data-ref]'); if(!el) return;
    if(e.target.closest('button')) return;
    sy=e.clientY; moved=false;
    timer=setTimeout(()=>{ held=el; el.classList.add('drag'); if(navigator.vibrate) navigator.vibrate(12) },350);
  });
  box.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch') return;
    if(!held){ if(timer&&Math.abs(e.clientY-sy)>9){ clearTimeout(timer); timer=null } return }
    moved=true; e.preventDefault();
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const over=under&&under.closest?under.closest('[data-ref]'):null;
    if(over&&over!==held&&over.parentNode===box){
      const r=over.getBoundingClientRect();
      const after=refListOn()?(e.clientY-r.top)>r.height/2:(e.clientX-r.left)>r.width/2;
      box.insertBefore(held,after?over.nextSibling:over);
    }
  });
  const end=()=>{
    clearTimeout(timer); timer=null;
    if(!held) return;
    held.classList.remove('drag'); held=null;
    if(moved) persistRefOrder(box,p);
  };
  box.addEventListener('pointerup',end);
  box.addEventListener('pointercancel',end);
}

const YEAR=60*60*24*365;

async function buildSnapshot(p){
  let rows=[];
  try{ rows=(await sb.from('photos').select('*').eq('project_id',p.id)).data||[] }catch(e){}
  const paths=rows.map(r=>r.path);
  let signed={};
  if(paths.length){
    try{
      const {data}=await sb.storage.from('photos').createSignedUrls(paths,YEAR);
      (data||[]).forEach(d=>{ if(d.path&&d.signedUrl) signed[d.path]=d.signedUrl });
    }catch(e){}
  }
  return {
    v:1, at:Date.now(),
    name:p.name||'Untitled', status:p.status, important:!!p.important,
    startDate:p.startDate||'', notes:p.notes||'', color:p.color||null,
    tasks:(p.tasks||[]).map(t=>({id:t.id,kind:t.kind||'task',text:t.text||'',done:!!t.done,
      url:t.url||'',note:t.note||'',preview:t.preview||'',cat:t.cat||'',
      subs:(t.subs||[]).map(x=>({text:x.text,done:!!x.done})),layout:t.layout||null})),
    photos:rows.map(r=>({id:r.id,item:r.item_id||null,url:signed[r.path]||'',
      x:r.x,y:r.y,w:r.w,r:r.r,z:r.z}))
  };
}

function shareUrl(token){

}

}

        </div>
      </div>`).join('')}</div>
      <p class="hint" style="margin-top:12px">Cleared 30 days after you delete.</p>`
    :`<p class="hint" style="margin:0">Nothing deleted recently.</p>`}
  </div>`;
  const close=()=>el.remove();
  el.addEventListener('click',async e=>{
    if(e.target===el||e.target.closest('[data-close]')) return close();
    const r=e.target.closest('[data-restore]'), g=e.target.closest('[data-purge]');
    if(r){
      await restorePhoto(r.dataset.restore);
      close(); dropCover(p.id);
      await loadPhotos(p.id); paintBoard();
      toast('Restored');
      return;
    }
    if(g){
      if(!confirm('Delete this photo for good?')) return;
      await purgePhoto(g.dataset.purge,g.dataset.path);
      close(); openTrash(p);
    }
  });
  document.body.appendChild(el);
}


/* идея-видео: смотрим прямо здесь и сразу даём ей название */
function ideaPreview(p,i){
  const url=ideaUrl(i), emb=embedOf(url);
  if(!emb){ window.open(url,'_blank','noopener'); return }
  const el=document.createElement('div');
  el.className='lb refprev';
  el.innerHTML=`
    <div class="embed-box ${emb.wide?'wide':'tall'}">
      <iframe src="${esc(emb.src)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <div class="lb-bar">
      <input class="iprev-name" id="iprevName" placeholder="Name it so you can find it later" value="${esc(noUrl(i.text)===shortUrl(url)?'':noUrl(i.text))}" autocomplete="off">
      <button data-go>${svg('link',14,1.9)} Open</button>
      <button data-close>${svg('x',14,2)} Close</button>
    </div>`;
  const inp=el.querySelector('#iprevName');
  const close=()=>{
    const v=inp.value.trim();
    if(v!==noUrl(i.text)&&(v||noUrl(i.text))){ i.url=url; i.text=v; saveProject(p,true); if(st.openId===p.id) renderProject() }
    el.remove();
  };
  el.addEventListener('click',e=>{
    if(e.target===el||e.target.closest('[data-close]')) return close();
    if(e.target.closest('[data-go]')){ window.open(url,'_blank','noopener'); return }
  });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); close() } e.stopPropagation() });
  document.body.appendChild(el);
}

async function retryMissingPreviews(p){
  const items=linksOf(p).filter(i=>i.url&&!i.preview&&!i._triedMeta);
  if(!items.length) return;
  const batch=items.slice(0,6);          // не бьём по квоте разом всей папкой
  for(const it of batch){
    it._triedMeta=true;                  // не пытаться повторно в этой сессии
    try{
      const meta=await fetchMeta(it.url);
      if(meta.image){ it.preview=meta.image; if(st.openId===p.id) renderProject() }
      if(meta.title&&it.text===shortUrl(it.url)){ it.text=meta.title; if(st.openId===p.id) renderProject() }
      if(meta.image||meta.title) saveProject(p,true);
    }catch(e){}
  }
}

function bindLinks(p){
  const la=$('#lAdd'); if(!la) return;
  const add=async()=>{
    const ui=$('#lUrl'), ni=$('#lName');
    let u=ui.value.trim(); if(!u) return;
    if(!/^https?:\/\//i.test(u)) u='https://'+u;
    const item={id:uid(),kind:'link',text:ni.value.trim(),url:u,preview:'',done:false,created:Date.now()};
    p.tasks=p.tasks||[]; p.tasks.push(item);
    ui.value=''; ni.value='';
    const moved=touchProject(p);
    saveProject(p,true);
    if(moved) sortProjects();
    renderProject(); renderSide();
    const img=await fetchPreview(u);
    if(img){ item.preview=img; saveProject(p,true); renderProject() }
  };
  la.addEventListener('click',add);
  $('#lUrl').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  $('#lName').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  const rt=$('#refToggle');
  if(rt) rt.addEventListener('click',()=>{
    const next=refHidden(p.id);
    st.refOpen[p.id]=next;
    LS.set('pm:refs:'+p.id,next?'1':'0');
    const sec=rt.closest('.refs-pane');
    if(sec) sec.classList.toggle('collapsed',!next);
  });
  const rv=$('#refView');
  if(rv) rv.addEventListener('click',()=>{
    st.refList=!st.refList; LS.set('pm:reflist',st.refList?'1':'0'); renderProject();
  });
  $('#lShot').addEventListener('click',()=>{
    const inp=$('#wishPick');
    inp.onchange=async ev=>{
      const f=ev.target.files[0]; ev.target.value='';
      if(!f) return;
      const item={id:uid(),kind:'link',text:$('#lName').value.trim(),url:'',preview:'',done:false,created:Date.now()};
      p.tasks=p.tasks||[]; p.tasks.push(item);
      $('#lName').value='';
      const moved=touchProject(p);
      saveProject(p,true);
      if(moved) sortProjects();
      if(await setItemPhoto(p.id,item.id,f)){ renderProject(); renderSide(); toast('Reference added') }
    };
    inp.click();
  });
  const box=$('#links'); if(!box) return;
  bindRowScroll(box);
  bindRefDrag(box,p);
  retryMissingPreviews(p);
  box.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ') return;
    const shot=e.target.closest('[data-shot]');
    if(shot&&!e.target.closest('button')){ e.preventDefault(); shot.click() }
  });
  box.addEventListener('click',async e=>{
    const shot=e.target.closest('[data-shot]');
    if(shot&&!e.target.closest('[data-led]')&&!e.target.closest('[data-ldel]')&&!e.target.closest('[data-lpin]')){
      const ph=st.linkShots[shot.dataset.id];
      if(ph) lightbox(ph,ph.url);
      return;
    }
    const ed=e.target.closest('[data-led]'), dl=e.target.closest('[data-ldel]'),
          ls=e.target.closest('[data-lshot]'), lp=e.target.closest('[data-lpin]');
    if(lp){ e.preventDefault(); e.stopPropagation(); const it=(p.tasks||[]).find(x=>x.id===lp.dataset.lpin); if(it){ setLay(it,'pin',layObj(it).pin?'':1); saveProject(p,true); renderProject() } return }
    if(!ed&&!dl&&!ls) return;
    e.preventDefault(); e.stopPropagation();
    const key=ed?ed.dataset.led:dl?dl.dataset.ldel:ls.dataset.lshot;
    const item=(p.tasks||[]).find(x=>x.id===key); if(!item) return;
    if(ed) return linkEdit(p,item);
    if(ls){
      const inp=$('#wishPick');
      inp.onchange=async ev=>{
        const f=ev.target.files[0]; ev.target.value='';
        if(!f) return;
        if(await setItemPhoto(p.id,item.id,f)) renderProject();
      };
      inp.click();
      return;
    }
    const at=p.tasks.indexOf(item); let back=false;
    p.tasks=p.tasks.filter(x=>x.id!==key);
    saveProject(p,true); renderProject();
    toast('Link removed',{action:'Undo',onAction:()=>{ back=true; p.tasks.splice(Math.min(at,p.tasks.length),0,item); saveProject(p,true); renderProject() }});
    setTimeout(async()=>{ if(back) return; try{ for(const o of (await photosOf(p.id)).filter(x=>x.item===key)) await delPhotoDB(o.id) }catch(_){} },6000);
  });
}

function pickProject(cb){
  const list=st.projects.filter(x=>x.id!==INBOX&&!x.archived);
  if(!list.length) return toast('Create a project first');
  const el=document.createElement('div');
  el.className='sheet-wrap';
  el.innerHTML=`<div class="sheet">
    <div class="sheet-head"><span>Move into</span><button data-close>${svg('x',15,2)}</button></div>
    <div class="pick-list">${list.map(x=>`<button data-pick="${x.id}">
      <span class="dot" data-s="${x.status}"></span>${esc(x.name)}</button>`).join('')}</div>
  </div>`;
  el.addEventListener('click',e=>{
    if(e.target===el||e.target.closest('[data-close]')) return el.remove();
    const b=e.target.closest('[data-pick]');
    if(b){ el.remove(); cb(b.dataset.pick); }
  });
  document.body.appendChild(el);
}

function bindIdeas(p){
  const fol=$('#folders');
  if(fol) fol.addEventListener('click',e=>{
    const ed=e.target.closest('[data-fedit]');
    if(ed){ e.stopPropagation(); const f=foldersOf(p).find(x=>x.id===ed.dataset.fedit); if(f) editFolder(p,f); return }
    if(e.target.closest('#folAdd')) return newFolder(p);
    const b=e.target.closest('[data-fol]');
    if(b){ st.ideaFolder=b.dataset.fol; renderProject() }
  });
  $('#view').querySelectorAll('[data-isrc]').forEach(b=>b.addEventListener('click',()=>{ st.ideaQ=b.dataset.isrc; renderProject(); const n=$('#ideaQ'); if(n) n.focus() }));
  const na=$('#aiNameAll'); if(na) na.addEventListener('click',()=>aiNameAll(p));
  const iqi=$('#ideaQ');
  if(iqi){ iqi.addEventListener('input',()=>{ const pos=iqi.selectionStart; st.ideaQ=iqi.value; renderProject(); const n=$('#ideaQ'); if(n){ n.focus(); n.setSelectionRange(pos,pos) } });
    iqi.addEventListener('keydown',e=>{ if(e.key==='Escape'){ st.ideaQ=''; renderProject() } }) }
  const rs=$('#view').querySelector('.resurf');
  if(rs) rs.addEventListener('click',e=>{
    if(e.target.closest('[data-rkeep]')){ LS.set('pm:resurfHide',ld()); renderProject(); return }
    const a=e.target.closest('[data-rarch]'); if(!a) return;
    const it=(p.tasks||[]).find(x=>x.id===a.dataset.rarch); if(!it) return;
    const was=it.cat; it.cat=ARCHIVE; LS.set('pm:resurfHide',ld()); saveProject(p,true); renderProject(); renderSide();
    toast('Archived',{action:'Undo',onAction:()=>{ it.cat=was; saveProject(p,true); renderProject(); renderSide() }});
  });
  const box=$('#ideas'); if(!box) return;
  const more=$('#ideasMore'), view=$('#view');
  if(st._ideaFill) view.removeEventListener('scroll',st._ideaFill);
  st._ideaFill=null;
  if(more){
    /* дорисовываем по 60, пока конец списка ближе 800px к краю экрана */
    const fill=()=>{
      if(!more.isConnected){ view.removeEventListener('scroll',fill); return }
      let guard=0;
      while((st._ideaRest||[]).length&&more.getBoundingClientRect().top<view.getBoundingClientRect().bottom+800&&guard++<10){
        box.insertAdjacentHTML('beforeend',st._ideaRest.splice(0,60).map(i=>ideaCard(p,i,st.ideaFolder||'')).join(''));
      }
      if(!(st._ideaRest||[]).length){ more.remove(); view.removeEventListener('scroll',fill) }
    };
    st._ideaFill=fill; view.addEventListener('scroll',fill,{passive:true}); setTimeout(fill,0);
  }
  box.addEventListener('click',e=>{
    const b=e.target.closest('[data-ito],[data-iwish]'); if(!b) return;
    const toTodo=!!b.dataset.ito, key=b.dataset.ito||b.dataset.iwish;
    const idea=(p.tasks||[]).find(x=>x.id===key); if(!idea) return;
    const target=st.projects.find(x=>x.id===(toTodo?TODO:WANT)); if(!target) return;
    const u=ideaUrl(idea), title=ideaTitle(idea);
    const ni=toTodo?{id:uid(),text:title,cat:'other',url:u||'',note:'',done:false,created:Date.now()}
      :{id:uid(),text:title,price:null,url:u||'',done:false,created:Date.now()};
    target.tasks=target.tasks||[]; target.tasks.push(ni);
    const at=p.tasks.indexOf(idea); p.tasks.splice(at,1);
    saveProject(target,true); saveProject(p,true); renderProject(); renderSide();
    toast(toTodo?'Moved to To do':'Moved to Wishlist',{action:'Undo',onAction:()=>{
      target.tasks=target.tasks.filter(x=>x.id!==ni.id); p.tasks.splice(Math.min(at,p.tasks.length),0,idea);
      saveProject(target,true); saveProject(p,true); refreshView() }});
  });
  box.addEventListener('click',async e=>{
    const pvw=e.target.closest('[data-iprev]');
    if(pvw&&!(e.metaKey||e.ctrlKey||e.shiftKey)){
      e.preventDefault();
      const it=(p.tasks||[]).find(x=>x.id===pvw.dataset.iprev); if(it) ideaPreview(p,it);
      return;
    }
    if(e.target.closest('a')) return;
    const mk=e.target.closest('[data-mk]'), mv=e.target.closest('[data-mv]'),
          ed=e.target.closest('[data-ied]'), dl=e.target.closest('[data-idel]'),
          fo=e.target.closest('[data-ifol]'), nm=e.target.closest('[data-iname]');
    const id=(mk||mv||ed||dl||fo||nm||{}).dataset;
    if(!id) return;
    const key=mk?id.mk:mv?id.mv:ed?id.ied:fo?id.ifol:nm?id.iname:id.idel;
    const idea=(p.tasks||[]).find(x=>x.id===key); if(!idea) return;

    if(mk){
      const name=idea.text.length>64?idea.text.slice(0,64).trim()+'…':idea.text;
      const np={id:uid(),name,status:'idle',important:false,startDate:'',created:Date.now(),
        updated:Date.now(),tasks:[],notes:idea.text.length>64?idea.text:''};
      await putProject(np);
      p.tasks=p.tasks.filter(x=>x.id!==key); await putProject(p);
      st.projects.push(np); sortProjects();
      openProject(np.id); toast('Project created');
      return;
    }
    if(mv){
      pickProject(async tid=>{
        const target=st.projects.find(x=>x.id===tid); if(!target) return;
        target.tasks=target.tasks||[];
        target.tasks.push({id:uid(),text:idea.text,done:false});
        target.updated=Date.now();
        p.tasks=p.tasks.filter(x=>x.id!==key);
        await putProject(target); await putProject(p);
        sortProjects(); renderProject(); renderSide();
        toast('Moved to '+target.name);
      });
      return;
    }
    if(fo){
      pickFolder(p,fid=>{
        idea.cat=fid;
        saveProject(p,true); renderProject(); renderSide();
        toast(fid===ARCHIVE?'Archived':fid?'Moved':'Back to All',{sub:fid?folderName(p,fid):''});
      });
      return;
    }
    if(dl){
      const at=p.tasks.indexOf(idea);
      p.tasks=p.tasks.filter(x=>x.id!==key);
      saveProject(p,true); renderProject(); renderSide();
      toast('Deleted',{action:'Undo',onAction:()=>{ p.tasks.splice(Math.min(at,p.tasks.length),0,idea); saveProject(p,true); refreshView() }});
      return;
    }
    if(nm){                                       /* название ссылки: адрес уходит в url и не теряется */
      const card=box.querySelector(`.idea[data-id="${key}"]`); if(!card) return;
      const holder=card.querySelector('.idea-main'); if(!holder||card.querySelector('.idea-edit')) return;
      const inp=document.createElement('input');
      inp.className='idea-edit idea-name-in'; inp.placeholder='Name'; inp.setAttribute('aria-label','Name this link'); inp.autocomplete='off';
      holder.replaceWith(inp); inp.focus();
      let done=false;
      const finish=keep=>{
        if(done) return; done=true;
        const v=inp.value.trim();
        if(keep&&v){ idea.url=ideaUrl(idea); idea.text=v; saveProject(p,true); renderSide() }
        renderProject();
      };
      inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ev.preventDefault();finish(true)} if(ev.key==='Escape'){ev.preventDefault();finish(false)} });
      inp.addEventListener('blur',()=>finish(true));
      return;
    }
    if(ed){
      const card=box.querySelector(`.idea[data-id="${key}"]`); if(!card) return;
      const holder=card.querySelector('.idea-main'); if(!holder||card.querySelector('.idea-edit')) return;
      const u=ideaUrl(idea);
      if(u&&!idea.url){ idea.url=u; saveProject(p,true) }            /* голая ссылка: сначала прячем адрес в url, чтобы текстом его не стереть */
      const was=u?noUrl(idea.text):idea.text;
      const wrap=document.createElement('div'); wrap.className='idea-edit-wrap';
      const ta=document.createElement('textarea');
      ta.className='idea-edit'; ta.value=u&&was===shortUrl(u)?'':was; ta.placeholder=u?'Name or note':'';
      wrap.appendChild(ta);
      if(u){ const l=document.createElement('span'); l.className='idea-edit-link'; l.textContent=shortUrl(u); wrap.appendChild(l) }
      holder.replaceWith(wrap); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
      const finish=()=>{
        const v=ta.value.trim();
        if(v) idea.text=v; else if(u) idea.text='';
        saveProject(p,true); renderProject(); renderSide();
      };
      ta.addEventListener('blur',finish);
      ta.addEventListener('keydown',ev=>{
        if(ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();ta.blur()}
        if(ev.key==='Escape'){ta.value=was;ta.blur()}
      });
    }
  });
}
