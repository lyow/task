<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All projects</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08080A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Projects">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#08080A;--panel:#111114;--panel-2:#17171B;--raise:#1F1F24;
  --line:#222228;--line-2:#363640;
  --txt:#F5F5F2;--soft:#B6B6BF;--dim:#868691;
  --violet:#6E9EFF;--cyan:#39CFE6;--magenta:#FF4F93;--mint:#35D888;--amber:#FFB830;--lime:#D4FF3A;
  --iris:var(--lime);--on:#0B0B0D;
  --s-idle:#868691;--s-active:var(--amber);--s-done:var(--mint);
  --btn-hover:#27272D;--chip-bg:rgba(255,255,255,.08);
  --dots:radial-gradient(circle at center,rgba(255,255,255,.07) 1px,transparent 1.2px);
  --display:'Geologica',system-ui,sans-serif;--ui:'Onest','Segoe UI',system-ui,sans-serif;
}
html,body{height:100%;margin:0}
body{
  display:flex;background:var(--bg);color:var(--txt);
  font-family:var(--ui);font-size:15px;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::placeholder{color:var(--dim)}
:focus-visible{outline:1.5px solid var(--violet);outline-offset:2px;border-radius:4px}
svg{display:block;flex:0 0 auto}
.muted{color:var(--soft)}.pad{padding:16px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ── sidebar ── */
#side{position:relative;z-index:2;width:288px;flex:0 0 288px;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line);margin-left:-289px;transition:margin-left .26s cubic-bezier(.4,0,.2,1)}
body.side-open #side{margin-left:0}
.side-top{display:flex;gap:7px;padding:14px 12px 10px}
.btn-all{flex:1;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:11px;
  font-family:var(--display);font-weight:600;font-size:12.5px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--soft);transition:.16s}
.btn-all:hover{color:var(--txt);border-color:var(--line-2)}
.btn-all.on{color:var(--on);border-color:transparent;background:var(--iris)}
.btn-icon{padding:9px;border:1px solid var(--line);border-radius:10px;color:var(--soft);background:var(--panel-2);transition:.16s}
#btnShow{display:none}
body:not(.side-open) #btnShow{display:inline-flex}
.btn-icon:hover{color:var(--txt);border-color:var(--line-2)}
.search{margin:2px 12px 8px;position:relative}
.search input{width:100%;padding:9px 11px 9px 32px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2);font-size:14.5px}
.search input:focus{outline:none;border-color:var(--line-2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim)}
.side-label{padding:8px 15px 7px;font-family:var(--ui);font-size:12px;
  color:var(--dim);border-bottom:1px solid var(--line)}
#sideList{flex:1;overflow-y:auto;padding:7px 9px;display:flex;flex-direction:column;gap:5px}
.empty-side{padding:16px 9px;font-size:13.5px;line-height:1.6;color:var(--dim)}
.row{display:flex;align-items:center;gap:2px;border-radius:11px;padding-right:5px;position:relative;transition:.14s}
.row:hover{background:var(--panel-2)}
.row.on{background:var(--raise);box-shadow:inset 0 0 0 1px var(--line-2)}
.row-name{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:10px 7px;text-align:left;
  text-decoration:none;color:inherit;cursor:inherit}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--s-idle)}
.dot[data-s=active]{background:var(--s-active)}
.dot[data-s=done]{background:var(--s-done)}
.row-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.row.on .row-text{font-weight:500}
.flag{color:var(--magenta)}
.btn-gear{padding:7px;border-radius:9px;color:var(--dim);opacity:0;transition:.14s}
.row:hover .btn-gear,.row.on .btn-gear{opacity:1}
.btn-gear:hover{color:var(--txt);background:var(--raise)}
.btn-gear.big{opacity:1;padding:10px;border:1px solid var(--line);background:var(--panel-2);border-radius:11px;color:var(--soft)}
.picker{display:flex;gap:1px}
.pick{padding:6px;border-radius:8px;color:var(--dim);opacity:.45;transition:.14s}
.row:hover .pick{opacity:.8}
.pick:hover{opacity:1;background:var(--raise)}
.pick.on{opacity:1}
.pick.on[data-s=idle]{color:var(--s-idle)}
.pick.on[data-s=active]{color:var(--s-active)}
.pick.on[data-s=done]{color:var(--s-done)}
.picker.big{gap:6px;flex-wrap:wrap}
.picker.big .pick{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel-2);font-size:13.5px;font-weight:500;opacity:.65}
.picker.big .pick.on{opacity:1;border-color:currentColor;background:var(--raise)}
.side-foot{padding:10px 12px 14px;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line)}
.btn-new{padding:11px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;
  border:1px solid var(--line-2);color:var(--txt);background:var(--panel-2);
  font-family:var(--display);font-weight:600;font-size:12.5px;transition:.16s;position:relative;overflow:hidden}
.btn-new::after{content:'';position:absolute;inset:0;background:var(--iris);opacity:0;transition:.18s}
.btn-new:hover::after{opacity:.18}
.btn-new:hover{border-color:transparent;color:var(--on);background:var(--iris)}
.btn-new:hover::after{opacity:0}
.btn-new>*{position:relative;z-index:1}
.backup{display:flex;gap:6px}
.backup button{flex:1;padding:8px;border:1px solid var(--line);border-radius:9px;color:var(--dim);
  font-family:var(--ui);font-size:12px;transition:.14s}
.backup button:hover{color:var(--txt);border-color:var(--line-2);background:var(--panel-2)}
#scrim{display:none}

/* ── main ── */
#main{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:11px;padding:12px 20px;border-bottom:1px solid var(--line);
  background:rgba(3,3,5,.82);backdrop-filter:blur(14px)}
.crumb{font-family:var(--ui);font-size:12px;
  color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{flex:1;overflow-y:auto;padding:30px 34px 72px}
.head{max-width:1500px;margin:0 auto 22px}
.head h1{margin:0;font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:-.02em;line-height:1.1}
.head h1 i{font-style:normal;background:var(--iris);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin:9px 0 0;color:var(--soft);font-size:14.5px;max-width:52ch;line-height:1.55}
.stats{max-width:1500px;margin:0 auto 18px;display:flex;gap:10px;flex-wrap:wrap}
.stat{padding:11px 15px;border:1px solid var(--line);border-radius:13px;background:var(--panel);min-width:104px}
.stat b{display:block;font-family:var(--display);font-size:21px;font-weight:600;line-height:1.2}
.stat span{font-family:var(--ui);font-size:12px;color:var(--dim)}
.stat[data-s=active] b{color:var(--s-active)}
.stat[data-s=done] b{color:var(--s-done)}
.chips{max-width:1500px;margin:0 auto 16px;display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
  font-size:13.5px;font-weight:500;color:var(--soft);transition:.14s}
.chip:hover{color:var(--txt);border-color:var(--line-2)}
.chip.on{color:var(--on);border-color:transparent;background:var(--iris)}
.grid{max-width:1500px;margin:0 auto;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(216px,1fr))}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;
  text-decoration:none;color:var(--txt);
  background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  padding:15px;transition:.18s;aspect-ratio:1/1}
.card::before{content:'';position:absolute;inset:0;background-image:var(--dots);background-size:20px 20px;
  opacity:.5;-webkit-mask-image:radial-gradient(70% 70% at 80% 10%,#000,transparent);mask-image:radial-gradient(70% 70% at 80% 10%,#000,transparent)}
.card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 20px 44px -20px #000}
.card .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity .35s ease,transform .35s ease;z-index:0}
.card.has-cover .cover{opacity:.42}
.card.has-cover:hover .cover{opacity:.58;transform:scale(1.04)}
.card.has-cover::before{opacity:.18}
.card .veil{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity .3s;
  background:linear-gradient(180deg,rgba(2,2,3,.62) 0%,rgba(2,2,3,.78) 42%,rgba(2,2,3,.93) 100%)}
.card.has-cover .veil{opacity:1}
.card:not(.has-cover)::after{content:'';position:absolute;inset:auto -20% -40% -20%;height:70%;z-index:1;
  background:radial-gradient(50% 100% at 50% 100%,color-mix(in srgb,var(--violet) 13%,transparent),transparent 72%);pointer-events:none}
.card.has-cover .card-name{text-shadow:0 2px 18px rgba(0,0,0,.95)}
.card.has-cover .card-meta,.card.has-cover .next{text-shadow:0 1px 10px rgba(0,0,0,.9)}
.card>*{position:relative;z-index:2}
.card>*{position:relative}
.card-top{position:absolute;top:14px;left:15px;right:15px;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-status{display:inline-flex;align-items:center;gap:6px;font-family:var(--ui);
  font-size:12px;color:var(--s-idle)}
.card-status[data-s=active]{color:var(--s-active)}
.card-status[data-s=done]{color:var(--s-done)}
.card-name{margin:0 0 7px;font-family:var(--display);font-weight:600;font-size:16px;
  line-height:1.25;letter-spacing:-.01em;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-family:var(--ui);font-size:12px;color:var(--dim);line-height:1.7}
.mini{margin-top:10px;height:3px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.mini i{display:block;height:100%;background:var(--iris)}
.empty-main{max-width:1500px;margin:0 auto;color:var(--soft)}
.btn-inline{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:12px 22px;border-radius:12px;
  border:1px solid var(--line-2);color:var(--txt);font-family:var(--display);font-weight:600;font-size:12.5px}
.btn-inline:hover{background:var(--panel-2)}

/* ── project ── */
.p-head{border-bottom:1px solid var(--line);padding-bottom:20px}
.p-title-row{display:flex;align-items:center;gap:12px}
.p-title{flex:1;min-width:0;background:none;border:none;padding:3px 0;
  font-family:var(--display);font-weight:700;font-size:31px;letter-spacing:-.02em;
  border-bottom:1px solid transparent}
.p-title:focus{outline:none;border-bottom-color:var(--line-2)}
.p-meta{margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag,.tag-imp{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);font-family:var(--ui);font-size:12px;color:var(--soft)}
.tag-imp{color:var(--magenta);border-color:color-mix(in srgb,var(--magenta) 36%,transparent);background:color-mix(in srgb,var(--magenta) 8%,transparent)}
#save{font-family:var(--ui);font-size:12px;color:var(--dim);margin-left:auto}
.bar{position:relative;margin-top:18px;height:5px;border-radius:5px;background:rgba(255,255,255,.08);max-width:360px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--iris);transition:width .3s ease}
.bar b{position:absolute;right:-46px;top:-7px;font-family:var(--ui);font-size:12px;font-weight:400;color:var(--dim)}
.panes{max-width:1500px;margin:0 auto;display:grid;gap:20px;grid-template-columns:repeat(2,minmax(0,1fr))}
.pane.wide{grid-column:1/-1}
.pane-h{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:0 0 12px;font-family:var(--ui);
  font-weight:500;font-size:12px;color:var(--dim)}
.pane-h .sp{flex:1}
.count{font-size:12px;padding:2px 7px;border-radius:999px;background:var(--raise);color:var(--soft)}
.pane-h-tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.ghost-btn{padding:5px 10px;border:1px solid var(--line);border-radius:8px;color:var(--dim);
  font-family:var(--ui);font-size:12px;}
.ghost-btn:hover{color:var(--txt);border-color:var(--line-2)}
.task-add{display:flex;gap:7px}
.task-add input{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-size:14.5px}
.task-add input:focus{outline:none;border-color:var(--line-2)}
.task-add button{padding:0 15px;border-radius:11px;background:var(--raise);color:var(--txt);
  box-shadow:inset 0 0 0 1px var(--line-2);transition:.14s}
.task-add button:hover{background:var(--btn-hover);box-shadow:inset 0 0 0 1px var(--violet)}
.tasks{list-style:none;margin:12px 0 0;padding:0}
.tasks li{display:flex;align-items:flex-start;gap:11px;padding:10px 6px;border-bottom:1px solid var(--line);line-height:1.5}
.tasks li>span:not(.check){flex:1;word-break:break-word;font-size:14.5px}
.tasks li span.check{flex:0 0 auto;display:inline-flex;align-items:center}
.tasks li.done span{text-decoration:line-through;color:var(--dim)}
.check{color:var(--dim);padding:0;margin-top:1px;transition:.14s}
.check:hover{color:var(--txt)}
.tasks li.done .check{color:var(--s-done)}
.task-del{opacity:0;color:var(--dim);padding:3px;transition:.14s}
.tasks li:hover .task-del{opacity:.6}
.task-del:hover{opacity:1;color:var(--magenta)}
.notes{width:100%;min-height:190px;resize:vertical;padding:15px;border:1px solid var(--line);
  border-radius:14px;background:var(--panel);line-height:1.65;font-size:14.5px}
.notes:focus{outline:none;border-color:var(--line-2)}

/* ── photo board ── */
#board{position:relative;height:min(56vh,620px);min-height:400px;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:var(--panel);touch-action:none}
#canvas{background-image:var(--dots);background-size:22px 22px;background-position:0 0}
#canvas::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(38% 30% at 18% 12%,color-mix(in srgb,var(--violet) 10%,transparent),transparent 70%),
             radial-gradient(34% 26% at 76% 8%,color-mix(in srgb,var(--magenta) 7%,transparent),transparent 72%)}
.board-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--dim);text-align:center;padding:20px;pointer-events:none}
.board-empty b{font-family:var(--display);font-size:15px;font-weight:600;color:var(--soft)}
.pin{position:absolute;border-radius:12px;overflow:visible;cursor:grab;user-select:none;touch-action:none;
  transition:box-shadow .16s,filter .16s}
.pin img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line-2);
  box-shadow:0 16px 36px -18px rgba(0,0,0,.95);pointer-events:none;background:var(--panel-2)}
.pin:hover{filter:brightness(1.04)}
.pin:hover img{box-shadow:0 0 0 1px rgba(255,255,255,.22),0 18px 44px -16px rgba(0,0,0,1)}
.pin.grabbing{cursor:grabbing;z-index:9999!important}
.pin.grabbing img{box-shadow:0 0 0 1.5px var(--violet),0 26px 60px -18px rgba(0,0,0,1)}
.pin-x{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:#0D0D12;border:1px solid var(--line-2);
  color:var(--soft);opacity:0;transform:scale(.7);transition:.15s}
.pin:hover .pin-x{opacity:1;transform:scale(1)}
.pin-x:hover{background:var(--magenta);border-color:var(--magenta);color:var(--on)}
.pin-size{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:7px;cursor:nwse-resize;
  background:#0D0D12;border:1px solid var(--line-2);opacity:0;transition:.15s;
  display:flex;align-items:center;justify-content:center;color:var(--soft)}
.pin:hover .pin-size{opacity:1}
.pin-size:hover{border-color:var(--violet);color:var(--violet)}
.hint{margin:12px 0 0;font-size:12.5px;color:var(--dim);line-height:1.6}
kbd{font-family:var(--ui);font-size:12px;padding:2px 6px;border-radius:5px;
  border:1px solid var(--line-2);background:var(--panel-2);color:var(--soft)}
body.dragging #board{border-color:var(--violet)}

/* ── overlays ── */
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.96);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.lb img{max-width:100%;max-height:76vh;border-radius:14px;border:1px solid var(--line-2)}
.lb-bar{display:flex;align-items:center;gap:12px;font-size:13.5px;flex-wrap:wrap;justify-content:center;color:var(--soft)}
.lb-bar button{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line-2);
  border-radius:10px;color:var(--txt)}
.lb-bar button:hover{background:var(--panel-2)}
.sheet-wrap{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:18px}
.sheet{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line-2);border-radius:20px;
  padding:20px;box-shadow:0 40px 90px -30px #000;max-height:90vh;overflow-y:auto;position:relative}
.sheet::before{content:'';position:absolute;inset:0;border-radius:20px;padding:1px;pointer-events:none;
  background:var(--iris);opacity:.34;-webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  -webkit-mask-composite:xor;mask-composite:exclude}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;
  font-family:var(--ui);font-size:12px;color:var(--dim)}
.f{display:block;margin-bottom:17px}
.f>span{display:block;margin-bottom:8px;font-family:var(--ui);font-size:12px;
  color:var(--dim)}
.f input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2)}
.f input:focus{outline:none;border-color:var(--line-2)}
.f input[type=date]{color-scheme:dark}
.two{display:flex;gap:7px}
.opt{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px;
  border:1px solid var(--line);border-radius:11px;background:var(--panel-2);font-size:13.5px;font-weight:500;color:var(--soft)}
.opt.on{color:var(--on);border-color:transparent;background:var(--iris)}
.sheet-foot{border-top:1px solid var(--line);padding-top:16px}
.danger{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px;
  border-radius:11px;background:none;color:var(--magenta);border:1px solid color-mix(in srgb,var(--magenta) 34%,transparent);font-size:13.5px;font-weight:500}
.danger:hover{background:color-mix(in srgb,var(--magenta) 11%,transparent)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,22px) scale(.96);z-index:130;opacity:0;
  display:flex;align-items:center;gap:11px;max-width:min(92vw,440px);
  padding:11px 13px;border-radius:15px;background:var(--raise);
  box-shadow:inset 0 0 0 1px var(--line-2),0 24px 60px -22px #000;
  color:var(--txt);font-size:14.5px;pointer-events:none;
  transition:opacity .22s cubic-bezier(.2,.8,.2,1),transform .22s cubic-bezier(.2,.8,.2,1)}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}

.hbars{max-width:820px;margin:0 auto 26px;display:flex;align-items:flex-end;gap:6px;height:78px}
.hbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.hbar i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--iris);min-height:3px;transition:height .3s}
.hbar span{font-family:var(--ui);font-size:12px;color:var(--dim)}
.hbar.today i{}

.hist-stat{margin-left:auto;display:flex;align-items:center;gap:13px;padding:11px 16px;border-radius:13px;
  border:1px solid color-mix(in srgb,var(--violet) 45%,transparent);background:color-mix(in srgb,var(--violet) 10%,transparent);transition:.16s;text-align:left}
.hist-stat:hover{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 20%,transparent)}
.hs-ico{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;
  background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet);flex:0 0 34px}
.hs-txt{display:flex;flex-direction:column;gap:2px}
.hs-txt b{font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--txt)}
.hs-txt span{font-family:var(--ui);font-size:12px;
  color:var(--dim)}
.hs-go{color:var(--violet);display:flex}
@media (max-width:900px){.hist-stat{margin-left:0;width:100%}}
.back-link{display:inline-flex;align-items:center;gap:7px;margin-bottom:12px;padding:6px 12px 6px 9px;
  border-radius:9px;border:1px solid var(--line);color:var(--soft);font-family:var(--ui);
  font-size:12px;}
.back-link:hover{color:var(--txt);border-color:var(--line-2)}
.back-link svg{transform:rotate(180deg)}

.quick-btn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;
  border:1px solid var(--line);color:var(--soft);font-size:13.5px;transition:.16s}
.quick-btn:hover{color:var(--txt);border-color:var(--violet);background:color-mix(in srgb,var(--violet) 10%,transparent)}
.quick-btn kbd{font-size:12px;padding:2px 5px}
.qa-wrap{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.76);backdrop-filter:blur(7px);
  display:flex;align-items:flex-start;justify-content:center;padding:12vh 18px 18px}
.qa{width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line-2);border-radius:20px;
  box-shadow:0 44px 100px -34px #000;overflow:hidden}
.qa-in{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.qa-in svg{color:var(--violet)}
.qa-in input{flex:1;background:none;border:none;font-size:17px;font-family:var(--display);font-weight:600}
.qa-in input:focus{outline:none}
.qa-targets{display:flex;gap:7px;flex-wrap:wrap;padding:14px 20px}
.qa-t{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel-2);font-size:13.5px;color:var(--soft);transition:.14s}
.qa-t:hover{border-color:var(--line-2);color:var(--txt)}
.qa-t.on{color:var(--on);border-color:transparent}
.qa-t.on[data-t="inbox"]{background:var(--violet)}
.qa-t.on[data-t="wishlist"]{background:var(--mint)}
.qa-t.on[data-t="todolist"]{background:var(--magenta)}
.qa-t.on[data-t="proj"]{background:var(--amber)}
.qa-foot{display:flex;align-items:center;gap:14px;padding:11px 20px;border-top:1px solid var(--line);
  font-family:var(--ui);font-size:12px;color:var(--dim);flex-wrap:wrap}
.qa-foot b{color:var(--soft);font-weight:400}
.qa-hint{padding:0 20px 16px;font-size:13.5px;color:var(--soft);line-height:1.5}
.qa-hint em{font-style:normal;color:var(--violet)}
.qa-price{font-family:var(--ui);font-size:13.5px;color:var(--lime)}

.due-badge{color:var(--amber)}
.rev-tag{color:var(--cyan)}
.banner .b-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.banner .b-list button{padding:5px 11px;border-radius:999px;border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);
  color:var(--amber);font-size:12.5px}
.banner .b-list button:hover{background:color-mix(in srgb,var(--amber) 14%,transparent)}
.quick-dates{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.quick-dates button{padding:6px 11px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--soft);font-size:12.5px}
.quick-dates button:hover{color:var(--txt);border-color:var(--cyan)}
.quick-dates button.clr:hover{color:var(--magenta);border-color:var(--magenta)}
.msum{max-width:820px;margin:0 auto 26px;padding:18px 20px;border-radius:18px;
  border:1px solid var(--line);background:var(--panel)}
.msum-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.msum-h b{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.msum-h button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);color:var(--soft);
  display:flex;align-items:center;justify-content:center}
.msum-h #mPrev svg{transform:rotate(180deg)}
.msum-h button:hover:not(:disabled){color:var(--txt);border-color:var(--line-2)}
.msum-h button:disabled{opacity:.3}
.msum-h .sp{flex:1}
.msum-grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.msum-c{padding:11px 13px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.msum-c b{display:block;font-family:var(--display);font-size:19px;font-weight:600;line-height:1.2}
.msum-c span{font-family:var(--ui);font-size:12px;
  color:var(--dim)}
.msum-c.t b{color:var(--mint)}
.msum-c.p b{color:var(--amber)}
.msum-c.w b{color:var(--lime)}
.msum-c.d b{color:var(--magenta)}
.msum-note{margin:13px 0 0;font-size:13.5px;color:var(--soft);line-height:1.55}
.msum-note em{font-style:normal;color:var(--txt)}

.tasks li{flex-wrap:wrap}
.sub-toggle{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:8px;
  border:1px solid var(--line);color:var(--dim);font-family:var(--ui);font-size:12px;
  transition:.14s;flex:0 0 auto}
.sub-toggle:hover{color:var(--txt);border-color:var(--line-2)}
.sub-toggle.has{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 32%,transparent)}
.sub-toggle.full{color:var(--mint);border-color:color-mix(in srgb,var(--mint) 32%,transparent)}
.sub-toggle svg{transition:transform .16s}
.sub-toggle.open svg{transform:rotate(90deg)}
.subs{list-style:none;margin:9px 0 3px;padding:0 0 0 28px;width:100%;
  border-left:1px solid var(--line);margin-left:8px}
.subs li{display:flex;align-items:center;gap:9px;padding:6px 2px;border:none;line-height:1.4}
.subs li span{flex:1;min-width:0;font-size:13.5px;word-break:break-word}
.subs li.done span{text-decoration:line-through;color:var(--dim)}
.subs .check{color:var(--dim)}
.subs li.done .check{color:var(--mint)}
.sub-del{opacity:0;color:var(--dim);padding:2px;transition:.14s}
.subs li:hover .sub-del{opacity:.7}
.sub-del:hover{opacity:1;color:var(--magenta)}
.sub-add{gap:7px!important;padding-top:8px!important}
.sub-add input{flex:1;padding:8px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel-2);font-size:13.5px}
.sub-add input:focus{outline:none;border-color:var(--cyan)}
.sub-add button{padding:0 13px;border-radius:9px;border:1px solid var(--line);color:var(--soft)}
.sub-add button:hover{color:var(--txt);border-color:var(--cyan)}
.gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  padding:24px;background:var(--bg)}
.gate::before{content:'';position:fixed;inset:-30% -10% auto -10%;height:80vh;pointer-events:none;
  background:radial-gradient(40% 55% at 30% 20%,color-mix(in srgb,var(--violet) 24%,transparent),transparent 70%),
             radial-gradient(36% 50% at 72% 10%,color-mix(in srgb,var(--magenta) 16%,transparent),transparent 72%);filter:blur(34px)}
.gate-box{position:relative;width:100%;max-width:380px;padding:28px;border-radius:22px;
  border:1px solid var(--line-2);background:var(--panel);box-shadow:0 44px 110px -40px #000}
.gate-mark{width:64px;height:64px;border-radius:18px;display:block;margin-bottom:18px}
.gate-box h1{margin:0 0 8px;font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.02em}
.gate-box p{margin:0 0 22px;font-size:14.5px;line-height:1.55;color:var(--soft)}
.gate-go{width:100%;padding:13px;border-radius:12px;background:var(--iris);color:var(--on);
  font-family:var(--display);font-weight:600;font-size:13.5px;margin-top:4px}
.gate-go:disabled{opacity:.55}
.gate-err{margin:14px 0 0!important;color:var(--magenta);font-size:13.5px;min-height:1em}
.boot{position:fixed;inset:0;z-index:190;display:flex;align-items:center;justify-content:center;background:var(--bg)}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1);opacity:1}}
.sign-out{width:100%;padding:8px;border-radius:9px;color:var(--dim);
  font-family:var(--ui);font-size:12px;
  border:1px solid transparent}
.sign-out:hover{color:var(--magenta);border-color:color-mix(in srgb,var(--magenta) 30%,transparent)}
.mig{max-width:1500px;margin:0 auto 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 17px;border-radius:14px;border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);background:color-mix(in srgb,var(--cyan) 7%,transparent)}
.mig span{flex:1;min-width:220px;font-size:13.5px;color:var(--soft);line-height:1.5}
.mig b{color:var(--cyan)}
.mig button{padding:9px 15px;border-radius:10px;border:1px solid color-mix(in srgb,var(--cyan) 40%,transparent);color:var(--cyan);font-size:13.5px}
.mig button:hover{background:color-mix(in srgb,var(--cyan) 14%,transparent)}
.mig button.skip{border-color:var(--line);color:var(--dim)}
.link-add{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin-bottom:4px}
.link-add>*{height:44px}
.link-add input{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:14.5px}
.link-add input:focus{outline:none;border-color:var(--line-2)}
.l-url{flex:2;min-width:130px}
.l-name{flex:1;min-width:110px}
.l-shot{flex:0 0 auto;width:44px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--soft);transition:.16s}
.l-shot:hover{color:var(--txt);border-color:var(--violet);background:color-mix(in srgb,var(--violet) 10%,transparent)}
.link-add .go{display:inline-flex;align-items:center;justify-content:center;padding:0 22px;border-radius:12px;
  background:var(--raise);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line-2);transition:.14s}
.link-add .go:hover{background:var(--btn-hover);box-shadow:inset 0 0 0 1px var(--violet)}
.links{margin-top:14px}
.links.row{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 10px;
  scroll-snap-type:x proximity;scroll-padding-left:2px;-webkit-overflow-scrolling:touch}
.links.row .lcard{flex:0 0 auto;width:186px;aspect-ratio:9/16;scroll-snap-align:start}
.links.row::-webkit-scrollbar{height:8px}
.links.row::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:8px;
  border:2px solid transparent;background-clip:padding-box}
.links.row:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);background-clip:padding-box}
.lcard{position:relative;display:block;aspect-ratio:9/16;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);background:var(--panel-2);text-decoration:none;color:var(--txt);
  transition:.18s;cursor:pointer;padding:0;font:inherit;text-align:left}
.lcard[role="button"]:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.lcard:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 20px 44px -22px #000}
.lshot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s;z-index:1}
.lcard.shot .lshot,.lshot[src]{opacity:1}
.lfall{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);
  background:radial-gradient(75% 65% at 50% 35%,color-mix(in srgb,var(--violet) 20%,transparent),transparent 72%)}
.lfav{width:34px;height:34px;border-radius:9px}
.lshade{position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,rgba(2,2,3,.5) 0%,transparent 38%,transparent 46%,rgba(2,2,3,.92) 100%)}
.lbody{position:absolute;left:13px;right:13px;bottom:12px;z-index:3;display:block}
.lbody b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-family:var(--display);font-weight:600;font-size:12.5px;line-height:1.25;
  text-shadow:0 2px 14px rgba(0,0,0,.9)}
.lbody>span{display:block;margin-top:5px;font-family:var(--ui);font-size:12px;
  color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lacts{position:absolute;top:9px;right:9px;z-index:4;display:flex;gap:5px;opacity:0;transition:.15s}
.lcard:hover .lacts{opacity:1}
.lacts button{width:29px;height:29px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line-2);background:rgba(4,4,7,.72);color:var(--soft);backdrop-filter:blur(4px)}
.lacts button:hover{color:var(--txt);border-color:var(--violet)}
.lacts button[data-lshot]{color:var(--violet)}
.lacts button[data-lshot]:hover{background:color-mix(in srgb,var(--violet) 14%,transparent)}
.lacts button[data-ldel]:hover{color:var(--magenta);border-color:var(--magenta)}
.capture #capShot{flex:0 0 auto;width:48px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--soft);transition:.16s}
.capture #capShot:hover{color:var(--txt);border-color:var(--violet);background:color-mix(in srgb,var(--violet) 10%,transparent)}

#board{overflow:auto;overscroll-behavior:contain}
#board.panning{cursor:grabbing}
#canvas{position:relative}
.album{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.al{aspect-ratio:1;border-radius:13px;overflow:hidden;border:1px solid var(--line);padding:0;
  background:var(--panel-2);transition:.16s}
.al:hover{transform:translateY(-2px);border-color:var(--line-2)}
.al img{width:100%;height:100%;object-fit:cover;display:block}

.sticky{position:absolute;padding:14px 16px;border-radius:14px;cursor:grab;
  box-shadow:0 16px 40px -20px #000;border:1px solid rgba(255,255,255,.1);
  max-width:340px;min-width:120px;user-select:none;touch-action:none}
.sticky.grabbing{cursor:grabbing;box-shadow:0 26px 60px -22px #000}
.sticky-text{white-space:pre-wrap;word-break:break-word;font-family:var(--display);
  font-weight:600;line-height:1.28;letter-spacing:-.01em;color:var(--on)}
.sticky.s-s{--fs:13px}
.sticky.s-m{--fs:17px}
.sticky.s-l{--fs:23px}
.sticky.s-xl{--fs:32px}
.sticky-text{font-size:var(--fs,17px)}
.sticky-size{position:absolute;right:3px;bottom:3px;width:20px;height:20px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;color:rgba(8,8,11,.65);cursor:nwse-resize;
  opacity:0;transition:.15s}
.sticky:hover .sticky-size{opacity:1}
.sticky-size:hover{background:rgba(8,8,11,.18)}
.sticky.c-violet{background:var(--violet)}
.sticky.c-cyan{background:var(--cyan)}
.sticky.c-magenta{background:var(--magenta)}
.sticky.c-mint{background:var(--mint)}
.sticky.c-amber{background:var(--amber)}
.sticky.c-plain{background:#D8D8E2}
.sticky-acts{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:.15s}
.sticky:hover .sticky-acts{opacity:1}
.sticky-acts button{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;background:rgba(8,8,11,.55);color:#fff}
.sticky-acts button:hover{background:rgba(8,8,11,.85)}
.sticky-acts button.on{background:#fff;color:var(--on)}
.sticky-acts button.on svg{fill:currentColor}
.sk-colors{display:flex;gap:7px}
.sk-dot{width:34px;height:34px;border-radius:11px;border:2px solid transparent}
.sk-dot.on{border-color:var(--txt)}
.sk-dot.c-violet{background:var(--violet)}.sk-dot.c-cyan{background:var(--cyan)}
.sk-dot.c-magenta{background:var(--magenta)}.sk-dot.c-mint{background:var(--mint)}
.sk-dot.c-amber{background:var(--amber)}.sk-dot.c-plain{background:#E4E4EC}
body.no-hints .hint{display:none}
body.no-hints .board-empty span{display:none}
body.no-hints .lede{display:none}
/* поиск */
.sgroup{max-width:900px;margin:0 auto 20px;border:1px solid var(--line);border-radius:16px;
  background:var(--panel);overflow:hidden}
.sgroup-h{display:flex;align-items:center;gap:10px;padding:13px 16px;text-decoration:none;color:var(--txt);
  font-family:var(--display);font-weight:600;font-size:14.5px;border-bottom:1px solid var(--line)}
.sgroup-h:hover{background:var(--raise)}
.scount{margin-left:auto;font-family:var(--ui);font-size:12px;color:var(--dim);
  padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.06)}
.srow{display:flex;gap:12px;align-items:baseline;padding:10px 16px;text-decoration:none;color:var(--soft);
  font-size:14.5px;line-height:1.45;border-bottom:1px solid var(--line-2)}
.srow:last-child{border-bottom:none}
.srow:hover{background:var(--raise);color:var(--txt)}
.srow.done .stext{text-decoration:line-through;opacity:.6}
.skind{flex:0 0 54px;font-family:var(--ui);font-size:12px;
  color:var(--dim)}
.stext{flex:1;min-width:0;word-break:break-word}
.srow mark,.sgroup mark{background:color-mix(in srgb,var(--violet) 35%,transparent);color:var(--txt);border-radius:3px;padding:0 2px}
.smore{padding:9px 16px;font-family:var(--ui);font-size:12px;color:var(--dim)}

/* разбор */
.rsec{max-width:900px;margin:0 auto 24px}
.rsec h2{margin:0 0 10px;font-family:var(--ui);font-weight:500;font-size:12px;
  color:var(--dim)}
.rrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 15px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.rrow:hover{border-color:var(--line-2)}
.rname{flex:1;min-width:160px;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--txt);
  font-family:var(--display);font-weight:600;font-size:14.5px}
.rmeta{font-family:var(--ui);font-size:12px;
  color:var(--dim)}
.racts{display:flex;gap:6px;flex-wrap:wrap}
.racts button{padding:6px 11px;border-radius:9px;border:1px solid var(--line);color:var(--soft);font-size:12.5px}
.racts button:hover{color:var(--txt);border-color:var(--line-2);background:var(--raise)}
.racts button[data-rev-act="del"]:hover{color:var(--magenta);border-color:var(--magenta)}

/* цвет проекта */
.pc-none{background:var(--panel-2);border:2px dashed var(--line-2)!important}
.sk-dot.c-lime{background:var(--lime)}
.row.tinted{box-shadow:inset 3px 0 0 var(--pc)}
.row.on.tinted{box-shadow:inset 3px 0 0 var(--pc),inset 0 0 0 1px var(--line-2)}
.row.on .dot{transform:scale(1.25)}
.dot{transition:transform .14s}
.tinted.c-violet{--pc:var(--violet)}.tinted.c-cyan{--pc:var(--cyan)}.tinted.c-magenta{--pc:var(--magenta)}
.tinted.c-mint{--pc:var(--mint)}.tinted.c-amber{--pc:var(--amber)}.tinted.c-lime{--pc:var(--lime)}

/* компактный список */
.plist{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:14px;padding:12px 15px;border:1px solid var(--line);
  border-radius:12px;background:var(--panel);text-decoration:none;color:var(--txt);transition:.14s}
.prow:hover{border-color:var(--line-2);background:var(--raise)}
.prow.tinted{box-shadow:inset 3px 0 0 var(--pc)}
.pname{flex:0 1 auto;min-width:0;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--display);font-weight:600;font-size:14.5px}
.pflag{flex:0 0 auto;display:flex;align-items:center}
.prow .flag svg{display:block}

/* переходы между экранами */
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-in{animation:none}
@media (prefers-reduced-motion:reduce){.view-in{animation:none}}
.pthumb{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--panel-2) center/cover no-repeat;
  box-shadow:inset 0 0 0 1px var(--line)}
.prow:not(.has-cover) .pthumb{background-image:radial-gradient(70% 70% at 50% 30%,color-mix(in srgb,var(--violet) 22%,transparent),transparent 72%)}

/* тонкая полоса прокрутки в панели */
#sideList::-webkit-scrollbar{width:8px}
#sideList::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07);border-radius:8px;
  border:2px solid transparent;background-clip:padding-box}
#sideList:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);background-clip:padding-box}

/* заметнее фокус с клавиатуры */
.btn-nav:focus-visible,.row-name:focus-visible,.card:focus-visible,.prow:focus-visible{
  outline:2px solid var(--violet);outline-offset:2px}

/* заголовок проекта: подпись статуса заметнее на тёмном */
.card-status{backdrop-filter:blur(3px);padding:3px 8px;border-radius:999px;background:rgba(2,2,3,.45)}
.card:not(.has-cover) .card-status{background:transparent;backdrop-filter:none;padding:0}

/* мягкая подсветка строки под курсором в списке */
.prow{position:relative;overflow:hidden}
.prow::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .16s;
  background:linear-gradient(90deg,color-mix(in srgb,var(--violet) 10%,transparent),transparent 45%)}
.prow:hover::after{opacity:1}
.links.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);text-decoration:none;color:var(--txt);
  transition:.14s;cursor:pointer}

  background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center}

  font-family:var(--display);font-weight:600;font-size:13.5px}

.lrow .lacts{position:static;opacity:0;flex:0 0 auto}

.lcard[draggable],.lrow[draggable]{cursor:grab}
.refprev img{max-width:min(92vw,760px);max-height:74vh;border-radius:14px;object-fit:contain}

  justify-content:center;color:var(--dim);background:var(--panel)}

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* рамка выделения и панель действий */
.marquee{position:absolute;z-index:60;border:1px solid var(--violet);background:color-mix(in srgb,var(--violet) 12%,transparent);
  border-radius:6px;pointer-events:none}
.pin.sel{outline:2px solid var(--violet);outline-offset:2px}
.sel-bar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:96;display:flex;
  align-items:center;gap:9px;padding:9px 12px;border-radius:14px;background:var(--raise);
  box-shadow:0 20px 50px -20px #000,inset 0 0 0 1px var(--line-2);font-size:13.5px}

  color:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}

/* ─── движение ─── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-140% 0}100%{background-position:240% 0}}
@keyframes bootPulse{0%{transform:scale(.82);opacity:.55}50%{transform:scale(1);opacity:1}100%{transform:scale(.82);opacity:.55}}
@keyframes bootSpin{to{transform:rotate(360deg)}}

.boot{flex-direction:column;gap:18px;transition:opacity .3s ease}
.boot.gone{opacity:0;pointer-events:none}
.boot-mark{width:96px;height:96px;border-radius:24px;display:block;
  animation:bootPulse 1.6s ease-in-out infinite}
.boot-word{font-family:var(--ui);font-size:12px;
  color:var(--dim);padding-left:.42em}

/* мелкие радости */
.fab{animation:popIn .32s cubic-bezier(.2,.8,.2,1) both}
.fab.small{animation-delay:.06s}
.sheet{animation:popIn .2s cubic-bezier(.2,.8,.2,1) both}
.lb img,.refprev img{animation:popIn .22s cubic-bezier(.2,.8,.2,1) both}
.qa{animation:fadeUp .2s cubic-bezier(.2,.8,.2,1) both}
.tasks li .check svg,.tditem .check svg,.want .check svg{transition:transform .16s cubic-bezier(.2,1.6,.4,1)}
.tasks li.done .check svg,.tditem.done .check svg,.want.done .check svg{transform:scale(1.16)}
.chip,.ghost-btn,.qchip{transition:transform .12s ease,color .14s,background .14s,box-shadow .14s}
.chip:active,.ghost-btn:active,.qchip:active{transform:scale(.96)}

/* публичная страница появляется по частям */
body.shared-view .head{animation:fadeUp .34s ease both}
body.shared-view .qbar{animation:fadeUp .34s ease .08s both}
body.shared-view .panes>*{animation:fadeUp .36s ease both}
body.shared-view .panes>*:nth-child(2){animation-delay:.12s}
body.shared-view .panes>*:nth-child(3){animation-delay:.18s}
body.shared-view .panes>*:nth-child(4){animation-delay:.24s}

@media (prefers-reduced-motion:reduce){
  .grid>*,.plist>*,.links>*,.wish-grid>*,.tdlist>*,.ideas>*,.wants>*,.sgroup,.rrow,
  .fab,.sheet,.qa,.lb img,.refprev img,body.shared-view .head,body.shared-view .qbar,
  body.shared-view .panes>*{animation:none!important}
  .lrow-thumb,.pthumb,.boot-mark{animation:none!important}
}

/* ── сенсорные экраны: наведения нет, действия видны всегда ── */
@media (hover:none){
  .btn-gear,.star,.task-del,.sub-del,.idea-acts,.pin-x,.pin-size,.tditem .idea-acts,.lacts,.sticky-acts,.sticky-size,.qchip button{opacity:1!important}

  .ripple{display:none}

/* v2 — flat dark, one fill colour per meaning, capture first */

.card:hover,.wcard:hover,.lcard:hover,.idea:hover,.al:hover{transform:none;box-shadow:none}

.ripple{display:none}
.topbar{background:var(--bg);backdrop-filter:none}
.head h1{font-size:30px;font-weight:600}

/* v3 — colour with a job, feedback on every press, today list */
@property --sec{syntax:'<color>';inherits:true;initial-value:#D4FF3A}
:root{--bg:#09090A;--panel:#111112;--panel-2:#18181A;--raise:#1C1C1E;--line:#232326;--line-2:#303034;
  --soft:#A4A4AC;--dim:#7E7E86;--btn-hover:#242427;--s-idle:#7E7E86;--chip-bg:rgba(255,255,255,.05)}
body{--sec:var(--lime);transition:--sec .45s ease}
body[data-sec=inbox],body[data-sec=violet]{--sec:var(--violet)}
body[data-sec=wishlist],body[data-sec=mint]{--sec:var(--mint)}
body[data-sec=todolist],body[data-sec=magenta]{--sec:var(--magenta)}
body[data-sec=focus],body[data-sec=amber]{--sec:var(--amber)}
body[data-sec=cyan]{--sec:var(--cyan)}
#main::before{content:'';position:absolute;inset:0 0 auto 0;height:320px;pointer-events:none;z-index:0;
  background:radial-gradient(70% 100% at 22% 0%,color-mix(in srgb,var(--sec) 15%,transparent),transparent 72%)}
.topbar,#view{position:relative;z-index:1}
.topbar{background:transparent;border-bottom-color:transparent}
:focus-visible{outline-color:var(--sec)}
.p-head{border-bottom:none;padding-bottom:4px}
.p-title{caret-color:var(--sec)}
.chip.on{background:var(--sec);color:var(--on)}
.kind-pick button.on{background:var(--sec)}
.bar i{background:var(--sec)}
.task-add button,.want-add .go,.wish-add .go,.link-add .go,
.task-add button:hover,.want-add .go:hover,.wish-add .go:hover,.link-add .go:hover{background:var(--sec);color:var(--on);box-shadow:none}
.task-add button:hover,.want-add .go:hover,.wish-add .go:hover,.link-add .go:hover{filter:brightness(1.12)}
.task-add input:focus,.want-add input:focus,.wish-add input:focus,.link-add input:focus,.notes:focus,.search input:focus{border-color:var(--sec)}
.check:hover{color:var(--sec)}
.fab{background:var(--sec)}
.quick-btn,.quick-btn:hover{background:var(--sec);color:var(--on);border-color:transparent}
.quick-btn:hover{filter:brightness(1.1)}
.quick-btn kbd{background:rgba(0,0,0,.16);border-color:transparent;color:inherit}
.qa-hint{padding:0 20px 14px;color:var(--lime);font-weight:600}
.qa-foot{gap:18px}
.tditem:hover{border-color:color-mix(in srgb,var(--sec) 45%,var(--line))}
.tditem .idea-acts button{padding:7px;border:none;color:var(--dim)}
.tditem .idea-acts button:hover{color:var(--txt);background:var(--raise)}
.tditem .idea-acts button[data-tddel]{color:var(--dim)}
.tditem .idea-acts button[data-tddel]:hover{color:var(--magenta);background:color-mix(in srgb,var(--magenta) 14%,transparent)}
.tditem:hover .star{opacity:.55}
.tditem .star.on,.tditem .star:hover{opacity:1}
.catbadge[data-c=other]{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 35%,transparent)}
.idea{background:color-mix(in srgb,var(--violet) 6%,var(--panel))}
.idea:hover{border-color:color-mix(in srgb,var(--violet) 55%,var(--line))}
.wcard .noimg{background:color-mix(in srgb,var(--mint) 9%,var(--panel-2))}

/* press feedback */
button:active,.chip:active,.jot-tab:active{transform:scale(.96)}
.check:active{transform:scale(.82)}
.lcard:active,.wcard:active,.card:active,.idea:active{transform:scale(.99)}
.row-nav:active{transform:translateY(-50%) scale(.96)}
.burst{position:fixed;z-index:9999;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--sec);
  transform:rotate(var(--a));animation:burst .5s cubic-bezier(.2,.7,.3,1) forwards}
.burst i:nth-child(odd){background:var(--txt);width:4px;height:4px}
@keyframes burst{to{transform:rotate(var(--a)) translateY(-28px) scale(.2);opacity:0}}

/* project cards carry their own colour */
.card{background:color-mix(in srgb,var(--pc,var(--lime)) 11%,var(--panel));
  border-color:color-mix(in srgb,var(--pc,var(--lime)) 26%,var(--line));transition:border-color .15s,background .15s,transform .1s}
.card:hover{border-color:var(--pc,var(--lime));background:color-mix(in srgb,var(--pc,var(--lime)) 17%,var(--panel))}
.card .mini i{background:var(--pc,var(--lime))}
.card .next em{color:var(--pc,var(--cyan))}
.card-name{font-size:18px}
.card-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);min-height:18px}
.card-n{margin-left:auto;font-variant-numeric:tabular-nums}

/* today */
.today{max-width:1500px;margin:0 auto 28px}
.sec-n{font-size:13px;font-weight:700;color:var(--on);background:var(--amber);border-radius:999px;padding:1px 9px}
.tlist{margin:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.tlist li{padding:13px 14px;align-items:center;flex-wrap:nowrap;gap:12px}
.tlist li:last-child{border-bottom:none}
.tlist li:hover{background:var(--panel-2)}
.tlist li.leaving{opacity:.35;transition:opacity .35s}
.tlist li.leaving .check{color:var(--mint)}
.tsrc{flex:0 0 auto;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:600;
  padding:3px 9px;border-radius:999px;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent)}
.tsrc:hover{background:color-mix(in srgb,var(--pc) 26%,transparent)}

/* dates */
.due{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
  font-size:12.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.due:hover{color:var(--txt);background:var(--raise)}
.due.later{color:var(--cyan);background:color-mix(in srgb,var(--cyan) 13%,transparent)}
.due.now{color:var(--amber);background:color-mix(in srgb,var(--amber) 15%,transparent)}
.due.late{color:var(--magenta);background:color-mix(in srgb,var(--magenta) 16%,transparent)}
@media (hover:hover){
  .due:not(.later):not(.now):not(.late){opacity:0}
  li:hover>.due,.tditem:hover .due,.due:focus-visible{opacity:1}
  .wrow>button:not(.check){opacity:0}
  .wrow:hover>button,.wrow>button:focus-visible{opacity:1}
}
.due-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.due-grid button,.due-grid input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--panel-2);font-size:15px;font-weight:600;color:var(--txt);color-scheme:dark}
body.light .due-grid input{color-scheme:light}
.due-grid button:hover{border-color:var(--sec)}
.due-grid button.on{background:var(--sec);color:var(--on);border-color:transparent}

/* shopping list */
.wish-list{display:flex;flex-direction:column;margin-top:16px;border:1px solid var(--line);border-radius:14px;
  background:var(--panel);overflow:hidden}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:none}
.wrow:hover{background:var(--panel-2)}
.wrow-name{flex:1;min-width:0;font-size:15px;word-break:break-word}
.wrow-price{font-weight:700;color:var(--lime);font-variant-numeric:tabular-nums}
.wrow>button:not(.check){padding:6px;border-radius:8px;color:var(--dim)}
.wrow>button:not(.check):hover{color:var(--txt);background:var(--raise)}
.wrow.got .wrow-name{text-decoration:line-through;color:var(--dim)}
.wrow.got .check{color:var(--mint)}
.wgap{flex:0 0 26px}
.wsum{margin-left:6px;font-family:var(--display);font-size:17px;color:var(--lime)}
.wish-shot{width:48px;padding:0}
.cur-pick{margin-left:0}

/* home: write it down first */
.jot{max-width:1500px;margin:0 auto 28px;padding:14px;border-radius:18px;
  background:color-mix(in srgb,var(--jc) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--jc) 32%,var(--line));

<script>
/* ───────── cloud ───────── */
const SUPA_URL='https://behlseohzahgkvnsghjm.supabase.co';
const SUPA_KEY='sb_publishable_jtedcHjzGQ8Ow8Usp8WiWA_xF25IBGU';
let sb=null, ME=null, lastLoad=0;

/* ───────── local cache (kept for migration) ───────── */
const DB_NAME='proekty', DB_VER=2;
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('projects')) d.createObjectStore('projects',{keyPath:'id'});
      if(!d.objectStoreNames.contains('photos')){
        const s=d.createObjectStore('photos',{keyPath:'id'});
        s.createIndex('pid','pid');
      }
      if(!d.objectStoreNames.contains('queue')) d.createObjectStore('queue',{keyPath:'id'});
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
const tx=(s,m)=>db.transaction(s,m).objectStore(s);
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const localProjects=()=>req(tx('projects').getAll());
const localPhotos=()=>req(tx('photos').getAll());

/* ───────── cloud data layer ───────── */
const tasksOf=p=>(p.tasks||[]).filter(t=>t.kind!=='link'&&t.kind!=='sticky'&&t.kind!=='quick');
const quickOf=p=>(p.tasks||[]).filter(t=>t.kind==='quick');
const linksOf=p=>(p.tasks||[]).filter(t=>t.kind==='link');
const KIND_OF=pid=>pid===INBOX?'idea':pid===WANT?'wish':pid===TODO?'todo':'task';

function projectRow(p){
  return {id:p.id,user_id:ME.id,name:p.name||'',status:p.status||'idle',
    important:!!p.important,archived:!!p.archived,pinned:!!p.pinned,
    ord:p.ord==null?null:p.ord,start_date:p.startDate||null,revisit:p.revisit||null,
    cover:p.cover||null,color:p.color||null,shared:!!p.shared,share_id:p.shareId||null,
    share_data:p.shareData||null,notes:p.notes||'',created:p.created||Date.now(),
    updated:p.updated||Date.now(),done_at:p.doneAt||null};
}
function projectFromRow(r,items){
  return {id:r.id,name:r.name,status:r.status,important:r.important,archived:r.archived,
    pinned:r.pinned,ord:r.ord,startDate:r.start_date||'',revisit:r.revisit||'',
    cover:r.cover||null,color:r.color||null,shared:!!r.shared,shareId:r.share_id||null,
    shareData:r.share_data||null,notes:r.notes||'',created:Number(r.created)||0,
    updated:Number(r.updated)||0,doneAt:r.done_at?Number(r.done_at):null,tasks:items||[]};
}
function itemRow(t,p,i){
  return {id:t.id,project_id:p.id,user_id:ME.id,kind:t.kind||KIND_OF(p.id),text:t.text||'',
    preview:t.preview||null,layout:t.layout?(typeof t.layout==='string'?JSON.parse(t.layout):t.layout):null,
    done:!!t.done,done_at:t.doneAt||null,star:!!t.star,
    price:(t.price===0||t.price)?t.price:null,url:t.url||null,note:t.note||null,
    cat:t.cat||null,subs:t.subs||[],ord:i,created:t.created||Date.now()};
}
function itemFromRow(r){
  const t={id:r.id,text:r.text,done:r.done,created:Number(r.created)||0};
  if(r.kind&&r.kind!=='task') t.kind=r.kind;
  if(r.preview) t.preview=r.preview;
  if(r.layout) t.layout=typeof r.layout==='string'?r.layout:JSON.stringify(r.layout);
  if(r.done_at) t.doneAt=Number(r.done_at);
  if(r.star) t.star=true;
  if(r.price!=null) t.price=Number(r.price);
  if(r.url) t.url=r.url;
  if(r.note) t.note=r.note;
  if(r.cat) t.cat=r.cat;
  if(Array.isArray(r.subs)&&r.subs.length) t.subs=r.subs;
  return t;
}

let netOk=true, pendingCount=0;

function setNet(ok){
  if(netOk===ok) return;
  netOk=ok;
  paintNet();
  if(ok) toast('Back online — syncing');
}
function paintNet(){
  const el=document.getElementById('netDot');
  if(!el) return;
  if(netOk&&!pendingCount){ el.style.display='none'; return }
  el.style.display='';
  el.className='net-dot'+(netOk?' syncing':' off');
  el.textContent=netOk?('syncing '+pendingCount):('offline'+(pendingCount?' · '+pendingCount+' waiting':''));
}

async function localPut(store,val){ if(!db) return; try{ await req(tx(store,'readwrite').put(val)) }catch(e){} }
async function localDel(store,id){ if(!db) return; try{ await req(tx(store,'readwrite').delete(id)) }catch(e){} }
async function queueAll(){ if(!db) return []; try{ return await req(tx('queue').getAll()) }catch(e){ return [] } }

async function enqueue(job){
  job.id=job.id||uid(); job.at=Date.now();
  await localPut('queue',job);
  pendingCount=(await queueAll()).length;
  paintNet();
}

async function pushProject(p){
  try{
    const r1=await sb.from('projects').upsert(projectRow(p));
    if(r1.error) throw r1.error;
    const rows=(p.tasks||[]).map((t,i)=>itemRow(t,p,i));
    if(rows.length){
      const r2=await sb.from('items').upsert(rows);
      if(r2.error) throw r2.error;
    }
    let q=sb.from('items').delete().eq('project_id',p.id);
    const ids=rows.map(r=>r.id);
    if(ids.length) q=q.not('id','in','('+ids.map(x=>'"'+x+'"').join(',')+')');
    const r3=await q;
    if(r3.error) throw r3.error;
    return true;
  }catch(e){ console.error(e); return false }
}

async function putProject(p){
  if(!sb||!ME) return;
  await localPut('projects',JSON.parse(JSON.stringify(p)));   // зеркало на диске
  const ok=await pushProject(p);
  if(!ok){ await enqueue({kind:'project',pid:p.id}); setNet(false) }
  else setNet(true);
}

async function flushQueue(){
  if(!sb||!ME||!db) return;
  const jobs=await queueAll();
  pendingCount=jobs.length; paintNet();
  for(const job of jobs.sort((a,b)=>a.at-b.at)){
    let done=false;
    try{
      if(job.kind==='project'){
        const p=st.projects.find(x=>x.id===job.pid)
             ||(await req(tx('projects').get(job.pid)));
        done=p?await pushProject(p):true;
      }
      if(job.kind==='projDel'){
        done=!(await sb.from('projects').delete().eq('id',job.pid)).error;
      }
      if(job.kind==='photo'){
        const up=await sb.storage.from('photos').upload(job.path,job.blob,{contentType:'image/jpeg',upsert:true});
        if(!up.error||/exists/i.test(up.error.message||'')){
          done=!(await sb.from('photos').upsert(job.row)).error;
        }
      }
      if(job.kind==='photoRow'){
        done=!(await sb.from('photos').upsert(job.row)).error;
      }
      if(job.kind==='photoPurge'){
        if(job.path) await sb.storage.from('photos').remove([job.path]);
        done=!(await sb.from('photos').delete().eq('id',job.pid)).error;
      }
    }catch(e){ done=false }
    if(done) await localDel('queue',job.id); else { setNet(false); break }
  }

const UNDO_MAX=40;
let undoStack=[], redoStack=[], baseline={}, lastSnap={};

const snapOf=p=>JSON.stringify({tasks:p.tasks||[],notes:p.notes||'',name:p.name,
  status:p.status,important:!!p.important,archived:!!p.archived,color:p.color||null});

function noteChange(p){
  const now=snapOf(p);
  const prev=baseline[p.id];
  if(prev===undefined){ baseline[p.id]=now; return }
  if(prev===now) return;
  let a,b;
  try{ a=JSON.parse(prev); b=JSON.parse(now) }catch(e){ baseline[p.id]=now; return }
  const structural=JSON.stringify(a.tasks)!==JSON.stringify(b.tasks)
    || a.status!==b.status || a.archived!==b.archived || a.important!==b.important;
  const typing=!structural;
  if(typing && lastSnap[p.id] && Date.now()-lastSnap[p.id]<2500){ baseline[p.id]=now; return }
  undoStack.push({pid:p.id,snap:prev});
  if(undoStack.length>UNDO_MAX) undoStack.shift();
  redoStack.length=0;
  lastSnap[p.id]=Date.now();
  baseline[p.id]=now;
}

function applySnap(pid,snap){
  const p=st.projects.find(x=>x.id===pid);
  if(!p) return null;
  const before=snapOf(p);
  const d=JSON.parse(snap);
  p.tasks=d.tasks; p.notes=d.notes; p.name=d.name;
  p.status=d.status; p.important=d.important; p.archived=d.archived;
  if('color' in d) p.color=d.color;
  baseline[pid]=snap;
  putProject(p).catch(()=>{});
  return before;
}

function undo(){
  const step=undoStack.pop();
  if(!step) return toast('Nothing to undo');
  const before=applySnap(step.pid,step.snap);
  if(before===null) return;
  redoStack.push({pid:step.pid,snap:before});
  sortProjects();
  refreshView();
  toast('Undone');
}
function redo(){
  const step=redoStack.pop();
  if(!step) return toast('Nothing to redo');
  const before=applySnap(step.pid,step.snap);
  if(before===null) return;
  undoStack.push({pid:step.pid,snap:before});
  sortProjects();
  refreshView();
  toast('Redone');
}

const coverCache={};
const COVER_KEY='pm:covers';
let coverFresh=0;
const coverMap=()=>{ try{ return JSON.parse(LS.get(COVER_KEY)||'{}')||{} }catch(e){ return {} } };
async function coverStore(){ try{ return window.caches?await caches.open('pm-covers-v1'):null }catch(e){ return null } }
async function thumbBlob(url){
  const r=await fetch(url); if(!r.ok) throw new Error('cover');
  const bmp=await createImageBitmap(await r.blob());
  const k=Math.min(1,640/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(bmp.width*k)); c.height=Math.max(1,Math.round(bmp.height*k));
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(x=>x?res(x):rej(new Error('cover')),'image/jpeg',.8));
}
/* обложки: сразу из памяти и с диска, потом один запрос на всё и одна подпись ссылок */
async function paintCovers(){
  const cards=()=>Array.from(document.querySelectorAll('.card[data-cover], .prow[data-cover]'));
  const put=(pid,url)=>cards().forEach(c=>{ if(c.dataset.cover===pid) attachCover(c,url) });
  cards().forEach(c=>{ const m=coverCache[c.dataset.cover]; if(m&&m.url) attachCover(c,m.url) });
  const map=coverMap(), store=await coverStore();
  if(store) await Promise.all(Object.keys(map).map(async pid=>{
    if(coverCache[pid]&&coverCache[pid].url) return;
    try{
      const hit=await store.match('/cover/'+map[pid]); if(!hit) return;
      coverCache[pid]={url:URL.createObjectURL(await hit.blob()),id:map[pid]}; put(pid,coverCache[pid].url);
    }catch(e){}
  }));
  if(!sb||!ME||(coverFresh&&Date.now()-coverFresh<5*60*1000)) return;
  let rows;
  try{
    const q=await sb.from('photos').select('id,project_id,path,created,deleted_at').order('created',{ascending:true});
    if(q.error) throw q.error;
    rows=(q.data||[]).filter(r=>!r.deleted_at&&r.path);
  }catch(e){ return }
  coverFresh=Date.now();
  const want={};
  st.projects.forEach(p=>{
    if(SPECIAL(p.id)) return;
    const pick=(p.cover&&rows.find(r=>r.id===p.cover))||rows.find(r=>r.project_id===p.id);
    if(pick) want[p.id]=pick;
  });
  const next={}; Object.keys(want).forEach(pid=>{ next[pid]=want[pid].id });
  LS.set(COVER_KEY,JSON.stringify(next));
  Object.keys(coverCache).forEach(pid=>{
    if(want[pid]) return;
    delete coverCache[pid];
    cards().forEach(c=>{ if(c.dataset.cover!==pid) return; const im=c.querySelector('img.cover'); if(im) im.remove(); c.classList.remove('has-cover') });
  });
  const need=Object.keys(want).filter(pid=>!(coverCache[pid]&&coverCache[pid].id===want[pid].id));
  if(need.length){
    let urlOf={};
    try{
      const sg=await sb.storage.from('photos').createSignedUrls(need.map(pid=>want[pid].path),3600);
      (sg.data||[]).forEach(d=>{ if(d.path&&d.signedUrl) urlOf[d.path]=d.signedUrl });
    }catch(e){}
    await Promise.all(need.map(async pid=>{
      const row=want[pid], src=urlOf[row.path]; if(!src) return;
      let u=src;
      try{
        const blob=await thumbBlob(src);
        if(store) await store.put('/cover/'+row.id,new Response(blob,{headers:{'Content-Type':'image/jpeg'}}));
        u=URL.createObjectURL(blob);
      }catch(e){}
      coverCache[pid]={url:u,id:row.id}; put(pid,u);
    }));
  }
  if(store) try{                                        // старые уменьшенные копии больше не нужны
    const keep=new Set(Object.values(next).map(id=>'/cover/'+id));
    (await store.keys()).forEach(k=>{ const path=new URL(k.url).pathname; if(!keep.has(path)) store.delete(k) });
  }catch(e){}
}
function attachCover(card,url){
  const thumb=card.querySelector('.pthumb');
  if(thumb){                       // компактная строка — маленькое превью
    if(thumb.style.backgroundImage.indexOf(url)>=0) return;
    thumb.style.backgroundImage='url("'+url+'")';
    card.classList.add('has-cover');
    return;
  }
  const old=card.querySelector('img.cover');
  if(old){ if(old.src===url) return; old.remove() }
  const img=document.createElement('img');
  img.className='cover'; img.alt=''; img.decoding='async'; img.src=url;
  card.insertBefore(img,card.firstChild);
  card.classList.add('has-cover');
}
function dropCover(pid){ delete coverCache[pid]; coverFresh=0 }

function bindRowDrag(box){
  let dragId=null;
  box.addEventListener('dragstart',e=>{
    const r=e.target.closest('.row'); if(!r) return;
    dragId=r.dataset.id; st.dragRow=true; r.classList.add('drag');
    e.dataTransfer.effectAllowed='move';
    try{ e.dataTransfer.setData('text/plain',dragId) }catch(_){}
  });
  box.addEventListener('dragend',()=>{ st.dragRow=false; dragId=null; renderSide() });
  box.addEventListener('dragover',e=>{
    if(!dragId) return;
    e.preventDefault();
    const over=e.target.closest('.row'); if(!over||over.dataset.id===dragId) return;
    const el=box.querySelector('.row[data-id="'+dragId+'"]'); if(!el) return;
    const r=over.getBoundingClientRect();
    box.insertBefore(el, (e.clientY-r.top)>r.height/2 ? over.nextSibling : over);
  });
  box.addEventListener('drop',async e=>{
    e.preventDefault(); if(!dragId) return;
    dragId=null; st.dragRow=false;
    await persistOrder(box);
  });
  bindTouchReorder(box);
}

async function persistOrder(box){
  const ids=Array.from(box.querySelectorAll('.row')).map(r=>r.dataset.id);
  for(let i=0;i<ids.length;i++){
    const pr=st.projects.find(x=>x.id===ids[i]);
    if(pr){ pr.ord=i; await putProject(pr) }
  }
  st.manual=true; LS.set('pm:manual','1');
  sortProjects(); renderSide();
  toast('Order saved');
}

function bindTouchReorder(box){
  let held=null, timer=null, startY=0, moved=false;
  const cancel=()=>{ clearTimeout(timer); timer=null };
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch') return;
    const row=e.target.closest('.row'); if(!row) return;
    if(e.target.closest('.pick')||e.target.closest('.btn-gear')||e.target.closest('.btn-pin')) return;
    startY=e.clientY; moved=false;
    timer=setTimeout(()=>{
      held=row; st.dragRow=true; row.classList.add('drag');
      if(navigator.vibrate) navigator.vibrate(12);
    },350);
  });
  box.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch') return;
    if(!held){
      if(timer&&Math.abs(e.clientY-startY)>9){ cancel() }
      return;
    }
    moved=true;
    e.preventDefault();
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const row=under&&under.closest?under.closest('.row'):null;
    if(row&&row!==held&&row.parentNode===box){
      const r=row.getBoundingClientRect();
      box.insertBefore(held,(e.clientY-r.top)>r.height/2?row.nextSibling:row);
    }
  });
  const finish=async e=>{
    cancel();
    if(!held) return;
    const row=held; held=null; st.dragRow=false;
    row.classList.remove('drag');
    if(e) { e.preventDefault(); }
    if(moved) await persistOrder(box);
  };
  box.addEventListener('pointerup',finish);
  box.addEventListener('pointercancel',finish);
}

function historyEvents(days){
  const from=Date.now()-days*864e5, ev=[];
  st.projects.forEach(p=>{
    if(p.doneAt&&p.doneAt>=from&&!SPECIAL(p.id))
      ev.push({at:p.doneAt,kind:'proj',text:p.name,src:'project finished',pid:p.id});
    (p.tasks||[]).forEach(t=>{
      if(!t.doneAt||t.doneAt<from) return;
      if(p.id===WANT) ev.push({at:t.doneAt,kind:'wish',text:t.text,src:(isExp(t)?(layObj(t).inc?'income':'spent'):'bought')+(t.price?' · '+money(t.price):''),pid:p.id});
      else if(p.id===TODO) ev.push({at:t.doneAt,kind:'todo',text:t.text,src:(t.cat||'other')+' · done',pid:p.id});
      else if(p.id===INBOX) return;
      else ev.push({at:t.doneAt,kind:'task',text:t.text,src:p.name,pid:p.id});
    });
  });
  return ev.sort((a,b)=>b.at-a.at);
}

function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate() }
function dayLabel(ts){
  const n=daysAgo(ts);
  if(n<=0) return 'Today';
  if(n===1) return 'Yesterday';
  const d=new Date(ts);
  return MON[d.getMonth()]+' '+d.getDate();
}

function monthSummary(offset){
  const now=new Date();
  const m=new Date(now.getFullYear(),now.getMonth()-offset,1);
  const from=m.getTime();
  const to=new Date(m.getFullYear(),m.getMonth()+1,1).getTime();
  const ev=historyEvents(4000).filter(e=>e.at>=from&&e.at<to);
  const by=k=>ev.filter(e=>e.kind===k);
  const spent=by('wish').reduce((n,e)=>{const mm=String(e.src).match(/([\d.,]+)\s*$/);return n+(mm?parseFloat(mm[1].replace(',','.'))||0:0)},0);
  const days={};
  ev.forEach(e=>{const k=dayKey(e.at);days[k]=(days[k]||0)+1});
  let bestDay=null,bestN=0;
  Object.keys(days).forEach(k=>{ if(days[k]>bestN){bestN=days[k];bestDay=k} });
  const bestAt=bestDay?ev.find(e=>dayKey(e.at)===bestDay).at:null;
  return {label:MON[m.getMonth()]+' '+m.getFullYear(),ev,tasks:by('task').length,projs:by('proj').length,
    wishes:by('wish').length,todos:by('todo').length,spent,bestAt,bestN,activeDays:Object.keys(days).length};
}

function mark(text,q){
  const t=String(text||'');
  const i=t.toLowerCase().indexOf(q);
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
function snippet(text,q,pad){
  const t=String(text||''); const i=t.toLowerCase().indexOf(q);
  if(i<0) return '';
  const a=Math.max(0,i-pad), b=Math.min(t.length,i+q.length+pad*2);
  return (a>0?'…':'')+t.slice(a,b)+(b<t.length?'…':'');
}
const KIND_LABEL={income:'income',spent:'spent',bought:'bought',task:'task',idea:'idea',wish:'wish',todo:'to do',link:'link',sticky:'note',quick:'link'};

function searchHits(){
  const q=st.query.trim().toLowerCase();
  if(!q) return [];
  const out=[];
  st.projects.forEach(p=>{
    const hits=[];
    if((p.name||'').toLowerCase().includes(q)) hits.push({k:'name',t:p.name});
    (p.tasks||[]).forEach(t=>{
      const kind=t.kind||(SPECIAL(p.id)?KIND_OF(p.id):'task');
      const wk=p.id===WANT&&t.done?(isExp(t)?(layObj(t).inc?'income':'spent'):'bought'):kind;
      if((t.text||'').toLowerCase().includes(q)) hits.push({k:wk,t:t.text+(p.id===WANT&&t.done&&t.price?' · '+money2(Number(t.price)):''),done:t.done&&wk!=='spent'&&wk!=='bought',id:t.id,sp:p.id===WANT&&t.done&&Number(t.price)>0});
      if((t.note||'').toLowerCase().includes(q)) hits.push({k:'note',t:snippet(t.note,q,45),id:t.id});
      if((t.url||'').toLowerCase().includes(q)) hits.push({k:'link',t:t.url,id:t.id});
    });
    if((p.notes||'').toLowerCase().includes(q)) hits.push({k:'notes',t:snippet(p.notes,q,55)});
    if(hits.length) out.push({p,hits});
  });
  return out;
}

function renderSearch(){
  const q=st.query.trim().toLowerCase();

function renderReview(){

  const stale=real.filter(x=>!x.archived&&x.status==='active'&&daysAgo(x.updated||x.created)>=7&&!isDue(x));
  const cold=real.filter(x=>!x.archived&&x.status==='idle'&&daysAgo(x.created)>=30);
  const stars=starred();
  const week=historyEvents(7);
  const nothing=!due.length&&!stale.length&&!cold.length;

  const card=(p,actions)=>`<div class="rrow">
    <a class="rname" href="#p/${p.id}" data-open="${p.id}">
      <span class="dot" data-s="${p.status}"></span>${esc(p.name)}
    </a>
    <span class="rmeta">${p.revisit&&isDue(p)?'due back':(p.status==='active'?`untouched ${daysAgo(p.updated||p.created)}d`:`idle ${daysAgo(p.created)}d`)}</span>
    <span class="racts">${actions.map(a=>`<button data-rev-act="${a.k}" data-pid="${p.id}">${a.l}</button>`).join('')}</span>
  </div>`;

  $('#view').innerHTML=`
    <header class="head">
      <h1>Review</h1>
      <p class="lede">${week.length} done this week${nothing?'. Nothing needs a decision.':` · ${due.length+stale.length+cold.length} need a decision.`}</p>
    </header>
    ${due.length?`<div class="rsec"><h2>Asked to come back</h2>${due.map(p=>card(p,[
      {k:'snooze',l:'later'},{k:'start',l:'start now'},{k:'arch',l:'archive'}])).join('')}</div>`:''}
    ${stale.length?`<div class="rsec"><h2>Started, then stalled</h2>${stale.map(p=>card(p,[
      {k:'snooze',l:'park it'},{k:'done',l:'call it done'},{k:'arch',l:'archive'}])).join('')}</div>`:''}
    ${cold.length?`<div class="rsec"><h2>Never got going</h2>${cold.map(p=>card(p,[
      {k:'start',l:'start now'},{k:'arch',l:'archive'},{k:'del',l:'delete'}])).join('')}</div>`:''}
    ${nothing?`<p class="empty-line">All clear. <a href="#history">See what you did</a></p>`:''}
  `;
  $('#view').querySelectorAll('[data-rev-act]').forEach(b=>b.addEventListener('click',async e=>{
    e.preventDefault(); e.stopPropagation();
    const p=st.projects.find(x=>x.id===b.dataset.pid); if(!p) return;
    const k=b.dataset.revAct;
    if(k==='snooze'){ p.revisit=plusMonths(1); saveProject(p,true); toast('Back on '+ru(p.revisit)) }
    if(k==='start'){ p.status='active'; p.revisit=''; if(!p.startDate) p.startDate=today(); saveProject(p,true); toast('In progress') }
    if(k==='done'){ setStatus(p,'done'); toast('Marked finished') }
    if(k==='arch'){ const rv=p.revisit; p.archived=true; p.revisit=''; saveProject(p,true);
      toast('Archived',{action:'Undo',onAction:()=>{ p.archived=false; p.revisit=rv; saveProject(p,true); sortProjects(); renderReview(); renderSide() }}) }
    if(k==='del'){
      if(!confirm('Delete “'+(p.name||'project')+'” for good?')) return;
      for(const ph of await photosOf(p.id)) await delPhotoDB(ph.id);
      await delProject(p.id);
      st.projects=st.projects.filter(x=>x.id!==p.id);
      toast('Deleted');
    }
    sortProjects(); renderReview(); renderSide();
  }));
}

  const doneN=groups.reduce((n,g)=>n+g.items.filter(t=>t.done).length,0);
  $('#view').innerHTML=`
    <header class="head">
      <h1>Today</h1>
      <p class="lede">${total?`${doneN} of ${total} done. This is the short list — everything else can wait.`
        :'Nothing starred yet. Open any project, hover a task and hit the star. Pulled tasks land here, so you get one list instead of ten.'}</p>
    </header>
    ${total?`<div id="focusWrap" class="focus-wrap">${groups.map(g=>`
      <div class="fgroup">
        <div class="fgroup-h"><span class="dot" data-s="${g.p.status}"></span><button data-open="${g.p.id}">${esc(g.p.name)}</button></div>

          </li>`).join('')}</ul>
      </div>`).join('')}
      ${doneN?`<div style="max-width:760px;margin:0 auto"><button class="btn-inline" id="clearDone">Clear ${doneN} finished</button></div>`:''}
    </div>`:''}`;
  const wrap=$('#focusWrap');
  if(wrap) wrap.addEventListener('click',e=>{
    if(e.target.closest('a')) return;
    const tg=e.target.closest('[data-ftoggle]'), un=e.target.closest('[data-funstar]');
    const hit=tg||un; if(!hit) return;
    const [pid,tid]=(tg?tg.dataset.ftoggle:un.dataset.funstar).split('|');
    const pr=st.projects.find(x=>x.id===pid); if(!pr) return;
    const task=(pr.tasks||[]).find(x=>x.id===tid); if(!task) return;
    if(tg){ task.done=!task.done; task.doneAt=task.done?Date.now():null; rollRepeat(task) } else { task.star=false; if(dueOf(task)&&dueOf(task)<=ld()) setDue(task,'') }
    saveProject(pr,true); renderFocus(); renderSide();
  });
  const cd=$('#clearDone');
  if(cd) cd.addEventListener('click',()=>{
    starred().forEach(g=>{g.items.filter(t=>t.done).forEach(t=>t.star=false); saveProject(g.p,true)});
    renderFocus(); renderSide(); toast('Focus list cleared');
  });
}

function ago(ts){
  if(!ts) return '';
  const d=daysAgo(ts);
  if(d<=0) return 'today';
  if(d===1) return 'yesterday';
  if(d<30) return d+' days ago';
  return ru(ld(new Date(ts)));
}

/* идея-ссылка: адрес либо в url, либо весь текст — это голый адрес */
const BARE_URL=/^(https?:\/\/\S+|www\.\S+)$/i;
const isBare=s=>BARE_URL.test(String(s||'').trim());
function ideaUrl(i){
  if(i.url) return i.url;
  const m=String(i.text||'').match(/(https?:\/\/\S+|www\.\S+)/i);
  return m?(/^https?:/i.test(m[1])?m[1]:'https://'+m[1]):'';
}
const noUrl=s=>String(s||'').replace(/(https?:\/\/\S+|www\.\S+)/gi,' ').replace(/\s+/g,' ').trim();
function linkKind(u){
  const h=hostOf(u); let p=''; try{ p=decodeURIComponent(new URL(u).pathname) }catch(e){}
  const at=(p.match(/@([\w.]+)/)||[])[1];
  if(/(^|\.)youtu(be\.com|\.be)$/.test(h)) return {name:'YouTube',what:/\/shorts\//.test(p)?'short':'video'};
  if(/instagram\.com$/.test(h)) return {name:'Instagram',what:/\/reels?\//.test(p)?'reel':/\/p\//.test(p)?'post':/\/stories\//.test(p)?'story':'profile'};
  if(/threads\.(net|com)$/.test(h)) return {name:'Threads',what:at&&!/\/post\//.test(p)?'@'+at:at?'post by @'+at:'post'};
  if(/tiktok\.com$/.test(h)) return {name:'TikTok',what:at?'video by @'+at:'video'};
  if(/^(twitter|x)\.com$/.test(h)) return {name:'X',what:'post'};
  if(/^t\.me$/.test(h)) return {name:'Telegram',what:p.split('/').filter(Boolean)[0]||''};
  if(/github\.com$/.test(h)) return {name:'GitHub',what:p.split('/').filter(Boolean).slice(0,2).join('/')};
  const seg=p.split('/').filter(Boolean).pop()||'';
  return {name:h,what:seg.replace(/\.\w{2,5}$/,'').replace(/[-_+]+/g,' ').slice(0,60)};
}
function ideaTitle(i){
  const u=ideaUrl(i), t=u?noUrl(i.text):String(i.text||'').trim();
  if(t&&!(u&&t===shortUrl(u))) return t;
  if(u){ const k=linkKind(u); return (k.name+' '+k.what).trim() }
  return t||'Untitled';
}
function ideaCard(p,i,cur){

/* старым ссылкам без названия тихо подтягиваем название и картинку — понемногу за заход */
let enriching=false;
async function enrichIdeas(p){
  if(enriching) return; enriching=true;
  try{
    let seen={}; try{ seen=JSON.parse(LS.get('pm:meta')||'{}')||{} }catch(e){}
    const need=i=>{const u=ideaUrl(i), t=String(i.text||'').trim();
      return u&&!(seen[i.id]>=3)&&(!i.preview&&!autoThumb(u)||!t||isBare(t)||t===shortUrl(u))};
    const closed=u=>/instagram\.com$/.test(hostOf(u));
    ideasOf(p).forEach(i=>{ const u=ideaUrl(i); if(u&&closed(u)&&!i.url){ i.url=u } });
    const list=ideasOf(p).filter(i=>need(i)&&!closed(ideaUrl(i))).reverse().slice(0,25);
    for(const i of list){
      const u=ideaUrl(i);
      const meta=await fetchMeta(u);
      if(meta.fail) continue;                            // лимит или сбой сервиса — попробуем в другой раз
      seen[i.id]=meta.miss?(seen[i.id]||0)+1:3;          // не нашлось — ещё пару попыток в следующие заходы
      LS.set('pm:meta',JSON.stringify(seen));
      const t=String(i.text||'').trim();
      let ch=false;
      if(!i.url){ i.url=u; ch=true }
      if(meta.image&&!i.preview){ i.preview=meta.image; ch=true }
      if(meta.title&&(!t||isBare(t)||t===shortUrl(u))){ i.text=meta.title; ch=true }
      if(!ch) continue;
      saveProject(p,true);
      const el=document.querySelector('.idea[data-id="'+i.id+'"]');
      if(el&&st.openId===p.id&&!el.querySelector('textarea,input')) el.outerHTML=ideaCard(p,i,st.ideaFolder||'');
    }
  }catch(e){ console.error(e) }
  enriching=false;
}
