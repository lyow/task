function itemEdit(p,item,isWish){
  const el=document.createElement('div');
  el.className='sheet-wrap';
  el.innerHTML=`<div class="sheet">
    <div class="sheet-head"><span>Edit</span><button data-close>${svg('x',15,2)}</button></div>
    <label class="f"><span>What</span><input id="eText" value="${esc(item.text)}"></label>
    ${isWish?`<label class="f"><span>Price (${curSym()})</span><input id="ePrice" inputmode="decimal" value="${item.price||''}"></label>`
     :`<div class="f"><span>Kind</span><div class="kind-pick" style="flex-wrap:wrap">
        ${CATS.map(c=>`<button data-ec="${c.id}" class="${(item.cat||'other')===c.id?'on':''}">${c.label}</button>`).join('')}
      </div></div>`}
    <label class="f"><span>Link</span><input id="eUrl" placeholder="https://" value="${esc(item.url||'')}"></label>
    ${isWish?`<div class="f"><span>Photo</span><button class="wish-shot" id="ePhoto" style="width:100%">${svg('img',15,1.7)} replace photo</button></div>`:''}
    <div class="sheet-foot"><button class="opt" id="eSave" style="width:100%">Save</button></div>
  </div>`;
  const close=()=>el.remove();
  el.addEventListener('click',e=>{
    if(e.target===el||e.target.closest('[data-close]')) return close();
    const c=e.target.closest('[data-ec]');
    if(c){ item.cat=c.dataset.ec; saveProject(p,true); close(); itemEdit(p,item,isWish); return }
    if(e.target.closest('#ePhoto')){
      const inp=$('#wishPick');
      inp.onchange=async ev=>{
        const f=ev.target.files[0]; ev.target.value='';
        if(!f) return;
        await setWishPhoto(item.id,f);
        close(); renderProject();
      };
      inp.click();
      return;
    }
    if(e.target.closest('#eSave')){
      const t=el.querySelector('#eText').value.trim();
      if(t) item.text=t;
      if(isWish){
        const pr=parseFloat(String(el.querySelector('#ePrice').value).replace(',','.'));
        item.price=isNaN(pr)?null:pr;
      }
      let u=el.querySelector('#eUrl').value.trim();
      if(u&&!/^https?:\/\//i.test(u)) u='https://'+u;
      item.url=u;
      saveProject(p,true); close(); renderProject(); renderSide();
    }
  });
  document.body.appendChild(el);
}

async function setWishPhoto(itemId,file){
  try{
    const old=(await photosOf(WANT)).filter(x=>x.item===itemId);
    for(const o of old) await delPhotoDB(o.id);
    const blob=await compress(file,1200,.75);
    await putPhoto({id:uid(),pid:WANT,item:itemId,name:file.name||'photo',blob,created:Date.now()});
  }catch(e){ console.error(e); toast('Could not attach that photo') }
}

async function loadWishPhotos(){
  clearUrls();
  let list=[]; try{ list=await photosOf(WANT) }catch(e){}
  st.photos=list;
  list.forEach(ph=>{
    const el=document.querySelector('[data-img="'+ph.item+'"]');
    if(el){ const u=photoSrc(ph); if(u.indexOf('blob:')===0) st.urls.push(u); el.src=u; el.classList.add('has') }
  });
}

function bindWish(p){
  const wa=$('#wAdd'); if(!wa) return;
  const add=async()=>{
    const ti=$('#wText'), pi=$('#wPrice'), li=$('#wLink');
    const v=ti.value.trim(); if(!v) return;
    const pr=parseFloat(String(pi.value).replace(',','.'));
    let u=(li?li.value:'').trim();
    if(u&&!/^https?:\/\//i.test(u)) u='https://'+u;
    const item={id:uid(),text:v,price:isNaN(pr)?null:pr,url:u,done:false,created:Date.now()};
    p.tasks=p.tasks||[]; p.tasks.push(item);
    if(st.wishFile){ await setWishPhoto(item.id,st.wishFile); st.wishFile=null }
    ti.value=''; pi.value=''; if(li) li.value='';
    saveProject(p,true); renderProject(); renderSide();
  };
  wa.addEventListener('click',add);
  $('#wText').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  $('#wPrice').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  if($('#wLink')) $('#wLink').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  $('#wShot').addEventListener('click',()=>{
    const inp=$('#wishPick');
    inp.onchange=ev=>{
      const f=ev.target.files[0]; ev.target.value='';
      if(!f) return;
      st.wishFile=f;
      const b=$('#wShot'); b.classList.add('has'); b.innerHTML=svg('boxOk',15,1.7)+' photo ready';
    };
    inp.click();
  });
  $('#view').querySelectorAll('[data-cur]').forEach(b=>b.addEventListener('click',()=>{LS.set('pm:cur',b.dataset.cur);renderProject()}));
  $('#view').querySelectorAll('[data-wf]').forEach(b=>b.addEventListener('click',()=>{st.wantFilter=b.dataset.wf;renderProject()}));
  $('#view').querySelectorAll('[data-ws]').forEach(b=>b.addEventListener('click',()=>{st.wishSort=b.dataset.ws;renderProject()}));
  const grid=$('#wishGrid'); if(!grid) return;
  grid.addEventListener('dragover',e=>{
    const c=e.target.closest('.wcard'); if(!c) return;
    e.preventDefault(); c.classList.add('drop');
  });
  grid.addEventListener('dragleave',e=>{
    const c=e.target.closest('.wcard'); if(c) c.classList.remove('drop');
  });
  grid.addEventListener('drop',async e=>{
    const c=e.target.closest('.wcard'); if(!c) return;
    e.preventDefault(); e.stopPropagation(); c.classList.remove('drop');
    const f=Array.from(e.dataTransfer.files||[]).find(x=>x.type.indexOf('image/')===0);
    if(!f) return;
    await setWishPhoto(c.dataset.id,f);
    renderProject(); toast('Photo attached');
  });
  grid.addEventListener('click',async e=>{
    if(e.target.closest('a')) return;
    const tg=e.target.closest('[data-wtog]'), ed=e.target.closest('[data-wed]'),
          op=e.target.closest('[data-wopen]'), dl=e.target.closest('[data-wdel]');
    if(isTouch()&&!tg&&!ed&&!op&&!dl){
      const card=e.target.closest('.wcard');
      if(card){
        const was=card.classList.contains('show-acts');
        grid.querySelectorAll('.wcard.show-acts').forEach(c=>c.classList.remove('show-acts'));
        if(!was) card.classList.add('show-acts');
      }
      return;
    }
    const key=tg?tg.dataset.wtog:ed?ed.dataset.wed:op?op.dataset.wopen:dl?dl.dataset.wdel:null;
    if(!key) return;
    const item=(p.tasks||[]).find(x=>x.id===key); if(!item) return;
    if(op){ window.open(item.url,'_blank','noopener'); return }
    if(tg){ item.done=!item.done; item.doneAt=item.done?Date.now():null; saveProject(p,true); renderProject(); renderSide(); return }
    if(ed){ itemEdit(p,item,true); return }
    if(dl){
      const ph=(await photosOf(WANT)).filter(x=>x.item===key);
      for(const o of ph) await delPhotoDB(o.id);

function bindTodo(p){

  ta.addEventListener('click',add);
  $('#tdText').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  $('#view').querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{
    st.todoCat=b.dataset.cat;

  }));
  $('#view').querySelectorAll('[data-tf]').forEach(b=>b.addEventListener('click',()=>{st.todoFilter=b.dataset.tf;renderProject()}));
  const dice=$('#tdDice');
  if(dice) dice.addEventListener('click',()=>{
    const pool=(p.tasks||[]).filter(i=>!i.done&&(st.todoFilter==='open'||st.todoFilter==='done'||(i.cat||'other')===st.todoFilter));
    if(!pool.length) return;
    const pick=pool[Math.floor(Math.random()*pool.length)];
    st.todoOpen=pick.id; renderProject();
    toast('Tonight: '+pick.text);
    const el=document.querySelector('.tditem[data-id="'+pick.id+'"]');
    if(el) el.scrollIntoView({block:'center'});
  });

  const box=$('#tdList'); if(!box) return;
  box.querySelectorAll('[data-tdurl]').forEach(inp=>inp.addEventListener('input',()=>{
    const it=(p.tasks||[]).find(x=>x.id===inp.dataset.tdurl); if(!it) return;
    let u=inp.value.trim();
    if(u&&!/^https?:\/\//i.test(u)) u='https://'+u;
    it.url=u; saveProject(p,true);
  }));
  box.querySelectorAll('[data-tdnote]').forEach(tx=>tx.addEventListener('input',()=>{
    const it=(p.tasks||[]).find(x=>x.id===tx.dataset.tdnote); if(!it) return;
    it.note=tx.value; saveProject(p,true);
  }));
  box.addEventListener('click',async e=>{
    if(e.target.closest('a')||e.target.closest('input')||e.target.closest('textarea')) return;
    const tg=e.target.closest('[data-tdtog]'), mk=e.target.closest('[data-tdmk]'),
          dl=e.target.closest('[data-tddel]'), op=e.target.closest('[data-tdopen]'),
          ex=e.target.closest('[data-tdexp]')||e.target.closest('[data-tdexp2]');
    const key=tg?tg.dataset.tdtog:mk?mk.dataset.tdmk:dl?dl.dataset.tddel:op?op.dataset.tdopen
      :ex?(ex.dataset.tdexp||ex.dataset.tdexp2):null;
    if(!key) return;
    const item=(p.tasks||[]).find(x=>x.id===key); if(!item) return;
    if(op){
      if(!item.url) return toast('Add a link first');
      window.open(item.url,'_blank','noopener'); return;
    }
    if(ex){ st.todoOpen=st.todoOpen===key?null:key; renderProject(); return }
    if(tg){ item.done=!item.done; item.doneAt=item.done?Date.now():null; saveProject(p,true); renderProject(); renderSide(); return }
    if(dl){ p.tasks=p.tasks.filter(x=>x.id!==key); saveProject(p,true); renderProject(); renderSide(); return }
    if(mk){
      const name=item.text.length>64?item.text.slice(0,64).trim()+'…':item.text;
      const np={id:uid(),name,status:'idle',important:false,startDate:'',created:Date.now(),
        updated:Date.now(),tasks:[],notes:[item.url,item.note].filter(Boolean).join('\n\n')};
      await putProject(np);
      p.tasks=p.tasks.filter(x=>x.id!==key); await putProject(p);
      st.projects.push(np); sortProjects();
      openProject(np.id); toast('Project created');
    }
  });
}

function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,'') }catch(e){ return '' } }
function favOf(u){ const h=hostOf(u); return h?'https://icons.duckduckgo.com/ip3/'+h+'.ico':'' }

function embedOf(u){
  u=String(u||''); let m;
  if((m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/)))
    return {src:'https://www.youtube.com/embed/'+m[1]+'?autoplay=1&rel=0',wide:!/shorts/.test(u)};
  if((m=u.match(/vimeo\.com\/(\d+)/)))
    return {src:'https://player.vimeo.com/video/'+m[1]+'?autoplay=1',wide:true};
  if((m=u.match(/instagram\.com\/(p|reel|reels|tv)\/([\w-]+)/)))
    return {src:'https://www.instagram.com/'+(m[1]==='reels'?'reel':m[1])+'/'+m[2]+'/embed',wide:false};
  if((m=u.match(/tiktok\.com\/.*\/video\/(\d+)/)))
    return {src:'https://www.tiktok.com/embed/v2/'+m[1],wide:false};
  return null;
}

function autoThumb(u){
  const yt=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/);
  if(yt) return 'https://img.youtube.com/vi/'+yt[1]+'/hqdefault.jpg';
  return '';
}
async function fetchPreview(u){
  const direct=autoThumb(u);
  if(direct) return direct;
  try{
    const r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(u));
    const j=await r.json();
    return (j&&j.data&&j.data.image&&j.data.image.url)||'';
  }catch(e){ return '' }
}

function persistRefOrder(box,p){
  const domIds=Array.from(box.querySelectorAll('[data-ref]')).map(el=>el.dataset.ref);
  const wanted=domIds.slice().reverse();           // на экране новые сверху
  const links=linksOf(p);
  const byId={}; links.forEach(l=>byId[l.id]=l);
  const ordered=wanted.map(id=>byId[id]).filter(Boolean);
  let k=0;
  p.tasks=(p.tasks||[]).map(t=>t.kind==='link'?ordered[k++]:t);
  saveProject(p,true);
  toast('Order saved');
}

function bindRefDrag(box,p){
  let dragId=null;
  box.addEventListener('dragstart',e=>{
    const el=e.target.closest('[data-ref]'); if(!el) return;
    dragId=el.dataset.ref; el.classList.add('drag');
    e.dataTransfer.effectAllowed='move';
    try{ e.dataTransfer.setData('text/plain',dragId) }catch(_){}
  });
  box.addEventListener('dragend',e=>{
    const el=box.querySelector('.drag'); if(el) el.classList.remove('drag');
    dragId=null;
  });
  box.addEventListener('dragover',e=>{
    if(!dragId) return;
    e.preventDefault();
    const over=e.target.closest('[data-ref]');
    const el=box.querySelector('[data-ref="'+dragId+'"]');
    if(!over||!el||over===el) return;
    const r=over.getBoundingClientRect();
    const after=refListOn()?(e.clientY-r.top)>r.height/2:(e.clientX-r.left)>r.width/2;
    box.insertBefore(el,after?over.nextSibling:over);
  });
  box.addEventListener('drop',e=>{
    e.preventDefault(); if(!dragId) return;
    dragId=null;
    persistRefOrder(box,p);
  });

  // то же пальцем: долгое нажатие
  let held=null,timer=null,sy=0,moved=false;
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch') return;
    const el=e.target.closest('[data-ref]'); if(!el) return;
    if(e.target.closest('button')) return;
    sy=e.clientY; moved=false;
    timer=setTimeout(()=>{ held=el; el.classList.add('drag'); if(navigator.vibrate) navigator.vibrate(12) },350);
  });
  box.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch') return;
    if(!held){ if(timer&&Math.abs(e.clientY-sy)>9){ clearTimeout(timer); timer=null } return }
    moved=true; e.preventDefault();
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const over=under&&under.closest?under.closest('[data-ref]'):null;
    if(over&&over!==held&&over.parentNode===box){
      const r=over.getBoundingClientRect();
      const after=refListOn()?(e.clientY-r.top)>r.height/2:(e.clientX-r.left)>r.width/2;
      box.insertBefore(held,after?over.nextSibling:over);
    }
  });
  const end=()=>{
    clearTimeout(timer); timer=null;
    if(!held) return;
    held.classList.remove('drag'); held=null;
    if(moved) persistRefOrder(box,p);
  };
  box.addEventListener('pointerup',end);
  box.addEventListener('pointercancel',end);
}

const YEAR=60*60*24*365;

async function buildSnapshot(p){
  let rows=[];
  try{ rows=(await sb.from('photos').select('*').eq('project_id',p.id)).data||[] }catch(e){}
  const paths=rows.map(r=>r.path);
  let signed={};
  if(paths.length){
    try{
      const {data}=await sb.storage.from('photos').createSignedUrls(paths,YEAR);
      (data||[]).forEach(d=>{ if(d.path&&d.signedUrl) signed[d.path]=d.signedUrl });
    }catch(e){}
  }
  return {
    v:1, at:Date.now(),
    name:p.name||'Untitled', status:p.status, important:!!p.important,
    startDate:p.startDate||'', notes:p.notes||'', color:p.color||null,
    tasks:(p.tasks||[]).map(t=>({id:t.id,kind:t.kind||'task',text:t.text||'',done:!!t.done,
      url:t.url||'',note:t.note||'',preview:t.preview||'',cat:t.cat||'',
      subs:(t.subs||[]).map(x=>({text:x.text,done:!!x.done})),layout:t.layout||null})),
    photos:rows.map(r=>({id:r.id,item:r.item_id||null,url:signed[r.path]||'',
      x:r.x,y:r.y,w:r.w,r:r.r,z:r.z}))
  };
}

function shareUrl(token){

async function tryShared(){
  const m=(location.hash||'').match(/^#\/?s\/(.+)$/);
  if(!m) return false;
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  try{
    const {data,error}=await sb.rpc('shared_project',{token:m[1]});
    if(error||!data) throw error||new Error('not found');
    renderShared(typeof data==='string'?JSON.parse(data):data);
    bindShared();
    hideBoot();
  }catch(e){
    hideBoot();
    document.body.innerHTML=`<div class="gate"><div class="gate-box">
      <div class="gate-mark"></div>
      <h1>Link not available</h1>
      <p>This project is not shared any more, or the link is wrong.</p>
    </div></div>`;
  }
  return true;
}

function bindLinks(p){
  const la=$('#lAdd'); if(!la) return;
  const add=async()=>{
    const ui=$('#lUrl'), ni=$('#lName');
    let u=ui.value.trim(); if(!u) return;
    if(!/^https?:\/\//i.test(u)) u='https://'+u;
    const item={id:uid(),kind:'link',text:ni.value.trim(),url:u,preview:'',done:false,created:Date.now()};
    p.tasks=p.tasks||[]; p.tasks.push(item);
    ui.value=''; ni.value='';
    const moved=touchProject(p);
    saveProject(p,true);
    if(moved) sortProjects();
    renderProject(); renderSide();
    const img=await fetchPreview(u);
    if(img){ item.preview=img; saveProject(p,true); renderProject() }
  };
  la.addEventListener('click',add);
  $('#lUrl').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  $('#lName').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  const rt=$('#refToggle');
  if(rt) rt.addEventListener('click',()=>{
    const next=refHidden(p.id);
    st.refOpen[p.id]=next;
    LS.set('pm:refs:'+p.id,next?'1':'0');
    const sec=rt.closest('.refs-pane');
    if(sec) sec.classList.toggle('collapsed',!next);
  });
  const rv=$('#refView');
  if(rv) rv.addEventListener('click',()=>{
    st.refList=!st.refList; LS.set('pm:reflist',st.refList?'1':'0'); renderProject();
  });
  $('#lShot').addEventListener('click',()=>{
    const inp=$('#wishPick');
    inp.onchange=async ev=>{
      const f=ev.target.files[0]; ev.target.value='';
      if(!f) return;
      const item={id:uid(),kind:'link',text:$('#lName').value.trim(),url:'',preview:'',done:false,created:Date.now()};
      p.tasks=p.tasks||[]; p.tasks.push(item);
      $('#lName').value='';
      const moved=touchProject(p);
      saveProject(p,true);
      if(moved) sortProjects();
      if(await setItemPhoto(p.id,item.id,f)){ renderProject(); renderSide(); toast('Reference added') }
    };
    inp.click();
  });
  const box=$('#links'); if(!box) return;
  bindRefDrag(box,p);
  box.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ') return;
    const shot=e.target.closest('[data-shot]');
    if(shot&&!e.target.closest('button')){ e.preventDefault(); shot.click() }
  });
  box.addEventListener('click',async e=>{
    const opener=e.target.closest('a[data-ref]');
    if(opener&&!e.target.closest('[data-led]')&&!e.target.closest('[data-ldel]')){
      if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1) return;   // новая вкладка — как обычно
      if(isPhone()) return;                                        // на телефоне сразу наружу
      e.preventDefault();
      const item=(p.tasks||[]).find(x=>x.id===opener.dataset.ref);
      if(item) refPreview(p,item);
      return;
    }
    const shot=e.target.closest('[data-shot]');
    if(shot&&!e.target.closest('[data-led]')&&!e.target.closest('[data-ldel]')){
      const ph=st.linkShots[shot.dataset.id];
      if(ph) lightbox(ph,ph.url);
      return;
    }
    const ed=e.target.closest('[data-led]'), dl=e.target.closest('[data-ldel]');
    if(!ed&&!dl) return;
    e.preventDefault(); e.stopPropagation();
    const key=ed?ed.dataset.led:dl.dataset.ldel;
    const item=(p.tasks||[]).find(x=>x.id===key); if(!item) return;
    if(ed) return linkEdit(p,item);
    const ph=(await photosOf(p.id)).filter(x=>x.item===key);
    for(const o of ph) await delPhotoDB(o.id);
    p.tasks=p.tasks.filter(x=>x.id!==key);
    saveProject(p,true); renderProject();
  });
}

function bindIdeas(p){
  const box=$('#ideas'); if(!box) return;
  box.addEventListener('click',async e=>{
    if(e.target.closest('a')) return;
    const mk=e.target.closest('[data-mk]'), mv=e.target.closest('[data-mv]'),
          ed=e.target.closest('[data-ied]'), dl=e.target.closest('[data-idel]');
    const id=(mk||mv||ed||dl||{}).dataset;
    if(!id) return;
    const key=mk?id.mk:mv?id.mv:ed?id.ied:id.idel;
    const idea=(p.tasks||[]).find(x=>x.id===key); if(!idea) return;

    if(mk){
      const name=idea.text.length>64?idea.text.slice(0,64).trim()+'…':idea.text;
      const np={id:uid(),name,status:'idle',important:false,startDate:'',created:Date.now(),
        updated:Date.now(),tasks:[],notes:idea.text.length>64?idea.text:''};
      await putProject(np);
      p.tasks=p.tasks.filter(x=>x.id!==key); await putProject(p);
      st.projects.push(np); sortProjects();
      openProject(np.id); toast('Project created');
      return;
    }
    if(mv){
      pickProject(async tid=>{
        const target=st.projects.find(x=>x.id===tid); if(!target) return;
        target.tasks=target.tasks||[];
        target.tasks.push({id:uid(),text:idea.text,done:false});
        target.updated=Date.now();
        p.tasks=p.tasks.filter(x=>x.id!==key);
        await putProject(target); await putProject(p);
        sortProjects(); renderProject(); renderSide();
        toast('Moved to '+target.name);
      });
      return;
    }
    if(dl){
      p.tasks=p.tasks.filter(x=>x.id!==key);
      saveProject(p,true); renderProject(); renderSide();
      return;
    }
    if(ed){
      const card=box.querySelector(`.idea[data-id="${key}"]`); if(!card) return;
      const holder=card.querySelector('.idea-text'); if(!holder||card.querySelector('.idea-edit')) return;
      const ta=document.createElement('textarea');
      ta.className='idea-edit'; ta.value=idea.text;
      holder.replaceWith(ta); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
      const finish=()=>{
        const v=ta.value.trim();
        if(v) idea.text=v;
        saveProject(p,true); renderProject(); renderSide();
      };
      ta.addEventListener('blur',finish);
      ta.addEventListener('keydown',ev=>{
        if(ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();ta.blur()}
        if(ev.key==='Escape'){ta.value=idea.text;ta.blur()}
      });
    }
  });
}

function renderTasks(t){
  if(!t.length) return '<li class="muted" style="border:none;padding-left:6px">Break the work into steps — much easier to start.</li>';
  const fo=t.find(x=>!x.done);
  return t.map(x=>{
    const subs=x.subs||[], sd=subs.filter(y=>y.done).length;
    const exp=st.taskOpen===x.id;
    return `
    <li class="${x.done?'done':''} ${fo&&x.id===fo.id?'first-open':''}" draggable="true" data-task="${x.id}">
      <button class="check" data-toggle="${x.id}" aria-label="Toggle">${svg(x.done?'boxOk':'box',17,1.8)}</button>
      <span>${linkify(x.text)}</span>
      <button class="sub-toggle ${subs.length?(sd===subs.length?'full':'has'):''} ${exp?'open':''}"
        data-taskexp="${x.id}" title="${subs.length?'Steps':'Break into steps'}">
        ${svg('chev',11,2.2)}${subs.length?`${sd}/${subs.length}`:'steps'}
      </button>
      <button class="star ${x.star?'on':''}" data-star="${x.id}" title="${x.star?'Remove from focus':'Add to focus'}">${svg('star',14,1.8)}</button>
      <button class="task-del" data-deltask="${x.id}" title="Delete">${svg('x',13,2)}</button>
      ${exp?`<ul class="subs">
        ${subs.map(sb=>`<li class="${sb.done?'done':''}">
          <button class="check" data-subtog="${x.id}|${sb.id}" aria-label="Toggle">${svg(sb.done?'boxOk':'box',14,1.8)}</button>
          <span>${linkify(sb.text)}</span>
          <button class="sub-del" data-subdel="${x.id}|${sb.id}" title="Delete">${svg('x',11,2.2)}</button>
        </li>`).join('')}
        <li class="sub-add">
          <input data-subadd="${x.id}" placeholder="Add a step" autocomplete="off">
          <button data-subgo="${x.id}">${svg('plus',13,2.4)}</button>
        </li>
      </ul>`:''}
    </li>`}).join('');
}

function persistTaskOrder(box,p){
  const ids=Array.from(box.querySelectorAll('[data-task]')).map(el=>el.dataset.task);
  const byId={}; tasksOf(p).forEach(t=>byId[t.id]=t);
  const ordered=ids.map(id=>byId[id]).filter(Boolean);
  let k=0;
  p.tasks=(p.tasks||[]).map(t=>(t.kind!=='link'&&t.kind!=='sticky')?ordered[k++]:t);
  saveProject(p,true);
  $('#taskList').innerHTML=renderTasks(tasksOf(p));
  bindTaskDrag($('#taskList'),p);
  updateBarAndNext(p); renderSide();
}

function bindTaskDrag(box,p){
  let dragId=null;
  box.addEventListener('dragstart',e=>{
    const li=e.target.closest('[data-task]'); if(!li) return;
    if(e.target.closest('input')) { e.preventDefault(); return }
    dragId=li.dataset.task; li.classList.add('drag');
    e.dataTransfer.effectAllowed='move';
    try{ e.dataTransfer.setData('text/plain',dragId) }catch(_){}
  });
  box.addEventListener('dragend',()=>{
    const el=box.querySelector('.drag'); if(el) el.classList.remove('drag');
    dragId=null;
  });
  box.addEventListener('dragover',e=>{
    if(!dragId) return;
    e.preventDefault();
    const over=e.target.closest('[data-task]');
    const el=box.querySelector('[data-task="'+dragId+'"]');
    if(!over||!el||over===el) return;
    const r=over.getBoundingClientRect();
    box.insertBefore(el,(e.clientY-r.top)>r.height/2?over.nextSibling:over);
  });
  box.addEventListener('drop',e=>{
    e.preventDefault(); if(!dragId) return;
    dragId=null; persistTaskOrder(box,p);
  });

  let held=null,timer=null,sy=0,moved=false;
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch') return;
    const li=e.target.closest('[data-task]'); if(!li) return;
    if(e.target.closest('button')||e.target.closest('input')) return;
    sy=e.clientY; moved=false;
    timer=setTimeout(()=>{ held=li; li.classList.add('drag'); if(navigator.vibrate) navigator.vibrate(12) },350);
  });
  box.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch') return;
    if(!held){ if(timer&&Math.abs(e.clientY-sy)>9){ clearTimeout(timer); timer=null } return }
    moved=true; e.preventDefault();
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const over=under&&under.closest?under.closest('[data-task]'):null;
    if(over&&over!==held&&over.parentNode===box){
      const r=over.getBoundingClientRect();
      box.insertBefore(held,(e.clientY-r.top)>r.height/2?over.nextSibling:over);
    }
  });
  const end=()=>{
    clearTimeout(timer); timer=null;
    if(!held) return;
    held.classList.remove('drag'); held=null;
    if(moved) persistTaskOrder(box,p);
  };
  box.addEventListener('pointerup',end);
  box.addEventListener('pointercancel',end);
}

function updateBarAndNext(p){
  const t=tasksOf(p), d=t.filter(x=>x.done).length;
  const bar=document.querySelector('.bar');
  if(bar&&t.length){bar.querySelector('i').style.width=(d/t.length)*100+'%';bar.querySelector('b').textContent=d+'/'+t.length}
}
function bindProject(p){
  if(SPECIAL(p.id)) $('#pTitle').readOnly=true;
  $('#pTitle').addEventListener('input',e=>{
    p.name=e.target.value;
    $('#crumb').textContent=p.name||'Untitled';
    document.title=p.name||'Untitled';
    const r=document.querySelector(`[data-open="${p.id}"] .row-text`); if(r) r.textContent=p.name;
    saveProject(p);
  });
  const nt=$('#notes');
  if(nt) nt.addEventListener('input',e=>{
    const wasEmpty=!(p.notes||'').trim();
    p.notes=e.target.value;
    if(wasEmpty&&p.notes.trim()&&touchProject(p)){ sortProjects(); renderSide() }
    saveProject(p);
  });
  const add=()=>{
    const i=$('#taskInput'); if(!i) return;
    const v=i.value.trim(); if(!v) return;
    p.tasks=p.tasks||[]; p.tasks.push({id:uid(),text:v,done:false,created:Date.now()});
    const moved=touchProject(p);
    i.value=''; saveProject(p,true);
    if(moved){ sortProjects(); toast('Moved to In progress') }
    renderProject(); renderSide();
  };
  const ta=$('#taskAdd'), ti=$('#taskInput');
  if(ta) ta.addEventListener('click',add);
  if(ti) ti.addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  bindQuickBar(p);
  bindIdeas(p);
  bindWish(p);
  bindTodo(p);
  bindLinks(p);
  const ex=$('#expand'); if(ex) ex.addEventListener('click',toggleBoard);
  const ap=$('#addPhoto'); if(ap) ap.addEventListener('click',()=>$('#filePick').click());
  const sn=$('#addNote'); if(sn) sn.addEventListener('click',addSticky);
  const pk=$('#pack'); if(pk) pk.addEventListener('click',()=>packBoard(true));
  const tb=$('#trashBtn'); if(tb) tb.addEventListener('click',()=>openTrash(p));
  const bt=$('#boardToggle');
  if(bt) bt.addEventListener('click',()=>{
    st.boardOpen[p.id]=!boardOpen(p.id);
    const sec=bt.closest('.board-pane');
    if(sec) sec.classList.toggle('collapsed',!st.boardOpen[p.id]);
  });
  const td=$('#tidy'); if(td) td.addEventListener('click',tidyBoard);
  const tl=$('#taskList');
  const redrawTasks=()=>{
    saveProject(p,true);
    $('#taskList').innerHTML=renderTasks(tasksOf(p));
    bindTaskDrag($('#taskList'),p);
    renderSide(); updateBarAndNext(p);
  };
  const addSub=(tid,val)=>{
    const v=val.trim(); if(!v) return;
    const x=p.tasks.find(y=>y.id===tid); if(!x) return;
    x.subs=x.subs||[];
    x.subs.push({id:uid(),text:v,done:false});
    if(x.done){ x.done=false; x.doneAt=null }
    if(touchProject(p)){ sortProjects(); toast('Moved to In progress') }
    st.taskOpen=tid;
    redrawTasks();
    const inp=document.querySelector('[data-subadd="'+tid+'"]');
    if(inp) inp.focus();
  };
  if(tl) bindTaskDrag(tl,p);
  if(tl) tl.addEventListener('keydown',e=>{
    const inp=e.target.closest('[data-subadd]');
    if(inp&&e.key==='Enter'){ e.preventDefault(); addSub(inp.dataset.subadd,inp.value) }
  });
  if(tl) tl.addEventListener('click',e=>{
    if(e.target.closest('a')) return;
    const tg=e.target.closest('[data-toggle]'),dl=e.target.closest('[data-deltask]'),
          sr=e.target.closest('[data-star]'),ex=e.target.closest('[data-taskexp]'),
          stg=e.target.closest('[data-subtog]'),sdl=e.target.closest('[data-subdel]'),
          sgo=e.target.closest('[data-subgo]');
    if(e.target.closest('[data-subadd]')) return;
    if(sgo){
      const inp=document.querySelector('[data-subadd="'+sgo.dataset.subgo+'"]');
      if(inp) addSub(sgo.dataset.subgo,inp.value);
      return;
    }
    if(ex){ st.taskOpen=st.taskOpen===ex.dataset.taskexp?null:ex.dataset.taskexp; }
    else if(stg){
      const [tid,sid]=stg.dataset.subtog.split('|');
      const x=p.tasks.find(y=>y.id===tid); if(!x) return;
      const sb=(x.subs||[]).find(y=>y.id===sid); if(!sb) return;
      sb.done=!sb.done;
      const all=x.subs.length&&x.subs.every(y=>y.done);
      if(all&&!x.done){ x.done=true; x.doneAt=Date.now() }
      if(!all&&x.done){ x.done=false; x.doneAt=null }
    }
    else if(sdl){
      const [tid,sid]=sdl.dataset.subdel.split('|');
      const x=p.tasks.find(y=>y.id===tid); if(!x) return;
      x.subs=(x.subs||[]).filter(y=>y.id!==sid);
    }
    else if(tg){
      const x=p.tasks.find(y=>y.id===tg.dataset.toggle);
      x.done=!x.done; x.doneAt=x.done?Date.now():null;
      if(x.subs&&x.subs.length) x.subs.forEach(sb=>{sb.done=x.done});
    }
    else if(dl){p.tasks=p.tasks.filter(y=>y.id!==dl.dataset.deltask)}
    else if(sr){const x=p.tasks.find(y=>y.id===sr.dataset.star);x.star=!x.star}
    else return;
    redrawTasks();
  });
}

/* ───────── board ───────── */
function clearUrls(){st.urls.forEach(u=>URL.revokeObjectURL(u));st.urls=[]}
let layoutT=null;
function saveLayout(ph){
  clearTimeout(layoutT);
  layoutT=setTimeout(()=>{putPhoto(ph).catch(e=>console.error(e))},300);
}

async function loadPhotos(pid){
  clearUrls();
  let list=[];
  try{list=await photosOf(pid)}catch(e){console.error(e)}
  list=boardPhotos(list);
  list.sort((a,b)=>(a.z||0)-(b.z||0));
  st.photos=list;
  st.maxZ=list.reduce((m,p)=>Math.max(m,p.z||0),1);
  paintBoard();
}

const CANVAS_W=2600, CANVAS_H=1900;
const STICKY_COLORS=[
  {id:'violet',label:'Violet'},{id:'cyan',label:'Cyan'},{id:'magenta',label:'Pink'},
  {id:'mint',label:'Mint'},{id:'amber',label:'Amber'},{id:'plain',label:'Paper'}
];
const STICKY_SIZES=[{id:'s',label:'S'},{id:'m',label:'M'},{id:'l',label:'L'},{id:'xl',label:'XL'}];
const layoutOf=t=>{ try{ return typeof t.layout==='string'?JSON.parse(t.layout):(t.layout||{}) }catch(e){ return {} } };
const stickiesOf=p=>(p.tasks||[]).filter(t=>t.kind==='sticky');

function boardCanvas(){ return document.getElementById('canvas') }

function paintBoard(){
  const b=$('#board'); if(!b) return;
  b.innerHTML='<div id="canvas"></div>';
  const cv=boardCanvas();
  cv.style.width=CANVAS_W+'px'; cv.style.height=CANVAS_H+'px';
  const pr=cur();
  const notes=pr?stickiesOf(pr):[];
  if(!st.photos.length&&!notes.length){
    cv.insertAdjacentHTML('beforeend',`<div class="board-empty">${svg('img',26,1.3)}<b>Empty board</b><span>Drop photos here, paste a screenshot, or hit “+ photo”</span></div>`);
  }
  st.photos.forEach((ph,i)=>{
    if(ph.x==null){ const c=i%4; ph.x=40+c*250; ph.y=40+Math.floor(i/4)*190; ph.w=210; ph.r=(Math.random()*4-2); ph.z=++st.maxZ; putPhoto(ph).catch(()=>{}); }
    cv.appendChild(pinEl(ph));
  });
  notes.forEach(n=>cv.appendChild(stickyEl(pr,n)));
  bindPan(b,cv);
  const c=$('#phCount'); if(c) c.textContent=st.photos.length||'';
  requestAnimationFrame(()=>{ b.scrollLeft=0; b.scrollTop=0 });
}

const boardSel=new Set();

function paintSel(){
  document.querySelectorAll('.pin').forEach(el=>el.classList.toggle('sel',boardSel.has(el.dataset.id)));
  let bar=document.getElementById('selBar');
  if(!boardSel.size){ if(bar) bar.remove(); return }
  if(!bar){
    bar=document.createElement('div');
    bar.id='selBar'; bar.className='sel-bar';
    document.body.appendChild(bar);
    bar.addEventListener('click',async e=>{
      const b=e.target.closest('button'); if(!b) return;
      const act=b.dataset.sel;
      const p=cur();
      if(act==='clear'){ boardSel.clear(); paintSel(); return }
      if(act==='del'){
        if(!confirm('Delete '+boardSel.size+' photo'+(boardSel.size===1?'':'s')+'? This cannot be undone.')) return;
        for(const id of Array.from(boardSel)){
          await delPhotoDB(id);
          st.photos=st.photos.filter(x=>x.id!==id);
        }
        boardSel.clear();
        if(p) dropCover(p.id);
        paintBoard(); paintSel(); toast('Deleted');
      }
      if(act==='row'){
        const chosen=st.photos.filter(x=>boardSel.has(x.id));
        let x=40,y=40,rowH=0;
        chosen.forEach(ph=>{
          if(x+ph.w>1740){ x=40; y+=rowH+18; rowH=0 }
          const dx=x-ph.x, dy=y-ph.y;
          ph.x=x; ph.y=y; ph.z=++st.maxZ;
          if(dx||dy) moveAttached(ph,dx,dy);
          x+=ph.w+18; rowH=Math.max(rowH,ph.w);
          putPhoto(ph).catch(()=>{});
        });
        if(p) saveProject(p,true);
        paintBoard(); paintSel(); toast('Lined up');
      }
    });
  }
  bar.innerHTML=`<span>${boardSel.size} selected</span>
    <button data-sel="row">${svg('size',13,1.9)} line up</button>
    <button data-sel="del">${svg('trash',13,1.8)} delete</button>
    <button data-sel="clear">${svg('x',13,2.2)} clear</button>`;
}

function bindPan(b,cv){
  let sx=0,sy=0,sl=0,stp=0,on=false;
  cv.addEventListener('pointerdown',e=>{
    if(e.target!==cv) return;
    if(e.button!==0&&e.pointerType==='mouse') return;
    if(e.shiftKey){                       // Shift + протяжка = рамка выделения
      e.preventDefault();
      const rect=cv.getBoundingClientRect();
      const ox=e.clientX-rect.left, oy=e.clientY-rect.top;
      const box=document.createElement('div');
      box.className='marquee'; cv.appendChild(box);
      const draw=ev=>{
        const cx=ev.clientX-rect.left, cy=ev.clientY-rect.top;
        const l=Math.min(ox,cx), t=Math.min(oy,cy), w=Math.abs(cx-ox), h=Math.abs(cy-oy);
        box.style.left=l+'px'; box.style.top=t+'px'; box.style.width=w+'px'; box.style.height=h+'px';
        st.photos.forEach(ph=>{
          const el=document.querySelector('.pin[data-id="'+ph.id+'"]');
          const hh=(el&&el.offsetHeight)||ph.w;
          const hit=ph.x<l+w&&ph.x+ph.w>l&&ph.y<t+h&&ph.y+hh>t;
          if(hit) boardSel.add(ph.id); else boardSel.delete(ph.id);
        });
        paintSel();
      };
      const done=()=>{ box.remove(); window.removeEventListener('pointermove',draw); window.removeEventListener('pointerup',done) };
      window.addEventListener('pointermove',draw); window.addEventListener('pointerup',done);
      return;
    }
    if(boardSel.size){ boardSel.clear(); paintSel() }
    on=true; b.classList.add('panning');
    sx=e.clientX; sy=e.clientY; sl=b.scrollLeft; stp=b.scrollTop;
    const move=ev=>{ if(!on) return; b.scrollLeft=sl-(ev.clientX-sx); b.scrollTop=stp-(ev.clientY-sy) };
    const up=()=>{ on=false; b.classList.remove('panning');
      window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up) };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  });
}

function pinEl(ph){
  const url=photoSrc(ph); if(url.indexOf('blob:')===0) st.urls.push(url);
  const el=document.createElement('div');
  el.className='pin'; el.dataset.id=ph.id;
  el.style.left=ph.x+'px'; el.style.top=ph.y+'px'; el.style.width=ph.w+'px';
  el.style.zIndex=ph.z||1; el.style.transform=`rotate(${ph.r||0}deg)`;
  el.innerHTML=`<img src="${url}" alt="${esc(ph.name||'photo')}" draggable="false">
    <button class="pin-x" title="Delete">${svg('x',12,2.2)}</button>
    <div class="pin-size" title="Drag to resize">${svg('size',11,2)}</div>`;

  const front=()=>{
    ph.z=++st.maxZ; el.style.zIndex=ph.z; saveLayout(ph);
    raiseNotes(ph);
  };

  el.querySelector('.pin-x').addEventListener('pointerdown',e=>e.stopPropagation());
  el.querySelector('.pin-x').addEventListener('click',async e=>{
    e.stopPropagation();
    await delPhotoDB(ph.id);
    st.photos=st.photos.filter(x=>x.id!==ph.id);
    el.remove();
    const c=$('#phCount'); if(c) c.textContent=st.photos.length||'';
    if(!st.photos.length) paintBoard();
    toast('Photo deleted');
  });

  el.addEventListener('dblclick',()=>lightbox(ph,url));

  el.querySelector('.pin-size').addEventListener('pointerdown',e=>{
    e.stopPropagation(); e.preventDefault(); front();
    const sx=e.clientX, sw=ph.w;
    const move=ev=>{ ph.w=clamp(Math.round(sw+(ev.clientX-sx)),90,900); el.style.width=ph.w+'px'; };
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);saveLayout(ph)};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });

  el.addEventListener('pointerdown',e=>{
    if(e.button!==0&&e.pointerType==='mouse') return;
    if(e.shiftKey){
      e.preventDefault(); e.stopPropagation();
      if(boardSel.has(ph.id)) boardSel.delete(ph.id); else boardSel.add(ph.id);
      paintSel();
      return;
    }
    e.preventDefault(); front(); el.classList.add('grabbing');
    const rect=boardCanvas().getBoundingClientRect();
    const dx=e.clientX-rect.left-ph.x, dy=e.clientY-rect.top-ph.y;
    const groupIds=boardSel.has(ph.id)?Array.from(boardSel).filter(id=>id!==ph.id):[];
    const move=ev=>{
      const h=el.offsetHeight;
      const nx=clamp(Math.round(ev.clientX-rect.left-dx),0,CANVAS_W-ph.w);
      const ny=clamp(Math.round(ev.clientY-rect.top-dy),0,CANVAS_H-h);
      const sx=nx-ph.x, sy=ny-ph.y;
      ph.x=nx; ph.y=ny;
      el.style.left=ph.x+'px'; el.style.top=ph.y+'px';
      if(sx||sy){
        moveAttached(ph,sx,sy);
        groupIds.forEach(id=>{
          const o=st.photos.find(x=>x.id===id); if(!o) return;
          o.x+=sx; o.y+=sy;
          const oe=document.querySelector('.pin[data-id="'+id+'"]');
          if(oe){ oe.style.left=o.x+'px'; oe.style.top=o.y+'px' }
          moveAttached(o,sx,sy);
        });
      }
    };
    const up=()=>{
      el.classList.remove('grabbing');
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
      saveLayout(ph);
      groupIds.forEach(id=>{ const o=st.photos.find(x=>x.id===id); if(o) saveLayout(o) });
      const pr=cur(); if(pr&&attachedTo(ph.id).length) saveProject(pr,true);
    };
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });

  return el;
}

/* ───────── sticky notes ───────── */
function stickyEl(p,note){
  const L=layoutOf(note);
  const el=document.createElement('div');
  el.className='sticky c-'+(L.c||'violet')+' s-'+(L.s||'m');
  el.dataset.id=note.id;
  el._L=L;
  el.style.left=(L.x||60)+'px'; el.style.top=(L.y||60)+'px'; el.style.zIndex=L.z||1;
  if(L.fs) el.style.setProperty('--fs',L.fs+'px');
  if(L.w) el.style.width=L.w+'px';
  el.innerHTML=`<div class="sticky-text">${esc(note.text||'')}</div>
    <div class="sticky-acts">
      <button data-spin class="${L.pin?'on':''}" title="${L.pin?'Unpin from photo':'Pin to the photo underneath'}">${svg('pin',12,1.7)}</button>
      <button data-sset title="Style">${svg('gear',12,1.6)}</button>
      <button data-sdel title="Delete">${svg('x',12,2.2)}</button>
    </div>
    <div class="sticky-size" title="Drag to resize">${svg('size',11,2)}</div>`;
  const save=()=>{ note.layout=JSON.stringify(L); saveProject(p,true) };

  el.querySelector('[data-sdel]').addEventListener('pointerdown',e=>e.stopPropagation());
  el.querySelector('[data-sdel]').addEventListener('click',e=>{
    e.stopPropagation();
    p.tasks=p.tasks.filter(x=>x.id!==note.id);
    saveProject(p,true); el.remove();
  });
  el.querySelector('[data-sset]').addEventListener('pointerdown',e=>e.stopPropagation());
  el.querySelector('[data-sset]').addEventListener('click',e=>{ e.stopPropagation(); stickyEdit(p,note) });

  const pinBtn=el.querySelector('[data-spin]');
  pinBtn.addEventListener('pointerdown',e=>e.stopPropagation());
  pinBtn.addEventListener('click',e=>{
    e.stopPropagation();
    if(L.pin){
      delete L.pin; delete L.dx; delete L.dy;
      save(); pinBtn.classList.remove('on');
      pinBtn.title='Pin to the photo underneath';
      toast('Unpinned');
      return;
    }
    const host=photoUnder((L.x||0)+el.offsetWidth/2,(L.y||0)+el.offsetHeight/2)
             ||photoUnder((L.x||0)+16,(L.y||0)+16);
    if(!host){ toast('Drag the note over a photo first'); return }
    L.pin=host.id; L.dx=(L.x||0)-host.x; L.dy=(L.y||0)-host.y;
    save(); pinBtn.classList.add('on');
    pinBtn.title='Unpin from photo';
    toast('Pinned — it moves with that photo now');
  });

  el.addEventListener('dblclick',e=>{ e.stopPropagation(); stickyEdit(p,note) });

  el.querySelector('.sticky-size').addEventListener('pointerdown',e=>{
    e.stopPropagation(); e.preventDefault();
    const startX=e.clientX, startY=e.clientY;
    const baseFs=L.fs||{s:13,m:17,l:23,xl:32}[L.s||'m'];
    const baseW=L.w||el.offsetWidth;
    const move=ev=>{
      const dx=ev.clientX-startX, dy=ev.clientY-startY;
      L.fs=clamp(Math.round(baseFs+(dx+dy)/14),11,96);
      L.w=clamp(Math.round(baseW+dx),110,900);
      el.style.setProperty('--fs',L.fs+'px');
      el.style.width=L.w+'px';
    };
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);save()};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });

  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;
    if(e.button!==0&&e.pointerType==='mouse') return;
    e.preventDefault();
    L.z=++st.maxZ; el.style.zIndex=L.z;
    el.classList.add('grabbing');
    const rect=boardCanvas().getBoundingClientRect();
    const dx=e.clientX-rect.left-(L.x||0), dy=e.clientY-rect.top-(L.y||0);
    const move=ev=>{
      L.x=clamp(Math.round(ev.clientX-rect.left-dx),0,CANVAS_W-el.offsetWidth);
      L.y=clamp(Math.round(ev.clientY-rect.top-dy),0,CANVAS_H-el.offsetHeight);
      el.style.left=L.x+'px'; el.style.top=L.y+'px';
    };
    const up=()=>{
      el.classList.remove('grabbing');
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
      if(L.pin){
        const host=st.photos.find(x=>x.id===L.pin);
        if(host){ L.dx=L.x-host.x; L.dy=L.y-host.y }
      }
      save();
    };
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });
  return el;
}

function attachedTo(photoId){
  const p=cur(); if(!p) return [];
  return stickiesOf(p).filter(n=>{ const L=layoutOf(n); return L.pin===photoId });
}
function moveAttached(ph,dx,dy){
  const p=cur(); if(!p) return;
  attachedTo(ph.id).forEach(n=>{
    const el=document.querySelector('.sticky[data-id="'+n.id+'"]');
    // правим тот же объект, что держит элемент, иначе он потом вернётся на старое место
    const L=(el&&el._L)?el._L:layoutOf(n);
    L.x=(L.x||0)+dx; L.y=(L.y||0)+dy;
    n.layout=JSON.stringify(L);
    if(el){ el.style.left=L.x+'px'; el.style.top=L.y+'px' }
  });
}

function raiseNotes(ph){
  const p=cur(); if(!p) return;
  attachedTo(ph.id).forEach(n=>{
    const el=document.querySelector('.sticky[data-id="'+n.id+'"]');
    const L=(el&&el._L)?el._L:layoutOf(n);
    L.z=++st.maxZ;
    n.layout=JSON.stringify(L);
    if(el) el.style.zIndex=L.z;
  });
}
function photoUnder(x,y){
  return st.photos.slice().sort((a,b)=>(b.z||0)-(a.z||0)).find(ph=>{
    const el=document.querySelector('.pin[data-id="'+ph.id+'"]');
    const h=(el&&el.offsetHeight)||ph.w;
    return x>=ph.x&&x<=ph.x+ph.w&&y>=ph.y&&y<=ph.y+h;
  })||null;
}

/* ───────── arranging ───────── */
function packBoard(keepSize){
  if(!st.photos.length) return;
  const gap=18, left=40, top=40, maxW=Math.min(CANVAS_W-80,1700);
  let x=left, y=top, rowH=0;
  st.photos.forEach(ph=>{
    const w=keepSize?(ph.w||210):210;
    if(!keepSize) ph.w=210;
    const el=document.querySelector('.pin[data-id="'+ph.id+'"]');
    const h=el?el.offsetHeight*(w/(ph.w||w)):w;
    if(x+w>left+maxW){ x=left; y+=rowH+gap; rowH=0 }
    const sx=x-ph.x, sy=y-ph.y;
    ph.x=x; ph.y=y; ph.r=0; ph.z=++st.maxZ;
    if(sx||sy) moveAttached(ph,sx,sy);
    raiseNotes(ph);
    x+=w+gap; rowH=Math.max(rowH,h);
    putPhoto(ph).catch(()=>{});
  });
  const pr=cur(); if(pr) saveProject(pr,true);
  paintBoard();
  toast(keepSize?'Arranged, sizes kept':'Arranged in a grid');
}
const tidyBoard=()=>packBoard(false);

function compress(file,maxDim,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const s=Math.min(1,maxDim/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');x.fillStyle='#111';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
        c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q);
      };
      img.onerror=()=>rej(new Error('img'));
      img.src=fr.result;
    };
    fr.onerror=()=>rej(new Error('read'));
    fr.readAsDataURL(file);
  });
}

async function addPhotos(files){
  const p=cur(); if(!p) return;
  const list=Array.from(files).filter(f=>f.type.startsWith('image/'));
  if(!list.length) return;
  const b=$('#board'); const W=b?b.clientWidth:900; const H=b?b.clientHeight:600;
  const wasEmpty=!st.photos.length;
  for(const f of list){
    try{
      const blob=await compress(f,1400,.72);
      const n=st.photos.length;
      const ph={id:uid(),pid:p.id,name:f.name||'photo',blob,created:Date.now(),
        w:220,x:clamp(30+(n%5)*46+Math.random()*20,10,W-240),
        y:clamp(28+(n%4)*54+Math.random()*20,10,H-160),
        r:Math.random()*5-2.5,z:++st.maxZ};
      await putPhoto(ph);
      st.photos.push(ph);
      dropCover(p.id);
      if(touchProject(p)){ saveProject(p,true); sortProjects(); renderSide() }
      if(wasEmpty&&st.photos.length===1&&b) b.innerHTML='';
      if(b) b.appendChild(pinEl(ph));
    }catch(e){console.error(e);toast('Could not add '+(f.name||'file'))}
  }
  const c=$('#phCount'); if(c) c.textContent=st.photos.length||'';
}

function setStatus(p,s){
  p.status=s;
  if(s==='done') p.doneAt=Date.now(); else p.doneAt=null;
  if(s==='active'&&!p.startDate) p.startDate=today();
  saveProject(p,true);
  sortProjects();
  renderSide();
  if(st.openId===p.id) renderProject(); else renderAll();
}

/* ───────── backups ───────── */
const b2d=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)});
function d2b(u){
  const [h,d]=u.split(','),mime=h.match(/:(.*?);/)[1],bin=atob(d),a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:mime});
}
async function exportAll(){
  toast('Preparing file…');
  const {data:prows}=await sb.from('photos').select('*');
  const photos=await signPhotos(prows||[]);
  for(const ph of photos){
    try{ ph.blob=await (await fetch(ph.url)).blob() }catch(e){ ph.blob=null }
  }
  const out={version:2,exported:new Date().toISOString(),projects:st.projects,photos:[]};
  for(const ph of photos){
    if(!ph.blob) continue;
    out.photos.push({id:ph.id,pid:ph.pid,item:ph.item,name:ph.name,created:ph.created,
      x:ph.x,y:ph.y,w:ph.w,r:ph.r,z:ph.z,data:await b2d(ph.blob)});
  }
  const url=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
  const a=document.createElement('a'); a.href=url; a.download='proekty-'+today()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  LS.set('pm:lastBackup',String(Date.now()));
  toast('Backup saved');
}
async function importAll(file){
  try{
    const data=JSON.parse(await file.text());
    if(!Array.isArray(data.projects)) throw new Error('format');
    if(!confirm('Load this backup? Your current data will be replaced.')) return;
    const {data:oldRows}=await sb.from('photos').select('id');
    for(const ph of (oldRows||[])) await delPhotoDB(ph.id);
    for(const p of st.projects) await delProject(p.id);
    for(const p of data.projects) await putProject(p);
    for(const ph of (data.photos||[])) await putPhoto({id:ph.id,pid:ph.pid,item:ph.item||null,
      name:ph.name,created:ph.created,x:ph.x,y:ph.y,w:ph.w,r:ph.r,z:ph.z,blob:d2b(ph.data)});
    st.projects=data.projects;
    if(!st.projects.some(p=>p.id===INBOX)){const ib=makeInbox();await putProject(ib);st.projects.push(ib)}
    if(!st.projects.some(p=>p.id===WANT)){const wl=makeWant();await putProject(wl);st.projects.push(wl)}
    if(!st.projects.some(p=>p.id===TODO)){const td=makeTodo();await putProject(td);st.projects.push(td)}
    sortProjects();
    st.openId=null; route(); toast('Backup loaded');
  }catch(e){console.error(e);toast('That file did not work')}
}

function quickTargets(){
  const t=[{id:INBOX,key:'inbox',label:'Ideas',hint:'!'},
           {id:WANT,key:'wishlist',label:'Wishlist',hint:'$'},
           {id:TODO,key:'todolist',label:'To do',hint:'?'}];
  const last=st.openId&&!SPECIAL(st.openId)?st.projects.find(x=>x.id===st.openId)
            :st.projects.find(x=>!SPECIAL(x.id)&&!x.archived&&x.status==='active');
  if(last) t.push({id:last.id,key:'proj',label:last.name,hint:'>'});
  return t;
}

function parseQuick(raw){
  let text=raw.trim(), forced=null;
  const first=text[0];
  if(first==='!'){forced=INBOX;text=text.slice(1).trim()}
  else if(first==='$'){forced=WANT;text=text.slice(1).trim()}
  else if(first==='?'){forced=TODO;text=text.slice(1).trim()}
  else if(first==='>'){forced='proj';text=text.slice(1).trim()}
  let price=null, url='';
  const m=text.match(/\s(\d+(?:[.,]\d+)?)$/);
  if(m){ price=parseFloat(m[1].replace(',','.')); text=text.slice(0,m.index).trim() }
  const u=text.match(/(https?:\/\/\S+|www\.\S+)/i);
  if(u){ url=u[0]; if(!/^https?:/i.test(url)) url='https://'+url; text=text.replace(u[0],'').trim() }
  return {text,price,url,forced};
}

  };
  input.addEventListener('input',()=>{
    const f=parseQuick(input.value).forced;
    if(f==='proj'){ const t=targets.find(x=>x.key==='proj'); if(t) sel=t.id }
    else if(f) sel=f;
    paint();
  });
  el.querySelector('#qaT').addEventListener('click',e=>{
    const b=e.target.closest('.qa-t'); if(!b) return;
    sel=b.dataset.id; paint(); input.focus();
  });

  const submit=async(keep)=>{
    const {text,price,url}=parseQuick(input.value);
    if(!text) return;
    const target=st.projects.find(x=>x.id===sel); if(!target) return;
    target.tasks=target.tasks||[];
    if(sel===WANT) target.tasks.push({id:uid(),text,price:price||null,url,done:false,created:Date.now()});
    else if(sel===TODO) target.tasks.push({id:uid(),text,cat:st.todoCat||'other',url,note:'',done:false,created:Date.now()});
    else if(sel===INBOX) target.tasks.push({id:uid(),text,done:false,created:Date.now()});
    else { target.tasks.push({id:uid(),text,done:false,created:Date.now()}); touchProject(target) }
    target.updated=Date.now();
    await putProject(target);
    toast('Added to '+target.name);
    input.value=''; paint();
    renderSide();
    if(st.openId===target.id) renderProject();
    else if(!st.openId&&!st.focus&&!st.hist) renderAll();
    if(!keep) close();
  };
  const close=()=>{ el.remove(); document.removeEventListener('keydown',keys,true) };
  const keys=e=>{
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}
    else if(e.key==='Enter'){e.preventDefault();submit(e.shiftKey)}
    else if(e.key==='Tab'){
      e.preventDefault();
      const i=targets.findIndex(t=>t.id===sel);
      sel=targets[(i+(e.shiftKey?targets.length-1:1))%targets.length].id;
      paint();
    }
  };
  document.addEventListener('keydown',keys,true);
  el.addEventListener('click',e=>{ if(e.target===el) close() });
  paint();
  setTimeout(()=>input.focus(),20);
}

/* ───────── events ───────── */
let hashLock=false;
function currentHash(){
  if(st.openId) return '#p/'+st.openId;
  if(st.hist) return '#history';
  if(st.review) return '#review';
  if(st.focus) return '#focus';
  return '#all';
}
function syncHash(){
  const h=currentHash();
  if(location.hash===h) return;
  hashLock=true;
  location.hash=h;
  setTimeout(()=>{hashLock=false},0);
}
function applyHash(){
  const h=(location.hash||'').replace(/^#\/?/,'');
  if(h.indexOf('p/')===0){
    const id=h.slice(2);
    if(st.projects.some(x=>x.id===id)){ st.openId=id; st.focus=false; st.hist=false; st.review=false; return }
  }
  st.openId=null;
  st.focus=(h==='focus');
  st.hist=(h==='history');
  st.review=(h==='review');
}
window.addEventListener('hashchange',()=>{
  if(hashLock||!ME) return;
  applyHash(); route();
});
const isPhone=()=>!!(window.matchMedia&&window.matchMedia('(max-width:760px)').matches);
const isTouch=()=>!!(window.matchMedia&&window.matchMedia('(hover:none)').matches);
function syncSidebarButton(){
  if(window.innerWidth<900&&document.body.classList.contains('side-open')&&!st.sideForced)
    document.body.classList.remove('side-open');
}
function pageTitle(){
  if(st.openId){ const p=cur(); return p&&p.name?p.name:'Project' }
  if(st.hist) return 'History';
  if(st.review) return 'Review';
  if(st.focus) return 'Focus';
  if(st.query.trim()) return 'Search';
  return 'All projects';
}
function route(){
  syncHash(); document.title=pageTitle(); closeBoardFull(); clearUrls();
  if(st.openId) renderProject();
  else if(st.hist) renderHistory();
  else if(st.review) renderReview();
  else if(st.focus) renderFocus();
  else if(st.query.trim()) renderSearch();
  else renderAll();
  renderSide();
  const v=$('#view');
  if(v){ v.scrollTop=0; v.classList.remove('view-in'); void v.offsetWidth; v.classList.add('view-in') }
}
function resetViews(){ st.openId=null; st.focus=false; st.hist=false; st.review=false }
function openProject(id){st.openId=id;st.focus=false;st.hist=false;st.review=false;if(window.innerWidth<900)document.body.classList.remove('side-open');route()}

document.addEventListener('click',e=>{
  if(st.dragRow) return;
  const o=e.target.closest('[data-open]');
  if(o){
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1) return;   // новая вкладка — пусть браузер сам
    e.preventDefault();
    return openProject(o.dataset.open);
  }
  const s=e.target.closest('[data-set]');
  if(s){const p=st.projects.find(x=>x.id===s.dataset.set);if(p)setStatus(p,s.dataset.s);return}
  const pn=e.target.closest('[data-pin]');
  if(pn){
    const pr=st.projects.find(x=>x.id===pn.dataset.pin);
    if(pr){ pr.pinned=!pr.pinned; saveProject(pr,true); sortProjects(); renderSide(); }
    return;
  }
  const g=e.target.closest('[data-gear]'); if(g) return openSettings(g.dataset.gear);
  const f=e.target.closest('[data-filter]'); if(f){st.filter=f.dataset.filter;renderAll();return}
  if(e.target.closest('#emptyNew')) newProject();
});
$('#quickBtn').addEventListener('click',openQuick);
$('#fabAdd').addEventListener('click',openQuick);
$('#fabShot').addEventListener('click',()=>{
  photoSourcePick(async f=>{ if(f) await photoToIdeas(f) });
});
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||'');
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){
    if(typing&&!e.shiftKey) return;
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
    return;
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y')){e.preventDefault();redo();return}
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();openQuick();return}
  if(e.key==='Escape'){
    const l=document.querySelector('.lb, .sheet-wrap');
    if(l) l.remove();
    else closeBoardFull();
  }
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault();document.body.classList.add('side-open');st.sideForced=true;$('#q').focus();}
});

$('#q').addEventListener('input',e=>{
  st.query=e.target.value;
  if(st.query.trim()) resetViews();
  route();
});
$('#btnFocus').addEventListener('click',()=>{resetViews();st.focus=true;if(window.innerWidth<900)document.body.classList.remove('side-open');route()});
$('#histLink').addEventListener('click',openHistory);
$('#revLink').addEventListener('click',()=>{
  resetViews(); st.review=true; st.query=''; $('#q').value='';
  if(window.innerWidth<900){document.body.classList.remove('side-open');st.sideForced=false;syncSidebarButton()}
  route();
});
$('#archLink').addEventListener('click',()=>{resetViews();st.filter='archived';if(window.innerWidth<900){document.body.classList.remove('side-open');st.sideForced=false;syncSidebarButton()}route()});
$('#btnIdeas').addEventListener('click',()=>{openProject(INBOX)});
$('#btnWant').addEventListener('click',()=>{openProject(WANT)});
$('#btnTodo').addEventListener('click',()=>{openProject(TODO)});
function openHistory(){
  resetViews(); st.hist=true; st.query=''; const qq=$('#q'); if(qq) qq.value='';
  if(window.innerWidth<900){document.body.classList.remove('side-open');st.sideForced=false;syncSidebarButton()}

}
$('#sideFilter').addEventListener('click',()=>{
  const t=$('#sideTools'); const on=t.style.display==='none';

});
$('#tHideDone').addEventListener('click',()=>{

  renderSide(); if(!st.openId&&!st.focus) renderAll();
});
$('#tArchive').addEventListener('click',()=>{
  resetViews(); st.filter='archived';
  if(window.innerWidth<900){document.body.classList.remove('side-open');st.sideForced=false;syncSidebarButton()}
  route();
});
$('#tHints').addEventListener('click',()=>{
  st.hints=!st.hints;
  LS.set('pm:hints',st.hints?'1':'0');
  document.body.classList.toggle('no-hints',!st.hints);

});
$('#tTheme').addEventListener('click',()=>{
  st.light=!st.light;
  LS.set('pm:light',st.light?'1':'0');
  document.body.classList.toggle('light',st.light);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content',st.light?'#F2F2F6':'#020203');
  renderSide();
});
$('#tResort').addEventListener('click',()=>{
  st.manual=false; LS.set('pm:manual','0');
  st.projects.forEach(p=>{p.ord=null});
  sortProjects(); renderSide(); toast('Back to automatic order');
});
$('#btnAll').addEventListener('click',()=>{resetViews();if(st.filter==='archived')st.filter='all';if(window.innerWidth<900)document.body.classList.remove('side-open');route()});
$('#btnHide').addEventListener('click',()=>{document.body.classList.remove('side-open');st.sideForced=false;syncSidebarButton()});
$('#btnShow').addEventListener('click',()=>{document.body.classList.add('side-open');st.sideForced=true;syncSidebarButton()});
$('#scrim').addEventListener('click',()=>{document.body.classList.remove('side-open');st.sideForced=false;syncSidebarButton()});
$('#btnNew').addEventListener('click',newProject);
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='E'||e.key==='e')){e.preventDefault();exportAll()}
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='I'||e.key==='i')){e.preventDefault();$('#jsonPick').click()}
});
$('#jsonPick').addEventListener('change',e=>{if(e.target.files[0])importAll(e.target.files[0]);e.target.value=''});
$('#filePick').addEventListener('change',e=>{addPhotos(e.target.files);e.target.value=''});

window.addEventListener('paste',e=>{
  if(st.openId===TODO) return;
  if(st.openId===WANT){
    const it=Array.from((e.clipboardData&&e.clipboardData.items)||[]).find(i=>i.type.indexOf('image/')===0);
    if(!it) return;
    e.preventDefault();
    st.wishFile=it.getAsFile();
    const b=$('#wShot');
    if(b){ b.classList.add('has'); b.innerHTML=svg('boxOk',15,1.7)+' photo ready' }
    toast('Screenshot ready — now name it');
    return;
  }
  if(!st.openId) return;
  const items=Array.from((e.clipboardData&&e.clipboardData.items)||[]).filter(i=>i.type.indexOf('image/')===0);
  if(!items.length) return;
  e.preventDefault();
  addPhotos(items.map(i=>i.getAsFile()).filter(Boolean));
});

document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch') return;
  const r=document.createElement('span');
  r.className='ripple'; r.style.left=e.clientX+'px'; r.style.top=e.clientY+'px';
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),520);
});

let edgeX=null;
window.addEventListener('touchstart',e=>{
  if(window.innerWidth>=900) return;
  const t=e.touches[0];
  edgeX=(t.clientX<26&&!document.body.classList.contains('side-open'))?t.clientX:null;
},{passive:true});
window.addEventListener('touchmove',e=>{
  if(edgeX===null) return;
  const t=e.touches[0];
  if(t.clientX-edgeX>50){
    document.body.classList.add('side-open');
    st.sideForced=true;
    edgeX=null;
  }
},{passive:true});
window.addEventListener('touchend',()=>{edgeX=null},{passive:true});

let dragN=0;
window.addEventListener('dragenter',e=>{if(st.dragRow)return;e.preventDefault();if(st.openId){dragN++;document.body.classList.add('dragging')}});
window.addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1);if(!dragN)document.body.classList.remove('dragging')});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{
  if(st.dragRow) return;
  e.preventDefault();dragN=0;document.body.classList.remove('dragging');
  if(st.openId&&e.dataTransfer.files.length) addPhotos(e.dataTransfer.files);
});

async function newProject(){
  const p={id:uid(),name:'New project',status:'idle',important:false,startDate:'',created:Date.now(),tasks:[],notes:''};
  await putProject(p);
  st.projects.push(p); sortProjects();
  openProject(p.id);
  openSettings(p.id);
}

let migrateOffer=false;

async function localHasData(){
  try{
    db=await openDB();
    const ps=await localProjects();
    return ps.filter(p=>!SPECIAL(p.id)).length>0
        || ps.some(p=>(p.tasks||[]).length>0);
  }catch(e){ return false }
}

async function migrateLocal(){
  toast('Uploading your local data…');
  try{
    const ps=await localProjects();
    const phs=await localPhotos();
    for(const p of ps){
      const copy=Object.assign({},p);
      if(SPECIAL(p.id)){
        const cloud=st.projects.find(x=>x.id===p.id);
        if(cloud) copy.tasks=(cloud.tasks||[]).concat(p.tasks||[]);
      }
      await putProject(copy);
    }
    for(const ph of phs){
      if(!ph.blob) continue;
      await putPhoto({id:ph.id,pid:ph.pid,item:ph.item||null,name:ph.name,created:ph.created,
        x:ph.x,y:ph.y,w:ph.w,r:ph.r,z:ph.z,blob:ph.blob});
    }
    migrateOffer=false;
    LS.set('pm:migrated','1');
    await reload();
    toast('Everything moved to the cloud');
  }catch(e){ console.error(e); toast('Migration failed — your local copy is untouched') }
}

async function reload(){
  try{
    st.projects=await allProjects();
    setNet(true);
    st.projects.forEach(p=>localPut('projects',JSON.parse(JSON.stringify(p))));
  }catch(e){
    const mirror=await localProjects().catch(()=>[]);
    if(!mirror.length) throw e;
    st.projects=mirror;
    setNet(false);
    toast('Offline — showing the copy saved on this device');
  }
  if(!st.projects.some(p=>p.id===INBOX)){const ib=makeInbox();await putProject(ib);st.projects.push(ib)}
  if(!st.projects.some(p=>p.id===WANT)){const wl=makeWant();await putProject(wl);st.projects.push(wl)}
  if(!st.projects.some(p=>p.id===TODO)){const td=makeTodo();await putProject(td);st.projects.push(td)}
  sortProjects();
  applyHash();
  route();
}

function showGate(msg){
  hideBoot();
  const g=document.getElementById('gate');
  g.style.display='';
  if(msg) document.getElementById('gErr').textContent=msg;
  setTimeout(()=>{const m=document.getElementById('gMail'); if(m) m.focus()},40);
}

function hideBoot(){
  const b=document.getElementById('boot');
  if(!b) return;
  b.classList.add('gone');
  setTimeout(()=>{ b.style.display='none'; b.classList.remove('gone') },320);
  document.body.classList.add('booted');
}

async function afterLogin(){
  document.getElementById('gate').style.display='none';
  document.getElementById('boot').style.display='';
  document.getElementById('boot').classList.remove('gone');
  try{
    try{ if(!db) db=await openDB() }catch(e){}
    await flushQueue();
    await reload();
    const empty=st.projects.filter(p=>!SPECIAL(p.id)).length===0;
    if(empty&&LS.get('pm:migrated')!=='1'&&await localHasData()) migrateOffer=true;
    document.body.classList.toggle('no-hints',!st.hints);
    document.body.classList.toggle('light',st.light);
    syncSidebarButton();
    window.addEventListener('resize',syncSidebarButton);
    route();
  }catch(e){
    console.error(e);
    document.getElementById('view').innerHTML='<div class="pad"><h1 style="font-family:Unbounded,sans-serif;font-size:20px">Could not reach the database</h1><p class="lede">Check your connection and reload. If it keeps failing, the tables or their access rules may not be set up yet.</p></div>';
  }
  hideBoot();
}

document.getElementById('gateForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('gGo'), err=document.getElementById('gErr');
  err.textContent=''; btn.disabled=true; btn.textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({
    email:document.getElementById('gMail').value.trim(),
    password:document.getElementById('gPass').value
  });
  btn.disabled=false; btn.textContent='Sign in';
  if(error){ err.textContent=/Invalid/i.test(error.message)?'Wrong email or password.':error.message; return }
});

document.getElementById('signOut').addEventListener('click',async()=>{
  if(!confirm('Sign out of this device?')) return;
  await sb.auth.signOut();
  location.reload();
});

function dataSig(list){
  return (list||[]).map(p=>[p.id,p.name,p.status,p.important?1:0,p.archived?1:0,p.pinned?1:0,
    p.ord,p.cover||'',p.revisit||'',p.updated||0,(p.tasks||[]).length,
    (p.tasks||[]).filter(t=>t.done).length].join('~')).sort().join('|');
}
window.addEventListener('focus',async()=>{
  if(!ME||!lastLoad) return;
  if(Date.now()-lastLoad<30000) return;
  try{
    const before=dataSig(st.projects);
    const fresh=await allProjects();
    if(dataSig(fresh)===before) return;      // ничего не менялось — не трогаем экран
    const open=st.openId;
    st.projects=fresh;
    sortProjects();
    if(open&&!st.projects.some(p=>p.id===open)) st.openId=null;
    route();
  }catch(e){}
});

(async function start(){
  if(!window.supabase){
    hideBoot();
    document.getElementById('view').innerHTML='<div class="pad"><h1 style="font-family:Unbounded,sans-serif;font-size:20px">Offline</h1><p class="lede">The app could not load its cloud library. Check your connection and reload the page.</p></div>';
    return;
  }
  if(await tryShared()) return;
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  const {data}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='SIGNED_IN'&&session&&!ME){ ME=session.user; afterLogin() }
    if(ev==='SIGNED_OUT'){ ME=null; location.reload() }
  });
  if(data&&data.session){ ME=data.session.user; await afterLogin() }
  else { hideBoot(); showGate('') }
})();
</script>
