function renderTasks(t){
  if(!t.length) return `<li style="border:none;padding:10px 0 0"><button class="ai-btn" data-aiplan>${svg('spark',14,1.9)} Plan it with AI</button></li>`;
  const fo=t.find(x=>!x.done);
  return t.map(x=>{
    const subs=x.subs||[], sd=subs.filter(y=>y.done).length;
    const exp=st.taskOpen===x.id;
    return `
    <li class="${x.done?'done':''} ${fo&&x.id===fo.id?'first-open':''}" draggable="true" data-task="${x.id}" data-row="${st.openId}|${x.id}">
      <button class="check" data-toggle="${x.id}" aria-label="Toggle">${svg(x.done?'boxOk':'box',17,1.8)}</button>
      <span>${linkify(x.text)}</span>
      ${x.done?'':dueChip(st.openId,x)}
      <button class="sub-toggle ${subs.length?(sd===subs.length?'full':'has'):''} ${exp?'open':''}"
        data-taskexp="${x.id}" title="${subs.length?'Steps':'Break into steps'}">
        ${svg('chev',11,2.2)}${subs.length?`${sd}/${subs.length}`:''}
      </button>
      <button class="star ${x.star?'on':''}" data-star="${x.id}" title="${x.star?'Remove from focus':'Add to focus'}">${svg('star',14,1.8)}</button>
      <button class="task-del" data-deltask="${x.id}" title="Delete">${svg('x',13,2)}</button>
      ${exp?`<ul class="subs">
        ${subs.map(sb=>`<li class="${sb.done?'done':''}">
          <button class="check" data-subtog="${x.id}|${sb.id}" aria-label="Toggle">${svg(sb.done?'boxOk':'box',14,1.8)}</button>
          <span>${linkify(sb.text)}</span>
          <button class="sub-del" data-subdel="${x.id}|${sb.id}" title="Delete">${svg('x',11,2.2)}</button>
        </li>`).join('')}
        <li class="sub-add">
          <input data-subadd="${x.id}" placeholder="Add a step" autocomplete="off">
          <button data-subgo="${x.id}">${svg('plus',13,2.4)}</button>
          <button class="ai-mini" data-aisteps="${x.id}" title="Suggest steps with AI">${svg('spark',13,1.9)}</button>
        </li>
      </ul>`:''}
    </li>`}).join('');
}

function persistTaskOrder(box,p){
  const ids=Array.from(box.querySelectorAll('[data-task]')).map(el=>el.dataset.task);
  const byId={}; tasksOf(p).forEach(t=>byId[t.id]=t);
  const ordered=ids.map(id=>byId[id]).filter(Boolean);
  let k=0;
  p.tasks=(p.tasks||[]).map(t=>(t.kind!=='link'&&t.kind!=='sticky')?ordered[k++]:t);
  saveProject(p,true);
  $('#taskList').innerHTML=renderTasks(tasksOf(p));
  bindTaskDrag($('#taskList'),p);
  updateBarAndNext(p); renderSide();
}

function bindTaskDrag(box,p){
  let dragId=null;
  box.addEventListener('dragstart',e=>{
    const li=e.target.closest('[data-task]'); if(!li) return;
    if(e.target.closest('input')) { e.preventDefault(); return }
    dragId=li.dataset.task; li.classList.add('drag');
    e.dataTransfer.effectAllowed='move';
    try{ e.dataTransfer.setData('text/plain',dragId) }catch(_){}
  });
  box.addEventListener('dragend',()=>{
    const el=box.querySelector('.drag'); if(el) el.classList.remove('drag');
    dragId=null;
  });
  box.addEventListener('dragover',e=>{
    if(!dragId) return;
    e.preventDefault();
    const over=e.target.closest('[data-task]');
    const el=box.querySelector('[data-task="'+dragId+'"]');
    if(!over||!el||over===el) return;
    const r=over.getBoundingClientRect();
    box.insertBefore(el,(e.clientY-r.top)>r.height/2?over.nextSibling:over);
  });
  box.addEventListener('drop',e=>{
    e.preventDefault(); if(!dragId) return;
    dragId=null; persistTaskOrder(box,p);
  });

  let held=null,timer=null,sy=0,moved=false;
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch') return;
    const li=e.target.closest('[data-task]'); if(!li) return;
    if(e.target.closest('button')||e.target.closest('input')) return;
    sy=e.clientY; moved=false;
    timer=setTimeout(()=>{ held=li; li.classList.add('drag'); if(navigator.vibrate) navigator.vibrate(12) },350);
  });
  box.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch') return;
    if(!held){ if(timer&&Math.abs(e.clientY-sy)>9){ clearTimeout(timer); timer=null } return }
    moved=true; e.preventDefault();
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const over=under&&under.closest?under.closest('[data-task]'):null;
    if(over&&over!==held&&over.parentNode===box){
      const r=over.getBoundingClientRect();
      box.insertBefore(held,(e.clientY-r.top)>r.height/2?over.nextSibling:over);
    }
  });
  const end=()=>{
    clearTimeout(timer); timer=null;
    if(!held) return;
    held.classList.remove('drag'); held=null;
    if(moved) persistTaskOrder(box,p);
  };
  box.addEventListener('pointerup',end);
  box.addEventListener('pointercancel',end);
}

function updateBarAndNext(p){
  const t=tasksOf(p), d=t.filter(x=>x.done).length;
  const bar=document.querySelector('.bar');
  if(bar&&t.length){bar.querySelector('i').style.width=(d/t.length)*100+'%';bar.querySelector('b').textContent=d+'/'+t.length}
}
function bindProject(p){
  if($('#pTitle')) $('#pTitle').addEventListener('input',e=>{
    p.name=e.target.value;
    $('#crumb').textContent=p.name||'Untitled';
    document.title=p.name||'Untitled';
    const r=document.querySelector(`[data-open="${p.id}"] .row-text`); if(r) r.textContent=p.name;
    saveProject(p);
  });
  const nt=$('#notes');
  if(nt) nt.addEventListener('input',e=>{
    const wasEmpty=!(p.notes||'').trim();
    p.notes=e.target.value;
    if(wasEmpty&&p.notes.trim()&&touchProject(p)){ sortProjects(); renderSide() }
    saveProject(p);
  });
  const add=()=>{
    const i=$('#taskInput'); if(!i) return;
    const v=i.value.trim(); if(!v) return;
    p.tasks=p.tasks||[];
    const item={id:uid(),text:v,done:false,created:Date.now()};
    if(p.id===INBOX){
      URL_RE.lastIndex=0;
      const m=v.match(URL_RE);
      if(m){
        let u=m[0]; if(!/^https?:/i.test(u)) u='https://'+u;
        const dup=dupIdea(u); if(dup){ i.value=''; return showDup(dup) }
        item.url=u;
        item.text=v.replace(m[0],'').trim();
        if(!item.text) item.text=shortUrl(u);
      }
      const f=st.ideaFolder;
      if(f&&f!==ARCHIVE) item.cat=f;
    }
    p.tasks.push(item);
    const moved=touchProject(p);
    i.value=''; saveProject(p,true);
    if(moved){ sortProjects(); toast('Moved to In progress') }
    renderProject(); renderSide();
    if(item.url) fetchMeta(item.url).then(meta=>{
      let changed=false;
      if(meta.image&&!item.preview){ item.preview=meta.image; changed=true }
      if(meta.title&&(!item.text||item.text===shortUrl(item.url))){ item.text=meta.title; changed=true }
      if(changed){ saveProject(p,true); if(st.openId===p.id) renderProject() }
    });
  };
  const ta=$('#taskAdd'), ti=$('#taskInput');
  if(ta) ta.addEventListener('click',add);
  if(ti) ti.addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  bindIdeas(p);
  if(p.id===INBOX) enrichIdeas(p);
  bindWish(p);
  bindTodo(p);
  bindLinks(p);
  const ex=$('#expand'); if(ex) ex.addEventListener('click',toggleBoard);
  const ap=$('#addPhoto'); if(ap) ap.addEventListener('click',()=>$('#filePick').click());
  const tb=$('#trashBtn'); if(tb) tb.addEventListener('click',()=>openTrash(p));
  const bt=$('#boardToggle');
  if(bt) bt.addEventListener('click',()=>{
    st.boardOpen[p.id]=!boardOpen(p.id);
    const sec=bt.closest('.board-pane');
    if(sec) sec.classList.toggle('collapsed',!st.boardOpen[p.id]);
  });
  const tl=$('#taskList');
  const redrawTasks=()=>{
    saveProject(p,true);
    $('#taskList').innerHTML=renderTasks(tasksOf(p));
    bindTaskDrag($('#taskList'),p);
    renderSide(); updateBarAndNext(p);
  };
  const addSub=(tid,val)=>{
    const v=val.trim(); if(!v) return;
    const x=p.tasks.find(y=>y.id===tid); if(!x) return;
    x.subs=x.subs||[];
    x.subs.push({id:uid(),text:v,done:false});
    if(x.done){ x.done=false; x.doneAt=null }
    if(touchProject(p)){ sortProjects(); toast('Moved to In progress') }
    st.taskOpen=tid;
    redrawTasks();
    const inp=document.querySelector('[data-subadd="'+tid+'"]');
    if(inp) inp.focus();
  };
  if(tl) bindTaskDrag(tl,p);
  if(tl) tl.addEventListener('keydown',e=>{
    const inp=e.target.closest('[data-subadd]');
    if(inp&&e.key==='Enter'){ e.preventDefault(); addSub(inp.dataset.subadd,inp.value) }
  });
  if(tl) tl.addEventListener('click',e=>{
    if(e.target.closest('a')) return;
    const as=e.target.closest('[data-aisteps]'), ap=e.target.closest('[data-aiplan]');
    if(as){ aiSteps(p,as.dataset.aisteps).then(ok=>{ if(ok) redrawTasks() }); return }
    if(ap){ aiPlan(p).then(ok=>{ if(ok){ touchProject(p); redrawTasks(); if(st.openId===p.id) renderProject() } }); return }
    const tg=e.target.closest('[data-toggle]'),dl=e.target.closest('[data-deltask]'),
          sr=e.target.closest('[data-star]'),ex=e.target.closest('[data-taskexp]'),
          stg=e.target.closest('[data-subtog]'),sdl=e.target.closest('[data-subdel]'),
          sgo=e.target.closest('[data-subgo]');
    if(e.target.closest('[data-subadd]')) return;
    if(sgo){
      const inp=document.querySelector('[data-subadd="'+sgo.dataset.subgo+'"]');
      if(inp) addSub(sgo.dataset.subgo,inp.value);
      return;
    }
    if(ex){ st.taskOpen=st.taskOpen===ex.dataset.taskexp?null:ex.dataset.taskexp; }
    else if(stg){
      const [tid,sid]=stg.dataset.subtog.split('|');
      const x=p.tasks.find(y=>y.id===tid); if(!x) return;
      const sb=(x.subs||[]).find(y=>y.id===sid); if(!sb) return;
      sb.done=!sb.done;
      const all=x.subs.length&&x.subs.every(y=>y.done);
      if(all&&!x.done){ x.done=true; x.doneAt=Date.now() }
      if(!all&&x.done){ x.done=false; x.doneAt=null }
    }
    else if(sdl){
      const [tid,sid]=sdl.dataset.subdel.split('|');
      const x=p.tasks.find(y=>y.id===tid); if(!x) return;
      x.subs=(x.subs||[]).filter(y=>y.id!==sid);
    }
    else if(tg){
      const x=p.tasks.find(y=>y.id===tg.dataset.toggle);
      x.done=!x.done; x.doneAt=x.done?Date.now():null;
      if(x.subs&&x.subs.length) x.subs.forEach(sb=>{sb.done=x.done});
      rollRepeat(x);
    }
    else if(dl){p.tasks=p.tasks.filter(y=>y.id!==dl.dataset.deltask); toast('Deleted',{action:'Undo',onAction:undo})}
    else if(sr){const x=p.tasks.find(y=>y.id===sr.dataset.star);x.star=!x.star}
    else return;
    redrawTasks();
  });
}

/* ───────── board ───────── */
function clearUrls(){st.urls.forEach(u=>URL.revokeObjectURL(u));st.urls=[]}
let layoutT=null;
function saveLayout(ph){
  clearTimeout(layoutT);
  layoutT=setTimeout(()=>{putPhoto(ph).catch(e=>console.error(e))},300);
}

async function loadPhotos(pid){
  clearUrls();
  let list=[];
  try{list=await photosOf(pid)}catch(e){console.error(e)}
  list=boardPhotos(list);
  list.sort((a,b)=>(a.z||0)-(b.z||0));
  st.photos=list;
  st.maxZ=list.reduce((m,p)=>Math.max(m,p.z||0),1);
  paintBoard();
}

const CANVAS_W=2600, CANVAS_H=1900;
const STICKY_COLORS=[
  {id:'violet',label:'Violet'},{id:'cyan',label:'Cyan'},{id:'magenta',label:'Pink'},
  {id:'mint',label:'Mint'},{id:'amber',label:'Amber'},{id:'plain',label:'Paper'}
];
const STICKY_SIZES=[{id:'s',label:'S'},{id:'m',label:'M'},{id:'l',label:'L'},{id:'xl',label:'XL'}];
const layoutOf=t=>{ try{ return typeof t.layout==='string'?JSON.parse(t.layout):(t.layout||{}) }catch(e){ return {} } };
const stickiesOf=p=>(p.tasks||[]).filter(t=>t.kind==='sticky');

function boardCanvas(){ return document.getElementById('canvas') }

function paintBoard(){
  const b=$('#board'); if(!b) return;
  b.innerHTML='<div id="canvas"></div>';
  const cv=boardCanvas();
  cv.style.width=CANVAS_W+'px'; cv.style.height=CANVAS_H+'px';
  const pr=cur();
  const notes=pr?stickiesOf(pr):[];
  if(!st.photos.length&&!notes.length){
    cv.insertAdjacentHTML('beforeend',`<div class="board-empty">${svg('img',26,1.3)}<b>Empty board</b><span>Drop photos here, paste a screenshot, or hit “+ photo”</span></div>`);
  }
  st.photos.forEach((ph,i)=>{
    if(ph.x==null){ const c=i%4; ph.x=40+c*250; ph.y=40+Math.floor(i/4)*190; ph.w=210; ph.r=(Math.random()*4-2); ph.z=++st.maxZ; putPhoto(ph).catch(()=>{}); }
    cv.appendChild(pinEl(ph));
  });
  notes.forEach(n=>cv.appendChild(stickyEl(pr,n)));
  bindPan(b,cv);
  const c=$('#phCount'); if(c) c.textContent=st.photos.length||'';
  requestAnimationFrame(()=>{ b.scrollLeft=0; b.scrollTop=0 });
}

const boardSel=new Set();

function paintSel(){
  document.querySelectorAll('.pin').forEach(el=>el.classList.toggle('sel',boardSel.has(el.dataset.id)));
  let bar=document.getElementById('selBar');
  if(!boardSel.size){ if(bar) bar.remove(); return }
  if(!bar){
    bar=document.createElement('div');
    bar.id='selBar'; bar.className='sel-bar';
    document.body.appendChild(bar);
    bar.addEventListener('click',async e=>{
      const b=e.target.closest('button'); if(!b) return;
      const act=b.dataset.sel;
      const p=cur();
      if(act==='clear'){ boardSel.clear(); paintSel(); return }
      if(act==='del'){
        if(!confirm('Delete '+boardSel.size+' photo'+(boardSel.size===1?'':'s')+'? This cannot be undone.')) return;
        for(const id of Array.from(boardSel)){
          await delPhotoDB(id);
          st.photos=st.photos.filter(x=>x.id!==id);
        }
        boardSel.clear();
        if(p) dropCover(p.id);
        paintBoard(); paintSel(); toast('Deleted');
      }
      if(act==='row'){
        const chosen=st.photos.filter(x=>boardSel.has(x.id));
        let x=40,y=40,rowH=0;
        chosen.forEach(ph=>{
          if(x+ph.w>1740){ x=40; y+=rowH+18; rowH=0 }
          const dx=x-ph.x, dy=y-ph.y;
          ph.x=x; ph.y=y; ph.z=++st.maxZ;
          if(dx||dy) moveAttached(ph,dx,dy);
          x+=ph.w+18; rowH=Math.max(rowH,ph.w);
          putPhoto(ph).catch(()=>{});
        });
        if(p) saveProject(p,true);
        paintBoard(); paintSel(); toast('Lined up');
      }
    });
  }
  bar.innerHTML=`<span>${boardSel.size} selected</span>
    <button data-sel="row">${svg('size',13,1.9)} line up</button>
    <button data-sel="del">${svg('trash',13,1.8)} delete</button>
    <button data-sel="clear">${svg('x',13,2.2)} clear</button>`;
}

function bindPan(b,cv){
  let sx=0,sy=0,sl=0,stp=0,on=false;
  cv.addEventListener('pointerdown',e=>{
    if(e.target!==cv) return;
    if(e.button!==0&&e.pointerType==='mouse') return;
    if(e.shiftKey){                       // Shift + протяжка = рамка выделения
      e.preventDefault();
      const rect=cv.getBoundingClientRect();
      const ox=e.clientX-rect.left, oy=e.clientY-rect.top;
      const box=document.createElement('div');
      box.className='marquee'; cv.appendChild(box);
      const draw=ev=>{
        const cx=ev.clientX-rect.left, cy=ev.clientY-rect.top;
        const l=Math.min(ox,cx), t=Math.min(oy,cy), w=Math.abs(cx-ox), h=Math.abs(cy-oy);
        box.style.left=l+'px'; box.style.top=t+'px'; box.style.width=w+'px'; box.style.height=h+'px';
        st.photos.forEach(ph=>{
          const el=document.querySelector('.pin[data-id="'+ph.id+'"]');
          const hh=(el&&el.offsetHeight)||ph.w;
          const hit=ph.x<l+w&&ph.x+ph.w>l&&ph.y<t+h&&ph.y+hh>t;
          if(hit) boardSel.add(ph.id); else boardSel.delete(ph.id);
        });
        paintSel();
      };
      const done=()=>{ box.remove(); window.removeEventListener('pointermove',draw); window.removeEventListener('pointerup',done) };
      window.addEventListener('pointermove',draw); window.addEventListener('pointerup',done);
      return;
    }
    if(boardSel.size){ boardSel.clear(); paintSel() }
    on=true; b.classList.add('panning');
    sx=e.clientX; sy=e.clientY; sl=b.scrollLeft; stp=b.scrollTop;
    const move=ev=>{ if(!on) return; b.scrollLeft=sl-(ev.clientX-sx); b.scrollTop=stp-(ev.clientY-sy) };
    const up=()=>{ on=false; b.classList.remove('panning');
      window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up) };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  });
}

function pinEl(ph){
  const url=photoSrc(ph); if(url.indexOf('blob:')===0) st.urls.push(url);
  const el=document.createElement('div');
  el.className='pin'; el.dataset.id=ph.id;
  el.style.left=ph.x+'px'; el.style.top=ph.y+'px'; el.style.width=ph.w+'px';
  el.style.zIndex=ph.z||1; el.style.transform=`rotate(${ph.r||0}deg)`;
  el.innerHTML=`<img src="${url}" alt="${esc(ph.name||'photo')}" draggable="false">
    <button class="pin-x" title="Delete">${svg('x',12,2.2)}</button>
    <div class="pin-size" title="Drag to resize">${svg('size',11,2)}</div>`;

  const front=()=>{
    ph.z=++st.maxZ; el.style.zIndex=ph.z; saveLayout(ph);
    raiseNotes(ph);
  };

  el.querySelector('.pin-x').addEventListener('pointerdown',e=>e.stopPropagation());
  el.querySelector('.pin-x').addEventListener('click',async e=>{
    e.stopPropagation();
    await delPhotoDB(ph.id);
    st.photos=st.photos.filter(x=>x.id!==ph.id);
    el.remove();
    const c=$('#phCount'); if(c) c.textContent=st.photos.length||'';
    if(!st.photos.length) paintBoard();
    toast('Photo deleted');
  });

  el.addEventListener('dblclick',()=>lightbox(ph,url));

  el.querySelector('.pin-size').addEventListener('pointerdown',e=>{
    e.stopPropagation(); e.preventDefault(); front();
    const sx=e.clientX, sw=ph.w;
    const move=ev=>{ ph.w=clamp(Math.round(sw+(ev.clientX-sx)),90,900); el.style.width=ph.w+'px'; };
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);saveLayout(ph)};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });

  el.addEventListener('pointerdown',e=>{
    if(e.button!==0&&e.pointerType==='mouse') return;
    if(e.shiftKey){
      e.preventDefault(); e.stopPropagation();
      if(boardSel.has(ph.id)) boardSel.delete(ph.id); else boardSel.add(ph.id);
      paintSel();
      return;
    }
    e.preventDefault(); front(); el.classList.add('grabbing');
    const rect=boardCanvas().getBoundingClientRect();
    const dx=e.clientX-rect.left-ph.x, dy=e.clientY-rect.top-ph.y;
    const groupIds=boardSel.has(ph.id)?Array.from(boardSel).filter(id=>id!==ph.id):[];
    const move=ev=>{
      const h=el.offsetHeight;
      const nx=clamp(Math.round(ev.clientX-rect.left-dx),0,CANVAS_W-ph.w);
      const ny=clamp(Math.round(ev.clientY-rect.top-dy),0,CANVAS_H-h);
      const sx=nx-ph.x, sy=ny-ph.y;
      ph.x=nx; ph.y=ny;
      el.style.left=ph.x+'px'; el.style.top=ph.y+'px';
      if(sx||sy){
        moveAttached(ph,sx,sy);
        groupIds.forEach(id=>{
          const o=st.photos.find(x=>x.id===id); if(!o) return;
          o.x+=sx; o.y+=sy;
          const oe=document.querySelector('.pin[data-id="'+id+'"]');
          if(oe){ oe.style.left=o.x+'px'; oe.style.top=o.y+'px' }
          moveAttached(o,sx,sy);
        });
      }
    };
    const up=()=>{
      el.classList.remove('grabbing');
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
      saveLayout(ph);
      groupIds.forEach(id=>{ const o=st.photos.find(x=>x.id===id); if(o) saveLayout(o) });
      const pr=cur(); if(pr&&attachedTo(ph.id).length) saveProject(pr,true);
    };
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });

  return el;
}

/* ───────── sticky notes ───────── */
function stickyEl(p,note){
  const L=layoutOf(note);
  const el=document.createElement('div');
  el.className='sticky c-'+(L.c||'violet')+' s-'+(L.s||'m');
  el.dataset.id=note.id;
  el._L=L;
  el.style.left=(L.x||60)+'px'; el.style.top=(L.y||60)+'px'; el.style.zIndex=L.z||1;
  if(L.fs) el.style.setProperty('--fs',L.fs+'px');
  if(L.w) el.style.width=L.w+'px';
  el.innerHTML=`<div class="sticky-text">${esc(note.text||'')}</div>
    <div class="sticky-acts">
      <button data-spin class="${L.pin?'on':''}" title="${L.pin?'Unpin from photo':'Pin to the photo underneath'}">${svg('pin',12,1.7)}</button>
      <button data-sset title="Style">${svg('gear',12,1.6)}</button>
      <button data-sdel title="Delete">${svg('x',12,2.2)}</button>
    </div>
    <div class="sticky-size" title="Drag to resize">${svg('size',11,2)}</div>`;
  const save=()=>{ note.layout=JSON.stringify(L); saveProject(p,true) };

  el.querySelector('[data-sdel]').addEventListener('pointerdown',e=>e.stopPropagation());
  el.querySelector('[data-sdel]').addEventListener('click',e=>{
    e.stopPropagation();
    p.tasks=p.tasks.filter(x=>x.id!==note.id);
    saveProject(p,true); el.remove();
  });
  el.querySelector('[data-sset]').addEventListener('pointerdown',e=>e.stopPropagation());
  el.querySelector('[data-sset]').addEventListener('click',e=>{ e.stopPropagation(); stickyEdit(p,note) });

  const pinBtn=el.querySelector('[data-spin]');
  pinBtn.addEventListener('pointerdown',e=>e.stopPropagation());
  pinBtn.addEventListener('click',e=>{
    e.stopPropagation();
    if(L.pin){
      delete L.pin; delete L.dx; delete L.dy;
      save(); pinBtn.classList.remove('on');
      pinBtn.title='Pin to the photo underneath';
      toast('Unpinned');
      return;
    }
    const host=photoUnder((L.x||0)+el.offsetWidth/2,(L.y||0)+el.offsetHeight/2)
             ||photoUnder((L.x||0)+16,(L.y||0)+16);
    if(!host){ toast('Drag the note over a photo first'); return }
    L.pin=host.id; L.dx=(L.x||0)-host.x; L.dy=(L.y||0)-host.y;
    save(); pinBtn.classList.add('on');
    pinBtn.title='Unpin from photo';
    toast('Pinned — it moves with that photo now');
  });

  el.addEventListener('dblclick',e=>{ e.stopPropagation(); stickyEdit(p,note) });

  el.querySelector('.sticky-size').addEventListener('pointerdown',e=>{
    e.stopPropagation(); e.preventDefault();
    const startX=e.clientX, startY=e.clientY;
    const baseFs=L.fs||{s:13,m:17,l:23,xl:32}[L.s||'m'];
    const baseW=L.w||el.offsetWidth;
    const move=ev=>{
      const dx=ev.clientX-startX, dy=ev.clientY-startY;
      L.fs=clamp(Math.round(baseFs+(dx+dy)/14),11,96);
      L.w=clamp(Math.round(baseW+dx),110,900);
      el.style.setProperty('--fs',L.fs+'px');
      el.style.width=L.w+'px';
    };
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);save()};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });

  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;
    if(e.button!==0&&e.pointerType==='mouse') return;
    e.preventDefault();
    L.z=++st.maxZ; el.style.zIndex=L.z;
    el.classList.add('grabbing');
    const rect=boardCanvas().getBoundingClientRect();
    const dx=e.clientX-rect.left-(L.x||0), dy=e.clientY-rect.top-(L.y||0);
    const move=ev=>{
      L.x=clamp(Math.round(ev.clientX-rect.left-dx),0,CANVAS_W-el.offsetWidth);
      L.y=clamp(Math.round(ev.clientY-rect.top-dy),0,CANVAS_H-el.offsetHeight);
      el.style.left=L.x+'px'; el.style.top=L.y+'px';
    };
    const up=()=>{
      el.classList.remove('grabbing');
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
      if(L.pin){
        const host=st.photos.find(x=>x.id===L.pin);
        if(host){ L.dx=L.x-host.x; L.dy=L.y-host.y }
      }
      save();
    };
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });
  return el;
}

function compress(file,maxDim,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const s=Math.min(1,maxDim/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');x.fillStyle='#111';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
        c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q);
      };
      img.onerror=()=>rej(new Error('img'));
      img.src=fr.result;
    };
    fr.onerror=()=>rej(new Error('read'));
    fr.readAsDataURL(file);
  });
}

function d2b(u){
  const [h,d]=u.split(','),mime=h.match(/:(.*?);/)[1],bin=atob(d),a=new Uint8Array(bin.length);

async function restoreSheet(file){
  let data=null;
  try{ data=JSON.parse(await file.text()) }catch(e){}
  if(!data||!Array.isArray(data.projects)){ toast('That file is not a backup from this app',{kind:'bad'}); return }
  const haveP={}, haveI={};
  st.projects.forEach(p=>{ haveP[p.id]=p; (p.tasks||[]).forEach(t=>{ haveI[t.id]=1 }) });
  let havePh={};
  try{ const {data:rows}=await sb.from('photos').select('id'); (rows||[]).forEach(r=>{ havePh[r.id]=1 }) }catch(e){}
  const fileItems=data.projects.reduce((n,p)=>n+(p.tasks||[]).length,0);
  const newP=data.projects.filter(p=>p&&p.id&&!haveP[p.id]);
  const addI=[]; data.projects.forEach(p=>{ if(!haveP[p.id]) return; (p.tasks||[]).forEach(t=>{ if(t&&t.id&&!haveI[t.id]) addI.push({pid:p.id,t}) }) });
  const newPItems=newP.reduce((n,p)=>n+(p.tasks||[]).filter(t=>!haveI[t.id]).length,0);
  const pids={}; st.projects.forEach(p=>{ pids[p.id]=1 }); newP.forEach(p=>{ pids[p.id]=1 });
  const addPh=(data.photos||[]).filter(ph=>ph&&ph.id&&ph.data&&!havePh[ph.id]&&pids[ph.pid]);
  const nowItems=st.projects.reduce((n,p)=>n+(p.tasks||[]).length,0);
  const when=data.exported?new Date(data.exported):null;
  const nothing=!newP.length&&!addI.length&&!addPh.length;
  const el=document.createElement('div');
  el.className='sheet-wrap';
  el.innerHTML=`<div class="sheet rs-sheet">
    <div class="sheet-head"><span>Restore from backup</span><button data-close aria-label="Close">${svg('x',15,2)}</button></div>
    <p class="rs-when">${when&&!isNaN(when)?'Saved '+esc(MON[when.getMonth()]+' '+when.getDate()+', '+when.getFullYear()):'Backup file'} · ${esc(file.name||'')}</p>
    <div class="rs-grid">
      <span></span><b>In the file</b><b>Here now</b>
      <span>Lists and projects</span><em>${data.projects.length}</em><em>${st.projects.length}</em>
      <span>Items</span><em>${fileItems}</em><em>${nowItems}</em>
      <span>Photos</span><em>${(data.photos||[]).length}</em><em>${Object.keys(havePh).length}</em>
    </div>
    <p class="rs-sum">${nothing?'Everything in this file is already here.'
      :`Adds ${[newP.length?newP.length+' project'+(newP.length===1?'':'s'):'',addI.length+newPItems?(addI.length+newPItems)+' item'+(addI.length+newPItems===1?'':'s'):'',addPh.length?addPh.length+' photo'+(addPh.length===1?'':'s'):''].filter(Boolean).join(', ')}. Nothing here is changed or deleted.`}</p>
    <button class="gate-go rs-merge" ${nothing?'disabled':''}>${nothing?'Nothing to add':'Add what’s missing'}</button>
    <button class="rs-more" data-rsmore>Replace everything instead…</button>
    <div class="rs-replace" hidden>
      <p>This deletes everything here, photos included, and loads only the file. Type <b>REPLACE</b> to continue.</p>
      <input id="rsWord" autocomplete="off" aria-label="Type REPLACE">
      <button class="danger" id="rsGo" disabled>Replace everything</button>
    </div>
  </div>`;
  const close=()=>el.remove();
  el.addEventListener('click',async e=>{
    if(e.target===el||e.target.closest('[data-close]')) return close();
    if(e.target.closest('[data-rsmore]')){ el.querySelector('.rs-replace').hidden=false; e.target.closest('[data-rsmore]').hidden=true; el.querySelector('#rsWord').focus(); return }
    if(e.target.closest('.rs-merge')&&!nothing){
      close(); toast('Adding…');
      try{
        for(const p of newP){ const cp=Object.assign({},p,{tasks:(p.tasks||[]).filter(t=>!haveI[t.id])}); await putProject(cp); st.projects.push(cp) }
        const touched={};
        addI.forEach(x=>{ const p=haveP[x.pid]; p.tasks=p.tasks||[]; p.tasks.push(x.t); touched[p.id]=p });
        for(const id in touched) await putProject(touched[id]);
        for(const ph of addPh) await putPhoto({id:ph.id,pid:ph.pid,item:ph.item||null,name:ph.name,created:ph.created,x:ph.x,y:ph.y,w:ph.w,r:ph.r,z:ph.z,blob:d2b(ph.data)});
        sortProjects(); route();
        const pl=(n,w)=>n+' '+w+(n===1?'':'s');
        toast('Restored',{sub:[newP.length?pl(newP.length,'project'):'',addI.length+newPItems?pl(addI.length+newPItems,'item'):'',addPh.length?pl(addPh.length,'photo'):''].filter(Boolean).join(', ')});
      }catch(err){ console.error(err); toast('Could not finish restoring',{kind:'bad',sub:String(err&&err.message||'').slice(0,120)}) }
      return;
    }
    if(e.target.closest('#rsGo')&&el.querySelector('#rsWord').value.trim()==='REPLACE'){ close(); await replaceAll(data) }
  });
  el.addEventListener('input',e=>{ if(e.target.id==='rsWord') el.querySelector('#rsGo').disabled=e.target.value.trim()!=='REPLACE' });
  document.body.appendChild(el);
}

function parseQuick(raw){
  let text=raw.trim(), forced=null;
  const first=text[0];
  if(first==='!'){forced=INBOX;text=text.slice(1).trim()}
  else if(first==='$'){forced=WANT;text=text.slice(1).trim()}
  else if(first==='?'){forced=TODO;text=text.slice(1).trim()}
  else if(first==='>'){forced='proj';text=text.slice(1).trim()}
  let price=null, url='';
  const u=text.match(/(https?:\/\/\S+|www\.\S+)/i);
  if(u){ url=u[0]; if(!/^https?:/i.test(url)) url='https://'+url; text=text.replace(u[0],'').replace(/\s+/g,' ').trim() }
  const full=text;                      // для всего, кроме вишлиста, число в конце — часть текста
  const m=text.match(/\s(\d+(?:[.,]\d+)?)$/);
  if(m){ price=parseFloat(m[1].replace(',','.')); text=text.slice(0,m.index).trim() }
  // «…завтра» / «…today» в конце — срок для задач
  let due='', task=full, rep='';
  const R2=[[/(?:^|\s)(?:every|each)\s+(\d+)\s*days?$/i,m=>'d'+m[1]],[/(?:^|\s)(?:every|each)\s+(\d+)\s*weeks?$/i,m=>'w'+m[1]],
    [/(?:^|\s)every other day$/i,()=>'d2'],[/(?:^|\s)every other week$/i,()=>'w2'],[/(?:^|\s)(?:on\s+)?(?:every\s+)?weekdays?$/i,()=>'wd'],
    [/(?:^|\s)(?:monthly|every month)\s+on\s+the\s+(\d{1,2})(?:st|nd|rd|th)?$/i,m=>'m'+m[1]],[/(?:^|\s)on\s+the\s+(\d{1,2})(?:st|nd|rd|th)?\s+of\s+every\s+month$/i,m=>'m'+m[1]],
    [/(?:^|\s)каждые\s+(\d+)\s*(?:дня|дней|день)$/i,m=>'d'+m[1]],[/(?:^|\s)каждые\s+(\d+)\s*(?:недели|недель)$/i,m=>'w'+m[1]],
    [/(?:^|\s)через день$/i,()=>'d2'],[/(?:^|\s)через неделю каждую$/i,()=>'w2'],[/(?:^|\s)(?:по будням|каждый будний день)$/i,()=>'wd'],
    [/(?:^|\s)(?:каждое|каждого)\s+(\d{1,2})(?:-?е|-?го)?\s*(?:число|числа)?(?:\s+каждого месяца)?$/i,m=>'m'+m[1]],[/(?:^|\s)(\d{1,2})(?:-?го)?\s+числа\s+каждого месяца$/i,m=>'m'+m[1]]];
  for(const [re,f] of R2){ const m=full.match(re); if(m){ rep=f(m); task=full.slice(0,m.index).trim()||full; break } }
  const rw=rep?null:full.match(/(?:^|\s)(every day|daily|every week|weekly|every month|monthly|каждый день|ежедневно|каждую неделю|еженедельно|каждый месяц|ежемесячно)$/i);
  if(rw){ const w=rw[1].toLowerCase(); rep=/day|daily|день|ежедн/.test(w)?'day':/week|недел/.test(w)?'week':'month'; task=full.slice(0,rw.index).trim()||full }
  const nd=nlDate(task); if(nd){ due=nd.due; task=nd.rest||task }
  const dw=null;
  if(dw){ due=ldPlus(DUE_WORDS[dw[1].toLowerCase()]); task=task.slice(0,dw.index).trim()||task }
  if(rep&&!due) due=firstDue(rep);
  return {text,full,task,due,rep,price,url,forced};
}

function recentTargets(){
  const out=[{id:INBOX,label:'Ideas',cls:'t-ideas'},{id:TODO,label:'To do',cls:'t-todo'},{id:WANT,label:'Wishlist',cls:'t-want'}];

}

async function readClip(){
  try{
    if(!navigator.clipboard||!navigator.clipboard.readText) return '';
    return (await navigator.clipboard.readText()||'').trim();
  }catch(e){ return '' }
}


async function saveCapture(target,text,url,file,extra){
  const p=st.projects.find(x=>x.id===target);
  if(!p) return;
  const ex=extra||{};
  blip('add');
  p.tasks=p.tasks||[];
  let what='Saved';
  if(url&&!SPECIAL(p.id)){
    const item={id:uid(),kind:'link',text:text||'',url,preview:'',done:false,created:Date.now()};
    p.tasks.push(item);
    touchProject(p);
    saveProject(p,true);
    what='Reference added';
    fetchPreview(url).then(img=>{ if(img){ item.preview=img; saveProject(p,true); if(st.openId===p.id) renderProject() } });
  }else if(p.id===WANT){
    const wi={id:uid(),text:text||shortUrl(url)||'Untitled',url:url||'',price:ex.price==null?null:ex.price,done:false,created:Date.now()};
    p.tasks.push(wi);
    if(url) wishFill(p,wi,!text);
    if(aiKey()&&(wi.price==null||!url)) aiFillWish(p,wi,false);
    saveProject(p,true); what='Added to Wishlist';
  }else if(p.id===TODO){
    const ni={id:uid(),text:text||shortUrl(url)||'Untitled',cat:ex.cat||st.todoCat||'other',url:url||'',note:'',done:false,created:Date.now()};
    if(ex.due) setDue(ni,ex.due);
    if(ex.rep) setLay(ni,'rep',ex.rep);
    p.tasks.push(ni);
    saveProject(p,true); what='Added to To do';
  }else{
    if(p.id===INBOX&&url){ const dup=dupIdea(url); if(dup) return showDup(dup) }
    const it={id:uid(),kind:p.id===INBOX?undefined:'task',text:text||'',done:false,created:Date.now()};
    if(p.id===INBOX&&url){
      it.url=url;
      if(!it.text) it.text=shortUrl(url);
      fetchMeta(url).then(meta=>{
        let ch=false;
        if(meta.image&&!it.preview){ it.preview=meta.image; ch=true }
        if(meta.title&&(!it.text||it.text===shortUrl(url))){ it.text=meta.title; ch=true }
        if(ch){ saveProject(p,true); if(st.openId===p.id) renderProject() }
      });
    }else if(url){ it.text=[text,url].filter(Boolean).join(' ') }
    p.tasks.push(it);
    if(!SPECIAL(p.id)) touchProject(p);
    saveProject(p,true);
    what=p.id===INBOX?'Saved to Ideas':'Task added';
  }
  if(file) await setCapturePhoto(p,file);
  sortProjects(); renderSide();
  if(st.openId===p.id) renderProject();
  else if(!st.openId&&!st.focus&&!st.hist) renderAll();
  const subl=[ex.due?'due '+dueLabel(ex.due):'',ex.rep?repLabel(ex.rep):'',p.id===WANT&&ex.price?money(ex.price):''].filter(Boolean).join(' · ');
  toast(what,{sub:subl,action:'Open',onAction:()=>openProject(target)});
}

  if(document.querySelector('.cap-wrap')) return;
  let target=st.spend?'spent':(st.openId||INBOX);                       // внутри раздела — пишем в него

      ${micBtn('#capText')}

    </div>
  </div>`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('in'));
  { const on=el.querySelector('.cap-t.on'), box=el.querySelector('#capTargets'); if(on&&box) box.scrollLeft=Math.max(0,on.offsetLeft-box.offsetLeft-16) }

  const close=()=>{ el.classList.remove('in'); setTimeout(()=>el.remove(),220) };

    else { paste.classList.remove('has'); hint.textContent='tap to paste' }
  };
  // пробуем прочитать буфер сразу — где разрешено, сработает без нажатия
  readClip().then(v=>{ if(v&&URL_RE.test(v)) showClip(v.match(URL_RE)[0]); else showClip('') });

  paste.addEventListener('click',async()=>{
    if(clip){ submit(); return }
    const v=await readClip();
    URL_RE.lastIndex=0;
    const m=v&&v.match(URL_RE);
    if(m) showClip(m[0]);
    else { ta.focus(); toast('Clipboard is empty',{kind:'warn',sub:'copy a link first'}) }
  });

      el.querySelector('#cpPhotoLabel').textContent='1 photo';
      el.querySelector('#capPhoto').classList.add('has');
    });
  });

  const submit=async()=>{
    const text=ta.value.trim();
    if(!text&&!clip&&!file){ ta.focus(); return }

    if(target==='spent'){

    }

    if(target===TODO) await saveCapture(TODO,q.task,clip||q.url,file,{cat:'other',due:q.due,rep:q.rep});
    else await saveCapture(target,q?q.text:text,clip||(q?q.url:''),file,q?{price:q.price}:{cat:'other'});
  };
  el.querySelector('#capSend').addEventListener('click',submit);
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) submit() });
  el.addEventListener('click',e=>{ if(e.target===el) close() });
  const esckey=e=>{ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',esckey,true) } };

function addExpense(raw,_cat,at){
  const p=wantP(); if(!p) return null;
  const r=typeof raw==='object'?raw:parseSpend(raw);
  const gamble=r.gin!=null||r.gout!=null;
  if(!gamble&&!(r.price>0)){ toast('Add an amount, like “coffee 4”'); return null }
  const rc=recognise(r.text);
  let cur=r.cur;
  if(!cur&&rc.svc){                                     /* сервис — в той валюте, в которой его записывали последний раз */
    const n=normName(r.text), prev=(p.tasks||[]).slice().reverse().find(t=>isExp(t)&&normName(t.text)===n&&layObj(t).cur);
    if(prev) cur=layObj(prev).cur;
  }
  const inc=!gamble&&!!r.inc;
  const icat=inc?(r.cat&&ICAT_ID[r.cat]?r.cat:incomeCat(r.text)||'incother'):'';
  /* «X monthly», когда X уже повторяется: обновляем ту запись, второй не заводим */
  if(r.rep&&!gamble&&r.text){
    const n=normName(r.text), head=(p.tasks||[]).find(t=>isExp(t)&&layObj(t).rep==='month'&&normName(t.text)===n);
    if(head){
      head.price=r.price; setLayRaw(head,{cur:cur||layObj(head).cur||curSym()}); fxStamp(head);
      if(inc) setLayRaw(head,{inc:1,ecat:icat});
      saveProject(p,true); st.spLast=head.id; st.spUpdated=head.id;
      return head;
    }
  }
  const it={id:uid(),text:r.text||(inc?SCAT[icat].l:rc.cat?SCAT[rc.cat].l:'Expense'),price:gamble?Math.max(0,(r.gin||0)-(r.gout||0)):r.price,url:'',done:true,doneAt:at||r.at||Date.now(),created:Date.now()};
  setLayRaw(it,{exp:1,ecat:inc?icat:(r.cat||rc.cat||(gamble?'gambling':'other')),cur:cur||curSym()});
  if(inc) setLayRaw(it,{inc:1});
  if(gamble) setLayRaw(it,{gin:Number(r.gin)||0,gout:Number(r.gout)||0});
  fxStamp(it);
  if(r.rep&&!gamble) setLayRaw(it,{rep:'month',rday:new Date(it.doneAt).getDate()});
  p.tasks=p.tasks||[]; p.tasks.push(it);
  saveProject(p,true); blip('add');
  st.spLast=it.id;
  if(!inc&&!rc.cat&&!r.cat&&r.text&&!gamble) aiCatFor(it);
  return it;
}

/* ───────── calendar: everything that has a date, in one place ─────────
   Own entries (birthdays, anniversaries, expiry dates) live in the built-in "dates" list:
   kind 'date', layout {date:'YYYY-MM-DD', yearly:1?, dk:'birthday'|'expiry'|'date', ahead:N}.
   Tasks, repeats and monthly money are read from their own sections; here they can only be done or moved. */
const datesP=()=>st.projects.find(x=>x.id===DATES);
const DK={birthday:{e:'🎂',l:'Birthday'},anniv:{e:'💍',l:'Anniversary'},expiry:{e:'📄',l:'Expires'},date:{e:'📌',l:'Date'}};
const BDAY_RE=/(день рожд|днюх|\bдр\b|birthday|bday|b-day)/i, ANNIV_RE=/(годовщин|anniversary)/i, EXP_RE=/(страхов|insurance|виз[аы]|visa|паспорт|passport|прав[аы]\b|licen[cs]e|истека|expire|продлить|renew|срок действия|до\s*$|until\s*$)/i;
function dateKind(text){ return BDAY_RE.test(text)?'birthday':ANNIV_RE.test(text)?'anniv':EXP_RE.test(text)?'expiry':'date' }
/* следующий раз, когда наступает дата (для ежегодных — в этом или следующем году) */
function dateNext(it,from){
  const L=layObj(it), d=L.date; if(!d) return null;
  const f=from||ld();
  if(!L.yearly) return d>=f?d:null;
  const md=d.slice(5); let y=+f.slice(0,4);
  let c=y+'-'+md; if(c<f) c=(y+1)+'-'+md;
  if(md==='02-29'&&!(new Date(+c.slice(0,4),1,29).getDate()===29)) c=c.slice(0,5)+'02-28';
  return c;
}
function daysTo(day){ return Math.round((new Date(day+'T12:00')-new Date(ld()+'T12:00'))/864e5) }
/* что скоро: свои даты за N дней (по умолчанию 7) и в сам день */
function dateAlerts(){
  if(LS.get('pm:calOff')==='1') return [];
  const p=datesP(); if(!p) return [];
  return (p.tasks||[]).map(t=>{ const n=dateNext(t); if(!n) return null; const d=daysTo(n), a=Number(layObj(t).ahead)||7; return d>=0&&d<=a?{t,day:n,d}:null }).filter(Boolean).sort((a,b)=>a.d-b.d);
}
const whenLabel=d=>d===0?'today':d===1?'tomorrow':'in '+d+' days';
/* все события за период [a..b] */
function calEvents(a,b){
  const out=[];
  st.projects.forEach(p=>{ if(p.archived||p.id===DATES||p.id===JOURNAL) return;
    (p.tasks||[]).forEach(t=>{
      if(t.done||t.kind==='sticky'||t.kind==='link'||t.kind==='quick') return;
      const d=dueOf(t); if(!d) return;
      if(d>=a&&d<=b) out.push({day:d,type:'task',p,t});
      const r=repOf(t); if(!r) return;
      let n=d, g=0; while(g++<60){ n=nextDue(n,r); if(n>b) break; if(n>=a) out.push({day:n,type:'rep',p,t}) }
    }) });
  (wantP()?wantP().tasks:[]).filter(t=>isExp(t)&&layObj(t).rep==='month').forEach(t=>{
    let x=nextCharge(t), g=0;
    while(g++<24){ const d=ld(x); if(d>b) break; if(d>=a) out.push({day:d,type:'money',t}); x=new Date(x.getFullYear(),x.getMonth()+1,Math.min(layObj(t).rday||x.getDate(),new Date(x.getFullYear(),x.getMonth()+2,0).getDate())) }
  });
  const dp=datesP();
  (dp?dp.tasks:[]).forEach(t=>{ const L=layObj(t); if(!L.date) return;
    if(!L.yearly){ if(L.date>=a&&L.date<=b) out.push({day:L.date,type:'date',t}); return }
    for(let y=+a.slice(0,4); y<=+b.slice(0,4); y++){ const c=y+L.date.slice(4); if(c>=a&&c<=b) out.push({day:c,type:'date',t}) }
  });
  const order={date:0,task:1,rep:2,money:3};
  return out.sort((x,y)=>x.day.localeCompare(y.day)||order[x.type]-order[y.type]);
}
function evIcon(e){
  if(e.type==='date') return (DK[layObj(e.t).dk]||DK.date).e;
  if(e.type==='money') return spIcon(e.t);

}
function evText(e){
  if(e.type==='date') return esc(e.t.text||'');
  if(e.type==='money') return esc(spName(e.t))+' <b class="'+(isInc(e.t)?'g-win':'')+'">'+(isInc(e.t)?'+':'')+amtStr(Number(e.t.price),curOf(e.t))+'</b>';

/* одна строка: «день рождения мамы 14 марта», «страховка до 20.01», «позвонить в банк в пятницу» */
function calAdd(raw,day){
  const txt=String(raw||'').trim(); if(!txt) return null;
  const nd=nlDate(txt);
  let text=(nd?nd.rest:txt).replace(/\s+(до|until|by|expires|истекает|на)$/i,'').trim()||txt;
  const when=nd?nd.due:day;
  if(!when){ toast('Add a date, like “14 March” or “20.01”',{kind:'warn'}); return null }
  const dk=dateKind(txt);
  if(dk==='date'&&!/(дата|date|событи|event|праздник|holiday)/i.test(txt)){
    /* обычное дело с датой — в To do */
    const td=st.projects.find(x=>x.id===TODO); const it={id:uid(),text,cat:'other',url:'',note:'',done:false,created:Date.now()};
    setDue(it,when); const q=parseQuick(text); if(q.rep){ setLay(it,'rep',q.rep); it.text=q.task||text }
    td.tasks.push(it); saveProject(td,true);
    toast('Task on '+dueLabel(when),{sub:'To do',action:'Undo',onAction:()=>{ td.tasks=td.tasks.filter(x=>x.id!==it.id); saveProject(td,true); refreshView() }});
    return it;
  }
  const p=datesP(); const it={id:uid(),kind:'date',text:text.charAt(0).toUpperCase()+text.slice(1),done:false,created:Date.now()};
  setLay(it,'date',when); setLay(it,'dk',dk); if(dk==='birthday'||dk==='anniv') setLay(it,'yearly',1);
  p.tasks.push(it); saveProject(p,true);
  toast(DK[dk].e+' '+it.text,{sub:(dk==='birthday'||dk==='anniv'?'every year on ':'on ')+dueLabel(when)+' · reminded 7 days ahead',action:'Undo',onAction:()=>{ p.tasks=p.tasks.filter(x=>x.id!==it.id); saveProject(p,true); refreshView() }});
  return it;
}

/* всё по дням: сделано, добавлено, деньги, заметка */
function jrnCollect(){
  const D={}, at=day=>D[day]||(D[day]={day,done:[],ideas:[],wishes:[],spent:0,earned:0,nMoney:0,note:null});

      if(t.created&&p.id===INBOX) at(dk(t.created)).ideas.push({p,t});
      if(t.created&&p.id===WANT&&!money) at(dk(t.created)).wishes.push({p,t});

  return D;

function pickDue(pr,task){

    </div>

      .map(([k,l])=>`<button data-rep="${k}" class="${repOf(task)===k?'on':''}">${l}</button>`).join('')}</div>
    <label class="rep-n">Every <input type="number" min="2" max="365" inputmode="numeric" id="repN" value="${/^d\d+$/.test(repOf(task))?repOf(task).slice(1):''}" placeholder="N"> days${repOf(task)&&!/^(day|wd|week|w2|month)$/.test(repOf(task))?` <b>· now ${esc(repLabel(repOf(task)))}</b>`:''}</label>
    ${cur?`<button class="danger" data-d="">No date</button>`:''}
  </div>`;
  let dirty=false;
  const close=()=>{ el.remove(); if(dirty) refreshView() };

    if(!d&&wasD) toast('Date cleared',{action:'Undo',onAction:()=>{ setDue(task,wasD); setLay(task,'rep',wasR); saveProject(pr,true); refreshView() }});

(()=>{
  let sx=0, sy=0, row=null, dx=0, horiz=null;
  document.addEventListener('touchstart',e=>{
    const r=e.target.closest('#view [data-row]'); if(!r||e.target.closest('input,textarea,.subs')||e.touches.length>1){ row=null; return }
    row=r; sx=e.touches[0].clientX; sy=e.touches[0].clientY; dx=0; horiz=null;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!row) return;
    const x=e.touches[0].clientX-sx, y=e.touches[0].clientY-sy;
    if(horiz===null&&(Math.abs(x)>10||Math.abs(y)>10)) horiz=Math.abs(x)>Math.abs(y)*1.4;
    if(!horiz) return;
    dx=Math.max(-140,Math.min(140,x));
    row.style.transform='translateX('+dx+'px)'; row.classList.add('swiping');
    row.dataset.swipe=dx>0?'done':'later'; row.classList.toggle('armed',Math.abs(dx)>90);
  },{passive:true});
  document.addEventListener('touchend',()=>{
    if(!row) return;
    const r=row, d=dx; row=null;
    r.style.transform=''; r.classList.remove('swiping','armed');
    if(!horiz) return;
    const ref=rowRef(r); if(!ref) return;
    if(d>90) rowDone(ref); else if(d<-90&&!ref.t.done) rowLater(ref);
  });
})();

  const move=n=>{ if(!rows.length) return; let i=cur?rows.indexOf(cur):-1; i=Math.max(0,Math.min(rows.length-1,i+n)); if(cur) cur.classList.remove('kfocus'); rows[i].classList.add('kfocus'); rows[i].scrollIntoView({block:'nearest'}) };
  if(!rows.length) return;
  if(e.key==='ArrowDown'||(e.key==='j'&&cur)){ e.preventDefault(); e.stopImmediatePropagation(); return move(1) }
  if(e.key==='ArrowUp'||(e.key==='k'&&cur)){ e.preventDefault(); e.stopImmediatePropagation(); return move(-1) }
  if(!cur) return;
  const ref=rowRef(cur); if(!ref) return;
  if(e.key===' '||e.key==='x'){ e.preventDefault(); e.stopImmediatePropagation(); const id=cur.dataset.row; rowDone(ref); setTimeout(()=>{ const n=document.querySelector(`#view [data-row="${id}"]`); if(n) n.classList.add('kfocus') },60); return }
  if(e.key==='d'){ e.preventDefault(); e.stopImmediatePropagation(); pickDue(ref.p,ref.t); return }
  if(e.key==='t'){ e.preventDefault(); e.stopImmediatePropagation(); rowLater(ref); return }
  if(e.key==='Enter'){ const ex=cur.querySelector('[data-tdexp],[data-taskexp]'); if(ex){ e.preventDefault(); ex.click() } return }
  if(e.key==='Escape') cur.classList.remove('kfocus');
},true);

    const ps=await localProjects();
    return ps.filter(p=>!SPECIAL(p.id)).length>0
        || ps.some(p=>(p.tasks||[]).length>0);
  }catch(e){ return false }
}

async function migrateLocal(){
  toast('Uploading your local data…');
  try{
    const ps=await localProjects();
    const phs=await localPhotos();
    for(const p of ps){
      const copy=Object.assign({},p);
      if(SPECIAL(p.id)){
        const cloud=st.projects.find(x=>x.id===p.id);
        if(cloud) copy.tasks=(cloud.tasks||[]).concat(p.tasks||[]);
      }
      await putProject(copy);
    }
    for(const ph of phs){
      if(!ph.blob) continue;
      await putPhoto({id:ph.id,pid:ph.pid,item:ph.item||null,name:ph.name,created:ph.created,
        x:ph.x,y:ph.y,w:ph.w,r:ph.r,z:ph.z,blob:ph.blob});
    }
    migrateOffer=false;
    LS.set('pm:migrated','1');
    await reload();
    toast('Everything moved to the cloud');
  }catch(e){ console.error(e); toast('Migration failed — your local copy is untouched') }
}

async function reload(){
  try{
    st.projects=await allProjects();
    setNet(true);
    st.projects.forEach(p=>localPut('projects',JSON.parse(JSON.stringify(p))));
    st.projects.forEach(p=>{ baseline[p.id]=snapOf(p) });      // чтобы отменялось и самое первое действие
  }catch(e){
    const mirror=await localProjects().catch(()=>[]);
    if(!mirror.length) throw e;
    st.projects=mirror;
    setNet(false);
    toast('Offline — showing the copy saved on this device');
  }
  if(!st.projects.some(p=>p.id===INBOX)){const ib=makeInbox();await putProject(ib);st.projects.push(ib)}
  if(!st.projects.some(p=>p.id===WANT)){const wl=makeWant();await putProject(wl);st.projects.push(wl)}
  if(!st.projects.some(p=>p.id===TODO)){const td=makeTodo();await putProject(td);st.projects.push(td)}if(!st.projects.some(p=>p.id===DATES)){const dt=makeDates();await putProject(dt);st.projects.push(dt)}if(!st.projects.some(p=>p.id===JOURNAL)){const jr=makeJournal();await putProject(jr);st.projects.push(jr)}
  sortProjects();
  applyHash();
  route();
}

function showGate(msg){
  hideBoot();
  const g=document.getElementById('gate');
  g.style.display='';
  if(msg) document.getElementById('gErr').textContent=msg;
  setTimeout(()=>{const m=document.getElementById('gMail'); if(m) m.focus()},40);
}

function hideBoot(){
  const b=document.getElementById('boot');
  if(!b) return;
  b.classList.add('gone');
  setTimeout(()=>{ b.style.display='none'; b.classList.remove('gone') },320);
  document.body.classList.add('booted');
}

async function afterLogin(){
  document.getElementById('gate').style.display='none';
  document.getElementById('boot').style.display='';
  document.getElementById('boot').classList.remove('gone');
  try{
    try{ if(!db) db=await openDB() }catch(e){}
    await flushQueue();
    await reload();
    const empty=st.projects.filter(p=>!SPECIAL(p.id)).length===0;
    if(empty&&LS.get('pm:migrated')!=='1'&&await localHasData()) migrateOffer=true;
    try{ localStorage.removeItem('pm:hints') }catch(e){}
    try{ localStorage.removeItem('pm:light') }catch(e){}
    syncSidebarButton();
    window.addEventListener('resize',syncSidebarButton);
    route();
    if(spendRoll()) renderSide();
    /* «важное» теперь — это закреплённое; флаг в данных остаётся как был */
    st.projects.forEach(p=>{ if(p.important&&!p.pinned&&!SPECIAL(p.id)){ p.pinned=true; saveProject(p,true) } }); sortProjects();
    loadRates().then(c=>{ if(c){ renderSide(); if(st.spend) renderSpend() } });
    setTimeout(()=>{ trashSweep() },5000);
    if(/[?&]shared=1/.test(location.search)) openShared();
    else setTimeout(()=>{ showDigest(); checkRemind() },700);
  }catch(e){
    console.error(e);
    document.getElementById('view').innerHTML='<div class="pad"><h1 style="font-family:var(--display);font-size:20px">Could not reach the database</h1><p class="lede">Check your connection and reload. If it keeps failing, the tables or their access rules may not be set up yet.</p></div>';
  }
  hideBoot();
}

document.getElementById('gateForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('gGo'), err=document.getElementById('gErr');
  err.textContent=''; btn.disabled=true; btn.textContent='Signing in…';
  const {error}=await sb.auth.signInWithPassword({
    email:document.getElementById('gMail').value.trim(),
    password:document.getElementById('gPass').value
  });
  btn.disabled=false; btn.textContent='Sign in';
  if(error){ err.textContent=/Invalid/i.test(error.message)?'Wrong email or password.':error.message; return }
});

document.getElementById('signOut').addEventListener('click',async()=>{
  if(!confirm('Sign out of this device?')) return;
  await sb.auth.signOut();
  location.reload();
});

function dataSig(list){
  return (list||[]).map(p=>[p.id,p.name,p.status,p.important?1:0,p.archived?1:0,p.pinned?1:0,
    p.ord,p.cover||'',p.revisit||'',p.updated||0,(p.tasks||[]).length,
    (p.tasks||[]).filter(t=>t.done).length].join('~')).sort().join('|');
}
window.addEventListener('focus',async()=>{
  if(!ME||!lastLoad) return;
  if(Date.now()-lastLoad<30000) return;
  try{
    const before=dataSig(st.projects);
    const fresh=await allProjects();
    if(dataSig(fresh)===before) return;      // ничего не менялось — не трогаем экран
    const open=st.openId;
    st.projects=fresh;
    sortProjects();
    if(open&&!st.projects.some(p=>p.id===open)) st.openId=null;
    route();
  }catch(e){}
});

(async function start(){
  if(!window.supabase){
    hideBoot();
    document.getElementById('view').innerHTML='<div class="pad"><h1 style="font-family:var(--display);font-size:20px">Offline</h1><p class="lede">The app could not load its cloud library. Check your connection and reload the page.</p></div>';
    return;
  }
  if(await tryShared()) return;
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  const {data}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='SIGNED_IN'&&session&&!ME){ ME=session.user; afterLogin() }
    if(ev==='SIGNED_OUT'){ ME=null; location.reload() }
  });
  if(data&&data.session){ ME=data.session.user; await afterLogin() }
  else { hideBoot(); showGate('') }
})();
</script>
</body>
</html>
