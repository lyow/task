/* ───────── AI (ключ Claude API хранится только в этом браузере) ─────────
   Экономно по умолчанию: самая дешёвая модель, минимум размышлений, месячный потолок расходов.
   Запросы идут только по нажатию; единственное исключение — добавление покупки. */
const AI_MODEL='claude-haiku-5-5', AI_IN=0.10/1e6, AI_OUT=0.50/1e6, AI_SEARCH=0.01;
const aiKey=()=>LS.get('pm:aikey')||'';
const aiCap=()=>{ const v=parseFloat(LS.get('pm:aicap')); return isFinite(v)&&v>=0?v:1 };
const aiMonth=()=>ld().slice(0,7);
function aiSpend(){ let o={}; try{ o=JSON.parse(LS.get('pm:aispend')||'{}')||{} }catch(e){} return o.m===aiMonth()?o:{m:aiMonth(),usd:0,n:0} }
function aiBill(usage){
  const o=aiSpend(), u=usage||{};
  o.usd+=(u.input_tokens||0)*AI_IN+(u.output_tokens||0)*AI_OUT+((u.server_tool_use&&u.server_tool_use.web_search_requests)||0)*AI_SEARCH;
  o.n++; LS.set('pm:aispend',JSON.stringify(o));
}
const CUR_NAME={'$':'US dollars','€':'euros','֏':'Armenian drams','₽':'Russian rubles','£':'British pounds'};
async function aiCall(body){
  if(aiSpend().usd>=aiCap()){ const e=new Error('cap'); e.status='cap'; throw e }
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':aiKey(),'anthropic-version':'2026-10-21',
      'anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error((j.error&&j.error.message)||('HTTP '+r.status)); e.status=r.status; throw e }
  aiBill(j.usage);
  return j;
}
/* один вопрос — один короткий ответ. tools: 'search' | 'fetch' | undefined */
async function aiAsk(prompt,tool){
  const variants=tool==='search'?[{type:'web_search_20250305',name:'web_search',max_uses:1},{type:'web_search_20260209',name:'web_search',max_uses:1}]
    :tool==='fetch'?[{type:'web_fetch_20250910',name:'web_fetch',max_uses:1,max_content_tokens:3000},{type:'web_fetch_20260209',name:'web_fetch',max_uses:1,max_content_tokens:3000}]
    :[null];
  let lastErr=null;
  for(const v of variants){
    const messages=[{role:'user',content:prompt}];
    try{
      let msg=null;
      for(let turn=0;turn<3;turn++){
        const body={model:AI_MODEL,max_tokens:2000,output_config:{effort:'low'},messages};
        if(v) body.tools=[v];
        msg=await aiCall(body);
        if(msg.stop_reason!=='pause_turn') break;
        messages.push({role:'assistant',content:msg.content});
      }
      if(!msg||msg.stop_reason==='refusal') return '';
      return (msg.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');
    }catch(e){ lastErr=e; if(e.status!==400) throw e }          // 400 — версия инструмента не подошла, пробуем другую
  }
  throw lastErr;
}
const lastJson=text=>{ const all=String(text||'').match(/\{[^{}]*\}/g); if(!all) return null; try{ return JSON.parse(all[all.length-1]) }catch(e){ return null } };
const aiWhy=e=>{ const m=((typeof e.status==='number'?'HTTP '+e.status+' · ':'')+String((e&&e.message)||'')).trim(); return m.length>120?m.slice(0,119)+'…':m };
/* ссылки, которые AI не смог прочитать — больше не пробуем и не считаем в кнопке */
const aiSkip=()=>{ try{ return JSON.parse(LS.get('pm:ainame')||'{}')||{} }catch(e){ return {} } };
function aiFail(e){
  console.error(e);
  toast(e.status==='cap'?'Monthly AI limit reached':e.status===401?'The AI key was rejected':e.status===429?'AI is busy, try later':'AI request failed',
    {kind:'bad',sub:e.status==='cap'?'raise it in settings → AI key':e.status===401?'check it in settings → AI key':aiWhy(e)});
}
const aiReady=()=>{ if(aiKey()) return true; openAiKey(); return false };
async function aiProduct(name){
  const j=lastJson(await aiAsk('Item on my wishlist: "'+name+'". Work out which product this most likely is, its typical current retail price new in '
    +(CUR_NAME[curSym()]||'US dollars')+', and one page for it (the maker\'s own product page if there is one, otherwise a major retailer). '
    +'If the name is too vague to identify a product, use nulls. Finish with one line of JSON and nothing after it: '
    +'{"name": "<proper product name>", "price": <number or null>, "url": "<https link or null>"}','search'));
  if(!j) return null;
  const price=typeof j.price==='number'&&isFinite(j.price)&&j.price>0?Math.round(j.price*100)/100:null;
  const url=typeof j.url==='string'&&/^https:\/\//i.test(j.url)?j.url:'';
  return {name:typeof j.name==='string'?j.name.trim().slice(0,120):'',price,url};
}
/* что это за ссылка — открываем страницу и называем в нескольких словах */
const ideaNamed=i=>{ const u=ideaUrl(i); return !u||(!!noUrl(i.text)&&noUrl(i.text)!==shortUrl(u)) };
async function aiNameIdea(p,i){
  const u=ideaUrl(i); if(!u) return false;
  if(isThreads(u)){ const j=await jinaMeta(u); if(j){ i.url=u; i.text=j.title; saveProject(p,true); return true } }
  const j=lastJson(await aiAsk('Open this link: '+u+'\nSay what the post, video or page is about as a short title of at most 9 words, in the language of its content. '
    +'If you cannot read it, use null. Finish with one line of JSON and nothing after it: {"title": "<title or null>"}','fetch'));
  const t=j&&typeof j.title==='string'?j.title.trim().slice(0,110):'';
  if(!t||/^null$/i.test(t)) return false;
  i.url=u; i.text=t; saveProject(p,true);
  return true;
}
let aiBusy=false;
async function aiNameAll(p){
  if(!aiReady()||aiBusy) return;
  const sk=aiSkip();
  const list=ideasOf(p).filter(i=>ideaUrl(i)&&!ideaNamed(i)&&i.cat!==ARCHIVE&&!sk[i.id]).reverse();
  if(!list.length) return;
  aiBusy=true;
  let ok=0, tried=0, miss=0, inRow=0, err=null, fatal=null;
  const hosts={};
  const btn=()=>$('#aiNameAll');
  const show=t=>{ const b=btn(); if(b){ b.disabled=true; b.innerHTML=svg('spark',14,1.9)+' '+t } };
  for(let k=0;k<list.length;k++){
    show('Naming '+(k+1)+' of '+list.length+'…');
    tried++;
    let named=false;
    try{ named=await aiNameIdea(p,list[k]) }
    catch(e){
      if(e.status==='cap'||e.status===401||e.status===429){ fatal=e; break }
      err=e; inRow++;
      if(inRow>=3) break;
      continue;
    }
    if(named){
      ok++; inRow=0;
      const el=document.querySelector('.idea[data-id="'+list[k].id+'"]');
      if(el&&st.openId===p.id) el.outerHTML=ideaCard(p,list[k],st.ideaFolder||'');
    }else{
      miss++; inRow++;
      sk[list[k].id]=1; LS.set('pm:ainame',JSON.stringify(sk));
      const h=linkKind(ideaUrl(list[k])).name; hosts[h]=(hosts[h]||0)+1;
      if(inRow>=3) break;
    }
  }
  aiBusy=false;
  if(st.openId===p.id) renderProject();
  if(fatal) return aiFail(fatal);
  const left=list.length-tried;
  const host=Object.keys(hosts).sort((a,b)=>hosts[b]-hosts[a])[0];
  if(err&&!ok) return toast('AI request failed',{kind:'bad',sub:aiWhy(err)});
  if(!ok) return toast(host?'Could not read '+host+' links':'Nothing named',{kind:'warn',sub:'Name them by hand: “name it” under each link'});
  toast('Named '+ok+' of '+list.length,{kind:'ok',sub:[miss?miss+' could not be read'+(host?' ('+host+')':''):'',err?'some requests failed: '+aiWhy(err):'',left?left+' left for later':''].filter(Boolean).join(' · ')});
}
/* шаги для задачи и план для пустого проекта */
async function aiSteps(p,tid){
  if(!aiReady()) return false;

    if(!steps.length){ toast('No steps came back',{kind:'warn'}); return false }

/* «Auto» в поле записи: сам решает — идея, задача или покупка, вынимает срок и цену */
async function aiSort(raw){
  const d=new Date();
  const j=lastJson(await aiAsk('Sort this note for a personal organiser. Note: "'+raw+'". Today is '+ld()+' ('+WEEK[d.getDay()]+'). '
    +'Lists: "idea" (a thought, a link, something to remember), "task" (something to do), "buy" (something to purchase). '

    +'Finish with one line of JSON and nothing after it: {"list": "idea|task|buy", "text": "<the note>", "due": "<YYYY-MM-DD or null>", "price": <number or null>}'));
  if(!j||typeof j.text!=='string'||!j.text.trim()) return null;

    price:typeof j.price==='number'&&isFinite(j.price)&&j.price>0?j.price:null};

/* дополняем покупку: цену (помечаем как примерную), ссылку и по ней — картинку. Своё не перезаписываем */
async function aiFillWish(p,item,loud){
  if(!aiKey()){ if(loud) openAiKey(); return }
  if(item._ai) return; item._ai=true;
  if(loud) toast('Looking it up…');
  try{
    const f=await aiProduct(item.text);
    if(!f||(!f.price&&!f.url)){ if(loud) toast('Nothing found for that name',{kind:'warn'}); return }
    let ch=false;
    if(f.price&&(item.price==null||item.price==='')){ item.price=f.price; setLay(item,'approx',1); ch=true }
    if(f.url&&!item.url){ item.url=f.url; ch=true; if(!item.preview) wishFill(p,item,false) }
    if(ch){
      saveProject(p,true);
      wishRerender(p);
      renderSide();
      toast(f.price?'About '+money(f.price):'Found the page',{sub:f.name||item.text});
    }else if(loud) toast('Already filled in');
  }catch(e){ if(loud||e.status!=='cap') aiFail(e) }
  finally{ delete item._ai }
}

/* покупка со ссылкой: картинку (и название, если его не дали) берём со страницы товара */
function wishRerender(p){

function wishFill(p,item,needTitle){
  fetchMeta(item.url).then(meta=>{

function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,'') }catch(e){ return '' } }
function favOf(u){ const h=hostOf(u); return h?'https://icons.duckduckgo.com/ip3/'+h+'.ico':'' }

function embedOf(u){
  u=String(u||''); let m;
  if((m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/)))
    return {src:'https://www.youtube.com/embed/'+m[1]+'?autoplay=1&rel=0',wide:!/shorts/.test(u)};
  if((m=u.match(/vimeo\.com\/(\d+)/)))
    return {src:'https://player.vimeo.com/video/'+m[1]+'?autoplay=1',wide:true};
  if((m=u.match(/instagram\.com\/(p|reel|reels|tv)\/([\w-]+)/)))
    return {src:'https://www.instagram.com/'+(m[1]==='reels'?'reel':m[1])+'/'+m[2]+'/embed',wide:false};
  if((m=u.match(/tiktok\.com\/.*\/video\/(\d+)/)))
    return {src:'https://www.tiktok.com/embed/v2/'+m[1],wide:false};
  return null;
}

function autoThumb(u){
  const yt=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/);
  if(yt) return 'https://img.youtube.com/vi/'+yt[1]+'/hqdefault.jpg';
  return '';
}
async function tiktokMeta(u){
  // официальный публичный oEmbed TikTok — не требует ключа, надёжнее сторонних сервисов
  if(!/tiktok\.com/i.test(u)) return null;
  try{
    const r=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(u));
    if(!r.ok) return null;
    const j=await r.json();
    return {image:j.thumbnail_url||'',title:(j.title||'').trim().slice(0,90)};
  }catch(e){ return null }
}
/* Jina reader: открывает страницу без ключа. Для Threads — основной источник, для прочего — запасной. Instagram не читает (страница входа) */
const isThreads=u=>/(^|\.)threads\.(net|com)$/.test(hostOf(u));
const jinaTried={};                                  /* один запрос на адрес за заход, ответ общий */
function jinaMeta(u){
  if(!u||/instagram\.com$/.test(hostOf(u))) return Promise.resolve(null);
  return jinaTried[u]||(jinaTried[u]=jinaFetch(u));
}
async function jinaFetch(u){
  try{
    const r=await fetch('https://r.jina.ai/'+u,{headers:{accept:'application/json'}});
    if(!r.ok) return null;
    const d=((await r.json())||{}).data||{};
    const clean=x=>String(x||'').replace(/\s+/g,' ').trim();
    const title=clean(d.title), fin=String(d.finalUrl||d.url||'');
    if(/\/login|\/accounts\//i.test(fin)) return null;
    if(!title||/^(threads|instagram|x|twitter|tiktok|log ?in|sign ?in)$/i.test(title)) return null;
    let text=clean(d.description);
    if(!text||/followers|log in|sign up/i.test(text)){
      text=(String(d.content||'').split(/\n/).map(clean).find(l=>l.length>15&&!/^(!?\[|#|\*|>|https?:|title:|url source)/i.test(l)&&!/log in|sign up|followers/i.test(l))||'');
    }
    const who=(title.match(/\(@([\w.]+)\)/)||[])[1];
    const head=title.replace(/\s*(•|on|\|)\s*Threads.*$/i,'').trim();
    let name=text?(who&&!text.includes('@'+who)?'@'+who+': ':'')+text:head;
    name=name.replace(/^["“]|["”]$/g,'');
    if(name.length>90) name=name.slice(0,89).replace(/\s+\S*$/,'')+'…';
    return name?{title:name,image:d.image||''}:null;
  }catch(e){ return null }
}
async function fetchMeta(u){
  const out={image:autoThumb(u)||'',title:''};
  if(isThreads(u)){ const j=await jinaMeta(u); if(j){ out.title=j.title; if(j.image&&!out.image) out.image=j.image; return out } }
  const tt=await tiktokMeta(u);
  if(tt){ if(tt.image) out.image=tt.image; if(tt.title) out.title=tt.title; return out }
  if(out.image){                      // YouTube: название отдаёт сам YouTube, без посредников и лимитов
    try{
      const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(u));
      if(r.ok){ const j=await r.json(); if(j&&j.title){ out.title=String(j.title).trim().slice(0,110); return out } }
    }catch(e){}
  }
  try{
    const r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(u));
    const j=await r.json();
    if(!j||j.status!=='success'){
      const jm=await jinaMeta(u); if(jm){ out.title=jm.title; return out }
      out.fail=r.status===429||r.status>=500; out.miss=true; return out }
    const d=j.data||{};
    if(!out.image&&d.image&&d.image.url) out.image=d.image.url;
    const clean=x=>String(x||'').replace(/\s+/g,' ').trim();
    const generic=x=>!x||/^(instagram|threads|tiktok|youtube|log ?in|sign ?in|just a moment)\b.{0,12}$/i.test(x);
    const social=/instagram\.com|threads\.(net|com)|tiktok\.com|(^|\.)x\.com|twitter\.com/.test(hostOf(u));
    const ti=clean(d.title), de=clean(d.description);
    const pick=social&&de&&!/followers|log in|sign up/i.test(de)?de:(!generic(ti)?ti:de);
    out.title=clean(pick).slice(0,110);
  }catch(e){ out.fail=true }
  return out;
}

async function fetchPreview(u){
  const direct=autoThumb(u);
  if(direct) return direct;
  try{
    const r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(u));
    const j=await r.json();
    return (j&&j.data&&j.data.image&&j.data.image.url)||'';
  }catch(e){ return '' }
}

function persistRefOrder(box,p){
  const domIds=Array.from(box.querySelectorAll('[data-ref]')).map(el=>el.dataset.ref);
  const wanted=domIds.slice().reverse();           // на экране новые сверху
  const links=linksOf(p);
  const byId={}; links.forEach(l=>byId[l.id]=l);
  const ordered=wanted.map(id=>byId[id]).filter(Boolean);
  let k=0;
  p.tasks=(p.tasks||[]).map(t=>t.kind==='link'?ordered[k++]:t);
  saveProject(p,true);
  toast('Order saved');
}

function bindRowScroll(box){
  if(!box||box.dataset.scrollBound) return;
  box.dataset.scrollBound='1';
  const wrap=box.closest('.row-wrap');

  const paintNav=()=>{
    if(!wrap) return;
    const max=box.scrollWidth-box.clientWidth-2;
    const prev=wrap.querySelector('.prev'), next=wrap.querySelector('.next');
    if(prev) prev.classList.toggle('hide',box.scrollLeft<=2);
    if(next) next.classList.toggle('hide',box.scrollLeft>=max||max<=0);
  };
  const step=()=>Math.max(200,Math.round(box.clientWidth*0.8));
  if(wrap) wrap.querySelectorAll('[data-rownav]').forEach(b=>b.addEventListener('click',e=>{
    e.preventDefault();
    box.scrollBy({left:step()*Number(b.dataset.rownav),behavior:'smooth'});
  }));
  box.addEventListener('scroll',paintNav,{passive:true});
  setTimeout(paintNav,60);
  window.addEventListener('resize',paintNav);

  // вертикальное колесо крутит ленту вбок
  box.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return;
    if(box.scrollWidth<=box.clientWidth) return;
    e.preventDefault();
    box.scrollLeft+=e.deltaY;
  },{passive:false});

  // протяжка мышью по пустому месту
  let down=false,sx=0,sl=0,moved=false;
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.button!==0) return;
    if(e.target.closest('button')) return;
    down=true; moved=false; sx=e.clientX; sl=box.scrollLeft;
  });
  box.addEventListener('pointermove',e=>{
    if(!down) return;
    const d=e.clientX-sx;
    if(Math.abs(d)>4){ moved=true; box.classList.add('dragging'); box.scrollLeft=sl-d }
  });
  const stop=e=>{
    if(!down) return;
    down=false; box.classList.remove('dragging');
    if(moved&&e){ e.preventDefault(); }
    setTimeout(()=>{moved=false},0);
  };
  box.addEventListener('pointerup',stop);
  box.addEventListener('pointerleave',stop);
  box.addEventListener('click',e=>{ if(moved){ e.preventDefault(); e.stopPropagation() } },true);
}

function bindRefDrag(box,p){
  let dragId=null;
  box.addEventListener('dragstart',e=>{
    const el=e.target.closest('[data-ref]'); if(!el) return;
    dragId=el.dataset.ref; el.classList.add('drag');
    e.dataTransfer.effectAllowed='move';
    try{ e.dataTransfer.setData('text/plain',dragId) }catch(_){}
  });
  box.addEventListener('dragend',e=>{
    const el=box.querySelector('.drag'); if(el) el.classList.remove('drag');
    dragId=null;
  });
  box.addEventListener('dragover',e=>{
    if(!dragId) return;
    e.preventDefault();
    const over=e.target.closest('[data-ref]');
    const el=box.querySelector('[data-ref="'+dragId+'"]');
    if(!over||!el||over===el) return;
    const r=over.getBoundingClientRect();
    const after=refListOn()?(e.clientY-r.top)>r.height/2:(e.clientX-r.left)>r.width/2;
    box.insertBefore(el,after?over.nextSibling:over);
  });
  box.addEventListener('drop',e=>{
    e.preventDefault(); if(!dragId) return;
    dragId=null;
    persistRefOrder(box,p);
  });

  // то же пальцем: долгое нажатие
  let held=null,timer=null,sy=0,moved=false;
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch') return;
    const el=e.target.closest('[data-ref]'); if(!el) return;
    if(e.target.closest('button')) return;
    sy=e.clientY; moved=false;
    timer=setTimeout(()=>{ held=el; el.classList.add('drag'); if(navigator.vibrate) navigator.vibrate(12) },350);
  });
  box.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch') return;
    if(!held){ if(timer&&Math.abs(e.clientY-sy)>9){ clearTimeout(timer); timer=null } return }
    moved=true; e.preventDefault();
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const over=under&&under.closest?under.closest('[data-ref]'):null;
    if(over&&over!==held&&over.parentNode===box){
      const r=over.getBoundingClientRect();
      const after=refListOn()?(e.clientY-r.top)>r.height/2:(e.clientX-r.left)>r.width/2;
      box.insertBefore(held,after?over.nextSibling:over);
    }
  });
  const end=()=>{
    clearTimeout(timer); timer=null;
    if(!held) return;
    held.classList.remove('drag'); held=null;
    if(moved) persistRefOrder(box,p);
  };
  box.addEventListener('pointerup',end);
  box.addEventListener('pointercancel',end);
}

const YEAR=60*60*24*365;

async function buildSnapshot(p){
  let rows=[];
  try{ rows=(await sb.from('photos').select('*').eq('project_id',p.id)).data||[] }catch(e){}
  const paths=rows.map(r=>r.path);
  let signed={};
  if(paths.length){
    try{
      const {data}=await sb.storage.from('photos').createSignedUrls(paths,YEAR);
      (data||[]).forEach(d=>{ if(d.path&&d.signedUrl) signed[d.path]=d.signedUrl });
    }catch(e){}
  }
  return {
    v:1, at:Date.now(),
    name:p.name||'Untitled', status:p.status, important:!!p.important,
    startDate:p.startDate||'', notes:p.notes||'', color:p.color||null,
    tasks:(p.tasks||[]).map(t=>({id:t.id,kind:t.kind||'task',text:t.text||'',done:!!t.done,
      url:t.url||'',note:t.note||'',preview:t.preview||'',cat:t.cat||'',
      subs:(t.subs||[]).map(x=>({text:x.text,done:!!x.done})),layout:t.layout||null})),
    photos:rows.map(r=>({id:r.id,item:r.item_id||null,url:signed[r.path]||'',
      x:r.x,y:r.y,w:r.w,r:r.r,z:r.z}))
  };
}

function shareUrl(token){
  return location.origin+location.pathname+'#s/'+token;
}

}

function ideaPreview(p,i){
  const url=ideaUrl(i), emb=embedOf(url);
  if(!emb){ window.open(url,'_blank','noopener'); return }
  const el=document.createElement('div');
  el.className='lb refprev';
  el.innerHTML=`
    <div class="embed-box ${emb.wide?'wide':'tall'}">
      <iframe src="${esc(emb.src)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </div>`;
  const inp=el.querySelector('#iprevName');

    el.remove();
  };
  el.addEventListener('click',e=>{
    if(e.target===el||e.target.closest('[data-close]')) return close();
    if(e.target.closest('[data-go]')){ window.open(url,'_blank','noopener'); return }
  });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); close() } e.stopPropagation() });
  document.body.appendChild(el);

async function retryMissingPreviews(p){
  const items=linksOf(p).filter(i=>i.url&&!i.preview&&!i._triedMeta);
  if(!items.length) return;
  const batch=items.slice(0,6);          // не бьём по квоте разом всей папкой
  for(const it of batch){
    it._triedMeta=true;                  // не пытаться повторно в этой сессии
    try{
      const meta=await fetchMeta(it.url);
      if(meta.image){ it.preview=meta.image; if(st.openId===p.id) renderProject() }
      if(meta.title&&it.text===shortUrl(it.url)){ it.text=meta.title; if(st.openId===p.id) renderProject() }
      if(meta.image||meta.title) saveProject(p,true);
    }catch(e){}
  }
}

function bindLinks(p){
  const la=$('#lAdd'); if(!la) return;
  const add=async()=>{
    const ui=$('#lUrl'), ni=$('#lName');

    if(!/^https?:\/\//i.test(u)) u='https://'+u;
    const item={id:uid(),kind:'link',text:ni.value.trim(),url:u,preview:'',done:false,created:Date.now()};
    p.tasks=p.tasks||[]; p.tasks.push(item);
    ui.value=''; ni.value='';
    const moved=touchProject(p);
    saveProject(p,true);
    if(moved) sortProjects();
    renderProject(); renderSide();
    const img=await fetchPreview(u);
    if(img){ item.preview=img; saveProject(p,true); renderProject() }
  };
  la.addEventListener('click',add);
  $('#lUrl').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  $('#lName').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  const rt=$('#refToggle');
  if(rt) rt.addEventListener('click',()=>{

    const sec=rt.closest('.refs-pane');
    if(sec) sec.classList.toggle('collapsed',!next);
  });
  const rv=$('#refView');
  if(rv) rv.addEventListener('click',()=>{
    st.refList=!st.refList; LS.set('pm:reflist',st.refList?'1':'0'); renderProject();
  });
  $('#lShot').addEventListener('click',()=>{
    const inp=$('#wishPick');
    inp.onchange=async ev=>{
      const f=ev.target.files[0]; ev.target.value='';
      if(!f) return;
      const item={id:uid(),kind:'link',text:$('#lName').value.trim(),url:'',preview:'',done:false,created:Date.now()};
      p.tasks=p.tasks||[]; p.tasks.push(item);
      $('#lName').value='';

      saveProject(p,true);
      if(moved) sortProjects();
      if(await setItemPhoto(p.id,item.id,f)){ renderProject(); renderSide(); toast('Reference added') }
    };

  });
  box.addEventListener('click',async e=>{
    const shot=e.target.closest('[data-shot]');
    if(shot&&!e.target.closest('[data-led]')&&!e.target.closest('[data-ldel]')){
      const ph=st.linkShots[shot.dataset.id];
      if(ph) lightbox(ph,ph.url);
      return;
    }
    const ed=e.target.closest('[data-led]'), dl=e.target.closest('[data-ldel]'),
          ls=e.target.closest('[data-lshot]');

    if(ls){

function bindIdeas(p){
  const fol=$('#folders');
  if(fol) fol.addEventListener('click',e=>{
    const ed=e.target.closest('[data-fedit]');
    if(ed){ e.stopPropagation(); const f=foldersOf(p).find(x=>x.id===ed.dataset.fedit); if(f) editFolder(p,f); return }
    if(e.target.closest('#folAdd')) return newFolder(p);
    const b=e.target.closest('[data-fol]');
    if(b){ st.ideaFolder=b.dataset.fol; renderProject() }
  });
  $('#view').querySelectorAll('[data-isrc]').forEach(b=>b.addEventListener('click',()=>{st.ideaSrc=b.dataset.isrc;renderProject()}));
  const na=$('#aiNameAll'); if(na) na.addEventListener('click',()=>aiNameAll(p));
  const box=$('#ideas'); if(!box) return;
  box.addEventListener('click',async e=>{
    const pvw=e.target.closest('[data-iprev]');
    if(pvw&&!(e.metaKey||e.ctrlKey||e.shiftKey)){
      e.preventDefault();
      const it=(p.tasks||[]).find(x=>x.id===pvw.dataset.iprev); if(it) ideaPreview(p,it);
      return;
    }
    if(e.target.closest('a')) return;
    const mk=e.target.closest('[data-mk]'), mv=e.target.closest('[data-mv]'),
          ed=e.target.closest('[data-ied]'), dl=e.target.closest('[data-idel]'),
          fo=e.target.closest('[data-ifol]'), nm=e.target.closest('[data-iname]');
    const id=(mk||mv||ed||dl||fo||nm||{}).dataset;
    if(!id) return;
    const key=mk?id.mk:mv?id.mv:ed?id.ied:fo?id.ifol:nm?id.iname:id.idel;
    const idea=(p.tasks||[]).find(x=>x.id===key); if(!idea) return;

    if(mk){
      const name=idea.text.length>64?idea.text.slice(0,64).trim()+'…':idea.text;
      const np={id:uid(),name,status:'idle',important:false,startDate:'',created:Date.now(),
        updated:Date.now(),tasks:[],notes:idea.text.length>64?idea.text:''};
      await putProject(np);
      p.tasks=p.tasks.filter(x=>x.id!==key); await putProject(p);
      st.projects.push(np); sortProjects();
      openProject(np.id); toast('Project created');
      return;
    }
    if(mv){
      pickProject(async tid=>{
        const target=st.projects.find(x=>x.id===tid); if(!target) return;
        target.tasks=target.tasks||[];
        target.tasks.push({id:uid(),text:idea.text,done:false});
        target.updated=Date.now();
        p.tasks=p.tasks.filter(x=>x.id!==key);
        await putProject(target); await putProject(p);
        sortProjects(); renderProject(); renderSide();
        toast('Moved to '+target.name);
      });
      return;
    }
    if(fo){
      pickFolder(p,fid=>{
        idea.cat=fid;
        saveProject(p,true); renderProject(); renderSide();
        toast(fid===ARCHIVE?'Archived':fid?'Moved':'Back to All',{sub:fid?folderName(p,fid):''});
      });
      return;
    }
    if(dl){
      const at=p.tasks.indexOf(idea);
      p.tasks=p.tasks.filter(x=>x.id!==key);
      saveProject(p,true); renderProject(); renderSide();
      toast('Deleted',{action:'Undo',onAction:()=>{ p.tasks.splice(Math.min(at,p.tasks.length),0,idea); saveProject(p,true); refreshView() }});
      return;
    }
    if(nm){                                       /* название ссылки: адрес уходит в url и не теряется */
      const card=box.querySelector(`.idea[data-id="${key}"]`); if(!card) return;
      const holder=card.querySelector('.idea-main'); if(!holder||card.querySelector('.idea-edit')) return;
      const inp=document.createElement('input');
      inp.className='idea-edit idea-name-in'; inp.placeholder='Name'; inp.setAttribute('aria-label','Name this link'); inp.autocomplete='off';
      holder.replaceWith(inp); inp.focus();
      let done=false;
      const finish=keep=>{
        if(done) return; done=true;
        const v=inp.value.trim();
        if(keep&&v){ idea.url=ideaUrl(idea); idea.text=v; saveProject(p,true); renderSide() }
        renderProject();
      };
      inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ev.preventDefault();finish(true)} if(ev.key==='Escape'){ev.preventDefault();finish(false)} });
      inp.addEventListener('blur',()=>finish(true));
      return;
    }
    if(ed){
      const card=box.querySelector(`.idea[data-id="${key}"]`); if(!card) return;
      const holder=card.querySelector('.idea-main'); if(!holder||card.querySelector('.idea-edit')) return;
      const u=ideaUrl(idea);
      if(u&&!idea.url){ idea.url=u; saveProject(p,true) }            /* голая ссылка: сначала прячем адрес в url, чтобы текстом его не стереть */
      const was=u?noUrl(idea.text):idea.text;
      const wrap=document.createElement('div'); wrap.className='idea-edit-wrap';
      const ta=document.createElement('textarea');
      ta.className='idea-edit'; ta.value=u&&was===shortUrl(u)?'':was; ta.placeholder=u?'Name or note':'';
      wrap.appendChild(ta);
      if(u){ const l=document.createElement('span'); l.className='idea-edit-link'; l.textContent=shortUrl(u); wrap.appendChild(l) }
      holder.replaceWith(wrap); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
      const finish=()=>{
        const v=ta.value.trim();
        if(v) idea.text=v; else if(u) idea.text='';
        saveProject(p,true); renderProject(); renderSide();
      };
      ta.addEventListener('blur',finish);
      ta.addEventListener('keydown',ev=>{
        if(ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();ta.blur()}
        if(ev.key==='Escape'){ta.value=was;ta.blur()}
      });
    }
  });
}

function persistTaskOrder(box,p){
  const ids=Array.from(box.querySelectorAll('[data-task]')).map(el=>el.dataset.task);
  const byId={}; tasksOf(p).forEach(t=>byId[t.id]=t);
  const ordered=ids.map(id=>byId[id]).filter(Boolean);
  let k=0;
  p.tasks=(p.tasks||[]).map(t=>(t.kind!=='link'&&t.kind!=='sticky')?ordered[k++]:t);
  saveProject(p,true);
  $('#taskList').innerHTML=renderTasks(tasksOf(p));
  bindTaskDrag($('#taskList'),p);
  updateBarAndNext(p); renderSide();
}

function bindTaskDrag(box,p){
  let dragId=null;
  box.addEventListener('dragstart',e=>{
    const li=e.target.closest('[data-task]'); if(!li) return;
    if(e.target.closest('input')) { e.preventDefault(); return }
    dragId=li.dataset.task; li.classList.add('drag');
    e.dataTransfer.effectAllowed='move';
    try{ e.dataTransfer.setData('text/plain',dragId) }catch(_){}
  });
  box.addEventListener('dragend',()=>{
    const el=box.querySelector('.drag'); if(el) el.classList.remove('drag');
    dragId=null;
  });
  box.addEventListener('dragover',e=>{
    if(!dragId) return;
    e.preventDefault();
    const over=e.target.closest('[data-task]');
    const el=box.querySelector('[data-task="'+dragId+'"]');
    if(!over||!el||over===el) return;
    const r=over.getBoundingClientRect();
    box.insertBefore(el,(e.clientY-r.top)>r.height/2?over.nextSibling:over);
  });
  box.addEventListener('drop',e=>{
    e.preventDefault(); if(!dragId) return;
    dragId=null; persistTaskOrder(box,p);
  });

  let held=null,timer=null,sy=0,moved=false;
  box.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch') return;
    const li=e.target.closest('[data-task]'); if(!li) return;
    if(e.target.closest('button')||e.target.closest('input')) return;
    sy=e.clientY; moved=false;
    timer=setTimeout(()=>{ held=li; li.classList.add('drag'); if(navigator.vibrate) navigator.vibrate(12) },350);
  });
  box.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch') return;
    if(!held){ if(timer&&Math.abs(e.clientY-sy)>9){ clearTimeout(timer); timer=null } return }
    moved=true; e.preventDefault();
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const over=under&&under.closest?under.closest('[data-task]'):null;
    if(over&&over!==held&&over.parentNode===box){
      const r=over.getBoundingClientRect();
      box.insertBefore(held,(e.clientY-r.top)>r.height/2?over.nextSibling:over);
    }
  });
  const end=()=>{
    clearTimeout(timer); timer=null;
    if(!held) return;
    held.classList.remove('drag'); held=null;
    if(moved) persistTaskOrder(box,p);
  };
  box.addEventListener('pointerup',end);
  box.addEventListener('pointercancel',end);
}

  $('#pTitle').addEventListener('input',e=>{
    p.name=e.target.value;
    $('#crumb').textContent=p.name||'Untitled';
    document.title=p.name||'Untitled';
    const r=document.querySelector(`[data-open="${p.id}"] .row-text`); if(r) r.textContent=p.name;
    saveProject(p);
  });
  const nt=$('#notes');
  if(nt) nt.addEventListener('input',e=>{
    const wasEmpty=!(p.notes||'').trim();
    p.notes=e.target.value;
    if(wasEmpty&&p.notes.trim()&&touchProject(p)){ sortProjects(); renderSide() }
    saveProject(p);
  });
  const add=()=>{
    const i=$('#taskInput'); if(!i) return;
    const v=i.value.trim(); if(!v) return;
    p.tasks=p.tasks||[];
    const item={id:uid(),text:v,done:false,created:Date.now()};
    if(p.id===INBOX){
      URL_RE.lastIndex=0;
      const m=v.match(URL_RE);
      if(m){
        let u=m[0]; if(!/^https?:/i.test(u)) u='https://'+u;
        item.url=u;
        item.text=v.replace(m[0],'').trim();
        if(!item.text) item.text=shortUrl(u);
      }
      const f=st.ideaFolder;
      if(f&&f!==ARCHIVE) item.cat=f;
    }
    p.tasks.push(item);
    const moved=touchProject(p);
    i.value=''; saveProject(p,true);
    if(moved){ sortProjects(); toast('Moved to In progress') }
    renderProject(); renderSide();
    if(item.url) fetchMeta(item.url).then(meta=>{
      let changed=false;
      if(meta.image&&!item.preview){ item.preview=meta.image; changed=true }
      if(meta.title&&(!item.text||item.text===shortUrl(item.url))){ item.text=meta.title; changed=true }
      if(changed){ saveProject(p,true); if(st.openId===p.id) renderProject() }
    });
  };
  const ta=$('#taskAdd'), ti=$('#taskInput');
  if(ta) ta.addEventListener('click',add);
  if(ti) ti.addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  bindQuickBar(p);
  bindIdeas(p);
  if(p.id===INBOX) enrichIdeas(p);
  bindWish(p);
  bindTodo(p);
  bindLinks(p);
  const ex=$('#expand'); if(ex) ex.addEventListener('click',toggleBoard);
  const ap=$('#addPhoto'); if(ap) ap.addEventListener('click',()=>$('#filePick').click());
  const sn=$('#addNote'); if(sn) sn.addEventListener('click',addSticky);
  const pk=$('#pack'); if(pk) pk.addEventListener('click',()=>packBoard(true));
  const tb=$('#trashBtn'); if(tb) tb.addEventListener('click',()=>openTrash(p));
  const bt=$('#boardToggle');
  if(bt) bt.addEventListener('click',()=>{
    st.boardOpen[p.id]=!boardOpen(p.id);
    const sec=bt.closest('.board-pane');
    if(sec) sec.classList.toggle('collapsed',!st.boardOpen[p.id]);
  });
  const td=$('#tidy'); if(td) td.addEventListener('click',tidyBoard);
  const tl=$('#taskList');
  const redrawTasks=()=>{
    saveProject(p,true);
    $('#taskList').innerHTML=renderTasks(tasksOf(p));
    bindTaskDrag($('#taskList'),p);
    renderSide(); updateBarAndNext(p);
  };
  const addSub=(tid,val)=>{
    const v=val.trim(); if(!v) return;
    const x=p.tasks.find(y=>y.id===tid); if(!x) return;
    x.subs=x.subs||[];
    x.subs.push({id:uid(),text:v,done:false});
    if(x.done){ x.done=false; x.doneAt=null }
    if(touchProject(p)){ sortProjects(); toast('Moved to In progress') }
    st.taskOpen=tid;
    redrawTasks();
    const inp=document.querySelector('[data-subadd="'+tid+'"]');
    if(inp) inp.focus();
  };
  if(tl) bindTaskDrag(tl,p);
  if(tl) tl.addEventListener('keydown',e=>{
    const inp=e.target.closest('[data-subadd]');
    if(inp&&e.key==='Enter'){ e.preventDefault(); addSub(inp.dataset.subadd,inp.value) }
  });
  if(tl) tl.addEventListener('click',e=>{
    if(e.target.closest('a')) return;
    const as=e.target.closest('[data-aisteps]'), ap=e.target.closest('[data-aiplan]');
    if(as){ aiSteps(p,as.dataset.aisteps).then(ok=>{ if(ok) redrawTasks() }); return }
    if(ap){ aiPlan(p).then(ok=>{ if(ok){ touchProject(p); redrawTasks(); if(st.openId===p.id) renderProject() } }); return }
    const tg=e.target.closest('[data-toggle]'),dl=e.target.closest('[data-deltask]'),
          sr=e.target.closest('[data-star]'),ex=e.target.closest('[data-taskexp]'),
          stg=e.target.closest('[data-subtog]'),sdl=e.target.closest('[data-subdel]'),
          sgo=e.target.closest('[data-subgo]');
    if(e.target.closest('[data-subadd]')) return;
    if(sgo){
      const inp=document.querySelector('[data-subadd="'+sgo.dataset.subgo+'"]');
      if(inp) addSub(sgo.dataset.subgo,inp.value);
      return;
    }
    if(ex){ st.taskOpen=st.taskOpen===ex.dataset.taskexp?null:ex.dataset.taskexp; }
    else if(stg){
      const [tid,sid]=stg.dataset.subtog.split('|');
      const x=p.tasks.find(y=>y.id===tid); if(!x) return;
      const sb=(x.subs||[]).find(y=>y.id===sid); if(!sb) return;
      sb.done=!sb.done;
      const all=x.subs.length&&x.subs.every(y=>y.done);
      if(all&&!x.done){ x.done=true; x.doneAt=Date.now() }
      if(!all&&x.done){ x.done=false; x.doneAt=null }
    }
    else if(sdl){
      const [tid,sid]=sdl.dataset.subdel.split('|');
      const x=p.tasks.find(y=>y.id===tid); if(!x) return;
      x.subs=(x.subs||[]).filter(y=>y.id!==sid);
    }
    else if(tg){
      const x=p.tasks.find(y=>y.id===tg.dataset.toggle);
      x.done=!x.done; x.doneAt=x.done?Date.now():null;
      if(x.subs&&x.subs.length) x.subs.forEach(sb=>{sb.done=x.done});
      rollRepeat(x);
    }
    else if(dl){p.tasks=p.tasks.filter(y=>y.id!==dl.dataset.deltask); toast('Deleted',{action:'Undo',onAction:undo})}
    else if(sr){const x=p.tasks.find(y=>y.id===sr.dataset.star);x.star=!x.star}
    else return;
    redrawTasks();
  });
}

/* ───────── board ───────── */
function clearUrls(){st.urls.forEach(u=>URL.revokeObjectURL(u));st.urls=[]}
let layoutT=null;
function saveLayout(ph){
  clearTimeout(layoutT);
  layoutT=setTimeout(()=>{putPhoto(ph).catch(e=>console.error(e))},300);
}

async function loadPhotos(pid){
  clearUrls();
  let list=[];
  try{list=await photosOf(pid)}catch(e){console.error(e)}
  list=boardPhotos(list);
  list.sort((a,b)=>(a.z||0)-(b.z||0));
  st.photos=list;
  st.maxZ=list.reduce((m,p)=>Math.max(m,p.z||0),1);
  paintBoard();
}

const CANVAS_W=2600, CANVAS_H=1900;
const STICKY_COLORS=[
  {id:'violet',label:'Violet'},{id:'cyan',label:'Cyan'},{id:'magenta',label:'Pink'},
  {id:'mint',label:'Mint'},{id:'amber',label:'Amber'},{id:'plain',label:'Paper'}
];
const STICKY_SIZES=[{id:'s',label:'S'},{id:'m',label:'M'},{id:'l',label:'L'},{id:'xl',label:'XL'}];
const layoutOf=t=>{ try{ return typeof t.layout==='string'?JSON.parse(t.layout):(t.layout||{}) }catch(e){ return {} } };
const stickiesOf=p=>(p.tasks||[]).filter(t=>t.kind==='sticky');

function boardCanvas(){ return document.getElementById('canvas') }

function paintBoard(){
  const b=$('#board'); if(!b) return;
  b.innerHTML='<div id="canvas"></div>';
  const cv=boardCanvas();
  cv.style.width=CANVAS_W+'px'; cv.style.height=CANVAS_H+'px';
  const pr=cur();
  const notes=pr?stickiesOf(pr):[];
  if(!st.photos.length&&!notes.length){
    cv.insertAdjacentHTML('beforeend',`<div class="board-empty">${svg('img',26,1.3)}<b>Empty board</b><span>Drop photos here, paste a screenshot, or hit “+ photo”</span></div>`);
  }
  st.photos.forEach((ph,i)=>{
    if(ph.x==null){ const c=i%4; ph.x=40+c*250; ph.y=40+Math.floor(i/4)*190; ph.w=210; ph.r=(Math.random()*4-2); ph.z=++st.maxZ; putPhoto(ph).catch(()=>{}); }
    cv.appendChild(pinEl(ph));
  });
  notes.forEach(n=>cv.appendChild(stickyEl(pr,n)));
  bindPan(b,cv);
  const c=$('#phCount'); if(c) c.textContent=st.photos.length||'';
  requestAnimationFrame(()=>{ b.scrollLeft=0; b.scrollTop=0 });
}

const boardSel=new Set();

function paintSel(){
  document.querySelectorAll('.pin').forEach(el=>el.classList.toggle('sel',boardSel.has(el.dataset.id)));
  let bar=document.getElementById('selBar');
  if(!boardSel.size){ if(bar) bar.remove(); return }
  if(!bar){
    bar=document.createElement('div');
    bar.id='selBar'; bar.className='sel-bar';
    document.body.appendChild(bar);
    bar.addEventListener('click',async e=>{
      const b=e.target.closest('button'); if(!b) return;
      const act=b.dataset.sel;
      const p=cur();
      if(act==='clear'){ boardSel.clear(); paintSel(); return }
      if(act==='del'){
        if(!confirm('Delete '+boardSel.size+' photo'+(boardSel.size===1?'':'s')+'? This cannot be undone.')) return;
        for(const id of Array.from(boardSel)){
          await delPhotoDB(id);
          st.photos=st.photos.filter(x=>x.id!==id);
        }
        boardSel.clear();
        if(p) dropCover(p.id);
        paintBoard(); paintSel(); toast('Deleted');
      }
      if(act==='row'){
        const chosen=st.photos.filter(x=>boardSel.has(x.id));
        let x=40,y=40,rowH=0;
        chosen.forEach(ph=>{
          if(x+ph.w>1740){ x=40; y+=rowH+18; rowH=0 }
          const dx=x-ph.x, dy=y-ph.y;
          ph.x=x; ph.y=y; ph.z=++st.maxZ;
          if(dx||dy) moveAttached(ph,dx,dy);
          x+=ph.w+18; rowH=Math.max(rowH,ph.w);
          putPhoto(ph).catch(()=>{});
        });
        if(p) saveProject(p,true);
        paintBoard(); paintSel(); toast('Lined up');
      }
    });
  }
  bar.innerHTML=`<span>${boardSel.size} selected</span>
    <button data-sel="row">${svg('size',13,1.9)} line up</button>
    <button data-sel="del">${svg('trash',13,1.8)} delete</button>
    <button data-sel="clear">${svg('x',13,2.2)} clear</button>`;
}

function bindPan(b,cv){
  let sx=0,sy=0,sl=0,stp=0,on=false;
  cv.addEventListener('pointerdown',e=>{
    if(e.target!==cv) return;
    if(e.button!==0&&e.pointerType==='mouse') return;
    if(e.shiftKey){                       // Shift + протяжка = рамка выделения
      e.preventDefault();
      const rect=cv.getBoundingClientRect();
      const ox=e.clientX-rect.left, oy=e.clientY-rect.top;
      const box=document.createElement('div');
      box.className='marquee'; cv.appendChild(box);
      const draw=ev=>{
        const cx=ev.clientX-rect.left, cy=ev.clientY-rect.top;
        const l=Math.min(ox,cx), t=Math.min(oy,cy), w=Math.abs(cx-ox), h=Math.abs(cy-oy);
        box.style.left=l+'px'; box.style.top=t+'px'; box.style.width=w+'px'; box.style.height=h+'px';
        st.photos.forEach(ph=>{
          const el=document.querySelector('.pin[data-id="'+ph.id+'"]');
          const hh=(el&&el.offsetHeight)||ph.w;
          const hit=ph.x<l+w&&ph.x+ph.w>l&&ph.y<t+h&&ph.y+hh>t;
          if(hit) boardSel.add(ph.id); else boardSel.delete(ph.id);
        });
        paintSel();
      };
      const done=()=>{ box.remove(); window.removeEventListener('pointermove',draw); window.removeEventListener('pointerup',done) };
      window.addEventListener('pointermove',draw); window.addEventListener('pointerup',done);
      return;
    }
    if(boardSel.size){ boardSel.clear(); paintSel() }
    on=true; b.classList.add('panning');
    sx=e.clientX; sy=e.clientY; sl=b.scrollLeft; stp=b.scrollTop;
    const move=ev=>{ if(!on) return; b.scrollLeft=sl-(ev.clientX-sx); b.scrollTop=stp-(ev.clientY-sy) };
    const up=()=>{ on=false; b.classList.remove('panning');
      window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up) };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  });
}

function pinEl(ph){
  const url=photoSrc(ph); if(url.indexOf('blob:')===0) st.urls.push(url);
  const el=document.createElement('div');
  el.className='pin'; el.dataset.id=ph.id;
  el.style.left=ph.x+'px'; el.style.top=ph.y+'px'; el.style.width=ph.w+'px';
  el.style.zIndex=ph.z||1; el.style.transform=`rotate(${ph.r||0}deg)`;
  el.innerHTML=`<img src="${url}" alt="${esc(ph.name||'photo')}" draggable="false">
    <button class="pin-x" title="Delete">${svg('x',12,2.2)}</button>
    <div class="pin-size" title="Drag to resize">${svg('size',11,2)}</div>`;

  const front=()=>{
    ph.z=++st.maxZ; el.style.zIndex=ph.z; saveLayout(ph);
    raiseNotes(ph);
  };

  el.querySelector('.pin-x').addEventListener('pointerdown',e=>e.stopPropagation());
  el.querySelector('.pin-x').addEventListener('click',async e=>{
    e.stopPropagation();
    await delPhotoDB(ph.id);
    st.photos=st.photos.filter(x=>x.id!==ph.id);
    el.remove();
    const c=$('#phCount'); if(c) c.textContent=st.photos.length||'';
    if(!st.photos.length) paintBoard();
    toast('Photo deleted');
  });

  el.addEventListener('dblclick',()=>lightbox(ph,url));

  el.querySelector('.pin-size').addEventListener('pointerdown',e=>{
    e.stopPropagation(); e.preventDefault(); front();
    const sx=e.clientX, sw=ph.w;
    const move=ev=>{ ph.w=clamp(Math.round(sw+(ev.clientX-sx)),90,900); el.style.width=ph.w+'px'; };
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);saveLayout(ph)};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });

  el.addEventListener('pointerdown',e=>{
    if(e.button!==0&&e.pointerType==='mouse') return;
    if(e.shiftKey){
      e.preventDefault(); e.stopPropagation();
      if(boardSel.has(ph.id)) boardSel.delete(ph.id); else boardSel.add(ph.id);
      paintSel();
      return;
    }
    e.preventDefault(); front(); el.classList.add('grabbing');
    const rect=boardCanvas().getBoundingClientRect();
    const dx=e.clientX-rect.left-ph.x, dy=e.clientY-rect.top-ph.y;
    const groupIds=boardSel.has(ph.id)?Array.from(boardSel).filter(id=>id!==ph.id):[];
    const move=ev=>{
      const h=el.offsetHeight;
      const nx=clamp(Math.round(ev.clientX-rect.left-dx),0,CANVAS_W-ph.w);
      const ny=clamp(Math.round(ev.clientY-rect.top-dy),0,CANVAS_H-h);
      const sx=nx-ph.x, sy=ny-ph.y;
      ph.x=nx; ph.y=ny;
      el.style.left=ph.x+'px'; el.style.top=ph.y+'px';
      if(sx||sy){
        moveAttached(ph,sx,sy);
        groupIds.forEach(id=>{
          const o=st.photos.find(x=>x.id===id); if(!o) return;
          o.x+=sx; o.y+=sy;
          const oe=document.querySelector('.pin[data-id="'+id+'"]');
          if(oe){ oe.style.left=o.x+'px'; oe.style.top=o.y+'px' }
          moveAttached(o,sx,sy);
        });
      }
    };
    const up=()=>{
      el.classList.remove('grabbing');
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
      saveLayout(ph);
      groupIds.forEach(id=>{ const o=st.photos.find(x=>x.id===id); if(o) saveLayout(o) });
      const pr=cur(); if(pr&&attachedTo(ph.id).length) saveProject(pr,true);
    };
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });

  return el;
}

/* ───────── sticky notes ───────── */
function stickyEl(p,note){
  const L=layoutOf(note);
  const el=document.createElement('div');
  el.className='sticky c-'+(L.c||'violet')+' s-'+(L.s||'m');
  el.dataset.id=note.id;
  el._L=L;
  el.style.left=(L.x||60)+'px'; el.style.top=(L.y||60)+'px'; el.style.zIndex=L.z||1;
  if(L.fs) el.style.setProperty('--fs',L.fs+'px');
  if(L.w) el.style.width=L.w+'px';
  el.innerHTML=`<div class="sticky-text">${esc(note.text||'')}</div>
    <div class="sticky-acts">
      <button data-spin class="${L.pin?'on':''}" title="${L.pin?'Unpin from photo':'Pin to the photo underneath'}">${svg('pin',12,1.7)}</button>
      <button data-sset title="Style">${svg('gear',12,1.6)}</button>
      <button data-sdel title="Delete">${svg('x',12,2.2)}</button>
    </div>
    <div class="sticky-size" title="Drag to resize">${svg('size',11,2)}</div>`;
  const save=()=>{ note.layout=JSON.stringify(L); saveProject(p,true) };

  el.querySelector('[data-sdel]').addEventListener('pointerdown',e=>e.stopPropagation());
  el.querySelector('[data-sdel]').addEventListener('click',e=>{
    e.stopPropagation();
    p.tasks=p.tasks.filter(x=>x.id!==note.id);
    saveProject(p,true); el.remove();
  });
  el.querySelector('[data-sset]').addEventListener('pointerdown',e=>e.stopPropagation());
  el.querySelector('[data-sset]').addEventListener('click',e=>{ e.stopPropagation(); stickyEdit(p,note) });

  const pinBtn=el.querySelector('[data-spin]');
  pinBtn.addEventListener('pointerdown',e=>e.stopPropagation());
  pinBtn.addEventListener('click',e=>{
    e.stopPropagation();
    if(L.pin){
      delete L.pin; delete L.dx; delete L.dy;
      save(); pinBtn.classList.remove('on');
      pinBtn.title='Pin to the photo underneath';
      toast('Unpinned');
      return;
    }
    const host=photoUnder((L.x||0)+el.offsetWidth/2,(L.y||0)+el.offsetHeight/2)
             ||photoUnder((L.x||0)+16,(L.y||0)+16);
    if(!host){ toast('Drag the note over a photo first'); return }
    L.pin=host.id; L.dx=(L.x||0)-host.x; L.dy=(L.y||0)-host.y;
    save(); pinBtn.classList.add('on');
    pinBtn.title='Unpin from photo';
    toast('Pinned — it moves with that photo now');
  });

  el.addEventListener('dblclick',e=>{ e.stopPropagation(); stickyEdit(p,note) });

  el.querySelector('.sticky-size').addEventListener('pointerdown',e=>{
    e.stopPropagation(); e.preventDefault();
    const startX=e.clientX, startY=e.clientY;
    const baseFs=L.fs||{s:13,m:17,l:23,xl:32}[L.s||'m'];
    const baseW=L.w||el.offsetWidth;
    const move=ev=>{
      const dx=ev.clientX-startX, dy=ev.clientY-startY;
      L.fs=clamp(Math.round(baseFs+(dx+dy)/14),11,96);
      L.w=clamp(Math.round(baseW+dx),110,900);
      el.style.setProperty('--fs',L.fs+'px');
      el.style.width=L.w+'px';
    };
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);save()};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });

  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;
    if(e.button!==0&&e.pointerType==='mouse') return;
    e.preventDefault();
    L.z=++st.maxZ; el.style.zIndex=L.z;
    el.classList.add('grabbing');
    const rect=boardCanvas().getBoundingClientRect();
    const dx=e.clientX-rect.left-(L.x||0), dy=e.clientY-rect.top-(L.y||0);
    const move=ev=>{
      L.x=clamp(Math.round(ev.clientX-rect.left-dx),0,CANVAS_W-el.offsetWidth);
      L.y=clamp(Math.round(ev.clientY-rect.top-dy),0,CANVAS_H-el.offsetHeight);
      el.style.left=L.x+'px'; el.style.top=L.y+'px';
    };
    const up=()=>{
      el.classList.remove('grabbing');
      window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
      if(L.pin){
        const host=st.photos.find(x=>x.id===L.pin);
        if(host){ L.dx=L.x-host.x; L.dy=L.y-host.y }
      }
      save();
    };
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  });
  return el;
}

function attachedTo(photoId){
  const p=cur(); if(!p) return [];
  return stickiesOf(p).filter(n=>{ const L=layoutOf(n); return L.pin===photoId });
}
function moveAttached(ph,dx,dy){
  const p=cur(); if(!p) return;
  attachedTo(ph.id).forEach(n=>{
    const el=document.querySelector('.sticky[data-id="'+n.id+'"]');
    // правим тот же объект, что держит элемент, иначе он потом вернётся на старое место
    const L=(el&&el._L)?el._L:layoutOf(n);
    L.x=(L.x||0)+dx; L.y=(L.y||0)+dy;
    n.layout=JSON.stringify(L);
    if(el){ el.style.left=L.x+'px'; el.style.top=L.y+'px' }
  });
}

function raiseNotes(ph){
  const p=cur(); if(!p) return;
  attachedTo(ph.id).forEach(n=>{
    const el=document.querySelector('.sticky[data-id="'+n.id+'"]');
    const L=(el&&el._L)?el._L:layoutOf(n);
    L.z=++st.maxZ;
    n.layout=JSON.stringify(L);
    if(el) el.style.zIndex=L.z;
  });
}
function photoUnder(x,y){
  return st.photos.slice().sort((a,b)=>(b.z||0)-(a.z||0)).find(ph=>{
    const el=document.querySelector('.pin[data-id="'+ph.id+'"]');
    const h=(el&&el.offsetHeight)||ph.w;
    return x>=ph.x&&x<=ph.x+ph.w&&y>=ph.y&&y<=ph.y+h;
  })||null;
}

function stickyEdit(p,note){
  const L=layoutOf(note);
  const el=document.createElement('div');
  el.className='sheet-wrap';
  el.innerHTML=`<div class="sheet">
    <div class="sheet-head"><span>Note</span><button data-close>${svg('x',15,2)}</button></div>
    <label class="f"><span>Text</span><textarea id="skText" class="idea-edit" style="min-height:96px">${esc(note.text||'')}</textarea></label>
    <div class="f"><span>Colour</span>

function packBoard(keepSize){
  if(!st.photos.length) return;
  const gap=18, left=40, top=40, maxW=Math.min(CANVAS_W-80,1700);
  let x=left, y=top, rowH=0;
  st.photos.forEach(ph=>{
    const w=keepSize?(ph.w||210):210;
    if(!keepSize) ph.w=210;
    const el=document.querySelector('.pin[data-id="'+ph.id+'"]');
    const h=el?el.offsetHeight*(w/(ph.w||w)):w;
    if(x+w>left+maxW){ x=left; y+=rowH+gap; rowH=0 }
    const sx=x-ph.x, sy=y-ph.y;
    ph.x=x; ph.y=y; ph.r=0; ph.z=++st.maxZ;
    if(sx||sy) moveAttached(ph,sx,sy);
    raiseNotes(ph);
    x+=w+gap; rowH=Math.max(rowH,h);
    putPhoto(ph).catch(()=>{});
  });
  const pr=cur(); if(pr) saveProject(pr,true);
  paintBoard();
  toast(keepSize?'Arranged, sizes kept':'Arranged in a grid');
}

function compress(file,maxDim,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const s=Math.min(1,maxDim/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');x.fillStyle='#111';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
        c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q);
      };
      img.onerror=()=>rej(new Error('img'));
      img.src=fr.result;
    };
    fr.onerror=()=>rej(new Error('read'));
    fr.readAsDataURL(file);
  });
}

async function addPhotos(files){
  const p=cur(); if(!p) return;
  const list=Array.from(files).filter(f=>f.type.startsWith('image/'));
  if(!list.length) return;
  const b=$('#board'); const W=b?b.clientWidth:900; const H=b?b.clientHeight:600;
  const wasEmpty=!st.photos.length;
  for(const f of list){
    try{
      const blob=await compress(f,1400,.72);
      const n=st.photos.length;
      const ph={id:uid(),pid:p.id,name:f.name||'photo',blob,created:Date.now(),
        w:220,x:clamp(30+(n%5)*46+Math.random()*20,10,W-240),
        y:clamp(28+(n%4)*54+Math.random()*20,10,H-160),
        r:Math.random()*5-2.5,z:++st.maxZ};
      await putPhoto(ph);
      st.photos.push(ph);
      dropCover(p.id);
      if(touchProject(p)){ saveProject(p,true); sortProjects(); renderSide() }
      if(wasEmpty&&st.photos.length===1&&b) b.innerHTML='';
      if(b) b.appendChild(pinEl(ph));
    }catch(e){console.error(e);toast('Could not add '+(f.name||'file'))}
  }
  const c=$('#phCount'); if(c) c.textContent=st.photos.length||'';
}

const b2d=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)});
function d2b(u){
  const [h,d]=u.split(','),mime=h.match(/:(.*?);/)[1],bin=atob(d),a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:mime});
}

function parseQuick(raw){
  let text=raw.trim(), forced=null;
  const first=text[0];
  if(first==='!'){forced=INBOX;text=text.slice(1).trim()}
  else if(first==='$'){forced=WANT;text=text.slice(1).trim()}
  else if(first==='?'){forced=TODO;text=text.slice(1).trim()}
  else if(first==='>'){forced='proj';text=text.slice(1).trim()}
  let price=null, url='';
  const u=text.match(/(https?:\/\/\S+|www\.\S+)/i);
  if(u){ url=u[0]; if(!/^https?:/i.test(url)) url='https://'+url; text=text.replace(u[0],'').replace(/\s+/g,' ').trim() }
  const full=text;                      // для всего, кроме вишлиста, число в конце — часть текста
  const m=text.match(/\s(\d+(?:[.,]\d+)?)$/);
  if(m){ price=parseFloat(m[1].replace(',','.')); text=text.slice(0,m.index).trim() }
  // «…завтра» / «…today» в конце — срок для задач
  let due='', task=full, rep='';
  const rw=full.match(/(?:^|\s)(every day|daily|every week|weekly|every month|monthly|каждый день|ежедневно|каждую неделю|еженедельно|каждый месяц|ежемесячно)$/i);
  if(rw){ const w=rw[1].toLowerCase(); rep=/day|daily|день|ежедн/.test(w)?'day':/week|недел/.test(w)?'week':'month'; task=full.slice(0,rw.index).trim()||full }
  const dw=task.match(/(?:^|\s)(сегодня|завтра|послезавтра|today|tomorrow)$/i);
  if(dw){ due=ldPlus(DUE_WORDS[dw[1].toLowerCase()]); task=task.slice(0,dw.index).trim()||task }
  if(rep&&!due) due=ld();
  return {text,full,task,due,rep,price,url,forced};
}

function recentTargets(){
  const out=[{id:INBOX,label:'Ideas',cls:'t-ideas'},{id:TODO,label:'To do',cls:'t-todo'},{id:WANT,label:'Wishlist',cls:'t-want'}];

}

async function saveCapture(target,text,url,file,extra){
  const p=st.projects.find(x=>x.id===target);
  if(!p) return;
  const ex=extra||{};
  blip('add');
  p.tasks=p.tasks||[];
  let what='Saved';
  if(url&&!SPECIAL(p.id)){
    const item={id:uid(),kind:'link',text:text||'',url,preview:'',done:false,created:Date.now()};
    p.tasks.push(item);

    what='Reference added';
    fetchPreview(url).then(img=>{ if(img){ item.preview=img; saveProject(p,true); if(st.openId===p.id) renderProject() } });
  }else if(p.id===WANT){

    if(aiKey()&&(wi.price==null||!url)) aiFillWish(p,wi,false);
    saveProject(p,true); what='Added to Wishlist';
  }else if(p.id===TODO){
    const ni={id:uid(),text:text||shortUrl(url)||'Untitled',cat:ex.cat||st.todoCat||'other',url:url||'',note:'',done:false,created:Date.now()};
    if(ex.due) setDue(ni,ex.due);
    if(ex.rep) setLay(ni,'rep',ex.rep);
    p.tasks.push(ni);
    saveProject(p,true); what='Added to To do';
  }else{
    const it={id:uid(),kind:p.id===INBOX?undefined:'task',text:text||'',done:false,created:Date.now()};
    if(p.id===INBOX&&url){
      it.url=url;
      if(!it.text) it.text=shortUrl(url);
      fetchMeta(url).then(meta=>{
        let ch=false;
        if(meta.image&&!it.preview){ it.preview=meta.image; ch=true }
        if(meta.title&&(!it.text||it.text===shortUrl(url))){ it.text=meta.title; ch=true }
        if(ch){ saveProject(p,true); if(st.openId===p.id) renderProject() }
      });
    }else if(url){ it.text=[text,url].filter(Boolean).join(' ') }
    p.tasks.push(it);
    if(!SPECIAL(p.id)) touchProject(p);
    saveProject(p,true);
    what=p.id===INBOX?'Saved to Ideas':'Task added';

}

    el.querySelector('#qaPrice').textContent=(sel===WANT&&price)?money(price):'';

      ? [sel===WANT&&price?money(price):'', sel!==WANT&&sel!==INBOX&&parseQuick(input.value).due?'due '+dueLabel(parseQuick(input.value).due):'', url?'link attached':''].filter(Boolean).map(esc).join(', ')
      : '';
    el.querySelector('#qaHint').style.display=el.querySelector('#qaHint').textContent?'':'none';
  };

    const f=parseQuick(input.value).forced;
    if(f==='proj'){ const t=targets.find(x=>x.key==='proj'); if(t) sel=t.id }
    else if(f) sel=f;
    paint();
  });
  el.querySelector('#qaT').addEventListener('click',e=>{
    const b=e.target.closest('.qa-t'); if(!b) return;
    sel=b.dataset.id; paint(); input.focus();
  });

  const submit=async(keep)=>{
    const q=parseQuick(input.value);
    const dated=sel!==WANT&&sel!==INBOX;
    const price=q.price, url=q.url, text=sel===WANT?q.text:dated?q.task:q.full;
    if(!text) return;
    const target=st.projects.find(x=>x.id===sel); if(!target) return;
    target.tasks=target.tasks||[];
    if(sel===WANT) target.tasks.push({id:uid(),text,price:price||null,url,done:false,created:Date.now()});
    else if(sel===TODO) target.tasks.push({id:uid(),text,cat:st.todoCat||'other',url,note:'',done:false,created:Date.now()});
    else if(sel===INBOX) target.tasks.push({id:uid(),text,done:false,created:Date.now()});
    else { target.tasks.push({id:uid(),text,done:false,created:Date.now()}); touchProject(target) }
    if(dated&&q.due) setDue(target.tasks[target.tasks.length-1],q.due);
    if(dated&&q.rep) setLay(target.tasks[target.tasks.length-1],'rep',q.rep);
    target.updated=Date.now();
    await putProject(target);
    toast('Added to '+target.name);
    input.value=''; paint();
    renderSide();
    if(st.openId===target.id) renderProject();
    else if(!st.openId&&!st.focus&&!st.hist) renderAll();
    if(!keep) close();
  };
  const close=()=>{ el.remove(); document.removeEventListener('keydown',keys,true) };
  const keys=e=>{
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close()}
    else if(e.key==='Enter'){e.preventDefault();submit(e.shiftKey)}
    else if(e.key==='Tab'){
      e.preventDefault();
      const i=targets.findIndex(t=>t.id===sel);
      sel=targets[(i+(e.shiftKey?targets.length-1:1))%targets.length].id;
      paint();
    }
  };
  document.addEventListener('keydown',keys,true);
  el.addEventListener('click',e=>{ if(e.target===el) close() });
  input.value=prefill;
  paint();
  input.focus();
}

    sq.addEventListener('keydown',e=>{ if(e.key==='Escape'){ st.spQ=''; renderSpend() } }) }

/* ───────── events ───────── */
let hashLock=false;
function currentHash(){
  if(st.openId) return '#p/'+st.openId;
  if(st.hist) return '#history';
  if(st.review) return '#review';
  if(st.spend) return '#spending';
  if(st.focus) return '#focus';
  return '#all';
}
function syncHash(){
  const h=currentHash();
  if(location.hash===h) return;
  hashLock=true;
  location.hash=h;
  setTimeout(()=>{hashLock=false},0);
}
function applyHash(){
  const h=(location.hash||'').replace(/^#\/?/,'');
  if(h.indexOf('p/')===0){
    const id=h.slice(2);
    if(st.projects.some(x=>x.id===id)){ st.openId=id; st.focus=false; st.hist=false; st.review=false; st.spend=false; return }
  }
  st.openId=null;
  st.focus=(h==='focus');
  st.hist=(h==='history');
  st.review=(h==='review');
  st.spend=(h==='spending');
}
window.addEventListener('hashchange',()=>{
  if(hashLock||!ME) return;
  applyHash(); route();
});
const isPhone=()=>!!(window.matchMedia&&window.matchMedia('(max-width:760px)').matches);
const isTouch=()=>!!(window.matchMedia&&window.matchMedia('(hover:none)').matches);
function syncSidebarButton(){
  if(window.innerWidth<900&&document.body.classList.contains('side-open')&&!st.sideForced)
    document.body.classList.remove('side-open');
}
function pageTitle(){
  if(st.openId){ const p=cur(); return p&&p.name?p.name:'Project' }
  if(st.hist) return 'History';
  if(st.review) return 'Review';
  if(st.spend) return 'Spending';
  if(st.focus) return 'Focus';
  if(st.query.trim()) return 'Search';
  return 'All projects';
}
function route(){
  syncHash(); document.title=pageTitle(); closeBoardFull(); clearUrls();
  const op=cur();
  document.body.dataset.sec=st.openId?(SPECIAL(st.openId)?st.openId:(op?tintOf(op):'home')):st.focus?'focus':'home';
  if(st.openId) renderProject();
  else if(st.hist) renderHistory();
  else if(st.review) renderReview();
  else if(st.spend) renderSpend();
  else if(st.focus) renderFocus();
  else if(st.query.trim()) renderSearch();
  else renderAll();
  renderSide();
  const v=$('#view');
  if(v){ v.scrollTop=0; v.classList.remove('view-in'); void v.offsetWidth; v.classList.add('view-in') }
}
function flashItem(id){
  const p=cur(); const it=p&&(p.tasks||[]).find(x=>x.id===id);
  if(it&&it.done&&p.id===WANT&&st.wantFilter!=='done'){ st.wantFilter='done'; renderProject() }
  if(it&&it.done&&p.id===TODO&&st.todoFilter!=='done'){ st.todoFilter='done'; renderProject() }
  setTimeout(()=>{
    const el=document.querySelector(`#view [data-id="${id}"],#view [data-task="${id}"],#view [data-ref="${id}"],#view [data-sp="${id}"]`); if(!el) return;
    el.scrollIntoView({block:'center',behavior:'smooth'}); el.classList.add('flash');
    setTimeout(()=>el.classList.remove('flash'),1800);
  },60);
}
/* только что добавленное слегка «приезжает» — видно, куда оно легло */
function markNew(p){
  if(!p) return; const t0=Date.now()-1600;
  (p.tasks||[]).forEach(t=>{ if((t.created||0)>t0){
    const el=document.querySelector(`#view [data-id="${t.id}"],#view [data-task="${t.id}"],#view [data-sp="${t.id}"]`);
    if(el) el.classList.add('new-in') } });
}
function resetViews(){ st.openId=null; st.focus=false; st.hist=false; st.review=false; st.spend=false }
function openProject(id){st.openId=id;st.focus=false;st.hist=false;st.review=false;st.spend=false;if(window.innerWidth<900)document.body.classList.remove('side-open');route()}

document.addEventListener('click',e=>{
  if(st.dragRow) return;
  const o=e.target.closest('[data-open]');
  if(o){
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1) return;   // новая вкладка — пусть браузер сам
    e.preventDefault();
    if(o.closest('.sgroup')){ st.query=''; const qq=$('#q'); if(qq) qq.value=''; }
    const hid=o.dataset.hit;
    if(hid&&o.dataset.sphit){ const it=(wantP().tasks||[]).find(x=>x.id===hid);
      if(it){ resetViews(); st.spend=true; st.spMonth=Math.max(0,nowKey()-monthKey(it.doneAt)); route(); setTimeout(()=>flashItem(hid),150); return } }
    openProject(o.dataset.open);
    if(hid) setTimeout(()=>flashItem(hid),150);
    return;
  }
  const s=e.target.closest('[data-set]');
  if(s){const p=st.projects.find(x=>x.id===s.dataset.set);if(p)setStatus(p,s.dataset.s);return}
  const pn=e.target.closest('[data-pin]');
  if(pn){
    const pr=st.projects.find(x=>x.id===pn.dataset.pin);
    if(pr){ pr.pinned=!pr.pinned; saveProject(pr,true); sortProjects(); renderSide(); }
    return;
  }
  const g=e.target.closest('[data-gear]'); if(g) return openSettings(g.dataset.gear);
  const f=e.target.closest('[data-filter]'); if(f){st.filter=f.dataset.filter;renderAll();return}
  if(e.target.closest('#emptyNew')) newProject();
});
/* меню проекта: статус, закрепить, важное, архив, настройки, удалить — подписанными строками */
function closeProjectMenu(){ const m=document.querySelector('.pmenu'); if(m) m.remove() }
function projectMenu(pid,x,y){
  closeProjectMenu();
  const p=st.projects.find(q=>q.id===pid); if(!p) return;
  const el=document.createElement('div');
  el.className='pmenu';
  el.innerHTML=`
    <div class="pmenu-name">${esc(p.name||'Untitled')}</div>
    <div class="pmenu-status">${STATUSES.map(z=>`<button class="${p.status===z.id?'on':''}" data-m="status" data-s="${z.id}">${svg(z.id,15,2)}<span>${z.short}</span></button>`).join('')}</div>
    <button data-m="pin">${svg('pin',15,1.8)} ${p.pinned?'Unpin':'Pin to top'}</button>
    <button data-m="imp">${svg('flag',15,2)} ${p.important?'Not important':'Mark important'}</button>
    <button data-m="arch">${svg('arch',15,1.8)} ${p.archived?'Take out of archive':'Move to archive'}</button>
    <button data-m="gear">${svg('gear',15,1.6)} Settings</button>
    <button data-m="del" class="pmenu-del">${svg('trash',15,1.8)} Delete…</button>`;
  document.body.appendChild(el);
  const w=el.offsetWidth, h=el.offsetHeight;
  el.style.left=Math.max(8,Math.min(x,innerWidth-w-8))+'px';
  el.style.top=Math.max(8,Math.min(y,innerHeight-h-8))+'px';
  el.addEventListener('click',async e=>{
    const b=e.target.closest('[data-m]'); if(!b) return;
    e.preventDefault(); e.stopPropagation();
    const m=b.dataset.m;
    closeProjectMenu();
    if(m==='status'){ setStatus(p,b.dataset.s); toast(sMeta(b.dataset.s).short); return }
    if(m==='gear') return openSettings(p.id);
    if(m==='pin'){ p.pinned=!p.pinned; saveProject(p,true); sortProjects(); refreshView(); return }
    if(m==='imp'){ p.important=!p.important; saveProject(p,true); sortProjects(); refreshView(); return }
    if(m==='arch'){
      p.archived=!p.archived;
      if(p.archived&&st.openId===p.id) st.openId=null;
      saveProject(p,true); sortProjects(); route();
      toast(p.archived?'Moved to archive':'Back out of archive',{action:'Undo',onAction:()=>{ p.archived=!p.archived; saveProject(p,true); sortProjects(); route() }});
      return;
    }
    if(m==='del'){
      if(!confirm('Delete \''+(p.name||'project')+'\' along with its tasks, notes and photos? This cannot be undone.')) return;
      const phs=await photosOf(p.id);
      for(const ph of phs) await delPhotoDB(ph.id);
      await delProject(p.id);
      st.projects=st.projects.filter(q=>q.id!==p.id);
      if(st.openId===p.id) st.openId=null;
      route(); toast('Project deleted');
    }
  });
}

    <div class="due-grid">
      <button data-d="${ld()}" class="${cur===ld()?'on':''}">Today</button>
      <button data-d="${ldPlus(1)}" class="${cur===ldPlus(1)?'on':''}">Tomorrow</button>
      <button data-d="${ldPlus(7)}">In a week</button>
      <input type="date" id="dueDate" value="${esc(cur)}" aria-label="Pick a date">
    </div>
    <div class="rep-row">${[['','Once'],['day','Daily'],['week','Weekly'],['month','Monthly']]
      .map(([k,l])=>`<button data-rep="${k}" class="${repOf(task)===k?'on':''}">${l}</button>`).join('')}</div>
    ${cur?`<button class="danger" data-d="">No date</button>`:''}
  </div>`;
  let dirty=false;
  const close=()=>{ el.remove(); if(dirty) refreshView() };
  const apply=d=>{
    const wasD=dueOf(task), wasR=repOf(task);
    setDue(task,d); if(!d) setLay(task,'rep',''); saveProject(pr,true); dirty=true; close();
    if(!d&&wasD) toast('Date cleared',{action:'Undo',onAction:()=>{ setDue(task,wasD); setLay(task,'rep',wasR); saveProject(pr,true); refreshView() }});
  };
  el.addEventListener('click',e=>{
    if(e.target===el||e.target.closest('[data-close]')) return close();
    const r=e.target.closest('[data-rep]');
    if(r){
      setLay(task,'rep',r.dataset.rep);
      if(r.dataset.rep&&!dueOf(task)) setDue(task,ld());
      saveProject(pr,true); dirty=true;
      el.querySelectorAll('[data-rep]').forEach(x=>x.classList.toggle('on',x===r));
      return;
    }
    const b=e.target.closest('[data-d]'); if(b) apply(b.dataset.d);
  });
  el.querySelector('#dueDate').addEventListener('change',e=>{ if(e.target.value) apply(e.target.value) });
  document.body.appendChild(el);
}

/* галочка: короткий всплеск в цвете раздела, только когда отмечаем сделанным */
document.addEventListener('click',e=>{
  const c=e.target.closest('.check'); if(!c) return;
  const row=c.closest('li,.tditem,.wrow');
  if(row&&row.classList.contains('done')&&!row.classList.contains('leaving')) return;
  if(row&&row.classList.contains('got')) return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const r=c.getBoundingClientRect();
  const box=document.createElement('span');
  box.className='burst'; box.style.left=(r.left+r.width/2)+'px'; box.style.top=(r.top+r.height/2)+'px';
  for(let i=0;i<8;i++){ const d=document.createElement('i'); d.style.setProperty('--a',(i*45+12)+'deg'); box.appendChild(d) }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),600);
  blip('done');
  const x=r.left+r.width/2, y=r.top+r.height/2;             // строка перерисуется — подпрыгнет уже новая галочка
  setTimeout(()=>{ const n=document.elementFromPoint(x,y); const k=n&&n.closest('.check'); if(k) k.classList.add('pop') },30);
},true);

document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA)$/.test((e.target||{}).tagName||'');
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){
    if(typing&&!e.shiftKey) return;
    e.preventDefault();
    if(e.shiftKey) redo(); else undo();
    return;
  }
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y')){e.preventDefault();redo();return}
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();openQuick();return}
  if(e.key==='Escape'){
    const l=document.querySelector('.lb, .sheet-wrap');
    if(l) l.remove();
    else closeBoardFull();
  }
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){
    e.preventDefault();document.body.classList.add('side-open');st.sideForced=true;$('#q').focus();return}
  if(e.key==='?'&&!typing&&!e.ctrlKey&&!e.metaKey&&!document.querySelector('.qa-wrap,.sheet-wrap,.lb,.cap-wrap,#board.full')){
    e.preventDefault(); openKeys(); return }
  // просто начни печатать — откроется быстрый ввод с этой буквой
  if(ME&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.isComposing&&e.key.length===1&&e.key!==' '
     &&!(e.target&&e.target.isContentEditable)
     &&!document.querySelector('.qa-wrap,.sheet-wrap,.lb,.cap-wrap,.gate:not([style*="none"]),#board.full')){
    e.preventDefault();
    const c=$('#cap');
    if(c&&!st.openId){ c.focus(); c.value+=e.key }
    else openQuick(e.key);
  }
});

/* версия: видно, какая сборка открыта, и сама говорит, когда вышла новая */
const APP_VER='19 Nov 02:42';
(function(){
  const el=document.getElementById('appVer'); if(!el) return;
  let fresh=null, busy=false;
  const paint=()=>{ el.textContent=fresh?'Update to '+fresh:'v '+APP_VER; el.classList.toggle('new',!!fresh) };
  async function check(loud){
    if(busy||fresh) return; busy=true;
    try{
      const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});
      const m=r.ok&&(await r.text()).match(/const APP_VER\s?='([^']+)'/);
      if(m&&m[1]!==APP_VER){ fresh=m[1]; paint(); toast('New version is ready',{action:'Update',onAction:()=>location.reload()}) }
      else if(loud) toast(m?'You have the latest version':'Could not check right now');
    }catch(e){ if(loud) toast('Could not check right now') }
    busy=false;
  }
  el.addEventListener('click',()=>{ if(fresh) location.reload(); else check(true) });
  paint();
  setInterval(()=>{ if(!document.hidden) check(false) },60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) check(false) });
})();

async function newProject(){

let migrateOffer=false;

async function localHasData(){
  try{
    db=await openDB();
    const ps=await localProjects();
    return ps.filter(p=>!SPECIAL(p.id)).length>0
        || ps.some(p=>(p.tasks||[]).length>0);
  }catch(e){ return false }
}

async function migrateLocal(){
  toast('Uploading your local data…');
  try{
    const ps=await localProjects();
    const phs=await localPhotos();
    for(const p of ps){
      const copy=Object.assign({},p);
      if(SPECIAL(p.id)){
        const cloud=st.projects.find(x=>x.id===p.id);
        if(cloud) copy.tasks=(cloud.tasks||[]).concat(p.tasks||[]);
      }
      await putProject(copy);
    }
    for(const ph of phs){
      if(!ph.blob) continue;
      await putPhoto({id:ph.id,pid:ph.pid,item:ph.item||null,name:ph.name,created:ph.created,
        x:ph.x,y:ph.y,w:ph.w,r:ph.r,z:ph.z,blob:ph.blob});
    }
    migrateOffer=false;
    LS.set('pm:migrated','1');
    await reload();
    toast('Everything moved to the cloud');
  }catch(e){ console.error(e); toast('Migration failed — your local copy is untouched') }
}

async function reload(){
  try{
    st.projects=await allProjects();
    setNet(true);
    st.projects.forEach(p=>localPut('projects',JSON.parse(JSON.stringify(p))));
    st.projects.forEach(p=>{ baseline[p.id]=snapOf(p) });      // чтобы отменялось и самое первое действие
  }catch(e){
    const mirror=await localProjects().catch(()=>[]);
    if(!mirror.length) throw e;
    st.projects=mirror;
    setNet(false);
    toast('Offline — showing the copy saved on this device');
  }
  if(!st.projects.some(p=>p.id===INBOX)){const ib=makeInbox();await putProject(ib);st.projects.push(ib)}
  if(!st.projects.some(p=>p.id===WANT)){const wl=makeWant();await putProject(wl);st.projects.push(wl)}
  if(!st.projects.some(p=>p.id===TODO)){const td=makeTodo();await putProject(td);st.projects.push(td)}
  sortProjects();
  applyHash();
  route();
}

function showGate(msg){
  hideBoot();
  const g=document.getElementById('gate');
  g.style.display='';
  if(msg) document.getElementById('gErr').textContent=msg;

function hideBoot(){
  const b=document.getElementById('boot');
  if(!b) return;
  b.classList.add('gone');
  setTimeout(()=>{ b.style.display='none'; b.classList.remove('gone') },320);
  document.body.classList.add('booted');
}

async function afterLogin(){
  document.getElementById('gate').style.display='none';
  document.getElementById('boot').style.display='';
  document.getElementById('boot').classList.remove('gone');
  try{
    try{ if(!db) db=await openDB() }catch(e){}
    await flushQueue();
    await reload();
    const empty=st.projects.filter(p=>!SPECIAL(p.id)).length===0;
    if(empty&&LS.get('pm:migrated')!=='1'&&await localHasData()) migrateOffer=true;
    document.body.classList.toggle('no-hints',!st.hints);
    document.body.classList.toggle('light',st.light);
    syncSidebarButton();
    window.addEventListener('resize',syncSidebarButton);
    route();
    if(spendRoll()) renderSide();
    loadRates().then(c=>{ if(c){ renderSide(); if(st.spend) renderSpend() } });
    setTimeout(()=>{ showDigest(); checkRemind() },700);
  }catch(e){
    console.error(e);
    document.getElementById('view').innerHTML='<div class="pad"><h1 style="font-family:var(--display);font-size:20px">Could not reach the database</h1><p class="lede">Check your connection and reload. If it keeps failing, the tables or their access rules may not be set up yet.</p></div>';
  }
  hideBoot();
}

function dataSig(list){
  return (list||[]).map(p=>[p.id,p.name,p.status,p.important?1:0,p.archived?1:0,p.pinned?1:0,
    p.ord,p.cover||'',p.revisit||'',p.updated||0,(p.tasks||[]).length,
    (p.tasks||[]).filter(t=>t.done).length].join('~')).sort().join('|');
}
window.addEventListener('focus',async()=>{
  if(!ME||!lastLoad) return;
  if(Date.now()-lastLoad<30000) return;
  try{
    const before=dataSig(st.projects);
    const fresh=await allProjects();
    if(dataSig(fresh)===before) return;      // ничего не менялось — не трогаем экран
    const open=st.openId;
    st.projects=fresh;
    sortProjects();
    if(open&&!st.projects.some(p=>p.id===open)) st.openId=null;
    route();
  }catch(e){}
});

(async function start(){
  if(!window.supabase){
    hideBoot();
    document.getElementById('view').innerHTML='<div class="pad"><h1 style="font-family:var(--display);font-size:20px">Offline</h1><p class="lede">The app could not load its cloud library. Check your connection and reload the page.</p></div>';
    return;
  }
  if(await tryShared()) return;
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  const {data}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='SIGNED_IN'&&session&&!ME){ ME=session.user; afterLogin() }
    if(ev==='SIGNED_OUT'){ ME=null; location.reload() }
  });
  if(data&&data.session){ ME=data.session.user; await afterLogin() }
  else { hideBoot(); showGate('') }
})();
</script>
